/* ===========================================================================
   v2 · THE SOCIAL BOOK PROFILE
   The home of the book: cover, avatar, stats, and every chapter as a
   scrollable, editable feed — plus About / Cast / World / Gallery / Notes.
   ========================================================================= */

const PROF_TABS = [
  ['timeline', 'Chapters', 'files'],
  ['about', 'About This Book', 'info'],
  ['cast', 'Cast', 'users'],
  ['world', 'World & Lore', 'globe'],
  ['covers', 'Cover Art', 'image'],
  ['gallery', 'Gallery', 'image'],
  ['notes', 'Notes', 'sticky-note']
];

function excerptOf(html, n) {
  const t = stripHTML(html || '').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t;
}
function chapterPart(ch) { return partOf(ch.part); }

VIEWS.profile = {
  render() {
    const b = requireBook();
    if (!b) return noBookPanel('Create a book and it gets its own profile page — cover picture, chapters, cast, the lot.');
    const p = b.profile;
    const tab = p.tab || 'timeline';
    const words = bookWords(b);
    const cover = p.cover;
    const av = clamp(Number(p.avatarSize) || 128, 56, 260);

    return '' +
    /* ---------- cover ---------- */
    '<div class="prof-cover" style="height:' + clamp(Number(cover.h) || 300, 60, 700) + 'px">' +
      bannerMediaHTML(cover) +
      '<div class="cvscrim" style="opacity:' + ((cover.tint == null ? 55 : cover.tint) / 100) + '"></div>' +
      '<div class="cvtools">' +
        '<button class="btn ghost xs" data-act="profCoverNudge" data-d="-40" title="Shorter cover">–</button>' +
        '<span class="chip mono" style="background:var(--sunk)">' + (cover.h || 300) + 'px</span>' +
        '<button class="btn ghost xs" data-act="profCoverNudge" data-d="40" title="Taller cover">+</button>' +
        '<button class="btn xs" data-act="profCoverEdit"><i data-lucide="image"></i>COVER PICTURE / GIF</button>' +
      '</div>' +
    '</div>' +

    /* ---------- identity ---------- */
    '<div class="prof-head pos-' + (p.avatarPos || 'left') + '">' +
      '<div class="prof-av ' + (p.avatarShape || 'circle') + '" style="width:' + av + 'px;height:' + av + 'px" data-act="profAvatarMenu" title="Click to change the profile picture">' +
        (p.avatar ? '<img src="' + attr(p.avatar) + '" alt="">' : '<span class="ph" style="font-size:' + Math.round(av / 2.6) + 'px">' + esc((b.title || '?').charAt(0).toUpperCase()) + '</span>') +
        '<span class="avedit">✎</span>' +
      '</div>' +
      '<div class="prof-id">' +
        '<h1 class="prof-name">' + esc(p.displayName || b.title) + '</h1>' +
        '<div class="prof-handle">@' + esc(p.handle || slug(b.title)) + (b.author ? ' · by ' + esc(b.author) : '') + '</div>' +
        (p.tagline || b.logline ? '<div class="prof-tagline">' + esc(p.tagline || b.logline) + '</div>' : '') +
        '<div class="prof-chips">' +
          '<span class="chip rd">' + esc((b.status || 'drafting').toUpperCase()) + '</span>' +
          (b.genre ? '<span class="chip cy">' + esc(((GENRES.find(g => g.id === b.genre) || {}).name) || b.genre) + '</span>' : '') +
          (b.about && b.about.series ? '<span class="chip am">' + esc(b.about.series) + (b.about.seriesNo ? ' #' + esc(b.about.seriesNo) : '') + '</span>' : '') +
          '<span class="chip">' + fmt(b.chapters.length) + ' CHAPTERS</span>' +
          '<span class="chip">' + fmt(words) + ' WORDS</span>' +
          '<span class="chip lm">' + bookCompletion(b) + '% DONE</span>' +
        '</div>' +
      '</div>' +
      '<div class="prof-actions">' +
        '<button class="btn solid" data-act="feedAdd"><i data-lucide="plus"></i>WRITE A NEW CHAPTER</button>' +
        '<button class="btn ghost" data-act="profEdit"><i data-lucide="pencil"></i>EDIT PROFILE</button>' +
        '<button class="btn ghost" data-act="themeEdit"><i data-lucide="palette"></i>CUSTOMISE LOOK</button>' +
        '<button class="btn ghost" data-act="docExport" title="Save this book as a Word, WordPad or text document"><i data-lucide="file-output"></i>SAVE AS A DOCUMENT</button>' +
        '<button class="btn ghost" data-go="gdoc" title="Mirror this book into a Google Doc that keeps itself up to date">' +
          ((b.gdoc && b.gdoc.live && b.gdoc.id)
            ? '<span class="lpdot" style="margin-right:2px"></span>GOOGLE DOC · LIVE'
            : '<i data-lucide="file-text"></i>GOOGLE DOC') + '</button>' +
        '<button class="btn ghost" data-go="library"><i data-lucide="library"></i>ALL MY BOOKS' +
          (state.books.length > 1 ? ' <span class="badge">' + state.books.length + '</span>' : '') + '</button>' +
      '</div>' +
    '</div>' +

    (p.showStats === false ? '' :
    '<div class="prof-statbar">' +
      profStat(fmt(words), 'WORDS') + profStat(readTime(words), 'READING TIME') +
      profStat(fmt(b.chapters.length), 'CHAPTERS') + profStat(fmt(b.characters.length), 'CAST') +
      profStat(fmt((b.lore || []).length), 'LORE ENTRIES') + profStat(bookCompletion(b) + '%', 'OF GOAL') +

    /* ---------- tabs ---------- */
    '<div class="prof-tabs">' + profileTabs(b).map(t =>

      (t[0] === 'timeline' ? ' <span class="mono fs10">' + b.chapters.length + '</span>' : '') +
      (t[0] === 'cast' ? ' <span class="mono fs10">' + b.characters.length + '</span>' : '') +
      (t[0] === 'world' ? ' <span class="mono fs10">' + (b.lore || []).length + '</span>' : '') +
      (t[0] === 'gallery' ? ' <span class="mono fs10">' + ((b.gallery || []).length) + '</span>' : '') + '</button>').join('') +
      '<span style="flex:1"></span>' +
      '<span class="tabmove">' +
        '<span class="mono fs10 faint">MOVE “' + esc((PROF_TABS.find(x => x[0] === tab) || ['', 'tab'])[1]) + '”</span>' +
        '<button class="btn xs ghost" data-act="profTabMove" data-k="' + tab + '" data-d="-1" title="Move this tab left">◂</button>' +

      '</span>' +
    '</div>' +

    (tab === 'timeline' ? this.timeline(b)
      : tab === 'about' ? this.about(b)
      : tab === 'cast' ? this.cast(b)
      : tab === 'world' ? this.world(b)
      : tab === 'covers' ? this.covers(b)

  timeline(b) {

            '</select>' +
          '</div>' +
        '</div>' +

        '<div class="post-body">' +
          (isOpen
            ? editorHTML('feedEd', ch.html, 'Write this chapter. It saves as you type.', { allowImage: true, minHeight: 380 })
            : (w

        })() +
        '<div class="panel clip mb10 tone-red"><div class="panel-hd"><i data-lucide="target"></i><h3>STORY MAP</h3>' +
          '<span style="flex:1"></span><span class="sub">' + markers.length + ' MARKS</span></div>' +
          '<div class="panel-bd" style="max-height:280px;overflow:auto">' +
            '<div class="hint mb10">Marks you placed on individual paragraphs. Open a chapter, put the cursor in a paragraph and press <strong>Tag paragraph</strong>.</div>' +
            (markers.length ? '<div class="marker-list">' + markers.map(m =>
              '<div class="mrow" style="--pc:' + m.color + '" data-act="feedJump" data-id="' + m.chId + '">' +

          '</div></div>' +
        '<div class="panel clip"><div class="panel-hd"><i data-lucide="gauge"></i><h3>PROGRESS</h3></div>' +
          '<div class="panel-bd">' +
            '<div class="flex between mono fs10 faint mb6"><span>' + fmt(bookWords(b)) + ' / ' + fmt(b.goalWords) + '</span><span>' + bookCompletion(b) + '%</span></div>' +
            '<div class="bar mb10"><i style="width:' + bookCompletion(b) + '%"></i></div>' +
            '<div class="flex gap4 wrap">' +
              '<button class="btn xs ghost" data-go="outline"><i data-lucide="git-branch"></i>PLAN</button>' +
              '<button class="btn xs ghost" data-go="characters"><i data-lucide="users"></i>CAST</button>' +
              '<button class="btn xs ghost" data-go="cover"><i data-lucide="image"></i>COVER</button>' +
              '<button class="btn xs ghost" data-go="exportv"><i data-lucide="download"></i>EXPORT</button>' +
            '</div>' +
          '</div></div>' +
      '</div></div>' +
    '</div>';
  },

  /* -------------------------------- ABOUT ------------------------------- */
  about(b) {
    const a = b.about;
    const fld = (k, label, hint, rows) => rows
      ? '<label class="fld"><span class="lb">' + esc(label) + '</span><textarea class="ta" rows="' + rows + '" data-model="' + k + '">' + esc(a[k] || '') + '</textarea>' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>'
      : '<label class="fld"><span class="lb">' + esc(label) + '</span><input class="inp" data-model="' + k + '" value="' + attr(a[k] || '') + '">' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>';
    return '<div class="grid-auto" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">' +
      '<div>' +
        '<div class="panel clip mb14" data-root="book"><div class="panel-hd"><i data-lucide="book"></i><h3>THE BASICS</h3></div><div class="panel-bd">' +
          '<div class="helpbox mb14"><b>WHAT THIS TAB IS FOR</b>Everything a reader, an agent or future-you would need to know about this book in one place. Fill in what you know; leave the rest blank and come back.</div>' +
          '<div class="grid-auto g2">' +
            '<label class="fld"><span class="lb">Title</span><input class="inp" data-model="title" data-rerender value="' + attr(b.title) + '"></label>' +
            '<label class="fld"><span class="lb">Subtitle</span><input class="inp" data-model="subtitle" value="' + attr(b.subtitle) + '"></label>' +
            '<label class="fld"><span class="lb">Author</span><input class="inp" data-model="author" value="' + attr(b.author) + '"></label>' +
            '<label class="fld"><span class="lb">Genre</span><select class="sel" data-model="genre" data-rerender><option value="">— unset —</option>' +
              GENRES.map(g => '<option value="' + g.id + '"' + (b.genre === g.id ? ' selected' : '') + '>' + esc(g.name) + '</option>').join('') + '</select></label>' +
            '<label class="fld"><span class="lb">Status</span><select class="sel" data-model="status" data-rerender>' +
              ['ideation', 'outlining', 'drafting', 'revising', 'polished', 'shipped'].map(s => '<option value="' + s + '"' + (b.status === s ? ' selected' : '') + '>' + s.toUpperCase() + '</option>').join('') + '</select></label>' +
            '<label class="fld"><span class="lb">Word count goal</span><input class="inp" type="number" step="500" data-model="goalWords" data-rerender value="' + attr(b.goalWords) + '"></label>' +
          '</div>' +
          '<label class="fld"><span class="lb">Logline — the whole book in one sentence</span><textarea class="ta" rows="2" data-model="logline" placeholder="When ___ happens, ___ must ___ or else ___.">' + esc(b.logline) + '</textarea>' +
            '<span class="hint">If you can\'t write this yet, that\'s fine — but it usually means the plot isn\'t settled.</span></label>' +
        '</div></div>' +

        '<div class="panel clip mb14" data-root="book" data-sub="about"><div class="panel-hd"><i data-lucide="layers"></i><h3>SERIES &amp; POSITIONING</h3></div><div class="panel-bd">' +
          '<div class="grid-auto g2">' +
            fld('series', 'Series name', 'Leave blank for a standalone.') +
            fld('seriesNo', 'Book number in the series') +
            fld('penName', 'Pen name', 'If it differs from your real name.') +
            fld('audience', 'Audience', 'Children / Middle Grade / YA / Adult.') +
            fld('subgenre', 'Sub-genre', 'e.g. cosy mystery, hopepunk, grimdark.') +
            fld('rating', 'Content rating', 'e.g. PG-13, adult, all ages.') +
          '</div>' +
          fld('comps', 'Comparison titles ("for fans of…")', 'Two or three books or shows a reader could be told this is like.', 2) +
        '</div></div>' +

        '<div class="panel clip" data-root="book" data-sub="about"><div class="panel-hd"><i data-lucide="quote"></i><h3>PITCH &amp; SYNOPSIS</h3></div><div class="panel-bd">' +
          fld('pitch', 'Elevator pitch (30 seconds)', 'What you would say out loud if someone asked what it is about.', 3) +
          fld('synopsisShort', 'Short synopsis (1 paragraph)', '', 4) +
          fld('synopsisLong', 'Full synopsis (with the ending)', 'Agents ask for this. It must include how it ends.', 9) +
        '</div></div>' +
      '</div>' +

      '<div data-root="book" data-sub="about">' +
        '<div class="panel clip mb14"><div class="panel-hd"><i data-lucide="compass"></i><h3>CRAFT DECISIONS</h3></div><div class="panel-bd">' +
          '<div class="grid-auto g2">' +
            '<label class="fld"><span class="lb">Point of view</span><select class="sel" data-model="pov">' +
              ['First person', 'Second person', 'Third limited', 'Third omniscient', 'Multiple POV', 'Epistolary', 'Mixed'].map(o => '<option value="' + attr(o) + '"' + (a.pov === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' +
              '<span class="hint">Who is telling it, and how close are we to them?</span></label>' +
            '<label class="fld"><span class="lb">Tense</span><select class="sel" data-model="tense">' +
              ['Past', 'Present', 'Mixed'].map(o => '<option value="' + attr(o) + '"' + (a.tense === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></label>' +
          '</div>' +
          fld('setting', 'Setting — where', 'The place the story lives. Be specific.') +
          fld('period', 'Setting — when', 'Year, season, era, or "unspecified near future".') +
          fld('themes', 'Themes', 'What the book argues about, underneath the plot.', 2) +
          fld('tone', 'Tone & mood', 'Three or four adjectives you want a reader to feel.', 2) +
          fld('warnings', 'Content warnings', 'Worth noting now so you handle them deliberately.', 2) +
        '</div></div>' +

        '<div class="panel clip mb14"><div class="panel-hd"><i data-lucide="clock"></i><h3>PRODUCTION</h3></div><div class="panel-bd">' +
          '<div class="grid-auto g2">' +
            '<label class="fld"><span class="lb">Started</span><input class="inp" type="date" data-model="startDate" value="' + attr(a.startDate) + '"></label>' +
            '<label class="fld"><span class="lb">Target finish</span><input class="inp" type="date" data-model="deadline" value="' + attr(a.deadline) + '"></label>' +
          '</div>' +
          fld('pubPlan', 'Publication plan', 'Querying agents, self-publishing, serial, or "no idea yet".', 2) +
          fld('inspiration', 'Where this came from', 'The image, dream, argument or news story that started it.', 3) +
          fld('playlist', 'Playlist / soundtrack link') +
          fld('notes', 'Anything else', '', 5) +
        '</div></div>' +

        '<div class="panel clip"><div class="panel-hd"><i data-lucide="check"></i><h3>HOW COMPLETE IS THIS?</h3></div><div class="panel-bd">' +
          aboutChecklist(b) +
        '</div></div>' +
      '</div>' +
    '</div>';
  },

  /* -------------------------------- CAST -------------------------------- */
  cast(b) {
    const cast = b.characters || [];
    return '<div class="panel clip mb14"><div class="panel-bd">' +
      '<div class="helpbox"><b>THE PEOPLE IN THIS BOOK</b>' +
      'A quick view of your cast. Click anyone to open their full dossier. To build the relationship map or talk to a character, use the <strong>Cast System</strong> pages in the menu.</div>' +
      '<div class="flex gap6 wrap mt10">' +
        '<button class="btn solid sm" data-act="charNew"><i data-lucide="user-plus"></i>NEW CHARACTER</button>' +
        '<button class="btn ghost sm" data-go="characters"><i data-lucide="users"></i>FULL MATRIX</button>' +
        '<button class="btn ghost sm" data-go="network"><i data-lucide="network"></i>RELATIONSHIP MAP</button>' +
        '<button class="btn ghost sm" data-go="sandbox"><i data-lucide="message-square"></i>TALK TO THEM</button>' +
      '</div></div></div>' +
      (cast.length ? TIERS.map(t => {
        const list = cast.filter(c => c.tier === t.id);
        if (!list.length) return '';
        return '<div class="partsection" style="--pc:' + (t.id === 'lead' ? '#ff2b3d' : t.id === 'co' ? '#ffb43a' : t.id === 'sup' ? '#23e0ff' : '#7e9bad') + '">' + esc(t.label) + '</div>' +
          '<div class="grid-auto mb14" style="grid-template-columns:repeat(auto-fill,minmax(196px,1fr))">' +
          list.map(c => '<div class="panel cast-card ' + t.cls + '" data-act="charOpen" data-id="' + c.id + '">' +
            '<div class="cast-photo">' + (c.photo ? '<img src="' + attr(c.photo) + '">' : '<span class="ph">' + esc((c.name || '?').charAt(0).toUpperCase()) + '</span>') + '</div>' +
            '<div class="cast-body"><h4 class="cast-name">' + esc(c.name || 'Unnamed') + '</h4>' +
            '<div class="cast-role">' + esc((c.role || 'ROLE UNSET').toUpperCase()) + '</div>' +
            (c.motivation ? '<div class="fs12 muted mt6" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + esc(c.motivation) + '</div>' : '') +
            '</div></div>').join('') + '</div>';
      }).join('')
      : '<div class="panel clip"><div class="panel-bd"><div class="empty"><i data-lucide="users"></i><h4>NO CAST YET</h4>' +
        '<div class="fs13 mb14">Even a short story needs one person who wants something.</div>' +
        '<button class="btn solid" data-act="charNew"><i data-lucide="user-plus"></i>CREATE YOUR FIRST CHARACTER</button></div></div></div>');
  },

  /* ------------------------------- WORLD -------------------------------- */
  world(b) {
    const lore = b.lore || [];
    const filter = state.ui.loreFilter || 'all';
    const shown = filter === 'all' ? lore : lore.filter(l => l.type === filter);
    return '<div class="panel clip mb14"><div class="panel-bd">' +
      '<div class="helpbox"><b>WORLD &amp; LORE</b>' +
      'Every place, faction, object, creature, invented word and historical event in your story. Write it down once here and you will stop contradicting yourself in chapter 30.</div>' +
      '<div class="flex gap6 wrap mt10">' +
        '<button class="btn solid sm" data-act="loreAdd"><i data-lucide="plus"></i>NEW LORE ENTRY</button>' +
        '<span style="flex:1"></span>' +
        '<button class="chip ' + (filter === 'all' ? 'cy' : '') + '" style="cursor:pointer" data-act="loreFilter" data-k="all">ALL ' + lore.length + '</button>' +
        LORE_TYPES.filter(t => lore.some(l => l.type === t)).map(t =>
          '<button class="chip ' + (filter === t ? 'cy' : '') + '" style="cursor:pointer" data-act="loreFilter" data-k="' + attr(t) + '">' + esc(t) + ' ' + lore.filter(l => l.type === t).length + '</button>').join('') +
      '</div></div></div>' +
      (shown.length
        ? '<div class="grid-auto" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">' +
          shown.map(l => '<div class="lorecard" data-act="loreEdit" data-id="' + l.id + '">' +
            (l.img ? '<img src="' + attr(l.img) + '" alt="">' : '<div class="lph">' + esc((l.name || '?').charAt(0).toUpperCase()) + '</div>') +
            '<div style="flex:1;min-width:0">' +
              '<div class="flex between center gap6"><strong style="color:var(--txt);font-size:14px">' + esc(l.name || 'Unnamed') + '</strong>' +
              '<span class="chip cy">' + esc(l.type || 'Other') + '</span></div>' +
              (l.summary ? '<div class="fs12 muted mt6" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">' + esc(l.summary) + '</div>' : '<div class="fs12 faint mt6"><em>No description yet.</em></div>') +
            '</div></div>').join('') + '</div>'
        : '<div class="panel clip"><div class="panel-bd"><div class="empty"><i data-lucide="globe"></i><h4>NOTHING RECORDED YET</h4>' +
          '<div class="fs13 mb14">Add the first place, faction or invented term in your story.</div>' +
          '<button class="btn solid" data-act="loreAdd"><i data-lucide="plus"></i>NEW LORE ENTRY</button></div></div></div>');
  },

  /* ------------------------------ COVERS -------------------------------- */
  covers(b) {
    const f = b.cover.front, k = b.cover.back, sp = b.cover.spine;
    const has = !!(f.art || k.art);
    const shot = (title, side, artHTML, tips) =>
      '<div class="panel clip"><div class="panel-hd"><i data-lucide="image"></i><h3>' + esc(title) + '</h3>' +
        '<span style="flex:1"></span>' +
        '<button class="btn xs" data-act="coverArt" data-arg="' + side + '"><i data-lucide="upload"></i>UPLOAD</button>' +
        '<button class="btn xs ghost" data-act="coverArtUrl" data-arg="' + side + '"><i data-lucide="link"></i></button>' +
      '</div><div class="panel-bd"><div class="cover-showcase">' + artHTML + '</div>' +
      '<div class="hint mt10">' + tips + '</div></div></div>';

    return '<div class="panel clip mb14"><div class="panel-bd">' +
      '<div class="helpbox"><b>YOUR BOOK AS AN OBJECT</b>' +
        'The full-size artwork for the front, the back and the spine, shown as large as the screen allows. ' +
        'Upload straight from here, or open the <strong>Cover Studio</strong> to lay out the type, blurb and print guides.</div>' +
      '<div class="flex gap6 wrap mt10">' +
        '<button class="btn solid" data-go="cover"><i data-lucide="image"></i>OPEN COVER STUDIO</button>' +
        '<button class="btn ghost" data-act="coversFromGallery"><i data-lucide="library"></i>USE A PICTURE FROM MY ALBUM</button>' +
        (has ? '<button class="btn ghost" data-act="printCover"><i data-lucide="printer"></i>PRINT THE WRAP</button>' : '') +
      '</div>' +
    '</div></div>' +

    '<div class="partsection">THE FULL WRAP</div>' +
    '<div class="panel clip mb14"><div class="panel-bd">' +
      '<div class="wrap3d">' +
        '<div class="w3-back">' + coverBackPreview(b) + '</div>' +
        '<div class="w3-spine" style="background:' + attr(sp.color || '#0a1420') + '">' +
          '<span>' + esc(sp.text || (b.title + '   ·   ' + (b.author || ''))) + '</span></div>' +
        '<div class="w3-front">' + coverFrontPreview(b) + '</div>' +
      '</div>' +
      '<div class="hint mt10" style="text-align:center">Back cover · spine · front cover, laid out as they would be printed on one sheet.</div>' +
    '</div></div>' +

    '<div class="partsection">EACH SIDE, LARGE</div>' +
    '<div class="grid-auto" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">' +
      shot('Front Cover', 'front', coverFrontPreview(b),
        'The one job of a front cover is to say what kind of book this is from across a room. Genre first, cleverness second.') +
      shot('Back Cover', 'back', coverBackPreview(b),
        'Tagline, blurb, author bio, barcode. Aim for 120–180 words of blurb — the Cover Studio has the formula.') +
      '<div class="panel clip"><div class="panel-hd"><i data-lucide="book"></i><h3>Spine</h3></div>' +
        '<div class="panel-bd"><div class="cover-showcase spine-shot">' +
          '<div class="spine-big" style="background:' + attr(sp.color || '#0a1420') + '">' +
            '<span>' + esc(sp.text || (b.title + '   ·   ' + (b.author || ''))) + '</span></div>' +
        '</div>' +
        '<div class="grid-auto g2 mt10" data-root="book" data-sub="cover.spine">' +
          '<label class="fld" style="margin:0"><span class="lb">Spine text</span><input class="inp" data-model="text" data-rerender value="' + attr(sp.text) + '" placeholder="' + attr(b.title + ' · ' + (b.author || '')) + '"></label>' +
          '<label class="fld" style="margin:0"><span class="lb">Spine colour</span><input type="color" data-model="color" data-rerender value="' + attr(sp.color) + '"></label>' +
        '</div>' +
        '<div class="hint mt10">Spine width grows with page count — roughly 0.0572mm per page on 80gsm cream. Under about 100 pages a printer will not put text on it at all.</div>' +
      '</div></div>' +
    '</div>';
  },

  /* ------------------------------- NOTES -------------------------------- */
  notes(b) {
    return '<div class="grid-auto" style="grid-template-columns:minmax(0,1fr) minmax(260px,340px)">' +
      '<div class="panel clip" data-root="book" data-sub="about"><div class="panel-hd"><i data-lucide="sticky-note"></i><h3>WORKING NOTES</h3></div>' +
        '<div class="panel-bd">' +
          '<div class="helpbox mb14"><b>A SCRATCHPAD FOR THIS BOOK</b>Loose ideas, things to fix, lines you like, questions to answer later. Nothing here appears in the manuscript.</div>' +
          '<textarea class="ta" rows="22" data-model="notes" placeholder="Things to fix…&#10;Lines I want to use…&#10;Questions I still need to answer…">' + esc(b.about.notes) + '</textarea>' +
          '<div class="wcount mt6">' + countWords(b.about.notes) + ' words</div>' +
        '</div></div>' +
      '<div>' +
        '<div class="panel clip mb14" data-root="book" data-sub="profile"><div class="panel-hd"><i data-lucide="pin"></i><h3>PINNED TO THE FEED</h3></div>' +
          '<div class="panel-bd"><textarea class="ta" rows="5" data-model="pinned">' + esc(b.profile.pinned) + '</textarea>' +
          '<div class="hint">This shows on the Chapters tab beside your feed.</div></div></div>' +
        '<div class="panel clip"><div class="panel-hd"><i data-lucide="activity"></i><h3>RECENT ACTIVITY</h3></div>' +
          '<div class="panel-bd" style="max-height:400px;overflow:auto">' +
            ((b.activity || []).length ? b.activity.slice(0, 20).map(a =>
              '<div class="flex gap8 mb10" style="align-items:flex-start">' +
              '<span style="width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:6px;flex:0 0 6px"></span>' +
              '<div><div class="fs13">' + esc(a.text) + '</div><div class="mono fs10 faint">' + esc(timeAgo(a.at)) + '</div></div></div>').join('')
              : '<div class="faint fs12">Nothing yet.</div>') +
          '</div></div>' +
      '</div></div>';
  },

  mount() {
    const b = currentBook(); if (!b) return;
    const openId = state.ui.feedOpen;
    if (openId) {
      const ch = b.chapters.find(c => c.id === openId);
      if (ch && document.getElementById('feedEd')) {
        wireEditor('feedEd', (html) => { ch.html = html; }, ch.title || 'Chapter');
      }
    }
    const qt = $('#quickTitle');
    if (qt) qt.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); ACTIONS.feedQuickAdd(); } });
    wireTabDrag();
  }
};
function profStat(v, k) { return '<div><div class="v">' + v + '</div><div class="k">' + esc(k) + '</div></div>'; }
function aboutChecklist(b) {
  const a = b.about;
  const rows = [
    ['Title', !!b.title], ['Author name', !!b.author], ['Genre chosen', !!b.genre],
    ['Logline written', !!(b.logline || '').trim()], ['Elevator pitch', !!(a.pitch || '').trim()],
    ['Short synopsis', !!(a.synopsisShort || '').trim()], ['Full synopsis', !!(a.synopsisLong || '').trim()],
    ['POV & tense decided', !!(a.pov && a.tense)], ['Setting described', !!(a.setting || '').trim()],
    ['Themes named', !!(a.themes || '').trim()], ['Comp titles', !!(a.comps || '').trim()],
    ['Cover art', !!b.cover.front.art], ['At least one chapter', !!b.chapters.length],
    ['At least one lead character', (b.characters || []).some(c => c.tier === 'lead')],
    ['Beat sheet built', !!(b.outline.beats || []).length]
  ];
  const done = rows.filter(r => r[1]).length;
  return '<div class="flex between mono fs10 faint mb6"><span>' + done + ' OF ' + rows.length + ' COMPLETE</span><span>' + Math.round((done / rows.length) * 100) + '%</span></div>' +
    '<div class="bar mb10"><i style="width:' + Math.round((done / rows.length) * 100) + '%"></i></div>' +
    rows.map(r => '<div class="flex center gap8 fs13 mb6" style="color:' + (r[1] ? '#8dff4f' : 'var(--txt-faint)') + '">' +
      '<span style="width:14px">' + (r[1] ? '✓' : '○') + '</span>' + esc(r[0]) + '</div>').join('');
}

/* ---------------------------- profile actions ---------------------------- */
ACTIONS.profTab = function (el) {
  const b = requireBook(); if (!b) return;
  b.profile.tab = el.getAttribute('data-k');
  markDirty(); render();
};
ACTIONS.profCoverNudge = function (el) {
  const b = requireBook(); if (!b) return;
  b.profile.cover.h = clamp((Number(b.profile.cover.h) || 300) + Number(el.getAttribute('data-d')), 60, 700);
  markDirty(); render();
};
ACTIONS.profCoverEdit = function () {
  const b = requireBook(); if (!b) return;
  openBannerEditor(b.profile.cover, {
    title: 'PROFILE COVER PICTURE', what: 'your book profile', noScope: true, noText: true,
    repaint: debounce(() => render(), 120)
  });
};

      '<div class="flex gap14 wrap center mb14">' +
        '<div class="prof-av ' + (p.avatarShape || 'circle') + '" style="width:' + clamp(p.avatarSize, 56, 260) + 'px;height:' + clamp(p.avatarSize, 56, 260) + 'px;cursor:default">' +
        (p.avatar ? '<img src="' + attr(p.avatar) + '">' : '<span class="ph" style="font-size:' + Math.round(p.avatarSize / 2.6) + 'px">' + esc((b.title || '?').charAt(0).toUpperCase()) + '</span>') + '</div>' +
        '<div style="flex:1;min-width:220px">' +
          '<div class="flex gap6 wrap mb10">' +
            '<button class="btn sm" data-act="profAvUpload"><i data-lucide="upload"></i>UPLOAD IMAGE / GIF</button>' +
            '<button class="btn sm ghost red" data-act="profAvClear"><i data-lucide="x"></i>REMOVE</button>' +
          '</div>' +
          '<label class="fld"><span class="lb">…or paste a link</span><input class="inp" id="avUrl" value="' + attr(p.avatar && p.avatar.slice(0, 4) === 'http' ? p.avatar : '') + '" placeholder="https://… .gif"></label>' +
        '</div>' +
      '</div>' +
      '<div class="grid-auto g3" data-root="book" data-sub="profile">' +
        '<label class="fld"><span class="lb">Size — <b class="t-cy">' + p.avatarSize + 'px</b></span>' +

ACTIONS.edMark = function (el) {
  const edId = el.getAttribute('data-ed') || activeEditorId() || 'feedEd';
  const ed = document.getElementById(edId);
  if (!ed) { toast('Open a chapter first.', 'warn'); return; }
  const sel = window.getSelection();
  let node = sel && sel.anchorNode ? (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement) : null;
  if (SAVED_RANGE && (!node || !ed.contains(node))) {
    const n2 = SAVED_RANGE.commonAncestorContainer;
    node = n2.nodeType === 1 ? n2 : n2.parentElement;
  }
  let block = null;
  while (node && node !== ed) {
    if (/^(P|DIV|H1|H2|H3|H4|BLOCKQUOTE|LI|PRE)$/.test(node.tagName)) { block = node; break; }
    node = node.parentElement;
  }
  if (!block) { toast('Click inside the paragraph you want to tag first.', 'warn', 'NO PARAGRAPH SELECTED'); return; }
  window.__markBlock = block; window.__markEd = edId;
  openModal({
    title: 'TAG THIS PARAGRAPH', icon: 'bookmark', size: '',
    body: '<div class="helpbox mb14"><b>WHAT THIS DOES</b>' +
      'Puts a little coloured label on this exact paragraph so you can find it instantly later. Use it to mark the moment the story turns — the inciting incident, the midpoint, the climax, a reveal. ' +
      'All your marks are listed in the <strong>Story Map</strong> beside the feed.</div>' +
      '<div class="fs12 muted mb10">Paragraph: “' + esc(excerptOf(block.innerHTML, 130) || '(empty)') + '”</div>' +
      '<div class="grid-auto" style="grid-template-columns:repeat(auto-fill,minmax(168px,1fr))">' +
        STORY_PARTS.map(s => '<button class="optcard" data-act="edMarkSet" data-id="' + s.id + '" style="border-left:3px solid ' + s.color + '">' +
          '<strong class="fs13" style="color:' + s.color + '">' + esc(s.label) + '</strong></button>').join('') +
      '</div>',
    footer: '<button class="btn ghost red" data-act="edMarkClear" style="margin-right:auto"><i data-lucide="x"></i>REMOVE MARK</button>' +
            '<button class="btn ghost" data-modal-close>CANCEL</button>'
  });
};

  const ed = document.getElementById(window.__markEd);

  toast('Paragraph tagged as “' + sp.label + '”.', 'ok');

ACTIONS.edMarkClear = function () {

/** Every paragraph mark in the book, in reading order. */
function bookMarkers(b) {
  const out = [];
  const scan = (html, chId, chTitle) => {
    if (!html || html.indexOf('data-marker') === -1) return;
    const d = document.createElement('div');
    d.innerHTML = html;
    d.querySelectorAll('[data-marker]').forEach(n => {
      const label = n.getAttribute('data-marker');
      const sp = STORY_PARTS.find(s => s.label === label);
      out.push({ label: label, color: sp ? sp.color : '#23e0ff', chId: chId, chTitle: chTitle, text: excerptOf(n.innerHTML, 90) });
    });
  };
  scan(b.prologue && b.prologue.html, '', 'Prologue');
  (b.chapters || []).forEach((c, i) => scan(c.html, c.id, 'Ch ' + (i + 1) + ' — ' + (c.title || 'Untitled')));
  return out;
}

const SLIDE_TRANSITIONS = [
  ['fade', 'Fade — soft cross-dissolve'],
  ['slide', 'Slide — glides in from the right'],
  ['zoom', 'Zoom — eases in from close'],
  ['flip', 'Flip — swings in like a page'],
  ['blur', 'Blur — resolves into focus'],
  ['kenburns', 'Ken Burns — slow drift on a still image']
];
let SLIDE_TIMER = null;

function slideshowHTML(b) {
  const s = b.slideshow || (b.slideshow = { slides: [], interval: 5, transition: 'fade', h: 320, autoplay: true, showCaptions: true });
  const n = s.slides.length;
  if (!n) {
    return '<div class="panel clip mb14"><div class="panel-hd"><i data-lucide="film"></i><h3>SLIDESHOW</h3></div>' +

        '<button class="btn solid" data-act="slideEdit"><i data-lucide="plus"></i>BUILD A SLIDESHOW</button>' +
      '</div></div></div>';
  }
  const i = clamp(Number(state.ui.slide) || 0, 0, n - 1);
  state.ui.slide = i;
  return '<div class="panel clip mb14" style="padding:0;overflow:hidden">' +
    '<div class="slideshow" id="slideshow" data-tr="' + esc(s.transition || 'fade') + '" style="height:' + clamp(Number(s.h) || 320, 120, 700) + 'px">' +
      s.slides.map((sl, k) => '<div class="slide' + (k === i ? ' active' : '') + '" data-slide="' + k + '">' +
        (/^data:video|\.(mp4|webm|ogg)(\?|$)/i.test(sl.src)
          ? '<video src="' + attr(sl.src) + '" autoplay muted loop playsinline></video>'
          : '<img src="' + attr(sl.src) + '" alt="" loading="lazy">') +
        (s.showCaptions !== false && (sl.title || sl.caption)
          ? '<div class="scap">' + (sl.title ? '<h4>' + esc(sl.title) + '</h4>' : '') + (sl.caption ? '<p>' + esc(sl.caption) + '</p>' : '') + '</div>' : '') +
      '</div>').join('') +
      (n > 1 ? '<button class="snav prev" data-act="slideGo" data-d="-1">‹</button><button class="snav next" data-act="slideGo" data-d="1">›</button>' +
        '<div class="sdots">' + s.slides.map((_, k) => '<i class="' + (k === i ? 'on' : '') + '" data-act="slideTo" data-i="' + k + '"></i>').join('') + '</div>' : '') +
      '<div class="stools">' +

        '<button class="btn xs" data-act="slideEdit"><i data-lucide="sliders-horizontal"></i>EDIT SLIDESHOW</button>' +
      '</div>' +
    '</div></div>';
}
function wireSlideshow() {
  if (SLIDE_TIMER) { clearInterval(SLIDE_TIMER); SLIDE_TIMER = null; }
  const b = currentBook(); if (!b || !b.slideshow) return;

function newPhoto(src, title) {
  return { id: uid('ph'), src: src, title: title || '', desc: '', tags: '', at: nowISO() };

/** Pictures living elsewhere in the project, gathered for the "from this book" strip. */
/** One picture, however many places it is used. */
function dedupeImages(list) {
  const seen = Object.create(null);
  return (list || []).filter(im => {
    const k = im && im.src;
    if (!k || seen[k]) return false;
    seen[k] = 1; return true;
  });
}
function collectBookImages(b) {
  const out = [];
  const add = (src, cap, where) => { if (src) out.push({ src: src, title: cap, where: where, auto: true }); };
  add(b.cover.front.art, 'Front cover', 'Cover Studio');
  add(b.cover.back.art, 'Back cover', 'Cover Studio');
  add(b.profile.avatar, 'Profile picture', 'Book Profile');
  if (b.profile.cover.type === 'image') add(b.profile.cover.src, 'Profile cover', 'Book Profile');
  (b.prologue.moodboard || []).forEach((m, i) => add(m.src, m.note || 'Prologue moodboard ' + (i + 1), 'Prologue'));
  (b.chapters || []).forEach((c, i) => (c.images || []).forEach(im => add(im.src, (c.title || 'Chapter ' + (i + 1)), 'Chapter ' + (i + 1))));
  (b.characters || []).forEach(c => add(c.photo, c.name || 'Character', 'Cast'));
  (b.research.pins || []).forEach(pn => add(pn.src, pn.caption || 'Research pin', 'Research'));
  (b.comic.pages || []).forEach((pg, i) => (pg.panels || []).forEach((pn, j) => add(pn.img, 'Page ' + (i + 1) + ' panel ' + (j + 1), 'Comic Studio')));
  (b.kids.spreads || []).forEach((sp, i) => add(sp.art, 'Spread ' + (i + 1), "Children's Studio"));
  (b.lore || []).forEach(l => add(l.img, l.name || 'Lore', 'World & Lore'));
  (b.slideshow.slides || []).forEach((sl, i) => add(sl.src, sl.title || 'Slide ' + (i + 1), 'Slideshow'));
  (b.characters || []).forEach(c => (c.gallery || []).forEach(im => add(im.src, im.caption || c.name || 'Character', 'Cast')));
  /* One picture used in three places is still one picture. Keep the first
     mention (its most meaningful home) and drop the repeats. */
  const seen = Object.create(null);
  return out.filter(im => {
    if (!im.src || seen[im.src]) return false;
    seen[im.src] = 1;
    return true;
  });
}

/* --------------------- draggable profile tab strip ----------------------- */
function profileTabs(b) {
  const p = b.profile;
  const known = PROF_TABS.map(t => t[0]);
  let order = (p.tabOrder || []).filter(t => known.indexOf(t) !== -1);
  known.forEach(t => { if (order.indexOf(t) === -1) order.push(t); });
  p.tabOrder = order;
  return order.map(id => PROF_TABS.find(t => t[0] === id));
}
ACTIONS.profTabMove = function (el) {
  const b = requireBook(); if (!b) return;
  const order = profileTabs(b).map(t => t[0]);
  const id = el.getAttribute('data-k');
  const d = Number(el.getAttribute('data-d'));
  const i = order.indexOf(id), j = i + d;
  if (i < 0 || j < 0 || j >= order.length) return;
  const [m] = order.splice(i, 1); order.splice(j, 0, m);
  b.profile.tabOrder = order; markDirty(); render();
};
function wireTabDrag() {
  const strip = document.querySelector('.prof-tabs'); if (!strip) return;
  const b = currentBook(); if (!b) return;
  let dragId = null;
  strip.querySelectorAll('[data-k]').forEach(el => {
    el.addEventListener('dragstart', (e) => {
      dragId = el.getAttribute('data-k'); el.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', dragId); } catch (_) { }
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); strip.querySelectorAll('.dragover').forEach(x => x.classList.remove('dragover')); });
    el.addEventListener('dragover', (e) => { if (!dragId) return; e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', () => el.classList.remove('dragover'));
    el.addEventListener('drop', (e) => {
      if (!dragId) return;
      e.preventDefault(); el.classList.remove('dragover');
      const target = el.getAttribute('data-k');
      if (target === dragId) return;
      const order = profileTabs(b).map(t => t[0]);
      const from = order.indexOf(dragId), to = order.indexOf(target);
      if (from < 0 || to < 0) return;
      const [m] = order.splice(from, 1); order.splice(to, 0, m);
      b.profile.tabOrder = order; markDirty(); render();
      toast('Tab order saved.', 'ok');
    });
  });
}

/* ===========================================================================
   v7 · GOOGLE DOCS LIVE SYNC
   Connect a Google account, press one button, and this book becomes a real
   Google Doc that keeps itself up to date while you type — typeset the same
   way the Book Designer typesets it, so the Doc is as elegant as the page.

   HOW IT WORKS, HONESTLY
   · Google's sign-in only works on a page served over http:// or https://.
     A file opened straight off the disk has no web origin for Google to trust,
     so the app detects that and tells you the one-line fix instead of failing
     silently.
   · You supply your own OAuth Client ID from Google Cloud. Nothing is shipped
     inside this file, and the token lives in memory only — never saved, never
     sent anywhere but google.com.

  return new Promise((resolve, reject) => {
    const existing = document.getElementById('gisScript');

const GFONT_MAP = {

  'Georgia,"Times New Roman",serif': 'Georgia',
  '"Times New Roman",Times,serif': 'Times New Roman',
  '"Cinzel",Georgia,serif': 'Cinzel',
  '"Inter",system-ui,sans-serif': 'Inter',
  '"Special Elite",Courier,monospace': 'Special Elite',

/** The whole book, as Doc paragraphs, in reading order. */

/* ------------------------------ the sync loop ---------------------------- */
async function gdocCreate(b) {
  const g = gdocOf(b);
  const title = (b.title || 'Untitled') + (b.author ? ' — ' + b.author : '');
  const doc = await gFetch('https://docs.googleapis.com/v1/documents', {
    method: 'POST', body: JSON.stringify({ title: title })
  });
  g.id = doc.documentId;
  g.title = title;
  g.url = 'https://docs.google.com/document/d/' + doc.documentId + '/edit';
  g.pushes = 0; g.hash = '';
  markDirty();
  return g;
}
/** Rewrite the whole Doc so it matches the manuscript exactly. */
async function gdocPush(b, reason, force) {
  const g = gdocOf(b);
  if (!g.id) throw new Error('This book has no Google Doc yet.');
  const blocks = gBookBlocks(b);
  const preview = blocks.map(x => x.text).join('\n');
  const h = hashString(preview + '|' + JSON.stringify(b.design || {}));
  if (!force && h === g.hash) { GSYNC_STATE = 'ok'; GSYNC_MSG = 'Already up to date'; return false; }

  GSYNC_STATE = 'syncing'; GSYNC_MSG = 'Writing to Google Docs…'; paintLivePill();
  try {
    const cur = await gFetch('https://docs.googleapis.com/v1/documents/' + encodeURIComponent(g.id) + '?fields=body(content(endIndex))');
    const content = (cur.body && cur.body.content) || [];
    const docEnd = content.length ? content[content.length - 1].endIndex : 2;
    const built = gBuildRequests(b, blocks, docEnd);

    /* Docs is happier with several modest batches than one enormous one. */
    const CH = 400;
    const head = built.requests.slice(0, 2);          /* delete + insert must go first, together */
    const rest = built.requests.slice(2);
    await gFetch('https://docs.googleapis.com/v1/documents/' + encodeURIComponent(g.id) + ':batchUpdate',
      { method: 'POST', body: JSON.stringify({ requests: head }) });
    for (let i = 0; i < rest.length; i += CH) {
      await gFetch('https://docs.googleapis.com/v1/documents/' + encodeURIComponent(g.id) + ':batchUpdate',
        { method: 'POST', body: JSON.stringify({ requests: rest.slice(i, i + CH) }) });
    }
    g.hash = h;
    g.lastSync = nowISO();
    g.lastError = '';
    g.lastWords = bookWords(b);
    g.pushes = (g.pushes || 0) + 1;
    GDOC_LASTPUSH = Date.now();
    GSYNC_STATE = 'ok'; GSYNC_MSG = 'Up to date';
    markDirty();
    paintLivePill();
    if (CURRENT_VIEW === 'gdoc') paintGdocStamp();
    return true;
  } catch (e) {
    g.lastError = String(e.message || e);
    GSYNC_STATE = 'error'; GSYNC_MSG = g.lastError;
    paintLivePill();
    if (CURRENT_VIEW === 'gdoc') paintGdocStamp();
    throw e;
  }
}
/** Called from markDirty — notes that the open book has moved on. */
function gdocTouch() {
  const b = currentBook();
  if (!b || !b.gdoc || !b.gdoc.live || !b.gdoc.id) return;
  GDOC_DIRTY = true;
  paintLivePill();
}
function startGdocLoop() {
  if (GDOC_TIMER) clearInterval(GDOC_TIMER);
  GDOC_TIMER = setInterval(async () => {
    if (!GDOC_DIRTY) return;
    const b = currentBook();
    if (!b || !b.gdoc || !b.gdoc.live || !b.gdoc.id) return;
    const gap = clamp(Number((state.app.google || {}).minSeconds) || 12, 5, 300) * 1000;
    if (Date.now() - GDOC_LASTPUSH < gap) return;
    if (GSYNC_STATE === 'syncing') return;
    GDOC_DIRTY = false;
    try { await gdocPush(b, 'live'); }
    catch (e) {
      /* one failure should not spin forever — turn live off and say why */
      b.gdoc.live = false;
      markDirty();
      toast('Live updating stopped: ' + String(e.message || e), 'err', 'GOOGLE DOC');
      if (CURRENT_VIEW === 'gdoc') render();
    }
  }, 3000);
}
/** The flashing red LIVE badge in the top bar. */
function paintLivePill() {
  const el = $('#livePill'); if (!el) return;
  const b = currentBook();
  const g = b && b.gdoc;
  if (!g || !g.live || !g.id) { el.style.display = 'none'; return; }
  el.style.display = '';
  const st = GSYNC_STATE === 'syncing' ? 'syncing' : GSYNC_STATE === 'error' ? 'error' : GDOC_DIRTY ? 'pending' : 'ok';
  el.className = 'livepill ' + st;
  el.querySelector('.lptxt').textContent =
    st === 'syncing' ? 'UPDATING…' : st === 'error' ? 'LIVE FAILED' : st === 'pending' ? 'LIVE · CHANGES QUEUED' : 'LIVE UPDATING';
  el.title = st === 'error'
    ? 'The last update to your Google Doc failed: ' + (g.lastError || '') + ' — click for details'
    : 'This book is mirrored into a Google Doc. Last update ' + (g.lastSync ? timeAgo(g.lastSync) : 'not yet') + '. Click for details.';
}
function paintGdocStamp() {
  const b = currentBook(); if (!b) return;
  const g = gdocOf(b);
  const el = $('#gdocStamp');
  if (el) el.innerHTML = g.lastSync
    ? '<strong class="t-lm">' + esc(new Date(g.lastSync).toLocaleString()) + '</strong> <span class="faint">(' + esc(timeAgo(g.lastSync)) + ')</span>'
    : '<span class="t-am">never</span>';
  const c = $('#gdocCount'); if (c) c.textContent = fmt(g.pushes || 0);
  const w = $('#gdocWords'); if (w) w.textContent = fmt(g.lastWords || 0);
  const s = $('#gdocState');
  if (s) {
    const st = GSYNC_STATE === 'syncing' ? ['am', 'WRITING TO GOOGLE…'] : GSYNC_STATE === 'error' ? ['rd', 'FAILED'] :
      GDOC_DIRTY ? ['am', 'CHANGES WAITING'] : g.lastSync ? ['lm', 'UP TO DATE'] : ['', 'NOT SENT YET'];
    s.className = 'chip ' + st[0]; s.textContent = st[1];
  }
}

};
ACTIONS.gDisconnect = function () {

  state.app.google.connected = false;

  toast('Disconnected. The token was only ever held in memory, and it is gone.', 'warn');
};
ACTIONS.gdocCreate = async function () {
  const b = requireBook(); if (!b) return;
  const cap = googleCapability();
  if (!cap.ok) { ACTIONS.gHelp(); return; }
  try {
    toast('Creating the Google Doc…', 'ok');

    b.gdoc.live = true;
    markDirty(); render(); paintLivePill();

  } catch (e) { toast(String(e.message || e), 'err', 'GOOGLE'); render(); }
};
ACTIONS.gdocLink = async function () {
  const b = requireBook(); if (!b) return;
  const v = await promptDlg('LINK AN EXISTING GOOGLE DOC', 'Paste the Doc address or its ID', '');
  if (!v || !v.trim()) return;
  const m = String(v).match(/\/document\/d\/([a-zA-Z0-9_-]+)/);
  const id = m ? m[1] : v.trim();
  const g = gdocOf(b);
  g.id = id; g.url = 'https://docs.google.com/document/d/' + id + '/edit'; g.hash = '';
  markDirty(); render();
  toast('Linked. Press “Update it now” to write your book into it — this replaces whatever is in that Doc.', 'warn');
};
ACTIONS.gdocPushNow = async function () {
  const b = requireBook(); if (!b) return;
  try { await gdocPush(b, 'manual', true); render(); toast('Google Doc updated.', 'ok'); }
  catch (e) { toast(String(e.message || e), 'err', 'GOOGLE'); render(); }
};
ACTIONS.gdocLive = function (el) {
  const b = requireBook(); if (!b) return;
  const g = gdocOf(b);
  /* a pure toggle: the delegated click handler calls preventDefault(), so a
     checkbox's own state is not something to read back from. */
  g.live = !g.live;
  if (g.live && !g.id) { g.live = false; toast('Create the Google Doc first.', 'warn'); }
  if (g.live) { GDOC_DIRTY = true; toast('Live updating is on. The Doc follows what you type.', 'ok'); }

  markDirty(); render(); paintLivePill();
};

/** Builds the ordered stream of blocks that make up the book. */
function bookBlocks(b, d) {
  const out = [];

      '<div class="bk-title">' + esc(b.titlePage.text || b.title) + '</div>' +

      (b.author ? '<div class="bk-author">' + esc(b.author) + '</div>' : '') +
      (b.titlePage.imprint ? '<div class="bk-imprint">' + esc(b.titlePage.imprint) + '</div>' : '') });
  }
  if (d.dedication && (b.dedication.text || '').trim()) {
    out.push({ type: 'page-ded', html: '<div class="bk-ded">' + nl2br(b.dedication.text) + '</div>' });
  }
  const sections = [];
  if ((b.prologue.html || '').trim()) sections.push({ title: 'Prologue', num: '', html: b.prologue.html });
  (b.chapters || []).forEach((c, i) => sections.push({ title: c.title || 'Chapter ' + (i + 1), num: String(i + 1), html: c.html }));
  sections.forEach(sec => out.push({ type: 'chapter', title: sec.title, num: sec.num, html: sec.html }));
  return out;
}
/** Converts one chapter's editor HTML into clean, printable block elements. */
function chapterNodes(html, d) {
  const holder = document.createElement('div');
  holder.innerHTML = html || '';
  holder.querySelectorAll('script,style').forEach(n => n.remove());
  const nodes = [];
  Array.from(holder.childNodes).forEach(n => {
    if (n.nodeType === 3) {
      const t = n.textContent.trim();
      if (t) nodes.push('<p>' + esc(t) + '</p>');
      return;
    }
    if (n.nodeType !== 1) return;
    const tag = n.tagName.toLowerCase();
    if (tag === 'hr') { nodes.push('<p class="bk-break">' + esc(d.sceneBreak || '* * *') + '</p>'); return; }
    if (tag === 'img') { nodes.push('<figure class="bk-fig" style="width:100%"><img src="' + attr(n.getAttribute('src') || '') + '" alt=""></figure>'); return; }
    if (tag === 'figure') {
      if (!picturesInPrint()) return;      /* text-only book, as chosen */
      const im = n.querySelector('img'); if (!im) return;
      const cp = n.querySelector('figcaption');
      const al = n.getAttribute('data-align') || 'center';
      const wd = clamp(Number(n.getAttribute('data-w') || 70), 10, 100);
      const style = 'width:' + wd + '%;' + (al === 'left' ? 'float:left;margin:.2em 1em .6em 0;' :
        al === 'right' ? 'float:right;margin:.2em 0 .6em 1em;' : 'margin:1em auto;');
      nodes.push('<figure class="bk-fig" style="' + style + '"><img src="' + attr(im.getAttribute('src') || '') + '" alt="">' +
        (cp ? '<figcaption>' + esc(cp.textContent) + '</figcaption>' : '') + '</figure>');
      return;
    }
    const inner = n.innerHTML;
    if (!stripHTML(inner).trim() && !n.querySelector('img')) return;
    if (tag === 'h2' || tag === 'h3') nodes.push('<h3 class="bk-h">' + inner + '</h3>');
    else if (tag === 'blockquote') nodes.push('<blockquote class="bk-q">' + inner + '</blockquote>');
    else if (tag === 'ul' || tag === 'ol') nodes.push('<' + tag + ' class="bk-list">' + inner + '</' + tag + '>');
    else nodes.push('<p>' + inner + '</p>');
  });

}
/** Fills fixed-height pages with the block stream, splitting long paragraphs

function paginate(b, d, opts) {

    'text-align:' + d.align + ';';

  document.body.appendChild(gauge);
  /* mirror the page's own paragraph metrics or every measurement is wrong */
  const gaugeCSS = document.createElement('style');
  gaugeCSS.textContent =
    '.bk-gauge p{margin:0 0 ' + (d.paraGap || 0) + 'em;text-indent:' + (d.indent || 0) + 'em;}' +
    '.bk-gauge p.bk-first,.bk-gauge p.bk-cont{text-indent:0;}' +
    '.bk-gauge .bk-break{text-align:center;text-indent:0;margin:1.1em 0;}' +
    '.bk-gauge .bk-q{margin:1em 1.4em;text-indent:0;}' +
    '.bk-gauge .bk-h{font-size:1.08em;margin:1.3em 0 .5em;text-indent:0;}' +
    '.bk-gauge .bk-list{margin:0 0 .8em 1.4em;text-indent:0;}' +
    '.bk-gauge .bk-fig{margin:1em 0;} .bk-gauge .bk-fig img{max-width:100%;display:block;}' +
    '.bk-gauge .bk-fig figcaption{font-size:.72em;margin-top:.35em;}' +
    '.bk-gauge .bk-drop{float:left;font-size:3.1em;line-height:.82;padding:.05em .08em 0 0;}' +
    '.bk-gauge .bk-open{margin:0 0 1.6em;text-indent:0;}' +
    '.bk-gauge .bk-open.ctr{padding-top:1.6in;} .bk-gauge .bk-open.big{padding-top:1.1in;}' +
    '.bk-gauge .bk-open.orn{padding-top:1.4in;}' +
    '.bk-gauge .bk-open.big .n{display:block;font-size:4.2em;line-height:1;}' +
    '.bk-gauge .bk-open h2{font-size:1.5em;margin:0 0 .5em;}';

  const flush = () => { if (cur.length) { pages.push({ html: cur.join(''), type: curType, title: curTitle }); cur = []; curType = 'body'; } };

  const blocks = bookBlocks(b, d);

      if (d.opener === 'big-number') head = '<div class="bk-open big"><span class="n">' + esc(blk.num || '·') + '</span><h2>' + esc(blk.title) + '</h2></div>';
      else if (d.opener === 'ornament') head = '<div class="bk-open orn"><div class="o">❦</div><h2>' + esc(blk.title) + '</h2></div>';
      else if (d.opener === 'left') head = '<div class="bk-open left"><h2>' + esc(blk.title) + '</h2></div>';
      else head = '<div class="bk-open ctr"><h2>' + esc(blk.title) + '</h2><div class="rule"></div></div>';

    const nodes = chapterNodes(blk.html, d);
    if (d.dropCap && nodes.length && /^<p>/.test(nodes[0])) {

    } else if (nodes.length && /^<p>/.test(nodes[0])) {
      nodes[0] = nodes[0].replace(/^<p>/, '<p class="bk-first">');
    }
    let pending = head ? [head] : [];
    nodes.forEach(node => { pending.push(node); });

    /* Place one block, spilling a long paragraph across as many pages as it
       needs. Splitting only once would silently push the tail off the bottom
       of the page, losing text from the finished PDF. */
    const place = (node) => {
      if (pages.length > maxPages) return;
      if (fits(cur.join('') + node)) { cur.push(node); return; }
      const m = /^<p([^>]*)>([\s\S]*)<\/p>$/.exec(node);
      if (!m) { if (cur.length) { flush(); curTitle = blk.title; } cur.push(node); return; }

          if (cur.length) { flush(); curTitle = blk.title; continue; }   /* try a fresh page */

        }
        cur.push('<p' + attrs + '>' + words.slice(0, best).join('') + '</p>');
        rest = words.slice(best).join('').replace(/^\s+/, '');
        if (rest) { flush(); curTitle = blk.title; attrs = ' class="bk-cont"'; }
      }

}

/* ===========================================================================
   v4 · STORY ADVISOR  +  IDEA LAB
   The advisor reads the state of your book and tells you what the next
   sensible thing to write is. The lab is a bench of brainstorming tools that

/** A compact briefing on the current book, handed to every AI call. */
function bookBrief(b, opts) {
  opts = opts || {};
  if (!b) return 'No book selected.';
  const g = GENRES.find(x => x.id === b.genre);
  const A = b.about || {};
  const cast = (b.characters || []).slice(0, 8).map(c =>
    c.name + (c.role ? ' (' + c.role + ')' : '') + (c.motivation ? ' — wants ' + c.motivation : '')).join('; ');
  const parts = [
    'TITLE: ' + (b.title || 'untitled'),
    b.subtitle ? 'SUBTITLE: ' + b.subtitle : '',
    'GENRE: ' + (g ? g.name : (b.genre || 'unset')) + (A.subgenre ? ' / ' + A.subgenre : ''),
    A.audience ? 'AUDIENCE: ' + A.audience : '',
    b.logline ? 'LOGLINE: ' + b.logline : '',
    A.pitch ? 'PITCH: ' + A.pitch : '',
    A.setting ? 'SETTING: ' + A.setting + (A.period ? ', ' + A.period : '') : '',
    A.themes ? 'THEMES: ' + A.themes : '',
    A.tone ? 'TONE: ' + A.tone : '',
    A.pov ? 'POV/TENSE: ' + A.pov + ', ' + (A.tense || 'past') : '',
    cast ? 'CAST: ' + cast : '',
    (b.lore || []).length ? 'WORLD: ' + b.lore.slice(0, 8).map(l => l.name + ' (' + l.type + ')').join('; ') : '',
    (b.outline.beats || []).length ? 'BEATS SO FAR: ' + b.outline.beats.slice(0, 14).map(x => x.title).join(' → ') : '',
    'PROGRESS: ' + (b.chapters || []).length + ' chapters, ' + fmt(bookWords(b)) + ' of ' + fmt(b.goalWords) + ' words',
    (b.chapters || []).length ? 'CHAPTERS: ' + b.chapters.slice(0, 20).map((c, i) => (i + 1) + '. ' + (c.title || 'untitled') + (c.part ? ' [' + ((partOf(c.part) || {}).label || '') + ']' : '')).join(' | ') : ''
  ].filter(Boolean);
  if (opts.tail) {
    const last = (b.chapters || []).slice(-1)[0];
    const src = last && last.html ? last.html : b.prologue.html;
    const t = lastWords(stripHTML(src), 220);
    if (t) parts.push('MOST RECENT PROSE:\n' + t);
  }
  return parts.join('\n');
}

/* ------------------------------ the advisor ------------------------------ */
function hasPart(b, id) { return (b.chapters || []).some(c => c.part === id); }

  const A = b.about || {};

  if (!VAULT_HANDLE && HAS_FSA && state.books.length && words > 300)
    push({ t: 'Set up a vault file', why: 'You have real work here now. Point the app at a file on your computer and it will save everything into it automatically — the copy that survives a new machine.', go: 'storage', tone: 'rd', tag: 'SAFETY' });

  if (!b.genre)
    push({ t: 'Decide what kind of story this is', why: 'Genre sets the promises you are making to a reader — the shape of the plot, the pacing, the ending they will accept. Everything downstream gets easier once it is chosen.', go: 'genres', tone: 'am', tag: 'FOUNDATION' });

  if (!(b.logline || '').trim())
    push({ t: 'Write your logline', why: 'One sentence: when ___ happens, ___ must ___ or else ___. If you cannot write it yet, the plot is not settled — and that is worth knowing now rather than at chapter twenty.', go: 'profile', tab: 'about', tone: 'am', tag: 'FOUNDATION' });

  if (!(b.characters || []).some(c => c.tier === 'lead'))
    push({ t: 'Create your protagonist', why: 'A story needs one person who wants something and is being stopped. Give them a want, a flaw and a voice — those three make them usable in any scene.', go: 'characters', tone: 'am', tag: 'CAST' });

  const answered = STORY_QS.filter(q => (b.outline.answers || {})[q.k] && String(b.outline.answers[q.k]).trim()).length;
  if (answered < 3)
    push({ t: 'Answer the story questions', why: 'Seven short questions turn a vague idea into a plan. You do not need all of them — even three produces a usable beat sheet.', go: 'outline', tone: 'cy', tag: 'PLAN' });
  else if (!(b.outline.beats || []).length)
    push({ t: 'Generate your beat sheet', why: 'You have answered the questions. Turn them into an act-by-act plan you can build chapters from.', go: 'outline', tone: 'cy', tag: 'PLAN' });

  /* --- the core structural advice --- */
  if (!hasPro && !chs.length)
    push({ t: 'Write the opening', why: 'Start with either a prologue (a question the reader must carry) or Chapter One (your protagonist, wanting something, being refused). Do not write both first — pick the one you can see clearly.', go: 'prologue', tone: 'lm', tag: 'WRITE', primary: true });
  else if (hasPro && !written)
    push({
      t: 'Now write Chapter One', why: 'Your prologue is down. Chapter One has a different job: it must ground us in the ordinary world and introduce the person whose choices the book will follow. ' +
        'Open one beat after the scene starts, show your protagonist wanting something small and concrete, and let the world refuse them. The prologue asked a question — chapter one must make us care who answers it.',
      go: 'profile', act: 'feedAdd', tone: 'lm', tag: 'WRITE', primary: true
    });
  else if (written && !hasPart(b, 'inciting'))
    push({ t: 'Write the inciting incident', why: 'You have an opening. The next load-bearing beat is the event that makes the ordinary impossible to continue — usually 10–15% in. Write it, then tag that chapter <em>Inciting Incident</em> so the shape of the book stays visible.', go: 'profile', act: 'feedAdd', tone: 'lm', tag: 'WRITE', primary: true });
  else if (hasPart(b, 'inciting') && !hasPart(b, 'midpoint') && written >= 2)
    push({ t: 'Build toward the midpoint', why: 'Rising action next: two or three chapters where each attempt to fix things makes them worse. Then the midpoint — the reversal where your protagonist stops reacting and starts choosing. That is the hinge the whole book turns on.', go: 'profile', act: 'feedAdd', tone: 'lm', tag: 'WRITE', primary: true });
  else if (hasPart(b, 'midpoint') && !hasPart(b, 'lowpoint'))
    push({ t: 'Write the all-is-lost moment', why: 'After the midpoint the pressure has to keep climbing until your protagonist loses the thing they were protecting. Do not soften it — the ending only lands if this one hurts.', go: 'profile', act: 'feedAdd', tone: 'lm', tag: 'WRITE', primary: true });
  else if (hasPart(b, 'lowpoint') && !hasPart(b, 'climax'))
    push({ t: 'Write the climax', why: 'Your protagonist should face the antagonistic force using what the story has taught them, and pay for it. Make sure they <em>choose</em> — a climax the hero merely survives is an ending that happens to them.', go: 'profile', act: 'feedAdd', tone: 'rd', tag: 'WRITE', primary: true });

    push({ t: 'Write the conclusion', why: 'Short. Show the new ordinary and what it cost. Mirror your opening image so the reader feels the distance travelled, then stop earlier than feels comfortable.', go: 'profile', act: 'feedAdd', tone: 'lm', tag: 'WRITE', primary: true });
  else if (written && words < (b.goalWords || 80000) * 0.9)
    push({ t: 'Keep drafting', why: 'The structure is in place. You are ' + fmt(Math.max(0, (b.goalWords || 80000) - words)) + ' words from your goal — the only thing left is pages. Pick up where you left off.', go: 'profile', tone: 'lm', tag: 'WRITE', primary: true });

  const untagged = chs.filter(c => !c.part && wordsOfHTML(c.html) > 60).length;
  if (untagged >= 3)
    push({ t: 'Tag your chapters with story parts', why: untagged + ' written chapters have no story part. Tagging them draws the shape of your book on the page, and shows instantly where the structure sags.', go: 'profile', tone: 'cy', tag: 'STRUCTURE' });

  if (chs.length >= 4) {
    const flat = chs.slice(0, -1).filter((c, i) => Math.abs((c.tension || 5) - (chs[i + 1].tension || 5)) === 0).length;
    if (flat >= 3) push({ t: 'Your tension line is flat', why: 'Several chapters in a row sit at the same tension. Readers stop feeling escalation they cannot measure — cut one, merge two, or raise the stakes in the middle of the run.', go: 'dashboard', tone: 'am', tag: 'PACING' });
  }
  if (written >= 3 && !(b.characters || []).some(c => c.tier === 'co'))
    push({ t: 'Add a co-lead or a real antagonist', why: 'Three chapters in with only one significant character means the pressure has nowhere to come from. Somebody needs to want something incompatible.', go: 'characters', tone: 'cy', tag: 'CAST' });
  if (words > 4000 && !(b.lore || []).length)
    push({ t: 'Start a world bible', why: 'You are far enough in to start contradicting yourself. Write down the places, factions and invented words now, while you still remember what you decided.', go: 'profile', tab: 'world', tone: 'cy', tag: 'WORLD' });
  if (words > 8000 && !b.cover.front.art)
    push({ t: 'Make a cover', why: 'Not for anyone else — for you. A cover makes the thing feel real, and real books get finished.', go: 'cover', tone: 'vi', tag: 'MORALE' });
  if (written >= 2 && !(A.synopsisShort || '').trim())
    push({ t: 'Write a one-paragraph synopsis', why: 'Doing this while drafting catches plot holes early, and you will need it the moment you talk to anyone about the book.', go: 'profile', tab: 'about', tone: 'cy', tag: 'ADMIN' });
  if (words > (b.goalWords || 80000) * 0.75)
    push({ t: 'Set the book in the Book Designer', why: 'You are close. Choose a trim size and typeface and see it as real pages — it is a genuine motivator, and you can export a PDF at any point.', go: 'designer', tone: 'vi', tag: 'FINISH' });

  return out;
}

/** Small always-visible readout of where your work is being saved. */
function paintVaultPill() {
  const el = $('#vaultPill'); if (!el) return;
  const map = {
    ready: ['lm', 'VAULT FILE ON', 'Your work is being written into ' + ((VAULT_HANDLE && VAULT_HANDLE.name) || 'your vault file')],
    'needs-permission': ['am', 'VAULT PAUSED', 'Click to give the browser permission to write to your vault file again'],
    error: ['rd', 'VAULT ERROR', 'The last write to your vault file failed — click to look'],
    none: ['', 'NO VAULT FILE', 'Click to choose a file on your computer that this app saves into automatically'],
    unsupported: ['', 'BROWSER SAVE', 'This browser cannot write to a file directly — use Download Backup instead']
  };
  let m = map[VAULT_STATUS] || map.none;
  if (VAULT_STATUS !== 'ready' && FOLDER_HANDLE) {
    const fmap = {
      ready: ['lm', 'FOLDER ON', 'Your work is being written into the folder “' + FOLDER_HANDLE.name + '”'],
      'needs-permission': ['am', 'FOLDER PAUSED', 'Click to give the browser permission to write into your storage folder again'],
      error: ['rd', 'FOLDER ERROR', 'The last write into your storage folder failed — click to look']
    };
    m = fmap[FOLDER_STATUS] || m;
  }
  el.className = 'chip ' + m[0];
  el.title = m[2];
  el.textContent = m[1];
}
/* Clicking the little status chip in the top bar explains, in plain words,
   what a vault actually is and what state yours is in. */
ACTIONS.vaultExplain = function () {
  const st = state.app.storage || {};
  const name = (VAULT_HANDLE && VAULT_HANDLE.name) || st.vaultName || '';
  const folder = (FOLDER_HANDLE && FOLDER_HANDLE.name) || st.folderName || '';
  const line = {
    ready: ['t-lm', 'Everything you write is being saved into “' + (name || 'your vault file') + '” automatically.'],
    'needs-permission': ['t-am', 'Your browser has forgotten its permission to write to “' + (name || 'your vault file') +
      '”. Nothing is being written to it until you allow it again. Your work is still safe inside the browser in the meantime.'],
    error: ['t-rd', 'The last write to your vault file failed. Your work is still safe inside the browser, but the file on your disk is behind.'],
    none: ['t-am', 'You have not set one up. Your work is still saved inside this browser — but if the browser is cleared, or you move to another computer, there is no copy on your disk.'],
    unsupported: ['t-am', 'This browser cannot write straight to a file. Use the Download-a-backup button instead, or open the app in Chrome, Edge, Opera or Brave.']
  }[VAULT_STATUS] || ['t-am', 'Not set up.'];
  openModal({
    title: 'WHAT IS THE VAULT?', icon: 'database', size: 'narrow',
    body:
      '<div class="helpbox mb14"><b>ONE FILE ON YOUR OWN COMPUTER THAT HOLDS EVERYTHING</b>' +
        'Pick any file — in Documents, Dropbox, OneDrive, on a memory stick — and this app writes every book, chapter, ' +
        'character, picture and setting into it as you work. Copy that one file to another machine, open the app there, ' +
        'point it at the file, and you are exactly where you left off. No account, no sync service, no upload.</div>' +
      '<div class="prose-c fs13">' +
        '<h5>Right now</h5><p class="' + line[0] + '">' + esc(line[1]) + '</p>' +
        (folder ? '<p class="t-lm">You also have a storage folder connected: <code>' + esc(folder) + '/</code>.</p>' : '') +
        '<h5>Why bother?</h5><ul>' +
          '<li>A browser can be cleared, by you or by itself. A file on your disk cannot.</li>' +
          '<li>It is what makes updating the app safe — new app file, same vault, nothing lost.</li>' +
          '<li>It is the copy you can back up, email to yourself, or drop on a USB stick.</li>' +
        '</ul>' +
      '</div>',
    footer:
      (VAULT_STATUS === 'needs-permission' ? '<button class="btn amber" data-act="vaultReconnect" data-modal-close><i data-lucide="key"></i>ALLOW IT AGAIN</button>' : '') +
      (VAULT_STATUS === 'none' && HAS_FSA ? '<button class="btn solid" data-act="vaultChoose" data-modal-close><i data-lucide="folder"></i>SET ONE UP NOW</button>' : '') +
      '<button class="btn ghost" data-go="storage" data-modal-close><i data-lucide="database"></i>STORAGE &amp; BACKUPS</button>' +
      '<button class="btn" data-modal-close>CLOSE</button>'
  });
};
function recoveredModal(from) {
  const label = from === 'crash' ? 'the emergency copy written as the tab closed'
    : 'the write-ahead copy from an interrupted save';
  openModal({
    title: 'RECOVERED YOUR LATEST WORK', icon: 'shield-check', size: 'narrow', closeOnScrim: false,
    body: '<div class="helpbox mb14"><b>NOTHING WAS LOST</b>' +
      'The app did not shut down cleanly last time — a crash, a power cut, or the tab being killed. ' +
      'Your work has been restored from ' + esc(label) + '.</div>' +
      '<div class="prose-c fs13"><p>Everything below is back as it was:</p><ul>' +
      '<li><strong>' + state.books.length + '</strong> book(s)</li>' +
      '<li><strong>' + fmt(state.books.reduce((n, b) => n + bookWords(b), 0)) + '</strong> words</li>' +
      '<li><strong>' + fmt(state.books.reduce((n, b) => n + b.chapters.length, 0)) + '</strong> chapters</li></ul>' +
      '<p>If something still looks wrong, you can roll back to an earlier snapshot.</p></div>',
    footer: '<button class="btn ghost" data-go="storage">OPEN SNAPSHOTS</button><button class="btn solid" data-modal-close>CARRY ON WRITING</button>'
  });
  logActivity('storage', 'Recovered unsaved work after an unclean shutdown');
}
async function boot() {
  await storageInit();
  const res = await storageLoad();
  let first = false, recovered = null, upgraded = null, downgraded = null;
  if (res && res.data) {
    try {
      const wroteIt = res.data.__ver || '';
      state = migrateState(res.data);
      if (res.recovered) recovered = res.from;
      if (wroteIt && verCmp(wroteIt, APP_VERSION) < 0) upgraded = wroteIt;
      if (wroteIt && verCmp(wroteIt, APP_VERSION) > 0) downgraded = wroteIt;
    } catch (e) { console.error('Migration failed, starting clean.', e); state = defaultState(); first = true; }
  } else { first = true; }

  if (!state.books.length) seedStarterBook();
  if (!state.ui.bookId || !state.books.some(b => b.id === state.ui.bookId)) state.ui.bookId = state.books[0].id;
  normaliseNav();

  // route from the URL hash when present, otherwise from saved UI state
  const hash = (location.hash || '').replace(/^#/, '');
  const hv = hash.split('/')[0];
  CURRENT_VIEW = VIEWS[hv] ? hv : (VIEWS[state.ui.view] ? state.ui.view : 'profile');
  state.ui.view = CURRENT_VIEW;

  renderBrand();
  document.body.classList.toggle('hide-rte-images', !!state.ui.hideEditorImages);
  render();
  startAutosave();
  refreshStorageMeter();
  paintSavePill('idle');

  /* --- brandbar wiring --- */
  /* null-safe: a control removed from the top bar must never break boot */
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  on('#brandTitle', 'click', () => ACTIONS.brandRename());
  on('#brandLogo', 'click', () => ACTIONS.logoMenu());
  on('#bookSwitchBtn', 'click', () => ACTIONS.toggleBookMenu());
  on('#btnSearch', 'click', () => ACTIONS.globalSearch());
  on('#btnSaveNow', 'click', () => ACTIONS.saveForce());
  on('#btnRail', 'click', () => {
    const rail = $('#rail');
    rail.classList.toggle('open');
    if (rail.classList.contains('open')) {
      const bd = document.createElement('div');
      bd.className = 'rail-backdrop';
      bd.addEventListener('click', () => { rail.classList.remove('open'); bd.remove(); });
      document.body.appendChild(bd);
    } else { const bd = $('.rail-backdrop'); if (bd) bd.remove(); }
  });


  /* --- global drag & drop of images onto dropzones --- */
  document.addEventListener('dragover', (e) => {
    const z = e.target.closest('.dropzone'); if (!z) return;
    e.preventDefault(); z.classList.add('over');
  });
  document.addEventListener('dragleave', (e) => {
    const z = e.target.closest('.dropzone'); if (z) z.classList.remove('over');
  });
  document.addEventListener('drop', async (e) => {
    const z = e.target.closest('.dropzone'); if (!z) return;
    e.preventDefault(); z.classList.remove('over');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f || !/^image\//.test(f.type)) return;
    const data = await readFileAsDataURL(f);
    const act = z.getAttribute('data-act');
    const arg = z.getAttribute('data-arg');
    const b = currentBook();
    if (act === 'coverArt' && b) { b.cover[arg].art = data; markDirty(); render(); toast('Cover art dropped in.', 'ok'); }
    else if (act === 'moodAdd' && b) { b.prologue.moodboard.unshift({ id: uid('mp'), src: data, note: '' }); markDirty(); render(); }
    else if (act === 'chImgAdd' && b) { const ch = activeChapter(b); if (ch) { ch.images = ch.images || []; ch.images.push({ id: uid('im'), src: data, caption: f.name }); markDirty(); render(); } }
    else toast('Drop target does not accept images here — use the button instead.', 'warn');
  });

  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').replace(/^#/, '').split('/')[0];
    if (h && VIEWS[h] && h !== CURRENT_VIEW) go(h);
  });

  requestPersistence().then(p => { state.app.storage.persisted = !!p; });
  paintVaultPill();
  startGdocLoop();
  paintLivePill();
  if (recovered) setTimeout(() => recoveredModal(recovered), 500);
  else if (first) setTimeout(welcomeModal, 400);
  else if (downgraded) setTimeout(() => versionModal(downgraded, false), 500);
  else if (upgraded) {
    /* a silent, successful upgrade — say so once, then get out of the way */
    setTimeout(() => toast('Updated from v' + upgraded + ' to v' + APP_VERSION + '. All ' + state.books.length +
      ' project(s) carried over untouched.', 'ok', 'UP TO DATE'), 700);
    markDirty();
  }
  console.log('%cRAVENBANE · ARCHITECT online — engine: ' + ENGINE, 'color:#23e0ff;font-family:monospace');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
