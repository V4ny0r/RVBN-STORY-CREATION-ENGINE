ACTIONS.deleteBook = async function (el) {
  const id = el.getAttribute('data-id') || (currentBook() || {}).id;
  const bk = state.books.find(x => x.id === id); if (!bk) return;
  const ok = await confirmDlg('DELETE PROJECT', '<p>Permanently delete <strong>' + esc(bk.title) + '</strong> and everything inside it — chapters, cast, moodboards, outlines?</p><p class="t-rd">This cannot be undone. Export a JSON backup first if you are unsure.</p>', true);
  if (!ok) return;
  state.books = state.books.filter(x => x.id !== id);
  if (state.ui.bookId === id) state.ui.bookId = (state.books[0] || {}).id || '';
  markDirty(); render(); toast('Project deleted.', 'warn');
};
ACTIONS.duplicateBook = function (el) {
  const id = el.getAttribute('data-id') || (currentBook() || {}).id;
  const bk = state.books.find(x => x.id === id); if (!bk) return;
  const copy = clone(bk);
  copy.id = uid('bk'); copy.title = bk.title + ' (copy)'; copy.created = nowISO(); copy.updated = nowISO();
  state.books.push(copy); state.ui.bookId = copy.id;
  markDirty(); render(); toast('Project duplicated.', 'ok');
};
ACTIONS.renameBook = async function (el) {
  const id = el.getAttribute('data-id') || (currentBook() || {}).id;
  const bk = state.books.find(x => x.id === id); if (!bk) return;
  const v = await promptDlg('RENAME PROJECT', 'Book title', bk.title);
  if (v == null) return;
  bk.title = v.trim() || bk.title; markDirty(); render();
};

/* ----------------------------- GLOBAL SEARCH ---------------------------- */
ACTIONS.globalSearch = function () {
  openModal({
    title: 'GRID SEARCH', icon: 'search', size: '',
    body: '<label class="fld"><span class="lb">Search chapters, characters, notes, outlines, links — across every project</span>' +
          '<input class="inp" id="gsQ" placeholder="Type at least 2 characters…"></label>' +
          '<div id="gsOut" class="mt10"></div>',
    footer: '<span class="faint fs11 mono" style="margin-right:auto">CTRL/⌘ + K</span><button class="btn ghost" data-modal-close>CLOSE</button>',
    onMount: (r) => {
      const q = $('#gsQ', r), out = $('#gsOut', r);
      const run = debounce(() => {
        const term = q.value.trim().toLowerCase();
        if (term.length < 2) { out.innerHTML = '<div class="empty"><i data-lucide="search"></i><h4>AWAITING QUERY</h4></div>'; icons(); return; }
        const hits = [];
        state.books.forEach(bk => {
          const add = (kind, label, text, view, id) => {
            const t = stripHTML(text || '');
            const i = t.toLowerCase().indexOf(term);
            if (i === -1) return;
            hits.push({ bk: bk, kind: kind, label: label, view: view, id: id, snip: t.slice(Math.max(0, i - 60), i + 110) });
          };
          if (bk.title.toLowerCase().includes(term)) hits.push({ bk: bk, kind: 'BOOK', label: bk.title, view: 'dashboard', snip: bk.logline || '' });
          add('LOGLINE', bk.title, bk.logline, 'dashboard');
          add('PROLOGUE', 'Prologue', bk.prologue.html, 'prologue');
          add('DEDICATION', 'Dedication', bk.dedication.text, 'title');
          (bk.chapters || []).forEach((c, i2) => { add('CHAPTER', 'Ch ' + (i2 + 1) + ': ' + c.title, c.html, 'chapters', c.id); add('SCENE NOTES', 'Ch ' + (i2 + 1) + ' notes', c.notes, 'chapters', c.id); });
          (bk.characters || []).forEach(c => { add('CHARACTER', c.name, [c.name, c.aliases, c.motivation, c.flaws, c.voice, c.backstory, c.notes].join(' \n '), 'characters', c.id); });
          (bk.outline.beats || []).forEach(bt => add('BEAT', bt.title || 'Beat', (bt.title || '') + ' ' + (bt.text || ''), 'outline'));
          Object.keys(bk.outline.answers || {}).forEach(k => add('STORY Q', k, bk.outline.answers[k], 'outline'));
          (bk.research.links || []).forEach(l => add('LINK', l.title || l.url, [l.title, l.url, l.notes, l.tags].join(' '), 'research'));
          (bk.research.pins || []).forEach(p => add('PIN', p.caption || 'Pin', [p.caption, p.text].join(' '), 'research'));
        });
        out.innerHTML = hits.length
          ? '<div class="mono fs11 faint mb6">' + hits.length + ' MATCHES</div>' + hits.slice(0, 60).map(h =>

function noBookPanel(msg) {
  return '<div class="panel clip"><div class="corner-tl"></div><div class="corner-br"></div><div class="panel-bd">' +
    '<div class="empty"><i data-lucide="book-marked"></i><h4>NO ACTIVE PROJECT</h4>' +

    '<button class="btn solid red" data-act="newBook"><i data-lucide="plus"></i>NEW BOOK PROJECT</button></div></div></div>';
}

function tensionColor(t) {
  const v = clamp(Number(t) || 0, 0, 10);
  if (v <= 2) return '#1f6f86';
  if (v <= 4) return '#23e0ff';
  if (v <= 6) return '#8dff4f';
  if (v <= 8) return '#ffb43a';
  return '#ff2b3d';
}

function heatmapHTML(b) {
  const units = [];
  if (b.prologue && wordsOfHTML(b.prologue.html) > 0) units.push({ label: 'PRO', w: wordsOfHTML(b.prologue.html), t: Number(b.prologue.tension || 5), id: '', view: 'prologue' });
  (b.chapters || []).forEach((c, i) => units.push({ label: String(i + 1), w: wordsOfHTML(c.html), t: Number(c.tension || 5), id: c.id, view: 'chapters' }));
  if (!units.length) return '<div class="empty" style="padding:24px"><i data-lucide="activity"></i><h4>NO NARRATIVE DATA</h4><div class="fs12">Add chapters to plot the pacing curve.</div></div>';
  const maxW = Math.max.apply(null, units.map(u => u.w).concat([1]));
  const pts = units.map((u, i) => {
    const x = units.length === 1 ? 50 : (i / (units.length - 1)) * 100;
    const y = 100 - (clamp(u.t, 0, 10) / 10) * 92 - 4;
    return x.toFixed(2) + ',' + y.toFixed(2);
  }).join(' ');
  return '' +
    '<div style="position:relative">' +
      '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:110px;pointer-events:none;z-index:3">' +
        '<polyline points="' + pts + '" fill="none" stroke="rgba(255,43,61,.85)" stroke-width="1" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 5px rgba(255,43,61,.85))"/>' +
      '</svg>' +
      '<div class="heat">' + units.map(u => {
        const hW = clamp((u.w / maxW) * 100, 4, 100);
        return '<div class="col" title="' + esc(u.label) + ' · ' + fmt(u.w) + ' words · tension ' + u.t + '/10" data-act="heatJump" data-view="' + u.view + '" data-id="' + u.id + '">' +
          '<div class="t" style="height:' + hW + '%;background:linear-gradient(180deg,' + tensionColor(u.t) + ',rgba(4,10,18,.15));box-shadow:0 0 12px ' + tensionColor(u.t) + '44"></div></div>';
      }).join('') + '</div>' +
    '</div>' +
    '<div class="flex" style="gap:3px;margin-top:2px">' + units.map(u => '<div class="lbl" style="flex:1 1 0;min-width:6px">' + esc(u.label) + '</div>').join('') + '</div>' +
    '<div class="flex between mt10 mono fs10 faint"><span>BAR HEIGHT = WORD COUNT</span><span class="t-rd">RED LINE = TENSION 0–10</span></div>';
}

  if (id) state.ui.chapterId = id;
  go(el.getAttribute('data-view'));
};

function wireEditor(id, setter, label) {
  const el = document.getElementById(id);
  if (!el) return;
  EDITORS[id] = { setter: setter, el: el, label: label || id };
  const stats = document.getElementById(id + '-stats');
  const update = () => {
    const txt = el.innerText || '';
    const w = countWords(txt);
    if (stats) stats.innerHTML = '<b>' + fmt(w) + '</b> words · <b>' + fmt(txt.length) + '</b> chars · <b>' + readTime(w) + '</b> read';
  };
  const commit = debounce(() => {
    setter(el.innerHTML);
    markDirty();
    const b = currentBook();
    if (b) {
      state.ui.lastEdited[b.id] = { view: CURRENT_VIEW, id: state.ui.chapterId || '', label: label, at: nowISO() };
      logActivity('write', 'Edited ' + label);
    }
  }, 700);
  el.addEventListener('input', () => { update(); commit(); });
  el.addEventListener('keyup', saveRange);
  el.addEventListener('mouseup', saveRange);
  el.addEventListener('blur', saveRange);
  el.addEventListener('paste', (e) => {
    // Paste as clean text so external HTML cannot poison the manuscript styling.
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
    document.execCommand('insertText', false, t);
  });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;'); }
  });
  update();
}
function saveRange() {
  const s = window.getSelection();
  if (!s || !s.rangeCount || !s.anchorNode) return;
  const n = s.anchorNode;
  const el = n.nodeType === 1 ? n : n.parentElement;
  if (el && el.closest && el.closest('.rte')) SAVED_RANGE = s.getRangeAt(0).cloneRange();
}
function focusEditor(id) {
  const el = document.getElementById(id); if (!el) return null;
  el.focus();
  const sel = window.getSelection();
  if (SAVED_RANGE && el.contains(SAVED_RANGE.commonAncestorContainer)) {
    sel.removeAllRanges(); sel.addRange(SAVED_RANGE);
  } else {
    const r = document.createRange();
    r.selectNodeContents(el); r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
  }
  return el;
}

/* --------------------- AI insertion with diff highlight ------------------ */
let AI_INSERT_SEQ = 0;
function insertAIText(editorId, text) {
  const ed = focusEditor(editorId);
  if (!ed) { toast('Open a chapter or the prologue first.', 'warn'); return false; }
  const mark = 'aiIns' + (++AI_INSERT_SEQ);
  const paras = String(text).split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
  const inner = paras.map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
  const html = '<span class="ai-ins" data-ai="' + mark + '">' + (inner || '<p>' + esc(text) + '</p>') + '</span>';
  document.execCommand('insertHTML', false, html);
  ed.dispatchEvent(new Event('input'));
  const bar = document.getElementById(editorId + '-diff');
  if (bar) { bar.classList.remove('hidden'); bar.dataset.mark = mark; }
  const node = ed.querySelector('[data-ai="' + mark + '"]');
  if (node && node.scrollIntoView) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
  logActivity('ai', 'Inserted an AI passage into ' + (EDITORS[editorId] ? EDITORS[editorId].label : 'the manuscript'));
  return true;
}
ACTIONS.aiKeep = function (el) {
  const id = el.getAttribute('data-ed');
  const ed = document.getElementById(id), bar = document.getElementById(id + '-diff');
  if (!ed) return;
  ed.querySelectorAll('.ai-ins').forEach(sp => {
    const frag = document.createDocumentFragment();
    while (sp.firstChild) frag.appendChild(sp.firstChild);
    sp.parentNode.replaceChild(frag, sp);
  });
  if (bar) bar.classList.add('hidden');
  ed.dispatchEvent(new Event('input'));
  toast('Passage merged into the manuscript.', 'ok', 'KEPT');
};
ACTIONS.aiUndo = function (el) {
  const id = el.getAttribute('data-ed');
  const ed = document.getElementById(id), bar = document.getElementById(id + '-diff');
  if (!ed) return;
  const mark = bar ? bar.dataset.mark : null;
  const targets = mark ? ed.querySelectorAll('[data-ai="' + mark + '"]') : ed.querySelectorAll('.ai-ins');
  targets.forEach(n => n.remove());
  if (bar) bar.classList.add('hidden');
  ed.dispatchEvent(new Event('input'));
  toast('AI passage rolled back.', 'warn', 'UNDONE');
};

        const [m] = b.chapters.splice(from, 1);

    });

/** Tier-orbit placement: leads at the core, everyone else on widening rings.
 *  Avoids the collinear rows a naive grid produces, which stack edges on top
 *  of one another and bury their labels under nodes. */
function autoLayoutCast(b) {
  const cast = b.characters || [];
  const cx = 600, cy = 300;
  const leads = cast.filter(c => c.tier === 'lead');
  const rest = cast.filter(c => c.tier !== 'lead');
  leads.forEach((c, i) => {
    const a = (i / Math.max(1, leads.length)) * Math.PI * 2;
    c.x = cx + Math.cos(a) * (leads.length > 1 ? 110 : 0);
    c.y = cy + Math.sin(a) * (leads.length > 1 ? 110 : 0);
  });
  rest.forEach((c, i) => {
    const a = (i / Math.max(1, rest.length)) * Math.PI * 2 - Math.PI / 2;
    const rad = c.tier === 'co' ? 210 : c.tier === 'sup' ? 300 : 380;
    c.x = cx + Math.cos(a) * rad;
    c.y = cy + Math.sin(a) * rad * 0.62;
  });
}
ACTIONS.netAutoLayout = function () {
  const b = requireBook(); if (!b) return;
  autoLayoutCast(b);
  markDirty(); render(); toast('Cast arranged by tier orbit.', 'ok');
};

  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = '<filter id="ngl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  svg.appendChild(defs);
  const gEdges = document.createElementNS(NS, 'g');
  const gNodes = document.createElementNS(NS, 'g');
  svg.appendChild(gEdges); svg.appendChild(gNodes);

  rels.forEach(r => {
    const A = cast.find(c => c.id === r.a), B = cast.find(c => c.id === r.b);
    if (!A || !B) return;
    const t = REL_TYPES.find(x => x.id === r.type) || REL_TYPES[0];
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', A.x); line.setAttribute('y1', A.y);
    line.setAttribute('x2', B.x); line.setAttribute('y2', B.y);
    line.setAttribute('stroke', t.color);
    line.setAttribute('stroke-width', r.type === 'secret' ? 1.4 : 2);
    line.setAttribute('stroke-opacity', '.72');
    if (r.type === 'secret') line.setAttribute('stroke-dasharray', '6 5');
    /* No SVG filter on edges: an axis-aligned line has a zero-area bounding box,
       which collapses an objectBoundingBox filter region and hides the stroke. */
    line.style.cursor = 'pointer';
    line.addEventListener('click', () => ACTIONS.relEdit({ getAttribute: () => r.id }));
    gEdges.appendChild(line);
    if (r.label) {
      const tx = document.createElementNS(NS, 'text');
      /* 42% along the edge rather than dead centre — keeps the labels of two
         edges that share a node from landing on the same point. */
      tx.setAttribute('x', A.x + (B.x - A.x) * 0.42); tx.setAttribute('y', A.y + (B.y - A.y) * 0.42 - 6);
      tx.setAttribute('text-anchor', 'middle'); tx.setAttribute('fill', t.color);
      tx.setAttribute('font-size', '10'); tx.setAttribute('font-family', 'Share Tech Mono, monospace');
      tx.setAttribute('stroke', '#04070d'); tx.setAttribute('stroke-width', '3.5');
      tx.setAttribute('paint-order', 'stroke'); tx.setAttribute('stroke-linejoin', 'round');
      tx.textContent = r.label;
      gEdges.appendChild(tx);
    }
  });

  cast.forEach(c => {
    const tier = TIERS.find(t => t.id === c.tier) || TIERS[2];
    const rad = c.tier === 'lead' ? 34 : c.tier === 'co' ? 28 : c.tier === 'sup' ? 23 : 18;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'rel-node');
    g.setAttribute('transform', 'translate(' + c.x + ',' + c.y + ')');
    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('r', rad + 6); ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', c.color || '#23e0ff'); ring.setAttribute('stroke-opacity', '.28'); ring.setAttribute('stroke-width', '1');
    const circ = document.createElementNS(NS, 'circle');
    circ.setAttribute('r', rad);
    circ.setAttribute('fill', 'rgba(6,14,24,.94)');
    circ.setAttribute('stroke', c.color || '#23e0ff');
    circ.setAttribute('stroke-width', c.tier === 'lead' ? 3 : 2);
    circ.setAttribute('filter', 'url(#ngl)');
    const initials = document.createElementNS(NS, 'text');
    initials.setAttribute('text-anchor', 'middle'); initials.setAttribute('dy', '5');
    initials.setAttribute('fill', '#eafcff'); initials.setAttribute('font-size', rad > 25 ? '17' : '13');
    initials.setAttribute('font-family', 'Orbitron, sans-serif'); initials.setAttribute('font-weight', '700');
    initials.style.pointerEvents = 'none';
    initials.textContent = (c.name || '?').split(/\s+/).map(s => s.charAt(0)).join('').slice(0, 2).toUpperCase() || '?';
    const nm = document.createElementNS(NS, 'text');
    nm.setAttribute('text-anchor', 'middle'); nm.setAttribute('dy', rad + 20);
    nm.setAttribute('fill', '#9fc4d6'); nm.setAttribute('font-size', '11');
    nm.setAttribute('font-family', 'Rajdhani, sans-serif');
    nm.style.pointerEvents = 'none';
    nm.textContent = c.name || 'Unnamed';
    const tr = document.createElementNS(NS, 'text');
    tr.setAttribute('text-anchor', 'middle'); tr.setAttribute('dy', rad + 33);
    tr.setAttribute('fill', 'rgba(126,155,173,.75)'); tr.setAttribute('font-size', '8.5');
    tr.setAttribute('font-family', 'Share Tech Mono, monospace');
    tr.style.pointerEvents = 'none';
    tr.textContent = tier.label.toUpperCase();
    g.appendChild(ring); g.appendChild(circ); g.appendChild(initials); g.appendChild(nm); g.appendChild(tr);
    gNodes.appendChild(g);

    let dragging = false, moved = false, off = { x: 0, y: 0 };
    const pt = (evt) => {
      const r = svg.getBoundingClientRect();
      const vb = svg.viewBox.baseVal;
      const sx = vb.width / r.width, sy = vb.height / r.height;
      const cx2 = (evt.touches ? evt.touches[0].clientX : evt.clientX) - r.left;
      const cy2 = (evt.touches ? evt.touches[0].clientY : evt.clientY) - r.top;
      return { x: cx2 * sx, y: cy2 * sy };
    };
    const down = (e) => { dragging = true; moved = false; const p = pt(e); off = { x: p.x - c.x, y: p.y - c.y }; e.preventDefault(); };
    const move = (e) => {
      if (!dragging) return;
      const p = pt(e);
      c.x = clamp(Math.round(p.x - off.x), 40, 1160); c.y = clamp(Math.round(p.y - off.y), 40, 580);
      moved = true;
      g.setAttribute('transform', 'translate(' + c.x + ',' + c.y + ')');
      gEdges.innerHTML = '';
      rels.forEach(r => {
        const A = cast.find(x => x.id === r.a), B = cast.find(x => x.id === r.b);
        if (!A || !B) return;
        const t = REL_TYPES.find(x => x.id === r.type) || REL_TYPES[0];
        const ln = document.createElementNS(NS, 'line');
        ln.setAttribute('x1', A.x); ln.setAttribute('y1', A.y); ln.setAttribute('x2', B.x); ln.setAttribute('y2', B.y);
        ln.setAttribute('stroke', t.color); ln.setAttribute('stroke-width', '2'); ln.setAttribute('stroke-opacity', '.7');
        if (r.type === 'secret') ln.setAttribute('stroke-dasharray', '6 5');
        gEdges.appendChild(ln);
      });
    };
    const up = () => {
      if (!dragging) return;
      dragging = false;
      if (moved) { markDirty(); } else { ACTIONS.charOpen(c.id); }
    };
    g.addEventListener('mousedown', down);
    g.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  });
}

    c.aliases ? 'ALIASES: ' + c.aliases : '',

    c.pronouns ? 'PRONOUNS: ' + c.pronouns : '',
    c.occupation ? 'OCCUPATION: ' + c.occupation : '',
    c.alignment ? 'MORAL COMPASS: ' + c.alignment : '',
    c.appearance ? 'APPEARANCE: ' + c.appearance : '',
    c.motivation ? 'WANTS: ' + c.motivation : '',
    c.need ? 'NEEDS: ' + c.need : '',
    c.flaws ? 'FLAWS: ' + c.flaws : '',
    c.fears ? 'FEARS: ' + c.fears : '',

    c.voice ? 'VOICE: ' + c.voice : '',
    c.mannerisms ? 'MANNERISMS: ' + c.mannerisms : '',

/* Local persona simulation — used when no API provider is configured. */
function simulateCharacterReply(c, q) {
  const name = c.name || 'I';
  const ql = q.toLowerCase();
  const secret = (c.secret || '').trim();
  const flaw = (c.flaws || '').split(/[.,;]/)[0].trim();
  const want = (c.motivation || '').split(/[.,;]/)[0].trim();
  const fear = (c.fears || '').split(/[.,;]/)[0].trim();
  const voice = (c.voice || '').toLowerCase();
  const clipped = /clipped|terse|short|blunt|laconic/.test(voice);
  const formal = /formal|precise|no contractions|archaic|educated/.test(voice);
  const warm = /warm|kind|gentle|soft/.test(voice);
  const beats = [];

  if (/hiding|secret|truth|lying|lie\b/.test(ql)) {
    beats.push(secret
      ? 'You want the thing I do not say. Fine — but not the whole of it. ' + (formal ? 'There is a matter I have not disclosed.' : 'There\'s something I haven\'t told anyone.') + ' I will say this much and no more: it concerns ' + secret.split(/\s+/).slice(0, 8).join(' ').replace(/[.]$/, '') + '.'
      : 'Everyone is hiding something. Mine is duller than you are hoping. Ask me a better question and I might slip.');
  } else if (/want|need|goal|after\b|looking for/.test(ql)) {
    beats.push(want ? (formal ? 'What I want has not changed: ' : 'Same thing I\'ve wanted the whole time — ') + want.toLowerCase() + '.'
      : 'I want the next hour to be quieter than the last one. Beyond that I have not let myself plan.');
    if (c.need) beats.push('Though you did not ask what I need, and those are not the same animal.');
  } else if (/why did you|why would you|explain|justify/.test(ql)) {
    beats.push(flaw ? 'Because I am ' + flaw.toLowerCase() + ', and I have stopped pretending that is a temporary condition.'
      : 'Because at the time it was the only door that opened. I have thought about it since. That has not helped.');
  } else if (/afraid|scared|fear|terrif/.test(ql)) {
    beats.push(fear ? (clipped ? fear.charAt(0).toUpperCase() + fear.slice(1) + '. That is the whole answer.' : 'If you want it plainly — ' + fear.toLowerCase() + '. I have arranged my entire life around not finding out whether I could survive it.')
      : 'Fear is a luxury item. I keep mine in storage.');
  } else if (/betray|turn on|switch sides|abandon/.test(ql)) {
    beats.push('Everyone has a price and only liars pretend otherwise. Mine is not money. ' + (want ? 'Offer me ' + want.toLowerCase() + ' and watch what I become.' : 'Threaten the one person left and you will not need to ask twice.'));
  } else if (/describe|where are you|room|look around|see\b/.test(ql)) {
    beats.push('Low ceiling. ' + pick(SENSORY.smell) + '. ' + pick(SENSORY.sound) + '. I have already counted the exits — two, one of them a lie.');
  } else if (/who are you|introduce|tell me about yourself/.test(ql)) {
    beats.push((formal ? 'I am ' : 'Name\'s ') + name + '. ' + (c.occupation ? c.occupation + ', when anyone is paying. ' : '') + (c.role ? 'People decide what I am within a minute of meeting me, and they are usually close enough. ' : '') + (want ? 'What matters is that I intend to ' + want.toLowerCase() + '.' : ''));
  } else if (/love|feel about|care about/.test(ql)) {
    beats.push(warm ? 'More than is convenient. That is the trouble with it.' : 'I do not do the vocabulary for that. Ask what I would do instead — the answer is more honest.');
  } else if (/\?$/.test(q.trim())) {
    beats.push((clipped ? 'Short answer: no.' : 'You are asking the wrong person, or asking the right person too early.') + ' ' + (flaw ? 'I am ' + flaw.toLowerCase() + ' — that shapes anything I tell you.' : ''));
  } else {
    beats.push((clipped ? 'Noted.' : 'All right.') + ' ' + q.replace(/[.!?]+$/, '') + ' — ' + (want ? 'and none of that changes what I came here to do.' : 'and I still do not know what you expect me to say to that.'));
  }

  if (c.mannerisms && Math.random() > 0.45) {
    beats.push('(' + c.mannerisms.split(/[.,;]/)[0].trim().toLowerCase() + ')');
  }
  if (Math.random() > 0.62) beats.push(pick(SENSORY.body).replace(/^./, s => s.toUpperCase()) + '.');
  let out = beats.filter(Boolean).join(' ');
  if (formal) out = out.replace(/don't/g, 'do not').replace(/can't/g, 'cannot').replace(/won't/g, 'will not').replace(/I'm/g, 'I am').replace(/it's/g, 'it is');
  if (clipped) {
    const sentences = out.match(/[^.!?]+[.!?]*/g) || [out];
    out = sentences.slice(0, 2).join('').trim();
  }
  return out;
}

   Provider bridge (OpenAI / Anthropic / Gemini / local simulation)
   Unstuck plot brancher · Atmosphere enhancer · Cliché & repetition scanner

function aiReady() {
  const ai = state.app.ai;
  if (ai.provider === 'simulated') return false;
  return !!(ai.keys[ai.provider] || '').trim();
}
function aiLabel() {
  const ai = state.app.ai;
  if (!aiReady()) return 'LOCAL SIMULATION';
  return ai.provider.toUpperCase() + ' · ' + (ai.model[ai.provider] || '');
}

/**
 * Unified completion bridge. Falls back to the local simulator whenever no
 * provider is configured or the network call fails.
 */
async function aiComplete(opts) {
  const ai = state.app.ai;
  const fb = opts.fallback || (() => '');
  if (!aiReady()) return fb();
  const key = (ai.keys[ai.provider] || '').trim();
  const temp = Number(ai.temperature) || 0.85;
  const maxTok = Number(opts.maxTokens || ai.maxTokens) || 900;
  const history = opts.history || [];
  try {
    if (ai.provider === 'openai') {
      const r = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({
          model: ai.model.openai || 'gpt-4o-mini',
          temperature: temp, max_tokens: maxTok,
          messages: [{ role: 'system', content: opts.system || '' }].concat(history, [{ role: 'user', content: opts.user }])
        })
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status + ' — ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      return (j.choices && j.choices[0] && j.choices[0].message.content || '').trim() || fb();
    }
    if (ai.provider === 'anthropic') {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: ai.model.anthropic || 'claude-sonnet-4-5',
          max_tokens: maxTok, temperature: temp,
          system: opts.system || '',
          messages: history.concat([{ role: 'user', content: opts.user }])
        })
      });
      if (!r.ok) throw new Error('Anthropic ' + r.status + ' — ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      return ((j.content || []).map(p => p.text || '').join('')).trim() || fb();
    }
    if (ai.provider === 'gemini') {
      const model = ai.model.gemini || 'gemini-2.0-flash';
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: opts.system || '' }] },
          contents: history.map(h => ({ role: h.role === 'assistant' ? 'model' : 'user', parts: [{ text: h.content }] }))
            .concat([{ role: 'user', parts: [{ text: opts.user }] }]),
          generationConfig: { temperature: temp, maxOutputTokens: maxTok }
        })
      });
      if (!r.ok) throw new Error('Gemini ' + r.status + ' — ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      const cand = (j.candidates || [])[0];
      const txt = cand && cand.content && (cand.content.parts || []).map(p => p.text || '').join('');
      return (txt || '').trim() || fb();
    }
  } catch (e) {
    console.warn('AI bridge failed:', e);
    toast(String(e.message || e).slice(0, 160) + ' — falling back to local simulation.', 'warn', 'AI BRIDGE');
    return fb();
  }
  return fb();
}

function lastWords(text, n) {

/* --------------------------- UNSTUCK ENGINE ----------------------------- */
const UNSTUCK_MODES = [
  { id: 'logical', label: 'The Logical Progression', tone: 'tone1', chip: 'cy', icon: 'arrow-right',
    brief: 'the most causally honest next step — what this scene has already promised' },
  { id: 'twist', label: 'The Dramatic Twist / Conflict Escalation', tone: 'tone2', chip: 'rd', icon: 'zap',
    brief: 'a reversal that reframes what came before and raises the cost' },
  { id: 'wildcard', label: 'The Wildcard / High Chaos Option', tone: 'tone3', chip: 'am', icon: 'flame',
    brief: 'the destabilising swing — genre-bending, structurally reckless, occasionally brilliant' }
];

function simulateUnstuck(mode, ctx, b) {
  const names = castNames();
  const lead = names[0] || 'she';
  const second = names[1] || 'the other one';
  const g = GENRES.find(x => x.id === b.genre);
  const sentences = (ctx.match(/[^.!?]+[.!?]+/g) || []).map(s => s.trim());
  const lastSentence = sentences.length ? sentences[sentences.length - 1] : '';
  const anchorNoun = (lastSentence.match(/\b([a-z]{5,})\b/gi) || ['the room']).slice(-1)[0];
  const img = pick(AI_IMAGES), stake = pick(AI_STAKES), verb = pick(AI_VERBS);

  if (mode === 'logical') {
    return [
      lead + ' does the obvious thing, because the obvious thing is still the hardest one available. ' +
      'The ' + anchorNoun + ' does not resolve; it simply hands over the next problem, which was waiting behind it the whole time.',
      'What follows is procedure — the ordinary, granular work of someone who has decided not to stop. ' +
      'Every step forward closes a door behind, and ' + lead + ' notices this and keeps going anyway.',
      'By the end of it ' + (names[1] ? second + ' knows too, and knowing changes what ' + second + ' is willing to do.' : 'there is a name attached to the thing, and names make it possible to hunt.')
    ].join('\n\n');
  }
  if (mode === 'twist') {
    return [
      'The assumption breaks. ' + (names[1] ? second + ' is not who ' + lead + ' has been treating them as' : 'The version of events everyone accepted') +
      ' — and the proof has been sitting inside the ' + anchorNoun + ' since the beginning.',
      'The reversal ' + verb + ' the previous chapter: every kindness reads as management, every coincidence reads as design. ' +
      lead + ' has to decide, in the space of one breath, whether to say it out loud.',
      'Whatever is chosen, it costs ' + stake + '. ' + img.charAt(0).toUpperCase() + img.slice(1) + ' — and that detail will matter twice more before the book ends.'
    ].join('\n\n');
  }
  return [
    'Something arrives that the scene did not order. ' + img.charAt(0).toUpperCase() + img.slice(1) + ', and no one in the room has an explanation that survives thirty seconds of scrutiny.',
    'The rules that governed the last hundred pages stop applying cleanly. ' + lead + ' abandons the plan entirely and does the thing that cannot be walked back — ' +
    (g ? 'the kind of move ' + g.name.toLowerCase() + ' readers will either forgive or never forget' : 'the kind of move that makes the rest of the book a different book') + '.',
    'The immediate consequence is ' + stake + '. The second consequence has not landed yet. That is the chapter break.'
  ].join('\n\n');
}

async function generateUnstuck(mode, ctx) {
  const b = currentBook() || {};
  const g = GENRES.find(x => x.id === b.genre);
  const modeInfo = UNSTUCK_MODES.find(m => m.id === mode);
  const prompt = (state.app.ai.templates.unstuck || '')
    .replace(/\{\{BOOK\}\}/g, b.title || 'the manuscript')
    .replace(/\{\{GENRE\}\}/g, g ? g.name : (b.genre || 'unspecified'))
    .replace(/\{\{CAST\}\}/g, castNames().slice(0, 8).join(', ') || 'unnamed cast')
    .replace(/\{\{CONTEXT\}\}/g, ctx || '(the page is blank — open the scene)')
    .replace(/\{\{MODE\}\}/g, modeInfo.label + ' — ' + modeInfo.brief);
  return aiComplete({
    system: 'You are a world-class novelist and story doctor. Return prose only. Never explain yourself.',
    user: prompt,
    maxTokens: 550,
    fallback: () => simulateUnstuck(mode, ctx, b)
  });
}

/* --------------------- CLICHÉ & REPETITION SCANNER ---------------------- */
const STOPWORDS = new Set(['the', 'and', 'that', 'have', 'for', 'not', 'with', 'you', 'this', 'but', 'his', 'her', 'they', 'she', 'him', 'from', 'their', 'what', 'been', 'were', 'was', 'are', 'had', 'has', 'would', 'could', 'should', 'there', 'them', 'then', 'than', 'when', 'which', 'into', 'about', 'like', 'said', 'says', 'just', 'over', 'back', 'down', 'still', 'even', 'only', 'some', 'other', 'more', 'very', 'much', 'will', 'can', 'did', 'does', 'her', 'its', 'our', 'out', 'off', 'why', 'how', 'who', 'all', 'one', 'two', 'now', 'him', 'his']);

function scanText(raw) {
  const text = String(raw || '');
  const lower = text.toLowerCase();
  const hits = [];
  CLICHES.forEach(c => {
    let i = 0, n = 0, spots = [];
    while ((i = lower.indexOf(c.p, i)) !== -1) { n++; spots.push(text.slice(Math.max(0, i - 40), i + c.p.length + 40)); i += c.p.length; if (n > 20) break; }
    if (n) hits.push({ phrase: c.p, count: n, alts: c.s, spots: spots.slice(0, 3) });
  });
  const words = (lower.match(/[a-z']{4,}/g) || []);
  const freq = {};
  words.forEach(w => { if (!STOPWORDS.has(w)) freq[w] = (freq[w] || 0) + 1; });
  const total = countWords(text) || 1;
  const repeats = Object.keys(freq).map(w => ({ w: w, n: freq[w], per1k: (freq[w] / total) * 1000 }))
    .filter(x => x.n >= 4).sort((a, b) => b.n - a.n).slice(0, 16);
  const adverbs = (lower.match(/\b\w+ly\b/g) || []);
  const advFreq = {};
  adverbs.forEach(a => { advFreq[a] = (advFreq[a] || 0) + 1; });
  const filters = FILTER_WORDS.map(f => {
    const re = new RegExp('\\b' + f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
    const m = lower.match(re);
    return { w: f, n: m ? m.length : 0 };
  }).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
  const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
  const starts = {};
  sentences.forEach(s => { const w = (s.trim().split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z']/g, ''); if (w) starts[w] = (starts[w] || 0) + 1; });
  const startRepeat = Object.keys(starts).map(w => ({ w: w, n: starts[w] })).filter(x => x.n >= 3).sort((a, b) => b.n - a.n).slice(0, 8);
  const avgSentence = sentences.length ? Math.round(total / sentences.length) : 0;
  return { hits: hits, repeats: repeats, filters: filters, startRepeat: startRepeat, adverbs: Object.keys(advFreq).map(a => ({ w: a, n: advFreq[a] })).sort((a, b) => b.n - a.n).slice(0, 10), total: total, sentences: sentences.length, avgSentence: avgSentence };
}

  const r = scanText(text);

  const a = b.outline.answers || {};

  const lead = names[0] || 'the protagonist';
  const anta = names[1] || 'the opposing force';
  const g = GENRES.find(x => x.id === b.genre);
  const frag = (s, n) => {
    const t = String(s || '').trim();
    if (!t) return '';
    const parts = t.split(/[.;\n]/).map(x => x.trim()).filter(Boolean);
    return parts[n % Math.max(1, parts.length)] || parts[0] || '';
  };
  const seeds = {
    about: frag(a.about, 0), plot: frag(a.plot, 0), plot2: frag(a.plot, 1),
    begin: frag(a.begin, 0), middle: frag(a.middle, 0), climax: frag(a.climax, 0), climax2: frag(a.climax, 1),
    theme: frag(a.theme, 0)
  };
  const out = [];
  tpl.acts.forEach((act) => {
    act.beats.forEach((beatTitle, bi) => {
      const total = tpl.acts.reduce((n, x) => n + x.beats.length, 0);
      const pos = out.length / Math.max(1, total - 1);
      let text;
      if (pos < 0.18) text = (seeds.begin || 'The ordinary world holds, with one detail out of place') + '. ' + lead + ' is introduced through what they are willing to tolerate.';
      else if (pos < 0.35) text = (seeds.plot || 'The external problem arrives') + '. ' + lead + ' refuses, then cannot.';
      else if (pos < 0.55) text = 'Pressure from ' + anta + '. ' + (seeds.plot2 || 'The plan works partially, and the partial success costs more than failure would have') + '.';
      else if (pos < 0.68) text = (seeds.middle || 'The midpoint reversal lands') + ' — ' + lead + ' stops reacting and starts choosing. ' + (seeds.about ? 'The story\'s argument (' + seeds.about.toLowerCase() + ') becomes visible here.' : '');
      else if (pos < 0.84) text = 'Everything narrows. ' + pick(AI_STAKES).replace(/^/, 'The cost lands on ') + '. ' + anta + ' is winning on the terms ' + lead + ' chose.';
      else text = (seeds.climax || 'The final confrontation') + '. ' + (seeds.climax2 || 'What remains afterwards is smaller and truer') + '.' + (seeds.theme ? ' Theme paid in full: ' + seeds.theme.toLowerCase() + '.' : '');
      out.push({ id: uid('bt'), act: act.n, title: beatTitle, text: text.replace(/\s+/g, ' ').trim() });
    });
  });
  if (g) out.push({ id: uid('bt'), act: 'GENRE CHECK', title: g.name + ' promise audit', text: 'Confirm the genre promise is delivered: ' + g.structure.slice(0, 3).join(' · ') + '. Avoid: ' + g.pitfalls[0] + '.' });
  return out;
}

function comicScript(b) {
  const lines = ['# ' + b.title + (b.subtitle ? ' — ' + b.subtitle : ''), 'Writer: ' + (b.author || '—'), 'Format: ' + b.comic.style.toUpperCase(), 'Pages: ' + b.comic.pages.length, ''];
  b.comic.pages.forEach((pg, i) => {
    lines.push('=========================================');
    lines.push('PAGE ' + (i + 1) + (pg.title ? ' — ' + pg.title.toUpperCase() : '') + '  (' + ((COMIC_LAYOUTS.find(l => l.id === pg.layout) || {}).name || '') + ', ' + pg.panels.length + ' panels)');
    lines.push('=========================================', '');
    pg.panels.forEach((p, j) => {
      lines.push('PANEL ' + (j + 1) + ' — ' + (p.camera || 'Medium'));
      lines.push(p.desc || '(no description)');
      if (p.notes) lines.push('  [ART NOTE: ' + p.notes + ']');
      (p.lines || []).forEach(l => {
        if (l.type === 'sfx') lines.push('  SFX: ' + l.text);
        else if (l.type === 'caption') lines.push('  CAPTION: ' + l.text);
        else lines.push('  ' + (l.who || 'VOICE').toUpperCase() + (l.type === 'thought' ? ' (thought)' : l.type === 'off' ? ' (off-panel)' : '') + ': ' + l.text);
      });
      lines.push('');
    });
  });
  return lines.join('\n');
}

function manuscriptMarkdown(b) {
  const out = ['# ' + b.title, ''];
  if (b.subtitle) out.push('## ' + b.subtitle, '');
  if (b.author) out.push('_by ' + b.author + '_', '');
  if (b.logline) out.push('> ' + b.logline, '');
  out.push('---', '');
  if (b.dedication.text) out.push('### Dedication', '', b.dedication.text, '', '---', '');
  const html2md = (html) => stripHTML(String(html || '').replace(/<\/(p|div|h2|h3|blockquote|li)>/gi, '\n\n').replace(/<br\s*\/?>/gi, '\n').replace(/<li>/gi, '- ')).replace(/\n{3,}/g, '\n\n').trim();
  if (b.prologue.html) out.push('## Prologue', '', html2md(b.prologue.html), '', '---', '');
  (b.chapters || []).forEach((c, i) => {
    out.push('## ' + (c.title || 'Chapter ' + (i + 1)), '');
    if (c.pov || c.setting) out.push('_' + [c.pov ? 'POV: ' + c.pov : '', c.setting ? 'Setting: ' + c.setting : ''].filter(Boolean).join(' · ') + '_', '');
    out.push(html2md(c.html) || '_(unwritten)_', '', '---', '');
  });
  if (b.dedication.ack) out.push('## Acknowledgements', '', b.dedication.ack, '');
  return out.join('\n');
}
function storyBibleMarkdown(b) {
  const a = b.outline.answers || {};
  const g = GENRES.find(x => x.id === b.genre);
  const out = ['# ' + b.title + ' — Story Bible', '', '**Author:** ' + (b.author || '—') + '  ', '**Genre:** ' + (g ? g.name : (b.genre || '—')) + '  ',
    '**Status:** ' + b.status + '  ', '**Words:** ' + fmt(bookWords(b)) + ' / ' + fmt(b.goalWords) + '  ', '', b.logline ? '> ' + b.logline : '', '', '---', ''];
  out.push('## Story Questions', '');
  STORY_QS.forEach(q => { if ((a[q.k] || '').trim()) out.push('### ' + q.q, '', a[q.k], ''); });
  if ((b.outline.beats || []).length) {
    out.push('## Beat Sheet — ' + (b.outline.template || ''), '');
    b.outline.beats.forEach((bt, i) => out.push('' + (i + 1) + '. **' + (bt.act ? bt.act + ' · ' : '') + bt.title + '** — ' + bt.text));
    out.push('');
  }
  out.push('## Cast', '');
  TIERS.forEach(t => {
    const list = (b.characters || []).filter(c => c.tier === t.id);
    if (!list.length) return;
    out.push('### ' + t.label, '');
    list.forEach(c => {
      out.push('#### ' + (c.name || 'Unnamed') + (c.role ? ' — ' + c.role : ''));
      [['Aliases', c.aliases], ['Age', c.age], ['Pronouns', c.pronouns], ['Occupation', c.occupation], ['Alignment', c.alignment],
       ['Appearance', c.appearance], ['Wants', c.motivation], ['Needs', c.need], ['Flaws', c.flaws], ['Fears', c.fears],
       ['Secret', c.secret], ['Voice', c.voice], ['Mannerisms', c.mannerisms], ['Backstory', c.backstory], ['Arc', c.arc], ['Notes', c.notes]]
        .forEach(p => { if ((p[1] || '').trim()) out.push('- **' + p[0] + ':** ' + p[1]); });
      out.push('');
    });
  });
  if ((b.relationships || []).length) {
    out.push('## Relationship Map', '');
    b.relationships.forEach(r => {
      const A = (b.characters.find(c => c.id === r.a) || {}).name || '?';
      const B = (b.characters.find(c => c.id === r.b) || {}).name || '?';
      const t = (REL_TYPES.find(x => x.id === r.type) || {}).label || r.type;
      out.push('- **' + A + ' ↔ ' + B + '** — ' + t + (r.label ? ' (' + r.label + ')' : '') + (r.note ? ': ' + r.note : ''));
    });
    out.push('');
  }
  if ((b.chapters || []).length) {
    out.push('## Chapter Breakdown', '');
    b.chapters.forEach((c, i) => {
      out.push('### ' + (i + 1) + '. ' + (c.title || 'Untitled') + '  _(' + fmt(wordsOfHTML(c.html)) + ' words · tension ' + (c.tension || 5) + '/10 · ' + (c.status || 'draft') + ')_');
      [['POV', c.pov], ['Setting', c.setting], ['Goal', c.goal], ['Conflict', c.conflict], ['Outcome', c.outcome], ['Notes', c.notes]]
        .forEach(p => { if ((p[1] || '').trim()) out.push('- **' + p[0] + ':** ' + p[1]); });
      out.push('');
    });
  }
  if ((b.research.links || []).length) {
    out.push('## Research Vault', '');
    b.research.links.forEach(l => out.push('- [' + (l.title || l.url) + '](' + l.url + ') — _' + (l.cat || '') + '_' + (l.notes ? ': ' + l.notes : '')));
  }
  return out.filter(x => x !== undefined).join('\n');
}

/* ============================ MIGRATION ================================== */
function migrateBook(bk) {
  const t = newBook(bk.title || 'Untitled Manuscript');
  const out = Object.assign(t, bk);
  out.cover = Object.assign(clone(t.cover), bk.cover || {});
  out.cover.front = Object.assign(clone(t.cover.front), (bk.cover || {}).front || {});
  out.cover.back = Object.assign(clone(t.cover.back), (bk.cover || {}).back || {});
  out.cover.spine = Object.assign(clone(t.cover.spine), (bk.cover || {}).spine || {});
  out.titlePage = Object.assign(clone(t.titlePage), bk.titlePage || {});
  out.dedication = Object.assign(clone(t.dedication), bk.dedication || {});
  out.prologue = Object.assign(clone(t.prologue), bk.prologue || {});
  out.prologue.moodboard = out.prologue.moodboard || [];
  out.outline = Object.assign(clone(t.outline), bk.outline || {});
  out.comic = Object.assign(clone(t.comic), bk.comic || {});
  out.kids = Object.assign(clone(t.kids), bk.kids || {});
  out.research = Object.assign(clone(t.research), bk.research || {});
  out.masterclass = Object.assign(clone(t.masterclass), bk.masterclass || {});
  out.banners = bk.banners || {};
  out.chapters = (bk.chapters || []).map(c => Object.assign(newChapter(1), c));
  out.characters = (bk.characters || []).map(c => Object.assign(newCharacter('sup'), c));
  out.relationships = bk.relationships || [];
  out.activity = bk.activity || [];
  if (!out.id) out.id = uid('bk');
  return out;
}
function migrateState(loaded) {
  const d = defaultState();
  const s = Object.assign(d, loaded || {});
  s.app = Object.assign(clone(d.app), loaded.app || {});
  s.app.ai = Object.assign(clone(d.app.ai), (loaded.app || {}).ai || {});
  s.app.ai.keys = Object.assign(clone(d.app.ai.keys), ((loaded.app || {}).ai || {}).keys || {});
  s.app.ai.model = Object.assign(clone(d.app.ai.model), ((loaded.app || {}).ai || {}).model || {});
  s.app.ai.templates = Object.assign(clone(d.app.ai.templates), ((loaded.app || {}).ai || {}).templates || {});
  s.app.globalBanner = Object.assign(newBanner('medium'), (loaded.app || {}).globalBanner || {});
  s.ui = Object.assign(clone(d.ui), loaded.ui || {});
  s.ui.lastEdited = s.ui.lastEdited || {};
  s.books = (loaded.books || []).map(migrateBook);
  return s;
}

  rel(0, 1, 'rival', 'former partners'); rel(0, 2, 'mentor', 'reluctant guardian');
  rel(1, 2, 'secret', 'knows about the aunt'); rel(0, 3, 'enemy', 'blocks the request');
  rel(0, 4, 'ally', 'needs a source'); rel(1, 4, 'rival', 'manages the press');
  b.outline.answers = {
    about: 'A story about complicity — how ordinary, competent people keep a lie alive by doing their jobs correctly.',
    plot: 'An archivist finds a forged flood record bearing her own signature and has nine days to prove it before the tide gates cycle and destroy the physical evidence.',
    cast: 'Vera (wants vindication), Idris (wants containment), Toma (wants their aunt), Sela (wants the story).',
    begin: 'A flood siren tests three months out of schedule and nobody in the city wakes up.',
    middle: 'Vera finds her own signature on the forged record — and cannot remember the year it was signed.',
    climax: 'She publishes and loses her position, her record and her partner. The flood comes anyway. Toma is on the boat.',
    theme: 'Complicity is a slow decision made in small, defensible increments. Ending: bitter, clean, a little hopeful.'
  };
  b.outline.beats = simulateBeats(b, 'threeAct');
  b.outline.template = BEAT_TEMPLATES.threeAct.name;
  const chapters = [
    ['The Test Siren', 'Vera', 'Lower Registry, 03:00', 'Confirm the siren schedule', 'The log says no test was scheduled', 'She files a query she should not have filed', 6],
    ['Re-Index', 'Vera', 'Cabinet Row 14, morning', 'Complete a routine re-index', 'A record exists that should not', 'She photographs it before reporting it', 5],
    ['Compliance', 'Idris', 'Tide Gate Authority', 'Close the query quietly', 'Vera has already made a copy', 'He offers her a promotion', 7],
    ['The Signature', 'Vera', 'Her flat, night', 'Verify the handwriting', 'It is hers, dated to a year she cannot recall', 'She stops trusting her own archive', 9]
  ];
  chapters.forEach((c, i) => {
    const ch = newChapter(i + 1);
    ch.title = c[0]; ch.pov = c[1]; ch.setting = c[2]; ch.goal = c[3]; ch.conflict = c[4]; ch.outcome = c[5]; ch.tension = c[6];
    ch.status = i < 2 ? 'revised' : 'draft';
    ch.html = '<p>' + esc(c[3]) + ' — ' + esc(c[4].toLowerCase()) + '.</p><p><em>Draft this scene. Use the Unstuck Engine if the page goes quiet.</em></p>';
    b.chapters.push(ch);
  });
  b.research.links = SUGGESTED_LINKS.slice(0, 5).map(s => ({ id: uid('lk'), title: s.title, url: s.url, cat: s.cat, tags: '', notes: s.notes }));
  b.research.pins = [
    { id: uid('pin'), type: 'quote', x: 40, y: 40, z: 11, text: 'Every record can be rewritten.\nEvery city remembers anyway.', caption: 'working epigraph' },
    { id: uid('pin'), type: 'swatch', x: 300, y: 60, z: 12, color: '#1d5a6b', caption: 'flood water' },
    { id: uid('pin'), type: 'swatch', x: 300, y: 200, z: 13, color: '#c9a227', caption: 'archive lamp' },
    { id: uid('pin'), type: 'note', x: 520, y: 60, z: 14, text: 'RESEARCH: how paper records were physically stored in flood-prone municipal archives. Cabinet height above datum. What survives immersion.' }
  ];
  b.kids.tier = '4-8';
  b.comic.pages = [newComicPage('four')];
  b.comic.pages[0].title = 'The Test Siren';
  b.comic.pages[0].panels[0].desc = 'Wide. The terraced city at 3am, every window dark. One lit square: the archive.';
  b.comic.pages[0].panels[0].camera = 'Establishing wide';
  b.comic.pages[0].panels[0].lines = [{ type: 'caption', who: '', text: 'The siren tested three months early.' }];
  b.comic.pages[0].panels[1].desc = 'Interior. VERA at the window, cup in hand, listening.';
  b.comic.pages[0].panels[1].camera = 'Medium';
  b.comic.pages[0].panels[1].lines = [{ type: 'thought', who: 'VERA', text: 'Nobody is waking up.' }];
  b.comic.pages[0].panels[2].desc = 'Close on the dark windows across the terrace. Not one light.';
  b.comic.pages[0].panels[2].camera = 'Close-up';
  b.comic.pages[0].panels[3].desc = 'The siren dies. Silence with a shape to it.';
  b.comic.pages[0].panels[3].camera = 'Extreme close-up';
  b.comic.pages[0].panels[3].lines = [{ type: 'sfx', who: '', text: '— khhhh —' }];
  b.activity = [
    { id: uid('ac'), kind: 'project', text: 'Demo project loaded: The Ashfall Protocol', at: nowISO() }
  ];
  state.books.push(b);
  state.ui.bookId = b.id;
  markDirty(); closeAllModals(); go('dashboard');
  toast('Demo project loaded — every module is populated. Delete it any time from the Library.', 'ok', 'DEMO ONLINE');
};

async function boot() {
  await storageInit();
  const loaded = await storageLoad();
  let first = false;
  if (loaded) {
    try { state = migrateState(loaded); }
    catch (e) { console.error('Migration failed, starting clean.', e); state = defaultState(); first = true; }
  } else { first = true; }

  if (!state.books.length) seedStarterBook();
  if (!state.ui.bookId || !state.books.some(b => b.id === state.ui.bookId)) state.ui.bookId = state.books[0].id;

  // route from the URL hash when present, otherwise from saved UI state
  const hash = (location.hash || '').replace(/^#/, '');
  const hv = hash.split('/')[0];
  CURRENT_VIEW = VIEWS[hv] ? hv : (VIEWS[state.ui.view] ? state.ui.view : 'dashboard');
  state.ui.view = CURRENT_VIEW;

  renderBrand();
  render();
  startAutosave();
  refreshStorageMeter();
  paintSavePill('idle');

  /* --- brandbar wiring --- */
  $('#brandTitle').addEventListener('click', () => ACTIONS.brandRename());
  $('#brandLogo').addEventListener('click', () => ACTIONS.logoMenu());
  $('#bookSwitchBtn').addEventListener('click', () => ACTIONS.toggleBookMenu());
  $('#btnSearch').addEventListener('click', () => ACTIONS.globalSearch());
  $('#btnSaveNow').addEventListener('click', () => ACTIONS.saveForce());
  $('#btnFx').addEventListener('click', () => { state.app.fx = !state.app.fx; markDirty(); renderBrand(); toast('Grid FX ' + (state.app.fx ? 'enabled' : 'disabled') + '.', 'ok'); });
  $('#btnRail').addEventListener('click', () => {
    const rail = $('#rail');
    rail.classList.toggle('open');
    if (rail.classList.contains('open')) {
      const bd = document.createElement('div');
      bd.className = 'rail-backdrop';
      bd.addEventListener('click', () => { rail.classList.remove('open'); bd.remove(); });
      document.body.appendChild(bd);
    } else { const bd = $('.rail-backdrop'); if (bd) bd.remove(); }
  });

  /* --- global drag & drop of images onto dropzones --- */
  document.addEventListener('dragover', (e) => {
    const z = e.target.closest('.dropzone'); if (!z) return;
    e.preventDefault(); z.classList.add('over');
  });
  document.addEventListener('dragleave', (e) => {
    const z = e.target.closest('.dropzone'); if (z) z.classList.remove('over');
  });
  document.addEventListener('drop', async (e) => {
    const z = e.target.closest('.dropzone'); if (!z) return;
    e.preventDefault(); z.classList.remove('over');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f || !/^image\//.test(f.type)) return;
    const data = await readFileAsDataURL(f);
    const act = z.getAttribute('data-act');
    const arg = z.getAttribute('data-arg');
    const b = currentBook();
    if (act === 'coverArt' && b) { b.cover[arg].art = data; markDirty(); render(); toast('Cover art dropped in.', 'ok'); }
    else if (act === 'moodAdd' && b) { b.prologue.moodboard.unshift({ id: uid('mp'), src: data, note: '' }); markDirty(); render(); }
    else if (act === 'chImgAdd' && b) { const ch = activeChapter(b); if (ch) { ch.images = ch.images || []; ch.images.push({ id: uid('im'), src: data, caption: f.name }); markDirty(); render(); } }
    else toast('Drop target does not accept images here — use the button instead.', 'warn');
  });

  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').replace(/^#/, '').split('/')[0];
    if (h && VIEWS[h] && h !== CURRENT_VIEW) go(h);
  });

  if (first) setTimeout(welcomeModal, 400);
  console.log('%cRAVENBANE · ARCHITECT online — engine: ' + ENGINE, 'color:#23e0ff;font-family:monospace');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
</html>
