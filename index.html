/* ============================================================================
   RAVENBANE :: ARCHITECT  —  TRON LEGACY / ARES GRID THEME
   All core layout lives in hand-written CSS so the shell survives a CDN outage.
   ========================================================================== */

:root{
  --bg-void:#03050a;
  --bg-deep:#05080f;
  --bg-panel:rgba(9,16,26,.78);
  --bg-panel-solid:#080e18;
  --bg-raise:rgba(18,32,48,.55);
  --line:rgba(35,224,255,.16);
  --line-soft:rgba(35,224,255,.08);
  --line-hard:rgba(35,224,255,.42);
  --txt:#cfe9f5;
  --txt-dim:#7e9bad;
  --txt-faint:#4d6b7d;
  --accent:#23e0ff;
  --accent-2:#ff2b3d;
  --accent-3:#ffb43a;
  --glow:0 0 12px rgba(35,224,255,.45), 0 0 32px rgba(35,224,255,.14);
  --glow-red:0 0 12px rgba(255,43,61,.5), 0 0 34px rgba(255,43,61,.18);
  --rail-w:268px;
  --brand-h:56px;
  --radius:2px;
  --font-ui:'Rajdhani','Inter',system-ui,sans-serif;
  --font-display:'Orbitron','Rajdhani',sans-serif;
  --font-mono:'Share Tech Mono','IBM Plex Mono',ui-monospace,monospace;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg-void); color:var(--txt);
  font-family:var(--font-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  letter-spacing:.2px;
}
/* --- Ambient TRON grid + vignette + scanlines --- */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(35,224,255,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(35,224,255,.055) 1px, transparent 1px),
    radial-gradient(ellipse at 50% -10%, rgba(35,224,255,.10), transparent 60%),
    radial-gradient(ellipse at 100% 110%, rgba(255,43,61,.09), transparent 55%);
  background-size:52px 52px, 52px 52px, 100% 100%, 100% 100%;
}
body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9998;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 3px, rgba(0,0,0,.16) 3px 4px);
  mix-blend-mode:multiply; opacity:.5;
}
body.no-fx::before,body.no-fx::after{ display:none; }

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:rgba(3,5,10,.6); }
::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,rgba(35,224,255,.35),rgba(35,224,255,.12)); border:1px solid rgba(35,224,255,.25); }
::-webkit-scrollbar-thumb:hover{ background:rgba(35,224,255,.5); }
* { scrollbar-color: rgba(35,224,255,.35) rgba(3,5,10,.6); scrollbar-width: thin; }

::selection{ background:rgba(35,224,255,.3); color:#fff; }

/* ============================ APP SHELL ================================== */
#app{ position:relative; z-index:1; height:100vh; display:flex; flex-direction:column; }

.brandbar{
  height:var(--brand-h); flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:0 14px; background:linear-gradient(180deg,rgba(6,12,20,.97),rgba(4,8,14,.92));
  border-bottom:1px solid var(--line); backdrop-filter:blur(14px);
  box-shadow:0 1px 0 rgba(35,224,255,.10), 0 8px 30px rgba(0,0,0,.7); position:relative;
}
.brandbar::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-2) 12%,var(--accent) 55%,transparent);
  opacity:.75;
}
.brand-logo{
  width:38px; height:38px; flex:0 0 auto; display:grid; place-items:center; overflow:hidden;
  border:1px solid var(--line-hard); background:rgba(35,224,255,.06);
  clip-path:polygon(22% 0,100% 0,100% 78%,78% 100%,0 100%,0 22%);
  box-shadow:var(--glow); cursor:pointer; transition:.2s;
}
.brand-logo:hover{ box-shadow:var(--glow-red); border-color:rgba(255,43,61,.6); }
.brand-logo img{ width:100%; height:100%; object-fit:cover; }
.brand-title{
  font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:3.5px;
  cursor:pointer; white-space:nowrap; user-select:none; line-height:1;
}
.brand-title .a{ color:var(--accent-2); text-shadow:0 0 10px rgba(255,43,61,.85),0 0 28px rgba(255,43,61,.4); }
.brand-title .b{ color:#e8fbff; text-shadow:0 0 10px rgba(35,224,255,.7),0 0 26px rgba(35,224,255,.3); }
.brand-title .sep{ color:var(--txt-faint); margin:0 6px; font-weight:400; }
.brand-sub{ font-family:var(--font-mono); font-size:10px; color:var(--txt-faint); letter-spacing:2.4px; margin-top:2px; }

.shell{ flex:1 1 auto; display:flex; min-height:0; }

/* ------------------------------- RAIL ----------------------------------- */
.rail{
  width:var(--rail-w); flex:0 0 var(--rail-w); display:flex; flex-direction:column; min-height:0;
  background:linear-gradient(180deg,rgba(6,11,19,.96),rgba(4,7,13,.98));
  border-right:1px solid var(--line); backdrop-filter:blur(10px); position:relative; z-index:40;
}
.rail::after{ content:''; position:absolute; top:0; bottom:0; right:-1px; width:1px;
  background:linear-gradient(180deg,var(--accent-2),var(--accent) 40%,transparent); opacity:.5; }
.rail-scroll{ overflow-y:auto; overflow-x:hidden; flex:1 1 auto; padding:8px 8px 24px; }
.rail-group{ margin-bottom:12px; }
.rail-label{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:2.6px; color:var(--txt-faint);
  padding:8px 10px 5px; display:flex; align-items:center; gap:7px; text-transform:uppercase;
}
.rail-label::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }
.navitem{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 10px; margin:1px 0; border:1px solid transparent; background:transparent;
  color:var(--txt-dim); font-family:var(--font-ui); font-size:14px; font-weight:600; letter-spacing:.6px;
  cursor:pointer; position:relative; transition:.14s ease; border-radius:var(--radius);
}
.navitem i,.navitem svg{ width:16px; height:16px; flex:0 0 16px; opacity:.85; }
.navitem:hover{ color:#dff6ff; background:rgba(35,224,255,.07); border-color:rgba(35,224,255,.18); }
.navitem.active{
  color:#eafcff; background:linear-gradient(90deg,rgba(35,224,255,.20),rgba(35,224,255,.03));
  border-color:rgba(35,224,255,.45); box-shadow:inset 0 0 18px rgba(35,224,255,.10);
}
.navitem.active::before{
  content:''; position:absolute; left:-8px; top:2px; bottom:2px; width:3px;
  background:var(--accent); box-shadow:0 0 10px var(--accent); }
.navitem.tone-red.active{ background:linear-gradient(90deg,rgba(255,43,61,.20),rgba(255,43,61,.02)); border-color:rgba(255,43,61,.45); }
.navitem.tone-red.active::before{ background:var(--accent-2); box-shadow:0 0 10px var(--accent-2); }
.navitem .badge{
  margin-left:auto; font-family:var(--font-mono); font-size:9.5px; padding:1px 6px;
  border:1px solid var(--line); color:var(--accent); background:rgba(35,224,255,.07);
}

.bookswitch{ padding:10px; border-bottom:1px solid var(--line); background:rgba(35,224,255,.035); }
.bookswitch-btn{
  width:100%; display:flex; align-items:center; gap:9px; padding:8px 10px; cursor:pointer;
  background:rgba(4,10,18,.85); border:1px solid var(--line-hard); color:var(--txt);
  font-family:var(--font-ui); font-weight:600; font-size:14px; text-align:left;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  transition:.15s;
}
.bookswitch-btn:hover{ border-color:var(--accent); box-shadow:inset 0 0 20px rgba(35,224,255,.12); }
.bookswitch-btn .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bookmenu{
  position:absolute; left:10px; right:10px; top:100%; margin-top:4px; z-index:120; max-height:340px; overflow:auto;
  background:var(--bg-panel-solid); border:1px solid var(--line-hard); box-shadow:0 20px 50px rgba(0,0,0,.8),var(--glow);
}
.bookmenu button{
  display:flex; width:100%; gap:8px; align-items:center; padding:9px 11px; background:transparent; border:0;
  border-bottom:1px solid var(--line-soft); color:var(--txt-dim); font-family:var(--font-ui); font-size:14px;
  cursor:pointer; text-align:left;
}
.bookmenu button:hover{ background:rgba(35,224,255,.1); color:#eafcff; }
.bookmenu button.sel{ color:var(--accent); }

/* ------------------------------ MAIN ------------------------------------ */
.main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.main-scroll{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; scroll-behavior:smooth; }
.view-pad{ padding:20px 24px 90px; max-width:1680px; margin:0 auto; }

/* ------------------------------ BANNER ---------------------------------- */
.banner{ position:relative; width:100%; overflow:hidden; border-bottom:1px solid var(--line); background:#04070c; flex:0 0 auto; }
.banner-media{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.banner-fallback{
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 20% 120%, rgba(255,43,61,.30), transparent 55%),
    radial-gradient(ellipse at 80% -20%, rgba(35,224,255,.30), transparent 55%),
    repeating-linear-gradient(90deg, rgba(35,224,255,.10) 0 1px, transparent 1px 60px),
    repeating-linear-gradient(0deg, rgba(35,224,255,.07) 0 1px, transparent 1px 60px),
    linear-gradient(180deg,#06101c,#04070c);
}
.banner-scrim{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(3,5,10,.30) 0%,rgba(3,5,10,.15) 40%,rgba(3,5,10,.92) 100%); }
.banner-inner{ position:relative; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:16px 24px; }
.banner-eyebrow{ font-family:var(--font-mono); font-size:10px; letter-spacing:3.4px; color:var(--accent); text-shadow:0 0 12px rgba(35,224,255,.7); }
.banner-title{ font-family:var(--font-display); font-weight:800; letter-spacing:2.4px; color:#fff; text-shadow:0 0 18px rgba(0,0,0,.9),0 0 34px rgba(35,224,255,.35); margin:2px 0 0; }
.banner-desc{ color:#a9c8d8; font-size:13.5px; max-width:760px; }
.banner-tools{ position:absolute; top:10px; right:12px; display:flex; gap:6px; z-index:5; }
.banner-h-compact{ height:132px; } .banner-h-compact .banner-title{ font-size:20px; }
.banner-h-medium{ height:230px; } .banner-h-medium .banner-title{ font-size:27px; }
.banner-h-hero{ height:420px; } .banner-h-hero .banner-title{ font-size:38px; }
.banner-h-off{ height:0; border:0; }
@media(max-width:820px){ .banner-h-hero{ height:260px; } .banner-h-hero .banner-title{ font-size:26px; } }

/* ------------------------- PRIMITIVE COMPONENTS -------------------------- */
.panel{
  background:var(--bg-panel); border:1px solid var(--line); backdrop-filter:blur(10px);
  position:relative; border-radius:var(--radius);
  box-shadow:0 10px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03);
}
.panel.clip{ clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px)); }
.panel:hover{ border-color:rgba(35,224,255,.30); }
.panel-hd{
  display:flex; align-items:center; gap:9px; padding:10px 14px; border-bottom:1px solid var(--line-soft);
  background:linear-gradient(90deg,rgba(35,224,255,.09),transparent 70%);
}
.panel-hd h3{
  margin:0; font-family:var(--font-display); font-size:12.5px; font-weight:700; letter-spacing:2.2px;
  color:#dff6ff; text-transform:uppercase;
}
.panel-hd .sub{ font-family:var(--font-mono); font-size:10px; color:var(--txt-faint); letter-spacing:1.6px; }
.panel-bd{ padding:14px; }
.panel.tone-red .panel-hd{ background:linear-gradient(90deg,rgba(255,43,61,.12),transparent 70%); }
.panel.tone-red{ border-color:rgba(255,43,61,.24); }

.corner-tl,.corner-br{ position:absolute; width:10px; height:10px; pointer-events:none; }
.corner-tl{ top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
.corner-br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--accent-2); border-right:2px solid var(--accent-2); }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:7px 13px; cursor:pointer;
  font-family:var(--font-ui); font-weight:700; font-size:13px; letter-spacing:1.1px; text-transform:uppercase;
  color:var(--accent); background:rgba(35,224,255,.07); border:1px solid rgba(35,224,255,.42);
  transition:.15s; border-radius:var(--radius); white-space:nowrap; user-select:none;
}
.btn:hover{ background:rgba(35,224,255,.18); box-shadow:0 0 16px rgba(35,224,255,.30); color:#eafcff; }
.btn:active{ transform:translateY(1px); }
.btn i,.btn svg{ width:15px; height:15px; }
.btn.sm{ padding:4px 9px; font-size:11.5px; letter-spacing:.9px; }
.btn.sm i,.btn.sm svg{ width:13px; height:13px; }
.btn.xs{ padding:2px 7px; font-size:10.5px; }
.btn.xs i,.btn.xs svg{ width:11px; height:11px; }
.btn.lg{ padding:11px 20px; font-size:14.5px; }
.btn.red{ color:#ff8a95; border-color:rgba(255,43,61,.45); background:rgba(255,43,61,.09); }
.btn.red:hover{ background:rgba(255,43,61,.2); box-shadow:0 0 16px rgba(255,43,61,.35); color:#fff; }
.btn.amber{ color:var(--accent-3); border-color:rgba(255,180,58,.45); background:rgba(255,180,58,.09); }
.btn.amber:hover{ background:rgba(255,180,58,.2); box-shadow:0 0 16px rgba(255,180,58,.3); }
.btn.lime{ color:var(--cyber-lime,#8dff4f); border-color:rgba(141,255,79,.45); background:rgba(141,255,79,.09); }
.btn.lime:hover{ background:rgba(141,255,79,.2); box-shadow:0 0 16px rgba(141,255,79,.3); }
.btn.violet{ color:#c39bff; border-color:rgba(165,107,255,.45); background:rgba(165,107,255,.1); }
.btn.violet:hover{ background:rgba(165,107,255,.22); box-shadow:0 0 16px rgba(165,107,255,.32); }
.btn.ghost{ color:var(--txt-dim); border-color:var(--line); background:transparent; }
.btn.ghost:hover{ color:#dff6ff; border-color:rgba(35,224,255,.4); background:rgba(35,224,255,.07); box-shadow:none; }
.btn.solid{ color:#04121a; background:linear-gradient(180deg,#5df0ff,#17c3e6); border-color:#7ff3ff; text-shadow:none; box-shadow:0 0 18px rgba(35,224,255,.4); }
.btn.solid:hover{ background:linear-gradient(180deg,#8af6ff,#22d7fa); color:#02090e; }
.btn.solid.red{ color:#1a0206; background:linear-gradient(180deg,#ff6b78,#e01128); border-color:#ff8a95; box-shadow:0 0 18px rgba(255,43,61,.45); }
.btn[disabled]{ opacity:.4; pointer-events:none; }

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; font-family:var(--font-mono); font-size:10px;
  letter-spacing:1.3px; text-transform:uppercase; border:1px solid var(--line); color:var(--txt-dim);
  background:rgba(35,224,255,.05); border-radius:999px; white-space:nowrap;
}
.chip.cy{ color:var(--accent); border-color:rgba(35,224,255,.4); }
.chip.rd{ color:#ff8a95; border-color:rgba(255,43,61,.4); background:rgba(255,43,61,.07); }
.chip.am{ color:var(--accent-3); border-color:rgba(255,180,58,.4); background:rgba(255,180,58,.07); }
.chip.lm{ color:#8dff4f; border-color:rgba(141,255,79,.4); background:rgba(141,255,79,.07); }
.chip.vi{ color:#c39bff; border-color:rgba(165,107,255,.4); background:rgba(165,107,255,.07); }

label.fld{ display:block; margin-bottom:11px; }
label.fld > span.lb, .lb{
  display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:2px; text-transform:uppercase;
  color:var(--txt-faint); margin-bottom:4px;
}
.inp,.sel,.ta{
  width:100%; padding:8px 11px; background:rgba(3,8,14,.85); border:1px solid var(--line);
  color:var(--txt); font-family:var(--font-ui); font-size:14.5px; outline:none; transition:.15s;
  border-radius:var(--radius);
}
.ta{ resize:vertical; min-height:80px; line-height:1.62; }
.inp:focus,.sel:focus,.ta:focus{ border-color:var(--accent); box-shadow:0 0 0 1px rgba(35,224,255,.25),0 0 18px rgba(35,224,255,.16); background:rgba(6,14,24,.95); }
.inp::placeholder,.ta::placeholder{ color:#3e5867; }
.sel{ appearance:none; cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 10px) calc(50% + 1px);
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px; }
.sel option{ background:#08121e; color:#cfe9f5; }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:3px; background:rgba(35,224,255,.2); outline:none; cursor:pointer; }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; background:var(--accent); border:2px solid #041018; box-shadow:0 0 12px var(--accent); cursor:pointer; border-radius:50%; }
input[type=range]::-moz-range-thumb{ width:13px; height:13px; background:var(--accent); border:2px solid #041018; box-shadow:0 0 12px var(--accent); cursor:pointer; border-radius:50%; }
input[type=color]{ width:100%; height:34px; background:transparent; border:1px solid var(--line); cursor:pointer; padding:2px; }
input[type=checkbox]{ accent-color:#23e0ff; width:15px; height:15px; cursor:pointer; }

.grid-auto{ display:grid; gap:14px; }
.g2{ grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
.g3{ grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); }
.g4{ grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }

.stat{ padding:13px 15px; position:relative; overflow:hidden; }
.stat .v{ font-family:var(--font-display); font-size:28px; font-weight:800; color:#eafcff; line-height:1.05; text-shadow:0 0 20px rgba(35,224,255,.4); }
.stat .k{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:2.2px; color:var(--txt-faint); text-transform:uppercase; margin-top:5px; }
.stat .ic{ position:absolute; right:10px; top:10px; opacity:.16; }
.stat .ic i,.stat .ic svg{ width:40px; height:40px; }
.stat.red .v{ color:#ffd7db; text-shadow:0 0 20px rgba(255,43,61,.5); }
.stat.amber .v{ color:#ffe7bd; text-shadow:0 0 20px rgba(255,180,58,.45); }
.stat.lime .v{ color:#ddffc9; text-shadow:0 0 20px rgba(141,255,79,.4); }

.bar{ height:6px; background:rgba(35,224,255,.10); border:1px solid var(--line-soft); overflow:hidden; }
.bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent-3) 45%,var(--accent)); box-shadow:0 0 12px rgba(35,224,255,.5); transition:width .5s ease; }

.empty{ text-align:center; padding:46px 20px; color:var(--txt-faint); }
.empty i,.empty svg{ width:40px; height:40px; opacity:.35; margin-bottom:10px; }
.empty h4{ font-family:var(--font-display); letter-spacing:2px; font-size:14px; color:var(--txt-dim); margin:0 0 6px; }

.dropzone{
  border:1px dashed rgba(35,224,255,.35); background:rgba(35,224,255,.035); display:grid; place-items:center;
  text-align:center; padding:20px; cursor:pointer; transition:.15s; color:var(--txt-faint); position:relative;
}
.dropzone:hover,.dropzone.over{ border-color:var(--accent); background:rgba(35,224,255,.11); color:var(--accent); box-shadow:inset 0 0 30px rgba(35,224,255,.1); }
.dropzone i,.dropzone svg{ width:26px; height:26px; margin-bottom:6px; }

/* ------------------------------- MODALS --------------------------------- */
.modal-scrim{
  position:fixed; inset:0; z-index:9000; background:rgba(2,4,8,.82); backdrop-filter:blur(7px);
  display:flex; align-items:flex-start; justify-content:center; padding:36px 16px; overflow-y:auto;
  animation:fade .16s ease;
}
@keyframes fade{ from{opacity:0} to{opacity:1} }
@keyframes riseIn{ from{opacity:0;transform:translateY(14px) scale(.985)} to{opacity:1;transform:none} }
.modal{
  width:100%; max-width:760px; background:linear-gradient(180deg,rgba(9,17,28,.99),rgba(5,9,16,.99));
  border:1px solid rgba(35,224,255,.42); box-shadow:0 40px 100px rgba(0,0,0,.9),0 0 60px rgba(35,224,255,.13);
  animation:riseIn .2s cubic-bezier(.2,.9,.3,1); position:relative; margin:auto 0;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
}
.modal.wide{ max-width:1180px; } .modal.narrow{ max-width:480px; }
.modal-hd{ display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(255,43,61,.10),rgba(35,224,255,.07) 45%,transparent); }
.modal-hd h3{ margin:0; font-family:var(--font-display); font-size:14px; letter-spacing:2.4px; color:#eafcff; text-transform:uppercase; flex:1; }
.modal-bd{ padding:18px; max-height:min(70vh,760px); overflow-y:auto; }
.modal-ft{ padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; background:rgba(3,7,12,.6); }
.xclose{ background:transparent; border:1px solid var(--line); color:var(--txt-dim); width:28px; height:28px; display:grid; place-items:center; cursor:pointer; }
.xclose:hover{ color:#fff; border-color:var(--accent-2); background:rgba(255,43,61,.15); }

/* -------------------------------- TOASTS -------------------------------- */
#toasts{ position:fixed; right:16px; bottom:16px; z-index:9500; display:flex; flex-direction:column; gap:8px; max-width:380px; }
.toast{
  display:flex; gap:10px; align-items:flex-start; padding:10px 13px; background:rgba(6,13,22,.97);
  border:1px solid var(--line-hard); border-left:3px solid var(--accent); box-shadow:0 14px 36px rgba(0,0,0,.7),var(--glow);
  font-size:13.5px; animation:slideIn .22s cubic-bezier(.2,.9,.3,1); color:var(--txt);
}
@keyframes slideIn{ from{opacity:0;transform:translateX(26px)} to{opacity:1;transform:none} }
.toast.err{ border-left-color:var(--accent-2); box-shadow:0 14px 36px rgba(0,0,0,.7),var(--glow-red); }
.toast.warn{ border-left-color:var(--accent-3); }
.toast.ok{ border-left-color:#8dff4f; }
.toast b{ display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:2px; color:var(--accent); text-transform:uppercase; }
.toast.err b{ color:#ff8a95; } .toast.warn b{ color:var(--accent-3); } .toast.ok b{ color:#8dff4f; }

/* ------------------------------- EDITOR --------------------------------- */
.editor-wrap{ display:flex; flex-direction:column; min-height:0; }
.etoolbar{
  display:flex; flex-wrap:wrap; gap:4px; padding:7px 9px; border-bottom:1px solid var(--line-soft);
  background:rgba(4,10,18,.7); align-items:center; position:sticky; top:0; z-index:20; backdrop-filter:blur(8px);
}
.etool{
  width:29px; height:27px; display:grid; place-items:center; background:transparent; border:1px solid transparent;
  color:var(--txt-dim); cursor:pointer; transition:.12s; border-radius:var(--radius);
}
.etool:hover{ color:var(--accent); border-color:rgba(35,224,255,.35); background:rgba(35,224,255,.09); }
.etool.on{ color:var(--accent); border-color:rgba(35,224,255,.5); background:rgba(35,224,255,.15); }
.etool i,.etool svg{ width:14px; height:14px; }
.esep{ width:1px; height:18px; background:var(--line); margin:0 3px; }
.rte{
  min-height:420px; padding:26px 30px; outline:none; color:#dcecf5; font-size:16.5px; line-height:1.85;
  background:rgba(3,7,13,.62); overflow-y:auto; font-family:'Inter',var(--font-ui);
}
.rte:focus{ background:rgba(4,10,18,.8); }
.rte p{ margin:0 0 1.05em; } .rte h2{ font-family:var(--font-display); font-size:22px; color:#eafcff; letter-spacing:1.6px; margin:1.5em 0 .6em; }
.rte h3{ font-family:var(--font-display); font-size:17px; color:var(--accent); letter-spacing:1.2px; margin:1.3em 0 .5em; }
.rte blockquote{ border-left:3px solid var(--accent); margin:1.2em 0; padding:.3em 0 .3em 1.1em; color:#9fc4d6; font-style:italic; background:rgba(35,224,255,.05); }
.rte hr{ border:0; border-top:1px solid var(--line); margin:2em 0; }
.rte ul,.rte ol{ padding-left:1.6em; margin:0 0 1em; }
.rte ul{ list-style:disc; } .rte ol{ list-style:decimal; } .rte li{ margin-bottom:.3em; }
.rte img{ max-width:100%; border:1px solid var(--line); margin:.8em 0; display:block; }
.rte:empty::before{ content:attr(data-ph); color:#33505f; font-style:italic; }
.rte.wide-measure{ max-width:none; }
.rte.paper{ background:#f4f1e8; color:#20242b; font-family:'Playfair Display',Georgia,serif; }
.rte.paper blockquote{ color:#4a5058; background:rgba(0,0,0,.04); border-left-color:#8a7f6a; }
.rte.focus-mode{ font-size:19px; line-height:2; padding:40px 8%; }

/* AI inserted text highlight */
.ai-ins{
  display:block; background:linear-gradient(90deg,rgba(255,180,58,.22),rgba(141,255,79,.13));
  border-left:3px solid rgba(255,180,58,.8); box-shadow:0 0 24px rgba(255,180,58,.20) inset;
  color:#fff4dc; padding:8px 12px; margin:.7em 0; animation:aiPulse 1.9s ease-in-out infinite; border-radius:2px;
}
.ai-ins p:last-child{ margin-bottom:0; }
@keyframes aiPulse{ 0%,100%{ box-shadow:0 0 14px rgba(255,180,58,.20) inset; } 50%{ box-shadow:0 0 30px rgba(141,255,79,.34) inset; } }
.ai-ins.kept{ animation:none; background:transparent; border-bottom:0; box-shadow:none; color:inherit; }
.diffbar{
  position:sticky; bottom:0; z-index:30; display:flex; align-items:center; gap:9px; padding:9px 13px;
  background:linear-gradient(90deg,rgba(255,180,58,.14),rgba(6,12,20,.97));
  border-top:1px solid rgba(255,180,58,.5); box-shadow:0 -10px 30px rgba(0,0,0,.6); flex-wrap:wrap;
}

/* --------------------------- CHARACTER CARDS ---------------------------- */
.cast-card{
  position:relative; overflow:hidden; cursor:pointer; transition:.18s;
  background:linear-gradient(160deg,rgba(12,22,34,.9),rgba(5,10,17,.94)); border:1px solid var(--line);
}
.cast-card:hover{ transform:translateY(-3px); border-color:var(--accent); box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 26px rgba(35,224,255,.18); }
.cast-photo{ height:172px; background:#050b13; position:relative; overflow:hidden; display:grid; place-items:center; }
.cast-photo img{ width:100%; height:100%; object-fit:cover; filter:contrast(1.06) saturate(1.05); }
.cast-photo .ph{ font-family:var(--font-display); font-size:40px; color:rgba(35,224,255,.22); }
.cast-photo::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,rgba(4,8,14,.95)); }
.cast-tier{ position:absolute; top:8px; left:8px; z-index:3; }
.cast-body{ padding:11px 13px; }
.cast-name{ font-family:var(--font-display); font-size:14.5px; letter-spacing:1.4px; color:#eafcff; margin:0; }
.cast-role{ font-family:var(--font-mono); font-size:10px; color:var(--accent); letter-spacing:1.6px; }
.tier-lead{ border-color:rgba(255,43,61,.5) !important; }
.tier-lead .cast-photo::before{ content:''; position:absolute; inset:0; z-index:2; box-shadow:inset 0 0 60px rgba(255,43,61,.28); }
.tier-co{ border-color:rgba(255,180,58,.42) !important; }
.tier-sup{ border-color:rgba(35,224,255,.34) !important; }
.tier-min{ border-color:rgba(120,150,170,.28) !important; }

/* --------------------------- RELATIONSHIP MAP --------------------------- */
#relCanvas{ width:100%; height:560px; background:
  radial-gradient(ellipse at 50% 50%, rgba(35,224,255,.06), transparent 70%),
  repeating-linear-gradient(0deg,rgba(35,224,255,.05) 0 1px,transparent 1px 40px),
  repeating-linear-gradient(90deg,rgba(35,224,255,.05) 0 1px,transparent 1px 40px), #04070d;
  border:1px solid var(--line); cursor:grab; user-select:none; }
.rel-node{ cursor:grab; }
.rel-node:active{ cursor:grabbing; }

/* ------------------------------- CHAT ----------------------------------- */
.chatlog{ height:440px; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:11px; background:rgba(3,7,13,.55); }
.msg{ max-width:78%; padding:9px 13px; font-size:14.5px; line-height:1.6; position:relative; }
.msg.me{ align-self:flex-end; background:rgba(35,224,255,.13); border:1px solid rgba(35,224,255,.35); color:#e6f9ff;
  clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px)); }
.msg.them{ align-self:flex-start; background:rgba(255,43,61,.10); border:1px solid rgba(255,43,61,.3); color:#ffe3e6;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%); }
.msg .who{ font-family:var(--font-mono); font-size:9px; letter-spacing:2px; opacity:.7; display:block; margin-bottom:3px; text-transform:uppercase; }
.typing span{ display:inline-block; width:6px; height:6px; background:var(--accent-2); border-radius:50%; margin:0 2px; animation:blip 1.1s infinite; }
.typing span:nth-child(2){ animation-delay:.16s } .typing span:nth-child(3){ animation-delay:.32s }
@keyframes blip{ 0%,60%,100%{ opacity:.25; transform:translateY(0) } 30%{ opacity:1; transform:translateY(-4px) } }

/* ------------------------------- COMICS --------------------------------- */
.comic-page{ background:#0a0f18; border:1px solid var(--line); padding:10px; display:grid; gap:8px; aspect-ratio:2/3; }
.comic-panel{
  position:relative; background:linear-gradient(140deg,#0d1826,#070d16); border:2px solid rgba(35,224,255,.35);
  overflow:hidden; cursor:grab; display:flex; flex-direction:column; min-height:60px;
}
.comic-panel.dragging{ opacity:.35; }
.comic-panel.dragover{ border-color:var(--accent-3); box-shadow:inset 0 0 26px rgba(255,180,58,.28); }
.comic-panel img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.92; }
.comic-panel .pn{ position:absolute; top:3px; left:5px; font-family:var(--font-mono); font-size:10px; color:var(--accent); z-index:3; text-shadow:0 0 6px #000; }
.comic-panel .pv{ position:relative; z-index:2; padding:16px 8px 8px; font-size:11px; color:#a9c8d8; overflow:hidden; }
.comic-panel .bub{ background:#e9f4fa; color:#101820; border-radius:9px; padding:3px 7px; font-size:10.5px; margin:3px 0; display:inline-block; max-width:100%; font-family:'Inter',sans-serif; }
.comic-panel .sfx{ font-family:var(--font-display); color:var(--accent-3); font-size:14px; text-shadow:0 0 10px rgba(255,180,58,.7); }

/* --------------------------- MOODBOARD CANVAS --------------------------- */
#moodCanvas{ position:relative; height:640px; overflow:hidden; border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 0%,rgba(35,224,255,.06),transparent 60%),
  repeating-linear-gradient(0deg,rgba(35,224,255,.04) 0 1px,transparent 1px 30px),
  repeating-linear-gradient(90deg,rgba(35,224,255,.04) 0 1px,transparent 1px 30px),#04070d; }
.pin{ position:absolute; min-width:110px; max-width:300px; background:rgba(8,16,26,.96); border:1px solid var(--line-hard);
  box-shadow:0 12px 30px rgba(0,0,0,.7); cursor:grab; user-select:none; }
.pin.dragging{ cursor:grabbing; z-index:999 !important; box-shadow:0 20px 50px rgba(0,0,0,.85),var(--glow); }
.pin img{ width:100%; display:block; }
.pin .pin-x{ position:absolute; top:-9px; right:-9px; width:20px; height:20px; background:#12202e; border:1px solid var(--accent-2);
  color:#ff8a95; display:none; place-items:center; font-size:12px; cursor:pointer; z-index:5; }
.pin:hover .pin-x{ display:grid; }
.pin .cap{ padding:6px 8px; font-size:12px; color:var(--txt-dim); }

/* ---------------------------- HEATMAP / GRAPH --------------------------- */
.heat{ display:flex; gap:3px; align-items:stretch; height:110px; }
.heat .col{ flex:1 1 0; min-width:6px; height:100%; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; cursor:pointer; position:relative; }
.heat .col .t{ width:100%; transition:.3s; }
.heat .col:hover .t{ filter:brightness(1.5); }
.heat .lbl{ font-family:var(--font-mono); font-size:8px; color:var(--txt-faint); text-align:center; margin-top:3px; }

/* ------------------------------- MISC ----------------------------------- */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.tab{ padding:7px 15px; background:transparent; border:1px solid transparent; border-bottom:0; color:var(--txt-dim);
  font-family:var(--font-ui); font-weight:700; font-size:13px; letter-spacing:1.1px; cursor:pointer; text-transform:uppercase; }
.tab:hover{ color:#dff6ff; background:rgba(35,224,255,.06); }
.tab.on{ color:var(--accent); border-color:var(--line-hard); background:rgba(35,224,255,.11); box-shadow:inset 0 2px 0 var(--accent); }

.accordion .acc-hd{ display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; cursor:pointer;
  background:rgba(35,224,255,.045); border:1px solid var(--line); color:var(--txt); text-align:left; font-family:var(--font-ui);
  font-weight:700; font-size:15px; letter-spacing:.7px; transition:.15s; }
.accordion .acc-hd:hover{ background:rgba(35,224,255,.1); border-color:rgba(35,224,255,.35); }
.accordion .acc-bd{ display:none; padding:16px 18px; border:1px solid var(--line); border-top:0; background:rgba(3,7,13,.6); }
.accordion .acc-item.open .acc-bd{ display:block; animation:fade .2s; }
.accordion .acc-item.open .acc-hd{ color:var(--accent); border-color:rgba(35,224,255,.4); }
.prose-c{ color:#b7d3e2; font-size:14.5px; line-height:1.75; }
.prose-c h5{ font-family:var(--font-display); font-size:12.5px; letter-spacing:1.8px; color:var(--accent); margin:1.2em 0 .45em; text-transform:uppercase; }
.prose-c p{ margin:0 0 .85em; }
.prose-c ul{ margin:0 0 .9em; padding-left:1.3em; list-style:disc; }
.prose-c ol{ margin:0 0 .9em; padding-left:1.45em; list-style:decimal; }
.prose-c li{ margin-bottom:.35em; }
.prose-c a{ color:var(--accent); text-decoration:underline; }
.prose-c strong{ color:#eafcff; } .prose-c em{ color:var(--accent-3); font-style:normal; }
.prose-c code{ font-family:var(--font-mono); background:rgba(35,224,255,.1); padding:1px 5px; color:var(--accent); font-size:.9em; }

.savepill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; letter-spacing:1.6px;
  color:var(--txt-faint); text-transform:uppercase; }
.savepill .dot{ width:7px; height:7px; border-radius:50%; background:#8dff4f; box-shadow:0 0 9px #8dff4f; }
.savepill.saving .dot{ background:var(--accent-3); box-shadow:0 0 9px var(--accent-3); animation:blink .7s infinite; }
.savepill.dirty .dot{ background:var(--accent-2); box-shadow:0 0 9px var(--accent-2); }
@keyframes blink{ 50%{ opacity:.25 } }

.wcount{ font-family:var(--font-mono); font-size:10.5px; color:var(--txt-faint); letter-spacing:1.4px; }
.wcount b{ color:var(--accent); font-weight:400; }

.sortrow{ transition:.14s; }
.sortrow.dragging{ opacity:.35; }
.sortrow.dragover{ box-shadow:inset 0 3px 0 var(--accent-3); }

.cover-preview{ aspect-ratio:2/3; background:#0a0f18; border:1px solid var(--line); position:relative; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,.7); }
.cover-preview img.art{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cover-preview .cvr-scrim{ position:absolute; inset:0; }
.cover-preview .cvr-txt{ position:relative; z-index:3; padding:22px; height:100%; display:flex; flex-direction:column; }
.trimguide{ position:absolute; inset:14px; border:1px dashed rgba(255,43,61,.55); z-index:6; pointer-events:none; }
.trimguide::after{ content:'TRIM / SAFE ZONE'; position:absolute; top:-16px; left:0; font-family:var(--font-mono); font-size:8px; color:rgba(255,43,61,.85); letter-spacing:1.5px; }
.barcode{ background:#fff; padding:5px 7px 3px; display:inline-block; }
.barcode .bars{ height:32px; width:104px; background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 3px,#000 3px 4px,#fff 4px 7px,#000 7px 9px,#fff 9px 11px); }
.barcode .num{ font-family:var(--font-mono); font-size:7px; color:#000; text-align:center; letter-spacing:1px; }

.wizard-step{ display:none; } .wizard-step.on{ display:block; animation:fade .22s; }
.step-dots{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.step-dot{ width:26px; height:26px; display:grid; place-items:center; border:1px solid var(--line); color:var(--txt-faint);
  font-family:var(--font-mono); font-size:11px; cursor:pointer; transition:.15s; }
.step-dot.on{ border-color:var(--accent); color:var(--accent); background:rgba(35,224,255,.15); box-shadow:0 0 14px rgba(35,224,255,.3); }
.step-dot.done{ border-color:rgba(141,255,79,.5); color:#8dff4f; }

.optcard{ cursor:pointer; transition:.16s; border:1px solid var(--line); background:rgba(8,15,25,.7); padding:13px; }
.optcard:hover{ border-color:var(--accent); background:rgba(35,224,255,.08); transform:translateY(-2px); }
.optcard.sel{ border-color:var(--accent); background:rgba(35,224,255,.13); box-shadow:0 0 22px rgba(35,224,255,.2); }
.optcard.tone1{ border-left:3px solid var(--accent); }
.optcard.tone2{ border-left:3px solid var(--accent-2); }
.optcard.tone3{ border-left:3px solid var(--accent-3); }

.kbd{ font-family:var(--font-mono); font-size:10px; padding:1px 5px; border:1px solid var(--line); color:var(--txt-dim); background:rgba(35,224,255,.06); }

.mobile-only{ display:none; }
@media(max-width:1024px){
  :root{ --rail-w:250px; }
  .rail{ position:fixed; top:var(--brand-h); bottom:0; left:0; transform:translateX(-102%); transition:transform .22s ease; z-index:500; }
  .rail.open{ transform:none; box-shadow:24px 0 60px rgba(0,0,0,.8); }
  .mobile-only{ display:inline-flex; }
  .view-pad{ padding:14px 13px 80px; }
  .rail-backdrop{ position:fixed; inset:0; background:rgba(2,4,8,.7); z-index:450; }
}
@media(max-width:640px){
  .brand-title{ font-size:14px; letter-spacing:2px; }
  .modal-bd{ max-height:74vh; }
  .rte{ padding:16px 15px; font-size:15.5px; }
}

@media print{
  body::before,body::after{ display:none; }
  .rail,.brandbar,.banner,.no-print{ display:none !important; }
  body,#app{ height:auto; overflow:visible; background:#fff; color:#000; }
  .main-scroll{ overflow:visible; }
}

/* Font family helper classes for the Title/Cover studios */
.ff-serif{ font-family:'Playfair Display',Georgia,serif; }
.ff-sans{ font-family:'Inter',system-ui,sans-serif; }
.ff-scifi{ font-family:'Orbitron',sans-serif; }
.ff-script{ font-family:'Dancing Script',cursive; }
.ff-type{ font-family:'Special Elite',monospace; }
.ff-gothic{ font-family:'Cinzel',serif; }
.ff-mono{ font-family:'Share Tech Mono',monospace; }
.ff-ui{ font-family:'Rajdhani',sans-serif; }

.glow-cy{ text-shadow:0 0 14px rgba(35,224,255,.7); }
.glow-rd{ text-shadow:0 0 14px rgba(255,43,61,.75); }
.hidden{ display:none !important; }
.flex{ display:flex; } .between{ justify-content:space-between; } .center{ align-items:center; }
.wrap{ flex-wrap:wrap; } .gap4{ gap:4px } .gap6{ gap:6px } .gap8{ gap:8px } .gap10{ gap:10px } .gap14{ gap:14px }
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mb6{margin-bottom:6px}.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}
.muted{ color:var(--txt-dim); } .faint{ color:var(--txt-faint); } .mono{ font-family:var(--font-mono); }
.t-cy{ color:var(--accent) } .t-rd{ color:#ff8a95 } .t-am{ color:var(--accent-3) } .t-lm{ color:#8dff4f } .t-vi{ color:#c39bff }
.fs10{font-size:10px}.fs11{font-size:11px}.fs12{font-size:12px}.fs13{font-size:13px}.fs16{font-size:16px}.fs18{font-size:18px}
.w100{width:100%} .rel{position:relative} .ovh{overflow:hidden}
</style>

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function attr(s) { return esc(s); }
function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }

function stripHTML(html) {
  const d = document.createElement('div');
  d.innerHTML = String(html || '');
  d.querySelectorAll('script,style').forEach(n => n.remove());
  return (d.textContent || '').replace(/ /g, ' ');
}
function countWords(text) {
  const t = String(text || '').trim();
  if (!t) return 0;
  return (t.match(/[A-Za-z0-9À-ɏ'’\-]+/g) || []).length;
}
function wordsOfHTML(html) { return countWords(stripHTML(html)); }
function readTime(words) {
  const m = words / 235;
  if (m < 1) return '<1 min';
  if (m < 60) return Math.round(m) + ' min';
  const h = Math.floor(m / 60), r = Math.round(m % 60);
  return h + 'h ' + r + 'm';
}
function fmt(n) { return (n || 0).toLocaleString('en-US'); }
function bytesHuman(b) {
  if (!b) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB'], i = Math.min(u.length - 1, Math.floor(Math.log(b) / Math.log(1024)));
  return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + u[i];
}
function timeAgo(iso) {
  if (!iso) return '—';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 2592000) return Math.floor(s / 86400) + 'd ago';
  return new Date(iso).toLocaleDateString();
}
function dstamp() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function slug(s) { return String(s || 'untitled').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'untitled'; }

function shuffle(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
function debounce(fn, ms) { let t; return function () { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms || 220); }; }

function getPath(o, p) {
  if (!p) return o;
  return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
}
function setPath(o, p, v) {
  const ks = p.split('.'); const last = ks.pop();

}

/* ------------------------------ file input ------------------------------ */
function readFileAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}
/** Opens the OS file picker and resolves with a data-URL (or null). */
function pickFile(accept) {
  return new Promise((resolve) => {
    const inp = $('#ghostFile');
    inp.value = '';
    inp.accept = accept || 'image/*';
    const done = async (e) => {
      inp.removeEventListener('change', done);
      const f = e.target.files && e.target.files[0];
      if (!f) return resolve(null);
      if (f.size > 14 * 1024 * 1024) { toast('File exceeds 14 MB — pick a smaller asset or use a URL.', 'warn', 'ASSET TOO LARGE'); return resolve(null); }
      try { resolve({ data: await readFileAsDataURL(f), name: f.name, type: f.type, size: f.size }); }
      catch (err) { toast('Could not read that file.', 'err'); resolve(null); }
    };
    inp.addEventListener('change', done);
    inp.click();
  });
}
function downloadBlob(filename, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied to clipboard.', 'ok'); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard.', 'ok'); } catch (_) { toast('Clipboard blocked by the browser.', 'err'); }
    ta.remove(); return true;
  }
}

/* -------------------------------- toasts -------------------------------- */
let toastSeq = 0;
function toast(msg, type, title) {
  const host = $('#toasts'); if (!host) return;
  const id = 'tst' + (++toastSeq);
  const t = type || 'info';
  const heads = { info: 'SYSTEM', ok: 'CONFIRMED', err: 'FAULT', warn: 'ADVISORY' };
  const el = document.createElement('div');
  el.className = 'toast ' + (t === 'info' ? '' : t);
  el.id = id;
  el.innerHTML = '<div style="flex:1"><b>' + esc(title || heads[t] || 'SYSTEM') + '</b>' + esc(msg) + '</div>';
  host.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s,transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateX(24px)'; setTimeout(() => el.remove(), 320); }, t === 'err' ? 6200 : 3600);
}

/* -------------------------------- modals -------------------------------- */
const ModalStack = [];
function openModal(opts) {
  const o = Object.assign({ title: 'PANEL', body: '', footer: '', size: '', onMount: null, onClose: null, closeOnScrim: true }, opts || {});
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim';
  scrim.innerHTML =
    '<div class="modal ' + o.size + '" role="dialog" aria-modal="true">' +
      '<div class="modal-hd"><i data-lucide="' + attr(o.icon || 'square-pen') + '" style="width:16px;height:16px;color:var(--accent-2)"></i>' +
        '<h3>' + esc(o.title) + '</h3>' +
        '<button class="xclose" data-modal-close>✕</button></div>' +
      '<div class="modal-bd">' + o.body + '</div>' +
      (o.footer !== null ? '<div class="modal-ft">' + (o.footer || '<button class="btn ghost" data-modal-close>CLOSE</button>') + '</div>' : '') +
    '</div>';
  $('#modals').appendChild(scrim);
  ModalStack.push({ el: scrim, onClose: o.onClose });
  scrim.addEventListener('mousedown', (e) => { if (e.target === scrim && o.closeOnScrim) closeModal(); });
  scrim.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', () => closeModal()));
  icons();
  if (o.onMount) { try { o.onMount(scrim); } catch (e) { console.error(e); } }
  const f = scrim.querySelector('input,textarea,select'); if (f && !o.noFocus) setTimeout(() => f.focus(), 60);
  return scrim;
}
function closeModal() {
  const m = ModalStack.pop(); if (!m) return;
  if (m.onClose) { try { m.onClose(); } catch (e) { } }
  m.el.style.animation = 'fade .12s reverse';
  setTimeout(() => m.el.remove(), 110);
}
function closeAllModals() { while (ModalStack.length) closeModal(); }

function confirmDlg(title, msg, danger) {
  return new Promise((resolve) => {
    let done = false;
    openModal({
      title: title, size: 'narrow', icon: 'alert-triangle', closeOnScrim: false,
      body: '<div class="prose-c">' + msg + '</div>',
      footer: '<button class="btn ghost" data-cancel>CANCEL</button><button class="btn ' + (danger ? 'solid red' : 'solid') + '" data-ok>CONFIRM</button>',
      onMount: (r) => {
        r.querySelector('[data-ok]').addEventListener('click', () => { done = true; closeModal(); resolve(true); });
        r.querySelector('[data-cancel]').addEventListener('click', () => { closeModal(); });
      },
      onClose: () => { if (!done) resolve(false); }
    });
  });
}
function promptDlg(title, label, value, multiline) {
  return new Promise((resolve) => {
    let done = false;
    const field = multiline
      ? '<textarea class="ta" data-f rows="6">' + esc(value || '') + '</textarea>'
      : '<input class="inp" data-f value="' + attr(value || '') + '" />';
    openModal({
      title: title, size: 'narrow', icon: 'pencil-line', closeOnScrim: false,
      body: '<label class="fld"><span class="lb">' + esc(label) + '</span>' + field + '</label>',
      footer: '<button class="btn ghost" data-cancel>CANCEL</button><button class="btn solid" data-ok>APPLY</button>',
      onMount: (r) => {
        const f = r.querySelector('[data-f]');
        const ok = () => { done = true; const v = f.value; closeModal(); resolve(v); };
        r.querySelector('[data-ok]').addEventListener('click', ok);
        r.querySelector('[data-cancel]').addEventListener('click', () => closeModal());
        if (!multiline) f.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ok(); } });
      },
      onClose: () => { if (!done) resolve(null); }
    });
  });
}

/* ============================== PERSISTENCE ============================== */
const DB_NAME = 'ravenbane-architect';
const DB_STORE = 'vault';
const LS_KEY = 'ravenbane.architect.state.v1';
let _idb = null, ENGINE = 'localStorage';

function idbOpen() {
  return new Promise((resolve) => {
    if (!('indexedDB' in window)) return resolve(null);
    let req;
    try { req = indexedDB.open(DB_NAME, 1); } catch (e) { return resolve(null); }
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
    req.onblocked = () => resolve(null);
    setTimeout(() => resolve(req.result || null), 2500);
  });
}
function idbPut(key, val) {
  return new Promise((resolve, reject) => {
    if (!_idb) return reject(new Error('no idb'));
    const tx = _idb.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
}
function idbGet(key) {
  return new Promise((resolve, reject) => {
    if (!_idb) return reject(new Error('no idb'));
    const tx = _idb.transaction(DB_STORE, 'readonly');
    const rq = tx.objectStore(DB_STORE).get(key);
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}

async function storageInit() {
  _idb = await idbOpen();
  ENGINE = _idb ? 'IndexedDB' : 'localStorage';
  const el = $('#railEngine'); if (el) el.textContent = _idb ? 'IDB' : 'LS';
}
async function storageLoad() {
  try {
    if (_idb) { const v = await idbGet('state'); if (v) return typeof v === 'string' ? JSON.parse(v) : v; }
  } catch (e) { console.warn('IDB read failed', e); }
  try { const s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch (e) { console.warn('LS read failed', e); }
  return null;
}
async function storageSave(obj) {
  let ok = false;
  try { if (_idb) { await idbPut('state', obj); ok = true; } } catch (e) { console.warn('IDB write failed', e); }
  try {
    const s = JSON.stringify(obj);
    if (s.length < 4.4 * 1024 * 1024) { localStorage.setItem(LS_KEY, s); ok = true; }
    else if (!ok) throw new Error('payload too large for localStorage');
    else localStorage.setItem(LS_KEY + '.meta', JSON.stringify({ note: 'payload stored in IndexedDB', at: nowISO(), bytes: s.length }));
  } catch (e) {
    if (!ok) { console.error(e); throw e; }
  }
  return ok;
}
async function storageUsage() {
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      return { used: e.usage || 0, quota: e.quota || 0 };
    }
  } catch (e) { }
  try { const s = localStorage.getItem(LS_KEY) || ''; return { used: s.length, quota: 5 * 1024 * 1024 }; } catch (e) { }
  return { used: 0, quota: 0 };
}

let state = defaultState();
let DIRTY = false, SAVING = false, lastSaved = null;

function currentBook() {
  if (!state.books.length) return null;
  return state.books.find(b => b.id === state.ui.bookId) || state.books[0];
}
function requireBook() {
  const b = currentBook();
  if (!b) return null;
  if (state.ui.bookId !== b.id) state.ui.bookId = b.id;
  return b;
}
function findChapter(id) { const b = currentBook(); return b ? b.chapters.find(c => c.id === id) : null; }
function findChar(id) { const b = currentBook(); return b ? b.characters.find(c => c.id === id) : null; }

function logActivity(kind, text) {
  const b = currentBook(); if (!b) return;
  b.activity = b.activity || [];
  const last = b.activity[0];
  if (last && last.kind === kind && last.text === text && (Date.now() - new Date(last.at).getTime()) < 90000) { last.at = nowISO(); return; }
  b.activity.unshift({ id: uid('ac'), kind: kind, text: text, at: nowISO() });
  if (b.activity.length > 90) b.activity.length = 90;
}

/* ------------------------------- autosave ------------------------------- */
function markDirty(silent) {
  DIRTY = true;
  const b = currentBook(); if (b) b.updated = nowISO();
  if (!silent) paintSavePill('dirty');
}
function paintSavePill(mode) {
  const p = $('#savePill'), t = $('#savePillTxt'); if (!p) return;
  p.classList.remove('saving', 'dirty');
  if (mode === 'saving') { p.classList.add('saving'); t.textContent = 'WRITING…'; }
  else if (mode === 'dirty') { p.classList.add('dirty'); t.textContent = 'UNSAVED'; }
  else if (mode === 'error') { p.classList.add('dirty'); t.textContent = 'SAVE FAULT'; }
  else { t.textContent = lastSaved ? 'SYNCED ' + new Date(lastSaved).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'SYNCED'; }
}
async function saveNow(force) {
  if (SAVING) return false;
  if (!DIRTY && !force) return false;
  SAVING = true; paintSavePill('saving');
  try {
    await storageSave(state);
    DIRTY = false; lastSaved = Date.now();
    paintSavePill('idle');
    refreshStorageMeter();
    return true;
  } catch (e) {
    console.error('SAVE FAILED', e);
    paintSavePill('error');
    toast('Storage write failed — your browser may be out of quota. Export a JSON backup now.', 'err', 'SAVE FAULT');
    return false;
  } finally { SAVING = false; }
}
let autosaveTimer = null;
function startAutosave() {
  if (autosaveTimer) clearInterval(autosaveTimer);
  const sec = clamp(Number(state.app.autosaveSec) || 5, 2, 120);
  autosaveTimer = setInterval(() => { if (DIRTY) saveNow(); }, sec * 1000);
}
async function refreshStorageMeter() {
  const u = await storageUsage();
  const el = $('#railStore'), bar = $('#railStoreBar');
  if (!el) return;
  el.textContent = 'STORAGE ' + bytesHuman(u.used);
  if (bar) bar.style.width = clamp(u.quota ? (u.used / u.quota) * 100 : 2, 1.5, 100) + '%';
}

/* ======================= GLOBAL EVENT DELEGATION ========================= */
const ACTIONS = Object.create(null);
const ROOTS = Object.create(null);
ROOTS.app = () => state.app;
ROOTS.ui = () => state.ui;
ROOTS.book = () => currentBook() || {};
ROOTS.ai = () => state.app.ai;
ROOTS.state = () => state;

function resolveRoot(el) {
  const host = el.closest('[data-root]');
  if (!host) return state;
  const spec = host.getAttribute('data-root');
  const ix = spec.indexOf(':');
  const key = ix === -1 ? spec : spec.slice(0, ix);
  const arg = ix === -1 ? undefined : spec.slice(ix + 1);
  const f = ROOTS[key];
  let obj = f ? f(arg) : state;
  const sub = host.getAttribute('data-sub');
  if (sub && obj) obj = getPath(obj, sub);
  return obj || {};
}
function fieldValue(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'number' || el.type === 'range') { const n = Number(el.value); return isNaN(n) ? 0 : n; }
  return el.value;
}
const rerenderSoon = debounce(() => render(), 260);

document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-model]');
  if (!el) return;
  const root = resolveRoot(el);
  setPath(root, el.getAttribute('data-model'), fieldValue(el));
  markDirty();
  const live = el.getAttribute('data-live');
  if (live && ACTIONS[live]) { try { ACTIONS[live](el, e); } catch (err) { console.error(err); } }
  if (el.hasAttribute('data-rerender')) rerenderSoon();
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-model]');
  if (!el) return;
  if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'color') {
    const root = resolveRoot(el);
    setPath(root, el.getAttribute('data-model'), fieldValue(el));
    markDirty();
    const live = el.getAttribute('data-live');
    if (live && ACTIONS[live]) { try { ACTIONS[live](el, e); } catch (err) { console.error(err); } }
    if (el.hasAttribute('data-rerender')) rerenderSoon();
  }
});
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-go]');
  if (nav) { e.preventDefault(); go(nav.getAttribute('data-go'), nav.getAttribute('data-arg') || ''); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.getAttribute('data-act')];
  if (!fn) { console.warn('No action:', el.getAttribute('data-act')); return; }
  e.preventDefault();
  try { fn(el, e); } catch (err) { console.error(err); toast(String(err && err.message || err), 'err', 'ACTION FAULT'); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ModalStack.length) { e.preventDefault(); closeModal(); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(true).then(ok => { if (ok) toast('Project written to ' + ENGINE + '.', 'ok', 'SAVED'); }); }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); ACTIONS.globalSearch && ACTIONS.globalSearch(); }
});
window.addEventListener('beforeunload', (e) => {
  if (DIRTY) { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (_) { } }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && DIRTY) saveNow(); });

/* ================================ ROUTER ================================= */
const VIEWS = Object.create(null);   // populated by the feature modules
let CURRENT_VIEW = 'dashboard';

function go(view, arg) {
  if (!VIEWS[view]) { toast('Unknown module: ' + view, 'warn'); return; }
  CURRENT_VIEW = view;
  state.ui.view = view;
  if (arg) state.ui.viewArg = arg; else state.ui.viewArg = '';
  markDirty(true);
  $('#rail') && $('#rail').classList.remove('open');
  $('.rail-backdrop') && $('.rail-backdrop').remove();
  render();
  const ms = $('#mainScroll'); if (ms) ms.scrollTop = 0;
  try { history.replaceState(null, '', '#' + view + (arg ? '/' + arg : '')); } catch (_) { }
}

function render() {
  const v = VIEWS[CURRENT_VIEW] || VIEWS.dashboard;
  const host = $('#view');
  renderBanner();
  try {
    host.innerHTML = v.render ? v.render() : '';
  } catch (err) {
    console.error(err);
    host.innerHTML = '<div class="panel clip"><div class="panel-bd"><h3 class="t-rd">MODULE FAULT</h3><pre class="mono fs12" style="white-space:pre-wrap;color:#ff8a95">' + esc(String(err && err.stack || err)) + '</pre></div></div>';
  }
  renderRail();
  icons();
  if (v.mount) { try { v.mount(); } catch (err) { console.error(err); } }
}

  {
    id: 'mc-prologue', title: 'How to Hook Readers in a Prologue', icon: 'flame', minutes: 9,
    body: `<h5>The only job of a prologue</h5>
<p>A prologue exists for exactly one reason: to create a <strong>question the reader must carry</strong> into chapter one. If it delivers history, geography, or a lecture, it is not a prologue — it is an appendix that wandered to the front.</p>
<h5>The four legitimate prologue types</h5>
<ul>
<li><strong>The Distant Detonation</strong> — an event years or centuries before the main story whose consequence is still travelling toward your protagonist. <em>Why it works:</em> the reader now reads chapter one looking for the impact crater.</li>
<li><strong>The Doomed Witness</strong> — a POV who will not survive, showing the threat in its full form so that chapter one's mundanity feels loaded. <em>Rule:</em> make the witness specific and likeable in under 800 words or the death is furniture.</li>
<li><strong>The Frame Voice</strong> — a narrator from outside the timeline (archivist, older self, court record) who tells you the ending is already fixed. <em>Rule:</em> the frame must return at the end, or cut it.</li>
<li><strong>The Rule Statement</strong> — the world declares its one non-negotiable law, dramatised as a scene. Never as exposition.</li>
</ul>
<h5>Mechanics that earn page two</h5>
<ul>
<li><strong>Open in motion, close on a question.</strong> First sentence: a body in space doing something. Last sentence: a hole the reader needs filled.</li>
<li><strong>Keep it under 1,500 words.</strong> Most published prologues run 600–1,200. Length signals confidence; over 2,500 signals you needed a chapter one.</li>
<li><strong>One concrete strangeness per paragraph.</strong> Not three. Readers can hold one anomaly at a time and will trust you to explain later.</li>
<li><strong>Withhold the proper noun.</strong> "The thing in the reservoir" beats "the Vashaal Devourer" every single time on page one.</li>
</ul>
<h5>The diagnostic test</h5>
<p>Delete the prologue. Read chapter one cold. If nothing is lost — <em>nothing at all</em> — the prologue was scaffolding. If chapter one now feels flat, safe, or unmotivated, the prologue was doing structural work. Keep it.</p>
<h5>Drill</h5>
<p>Write your prologue's final line first. One sentence, ending on the most concrete noun available. Then write backwards from it for 700 words.</p>`

    body: `<h5>Chapters are promises, not containers</h5>
<p>A chapter break is the reader's natural exit. Your job is to make the exit inconvenient. That is not achieved by cutting mid-sentence — it is achieved by <strong>opening a loop one line before you close the chapter</strong>.</p>
<h5>Seven chapter-out patterns that work</h5>
<ul>
<li><strong>The Decision Made</strong> — the character commits to something costly. We close before we see the cost. ("So I said yes.")</li>
<li><strong>The Arrival</strong> — someone enters who should not be able to.</li>
<li><strong>The Revealed Object</strong> — the drawer opens; we name what is inside and stop.</li>
<li><strong>The Reframe</strong> — a line of dialogue that makes the last ten pages mean something else.</li>
<li><strong>The Countdown Tick</strong> — time visibly contracts: "Nine hours."</li>
<li><strong>The Withheld Reaction</strong> — a devastating line lands; we cut before the response.</li>
<li><strong>The Quiet Dread</strong> — an ordinary detail rendered wrong. Use sparingly; it is the strongest and the easiest to overuse.</li>
</ul>
<h5>Pacing as a waveform</h5>
<p>Tension should not climb in a straight line — a monotone climb numbs. Design in a repeating 4-beat wave: <em>pressure → release → deeper pressure → smaller release</em>. Each release should be shorter than the last, so the reader's breathing room narrows as the book progresses.</p>
<ul>
<li><strong>Scene length is a pacing tool.</strong> Action chapters: 1,200–2,000 words. Revelation chapters: 800–1,400. Aftermath/interiority: never two in a row.</li>
<li><strong>Sentence length mirrors heart rate.</strong> Under stress: 4–9 words. In grief: long, subordinate, refusing to end.</li>
<li><strong>Never resolve two loops in one chapter.</strong> Spend them.</li>
</ul>
<h5>The audit</h5>
<p>List every chapter's last line in one document. If you can read the list top to bottom without wanting to know what happens between any two entries, your chapter-outs are decorative. Use the <em>Pacing &amp; Tension Heatmap</em> on the Dashboard: three consecutive chapters at the same tension value is a flat spot — cut, merge, or escalate.</p>`

<h5>The conversion ladder</h5>

</ol>
<h5>Filter words that convert showing back into telling</h5>
<p>Hunt these: <code>felt</code>, <code>saw</code>, <code>heard</code>, <code>noticed</code>, <code>realised</code>, <code>watched</code>, <code>seemed</code>, <code>could see</code>, <code>began to</code>. "She heard the door open" is a camera reporting. "The door opened" puts the reader in the room.</p>
<h5>Concrete over abstract, always</h5>
<p>Abstractions cost the reader nothing and give nothing back. Replace <em>poverty</em> with <em>a fridge holding ketchup and half a birthday cake</em>. Replace <em>they were in love</em> with <em>he had learned to make her tea the wrong way, because she liked it wrong.</em></p>
<h5>Where telling is correct</h5>
<ul>
<li>Bridging time: <em>The trial took three weeks.</em></li>
<li>Deliberately flattening trauma the POV refuses to inhabit.</li>
<li>Voice-driven narration where the teller's judgement <em>is</em> the entertainment.</li>
</ul>
<h5>Drill</h5>
<p>Take one paragraph of your draft. Delete every emotion word. Rewrite using only: what a body does, what the space contains, and what time is doing. Then use the <em>Atmosphere &amp; Sensory Enhancer</em> in the Co-Pilot to pressure-test which sense you habitually neglect — for most writers it is smell and proprioception.</p>`
  },
  {
    id: 'mc-pov', title: 'Structuring Multi-POV Stories', icon: 'users', minutes: 12,
    body: `<h5>Earn every head you enter</h5>
<p>A POV is not a camera position — it is a <strong>contract of consciousness</strong>. Each one must have its own want, its own information gap, and its own voice signature. If two POVs know the same things and want the same thing, delete one and give its scenes to the other.</p>
<h5>The four-question POV audit</h5>
<ol>
<li><strong>What does only this POV know?</strong> (If nothing — cut it.)</li>
<li><strong>What does this POV wrongly believe?</strong> (Dramatic irony lives here.)</li>
<li><strong>What does this POV want that conflicts with another POV's want?</strong></li>
<li><strong>How does their narration sound different?</strong> Diction, sentence length, what they notice first on entering a room.</li>
</ol>
<h5>Rotation architectures</h5>
<ul>
<li><strong>Strict alternation (A/B/A/B)</strong> — best for two-hander romance and duel narratives. Predictable rhythm becomes a comfort; violate it once, late, for maximum effect.</li>
<li><strong>Weighted primary (A A B A C A)</strong> — one lead owns ~60% of the book; others illuminate. Safest structure for a large cast.</li>
<li><strong>Braided ensemble</strong> — three or more equal strands converging on a shared crisis. Requires a hard convergence deadline or the reader loses the thread.</li>
<li><strong>Nested frame</strong> — a present-day POV excavating a historical one. Rule: the frame must change too.</li>
</ul>
<h5>Cast tiers and page-time</h5>
<p>Use the Character Matrix tiers deliberately. <em>Primary Leads</em> get POV. <em>Co-Leads</em> get POV only if their arc pays off independently. <em>Supporting Cast</em> almost never get POV — their mystery is an asset. Giving a Minor character a single POV chapter is a strong tool used exactly once per book, usually to deliver information no principal can survive learning.</p>
<h5>Handoff craft</h5>
<ul>
<li>End a POV chapter on an unanswered question; open the next POV on an image that rhymes with it. The reader tolerates the switch when the emotional key matches.</li>
<li><strong>Never</strong> switch POV to escape a scene you don't know how to write.</li>
<li>Head-hopping within a scene is not multi-POV, it is a mistake — unless your narrator is explicitly omniscient and consistent about it from page one.</li>
<li>Label chapters with the POV name only if voices are not yet distinct enough to be recognised in two sentences. Then fix the voices and remove the labels.</li>
</ul>
<h5>Convergence discipline</h5>
<p>Every strand must be affected by the climax. A POV that merely watches the ending was a subplot with delusions. Map it in the Relationship Network: if a character has no edge to the climax, they have no place in act three.</p>`
  },
  {
    id: 'mc-dialogue', title: 'Dialogue That Carries Subtext', icon: 'message-square', minutes: 8,
    body: `<h5>People do not say what they want</h5>
<p>On-the-nose dialogue is two characters exchanging accurate information. Real dialogue is two people <strong>negotiating</strong> while pretending to discuss something else. Write the argument they are actually having, then bury it under the argument they are willing to have.</p>
<h5>Tools</h5>
<ul>
<li><strong>Deflection</strong> — answer a different question than the one asked.</li>
<li><strong>Specificity as weapon</strong> — "You were at the Kessler place until four." Details prove surveillance, and surveillance is a threat.</li>
<li><strong>Interruption asymmetry</strong> — whoever interrupts holds power; flip it at the turn of the scene.</li>
<li><strong>Silence with business</strong> — let a character do something with their hands instead of replying.</li>
<li><strong>Repetition with a shift</strong> — the second time a phrase returns, it should mean something worse.</li>
</ul>
<h5>Mechanics</h5>
<ul>
<li>Use <code>said</code>. Exotic tags ("he opined") pull the reader out. Action beats replace adverbs.</li>
<li>Give each character one syntactic fingerprint: contractions or none, questions or declaratives, jargon domain, curse register.</li>
<li>Trim greetings, farewells, and logistics. Enter the scene one beat after it starts.</li>
<li>Read aloud. If you cannot say it in one breath, the character cannot either.</li>
</ul>
<h5>Drill</h5>
<p>Take a scene into the <em>AI Character Dialogue Sandbox</em> and interrogate your character about something they intend to hide. The moment they answer too helpfully, their profile lacks a defined fear. Go back to the dossier and give them one.</p>`
  },
  {
    id: 'mc-revise', title: 'The Revision Pass Sequence', icon: 'refresh-cw', minutes: 10,
    body: `<h5>Never revise everything at once</h5>
<p>Layered passes beat holistic tinkering. Each pass has one question and you ignore all other problems while making it.</p>
<ol>
<li><strong>Structural pass</strong> — Does every scene change the situation? Mark each scene: value at start → value at end. Any scene with no change is cut or merged. Do not fix a single sentence in this pass.</li>
<li><strong>Causality pass</strong> — Replace every "and then" with "therefore" or "but". Coincidence audit: any event that solves a problem without a character choosing it is a debt.</li>
<li><strong>Character pass</strong> — one character at a time, front to back. Consistency of want, escalation of cost, voice drift.</li>
<li><strong>Tension pass</strong> — the heatmap. Flat runs get cut or escalated. Two consecutive quiet chapters become one.</li>
<li><strong>Line pass</strong> — filter words, repetitions, clichés, rhythm. This is where the Cliché &amp; Repetition Scanner earns its keep.</li>
<li><strong>Read-aloud pass</strong> — the only reliable detector of false dialogue and accidental comedy.</li>
<li><strong>Continuity pass</strong> — names, eye colour, day of the week, phases of the moon, who knows what and when.</li>
</ol>
<h5>The 10% cut</h5>
<p>Whatever your draft length, cut 10% without removing scenes. It is almost always achievable in filter words, redundant beats, and dialogue runway — and it almost always improves pace.</p>`
  }
];

/* -------------------------------- BANNER -------------------------------- */
function activeBanner() {
  const b = currentBook();
  if (state.app.perViewBanners && b && b.banners && b.banners[CURRENT_VIEW]) return { data: b.banners[CURRENT_VIEW], scope: 'view' };
  if (b && b.banners && b.banners.__book) return { data: b.banners.__book, scope: 'book' };
  return { data: state.app.globalBanner, scope: 'global' };
}
function renderBanner() {
  const host = $('#bannerHost');
  const { data: bn, scope } = activeBanner();
  const meta = VIEW_META[CURRENT_VIEW] || { t: 'ARCHITECT', e: '', d: '' };
  const book = currentBook();
  const hCls = bn.height === 'off' ? 'banner-h-off' : 'banner-h-' + (bn.height || 'medium');
  if (bn.height === 'off') {
    host.innerHTML = '<div class="banner banner-h-off" style="height:34px;display:flex;align-items:center;justify-content:flex-end;padding:0 10px">' +
      '<button class="btn ghost xs" data-act="bannerEdit"><i data-lucide="image"></i>BANNER</button></div>';
    icons(); return;
  }
  let media = '<div class="banner-fallback"></div>';
  if (bn.src && bn.type === 'video') {
    media = '<video class="banner-media" src="' + attr(bn.src) + '" autoplay muted loop playsinline style="object-position:50% ' + (bn.offset || 50) + '%;opacity:' + ((bn.opacity == null ? 100 : bn.opacity) / 100) + '"></video>';
  } else if (bn.src) {
    media = '<img class="banner-media" src="' + attr(bn.src) + '" alt="" style="object-position:50% ' + (bn.offset || 50) + '%;opacity:' + ((bn.opacity == null ? 100 : bn.opacity) / 100) + '" onerror="this.style.display=\'none\'" />';
  }
  const title = bn.title || (book && CURRENT_VIEW !== 'library' && CURRENT_VIEW !== 'settings' && CURRENT_VIEW !== 'exportv' ? book.title + ' — ' + meta.t : meta.t);
  const desc = bn.desc || meta.d;
  host.innerHTML =
    '<div class="banner ' + hCls + '">' + media +
      '<div class="banner-scrim" style="opacity:' + ((bn.tint == null ? 60 : bn.tint) / 100) + '"></div>' +
      '<div class="banner-tools">' +
        '<button class="btn ghost xs" data-act="bannerCycleHeight" title="Cycle banner height">' + esc((bn.height || 'medium').toUpperCase()) + '</button>' +
        '<button class="btn ghost xs" data-act="bannerEdit" title="Customise banner"><i data-lucide="sliders-horizontal"></i>BANNER</button>' +
      '</div>' +
      '<div class="banner-inner">' +
        '<div class="banner-eyebrow">' + esc(meta.e) + (scope !== 'global' ? ' · ' + scope.toUpperCase() + ' BANNER' : '') + '</div>' +
        '<h1 class="banner-title">' + esc(title) + '</h1>' +
        (desc ? '<div class="banner-desc">' + esc(desc) + '</div>' : '') +
      '</div>' +
    '</div>';
  icons();
}
ACTIONS.bannerCycleHeight = function () {
  const order = ['compact', 'medium', 'hero', 'off'];
  const { data } = activeBanner();
  data.height = order[(order.indexOf(data.height || 'medium') + 1) % order.length];
  markDirty(); renderBanner();
};

    footer: '<label class="flex center gap6 fs12 muted" style="margin-right:auto"><input type="checkbox" id="bnPerView"' + (state.app.perViewBanners ? ' checked' : '') + '> Enable per-page banner overrides</label>' +

    onMount: (r) => {
      const sync = () => {
        const d = window.__bannerDraft;
        d.type = $('#bnType', r).value;
        d.height = $('#bnHeight', r).value;
        d.offset = Number($('#bnOffset', r).value);
        d.opacity = Number($('#bnOpacity', r).value);
        d.tint = Number($('#bnTint', r).value);
        d.title = $('#bnTitle', r).value;
        d.desc = $('#bnDesc', r).value;
        $('#bnOffV', r).textContent = d.offset + '%';
        $('#bnOpV', r).textContent = d.opacity + '%';
        $('#bnTiV', r).textContent = d.tint + '%';
        markDirty(); renderBanner();
      };
      ['bnType', 'bnHeight', 'bnOffset', 'bnOpacity', 'bnTint', 'bnTitle', 'bnDesc'].forEach(id => {
        const el = $('#' + id, r); if (el) { el.addEventListener('input', sync); el.addEventListener('change', sync); }
      });
      const url = $('#bnUrl', r);
      url.addEventListener('input', debounce(() => {
        const v = url.value.trim();
        const d = window.__bannerDraft;
        d.src = v;
        if (v) { d.type = /\.(mp4|webm|ogg|mov)(\?|$)/i.test(v) ? 'video' : 'image'; $('#bnType', r).value = d.type; }
        markDirty(); renderBanner();
      }, 400));
      $('#bnPerView', r).addEventListener('change', (e) => { state.app.perViewBanners = e.target.checked; markDirty(); renderBanner(); });
    }
  });
};
ACTIONS.bnUpload = async function (el) {
  const kind = el.getAttribute('data-arg');
  const f = await pickFile(kind === 'video' ? 'video/*' : 'image/*,image/gif');
  if (!f) return;
  const d = window.__bannerDraft;
  d.src = f.data; d.type = kind;
  markDirty(); renderBanner();
  const sel = $('#bnType'); if (sel) sel.value = kind;
  toast(kind === 'video' ? 'Video banner loaded.' : 'Banner image loaded.', 'ok');
};
ACTIONS.bnClear = function () { const d = window.__bannerDraft; d.src = ''; d.type = 'none'; markDirty(); renderBanner(); const u = $('#bnUrl'); if (u) u.value = ''; };
ACTIONS.bnScope = function (el) {
  const target = el.getAttribute('data-arg');
  const src = clone(window.__bannerDraft);
  const b = currentBook();
  if (target === 'global') state.app.globalBanner = src;
  else if (target === 'book' && b) { b.banners = b.banners || {}; b.banners.__book = src; }
  else if (b) { b.banners = b.banners || {}; b.banners[CURRENT_VIEW] = src; }
  else state.app.globalBanner = src;
  markDirty(); renderBanner();
  toast('Banner applied to ' + (target === 'view' ? 'this page' : target === 'book' ? 'the whole book' : 'the global default') + '.', 'ok');
  window.__bannerDraft = activeBanner().data;
};
ACTIONS.bnDropOverride = function () {
  const b = currentBook(); if (!b || !b.banners) return;
  delete b.banners[CURRENT_VIEW];
  markDirty(); renderBanner(); closeModal(); toast('Override removed — inheriting parent banner.', 'ok');
};

/* ------------------------------ BOOK CRUD ------------------------------- */
function bookWords(b) {
  if (!b) return 0;
  let w = wordsOfHTML(b.prologue && b.prologue.html);
  (b.chapters || []).forEach(c => { w += wordsOfHTML(c.html); });
  return w;
}
function bookCompletion(b) {
  if (!b) return 0;
  const goal = Number(b.goalWords) || 80000;
  return clamp(Math.round((bookWords(b) / goal) * 100), 0, 100);
}
