/** Tier-orbit placement: leads at the core, everyone else on widening rings.
 *  Avoids the collinear rows a naive grid produces, which stack edges on top
 *  of one another and bury their labels under nodes. */
function autoLayoutCast(b) {
  const cast = b.characters || [];
  const cx = 600, cy = 300;
  const leads = cast.filter(c => c.tier === 'lead');
  const rest = cast.filter(c => c.tier !== 'lead');
  leads.forEach((c, i) => {
    const a = (i / Math.max(1, leads.length)) * Math.PI * 2;
    c.x = cx + Math.cos(a) * (leads.length > 1 ? 110 : 0);
    c.y = cy + Math.sin(a) * (leads.length > 1 ? 110 : 0);
  });
  rest.forEach((c, i) => {
    const a = (i / Math.max(1, rest.length)) * Math.PI * 2 - Math.PI / 2;
    const rad = c.tier === 'co' ? 210 : c.tier === 'sup' ? 300 : 380;
    c.x = cx + Math.cos(a) * rad;
    c.y = cy + Math.sin(a) * rad * 0.62;
  });
}
ACTIONS.netAutoLayout = function () {
  const b = requireBook(); if (!b) return;
  autoLayoutCast(b);
  markDirty(); render(); toast('Cast arranged by tier orbit.', 'ok');
};
function drawNetwork() {
  const b = currentBook(); if (!b) return;
  const svg = document.getElementById('relCanvas'); if (!svg) return;
  const cast = b.characters || [], rels = b.relationships || [];
  if (cast.some(c => !c.x || !c.y)) autoLayoutCast(b);
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = '<filter id="ngl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  svg.appendChild(defs);
  const gEdges = document.createElementNS(NS, 'g');
  const gNodes = document.createElementNS(NS, 'g');
  svg.appendChild(gEdges); svg.appendChild(gNodes);

  rels.forEach(r => {
    const A = cast.find(c => c.id === r.a), B = cast.find(c => c.id === r.b);
    if (!A || !B) return;
    const t = REL_TYPES.find(x => x.id === r.type) || REL_TYPES[0];
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', A.x); line.setAttribute('y1', A.y);
    line.setAttribute('x2', B.x); line.setAttribute('y2', B.y);
    line.setAttribute('stroke', t.color);
    line.setAttribute('stroke-width', r.type === 'secret' ? 1.4 : 2);
    line.setAttribute('stroke-opacity', '.72');
    if (r.type === 'secret') line.setAttribute('stroke-dasharray', '6 5');
    /* No SVG filter on edges: an axis-aligned line has a zero-area bounding box,
       which collapses an objectBoundingBox filter region and hides the stroke. */
    line.style.cursor = 'pointer';
    line.addEventListener('click', () => ACTIONS.relEdit({ getAttribute: () => r.id }));
    gEdges.appendChild(line);
    if (r.label) {
      const tx = document.createElementNS(NS, 'text');
      /* 42% along the edge rather than dead centre — keeps the labels of two
         edges that share a node from landing on the same point. */
      tx.setAttribute('x', A.x + (B.x - A.x) * 0.42); tx.setAttribute('y', A.y + (B.y - A.y) * 0.42 - 6);
      tx.setAttribute('text-anchor', 'middle'); tx.setAttribute('fill', t.color);
      tx.setAttribute('font-size', '10'); tx.setAttribute('font-family', 'Share Tech Mono, monospace');
      tx.setAttribute('stroke', '#04070d'); tx.setAttribute('stroke-width', '3.5');
      tx.setAttribute('paint-order', 'stroke'); tx.setAttribute('stroke-linejoin', 'round');
      tx.textContent = r.label;
      gEdges.appendChild(tx);
    }
  });

  cast.forEach(c => {
    const tier = TIERS.find(t => t.id === c.tier) || TIERS[2];
    const rad = c.tier === 'lead' ? 34 : c.tier === 'co' ? 28 : c.tier === 'sup' ? 23 : 18;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'rel-node');
    g.setAttribute('transform', 'translate(' + c.x + ',' + c.y + ')');
    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('r', rad + 6); ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', c.color || '#23e0ff'); ring.setAttribute('stroke-opacity', '.28'); ring.setAttribute('stroke-width', '1');
    const circ = document.createElementNS(NS, 'circle');
    circ.setAttribute('r', rad);
    circ.setAttribute('fill', 'rgba(6,14,24,.94)');
    circ.setAttribute('stroke', c.color || '#23e0ff');
    circ.setAttribute('stroke-width', c.tier === 'lead' ? 3 : 2);
    circ.setAttribute('filter', 'url(#ngl)');
    const initials = document.createElementNS(NS, 'text');
    initials.setAttribute('text-anchor', 'middle'); initials.setAttribute('dy', '5');
    initials.setAttribute('fill', '#eafcff'); initials.setAttribute('font-size', rad > 25 ? '17' : '13');
    initials.setAttribute('font-family', 'Orbitron, sans-serif'); initials.setAttribute('font-weight', '700');
    initials.style.pointerEvents = 'none';
    initials.textContent = (c.name || '?').split(/\s+/).map(s => s.charAt(0)).join('').slice(0, 2).toUpperCase() || '?';
    const nm = document.createElementNS(NS, 'text');
    nm.setAttribute('text-anchor', 'middle'); nm.setAttribute('dy', rad + 20);
    nm.setAttribute('fill', '#9fc4d6'); nm.setAttribute('font-size', '11');
    nm.setAttribute('font-family', 'Rajdhani, sans-serif');
    nm.style.pointerEvents = 'none';
    nm.textContent = c.name || 'Unnamed';
    const tr = document.createElementNS(NS, 'text');
    tr.setAttribute('text-anchor', 'middle'); tr.setAttribute('dy', rad + 33);
    tr.setAttribute('fill', 'rgba(126,155,173,.75)'); tr.setAttribute('font-size', '8.5');
    tr.setAttribute('font-family', 'Share Tech Mono, monospace');
    tr.style.pointerEvents = 'none';
    tr.textContent = tier.label.toUpperCase();
    g.appendChild(ring); g.appendChild(circ); g.appendChild(initials); g.appendChild(nm); g.appendChild(tr);
    gNodes.appendChild(g);

    let dragging = false, moved = false, off = { x: 0, y: 0 };
    const pt = (evt) => {
      const r = svg.getBoundingClientRect();
      const vb = svg.viewBox.baseVal;
      const sx = vb.width / r.width, sy = vb.height / r.height;
      const cx2 = (evt.touches ? evt.touches[0].clientX : evt.clientX) - r.left;
      const cy2 = (evt.touches ? evt.touches[0].clientY : evt.clientY) - r.top;
      return { x: cx2 * sx, y: cy2 * sy };
    };
    const down = (e) => { dragging = true; moved = false; const p = pt(e); off = { x: p.x - c.x, y: p.y - c.y }; e.preventDefault(); };
    const move = (e) => {
      if (!dragging) return;
      const p = pt(e);
      c.x = clamp(Math.round(p.x - off.x), 40, 1160); c.y = clamp(Math.round(p.y - off.y), 40, 580);
      moved = true;
      g.setAttribute('transform', 'translate(' + c.x + ',' + c.y + ')');
      gEdges.innerHTML = '';
      rels.forEach(r => {
        const A = cast.find(x => x.id === r.a), B = cast.find(x => x.id === r.b);
        if (!A || !B) return;
        const t = REL_TYPES.find(x => x.id === r.type) || REL_TYPES[0];
        const ln = document.createElementNS(NS, 'line');
        ln.setAttribute('x1', A.x); ln.setAttribute('y1', A.y); ln.setAttribute('x2', B.x); ln.setAttribute('y2', B.y);
        ln.setAttribute('stroke', t.color); ln.setAttribute('stroke-width', '2'); ln.setAttribute('stroke-opacity', '.7');
        if (r.type === 'secret') ln.setAttribute('stroke-dasharray', '6 5');
        gEdges.appendChild(ln);
      });
    };
    const up = () => {
      if (!dragging) return;
      dragging = false;
      if (moved) { markDirty(); } else { ACTIONS.charOpen(c.id); }
    };
    g.addEventListener('mousedown', down);
    g.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  });
}

/* Local persona simulation — used when no API provider is configured. */
function simulateCharacterReply(c, q) {
  const name = c.name || 'I';
  const ql = q.toLowerCase();
  const secret = (c.secret || '').trim();
  const flaw = (c.flaws || '').split(/[.,;]/)[0].trim();
  const want = (c.motivation || '').split(/[.,;]/)[0].trim();
  const fear = (c.fears || '').split(/[.,;]/)[0].trim();
  const voice = (c.voice || '').toLowerCase();
  const clipped = /clipped|terse|short|blunt|laconic/.test(voice);
  const formal = /formal|precise|no contractions|archaic|educated/.test(voice);
  const warm = /warm|kind|gentle|soft/.test(voice);
  const beats = [];

  if (/hiding|secret|truth|lying|lie\b/.test(ql)) {
    beats.push(secret
      ? 'You want the thing I do not say. Fine — but not the whole of it. ' + (formal ? 'There is a matter I have not disclosed.' : 'There\'s something I haven\'t told anyone.') + ' I will say this much and no more: it concerns ' + secret.split(/\s+/).slice(0, 8).join(' ').replace(/[.]$/, '') + '.'
      : 'Everyone is hiding something. Mine is duller than you are hoping. Ask me a better question and I might slip.');
  } else if (/want|need|goal|after\b|looking for/.test(ql)) {
    beats.push(want ? (formal ? 'What I want has not changed: ' : 'Same thing I\'ve wanted the whole time — ') + want.toLowerCase() + '.'
      : 'I want the next hour to be quieter than the last one. Beyond that I have not let myself plan.');
    if (c.need) beats.push('Though you did not ask what I need, and those are not the same animal.');
  } else if (/why did you|why would you|explain|justify/.test(ql)) {
    beats.push(flaw ? 'Because I am ' + flaw.toLowerCase() + ', and I have stopped pretending that is a temporary condition.'
      : 'Because at the time it was the only door that opened. I have thought about it since. That has not helped.');
  } else if (/afraid|scared|fear|terrif/.test(ql)) {
    beats.push(fear ? (clipped ? fear.charAt(0).toUpperCase() + fear.slice(1) + '. That is the whole answer.' : 'If you want it plainly — ' + fear.toLowerCase() + '. I have arranged my entire life around not finding out whether I could survive it.')
      : 'Fear is a luxury item. I keep mine in storage.');
  } else if (/betray|turn on|switch sides|abandon/.test(ql)) {
    beats.push('Everyone has a price and only liars pretend otherwise. Mine is not money. ' + (want ? 'Offer me ' + want.toLowerCase() + ' and watch what I become.' : 'Threaten the one person left and you will not need to ask twice.'));
  } else if (/describe|where are you|room|look around|see\b/.test(ql)) {
    beats.push('Low ceiling. ' + pick(SENSORY.smell) + '. ' + pick(SENSORY.sound) + '. I have already counted the exits — two, one of them a lie.');
  } else if (/who are you|introduce|tell me about yourself/.test(ql)) {
    beats.push((formal ? 'I am ' : 'Name\'s ') + name + '. ' + (c.occupation ? c.occupation + ', when anyone is paying. ' : '') + (c.role ? 'People decide what I am within a minute of meeting me, and they are usually close enough. ' : '') + (want ? 'What matters is that I intend to ' + want.toLowerCase() + '.' : ''));
  } else if (/love|feel about|care about/.test(ql)) {
    beats.push(warm ? 'More than is convenient. That is the trouble with it.' : 'I do not do the vocabulary for that. Ask what I would do instead — the answer is more honest.');
  } else if (/\?$/.test(q.trim())) {
    beats.push((clipped ? 'Short answer: no.' : 'You are asking the wrong person, or asking the right person too early.') + ' ' + (flaw ? 'I am ' + flaw.toLowerCase() + ' — that shapes anything I tell you.' : ''));
  } else {
    beats.push((clipped ? 'Noted.' : 'All right.') + ' ' + q.replace(/[.!?]+$/, '') + ' — ' + (want ? 'and none of that changes what I came here to do.' : 'and I still do not know what you expect me to say to that.'));
  }

  if (c.mannerisms && Math.random() > 0.45) {
    beats.push('(' + c.mannerisms.split(/[.,;]/)[0].trim().toLowerCase() + ')');
  }
  if (Math.random() > 0.62) beats.push(pick(SENSORY.body).replace(/^./, s => s.toUpperCase()) + '.');
  let out = beats.filter(Boolean).join(' ');
  if (formal) out = out.replace(/don't/g, 'do not').replace(/can't/g, 'cannot').replace(/won't/g, 'will not').replace(/I'm/g, 'I am').replace(/it's/g, 'it is');
  if (clipped) {
    const sentences = out.match(/[^.!?]+[.!?]*/g) || [out];
    out = sentences.slice(0, 2).join('').trim();
  }
  return out;
}

/* ===========================================================================
   THE 2077 AI CO-PILOT
   Provider bridge (OpenAI / Anthropic / Gemini / local simulation)
   Unstuck plot brancher · Atmosphere enhancer · Cliché & repetition scanner
   Guided Story Architecture wizard & beat-sheet engine
   ========================================================================= */

function aiReady() {
  const ai = state.app.ai;
  if (ai.provider === 'simulated') return false;
  return !!(ai.keys[ai.provider] || '').trim();
}
function aiLabel() {
  const ai = state.app.ai;
  if (!aiReady()) return 'LOCAL SIMULATION';
  return ai.provider.toUpperCase() + ' · ' + (ai.model[ai.provider] || '');
}

/**
 * Unified completion bridge. Falls back to the local simulator whenever no
 * provider is configured or the network call fails.
 */
async function aiComplete(opts) {
  const ai = state.app.ai;
  const fb = opts.fallback || (() => '');
  if (!aiReady()) return fb();
  const key = (ai.keys[ai.provider] || '').trim();
  const temp = Number(ai.temperature) || 0.85;
  const maxTok = Number(opts.maxTokens || ai.maxTokens) || 900;
  const history = opts.history || [];
  try {
    if (ai.provider === 'openai') {
      const r = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({
          model: ai.model.openai || 'gpt-4o-mini',
          temperature: temp, max_tokens: maxTok,
          messages: [{ role: 'system', content: opts.system || '' }].concat(history, [{ role: 'user', content: opts.user }])
        })
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status + ' — ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      return (j.choices && j.choices[0] && j.choices[0].message.content || '').trim() || fb();
    }
    if (ai.provider === 'anthropic') {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: ai.model.anthropic || 'claude-sonnet-4-5',
          max_tokens: maxTok, temperature: temp,
          system: opts.system || '',
          messages: history.concat([{ role: 'user', content: opts.user }])
        })
      });
      if (!r.ok) throw new Error('Anthropic ' + r.status + ' — ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      return ((j.content || []).map(p => p.text || '').join('')).trim() || fb();
    }
    if (ai.provider === 'gemini') {
      const model = ai.model.gemini || 'gemini-2.0-flash';
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: opts.system || '' }] },
          contents: history.map(h => ({ role: h.role === 'assistant' ? 'model' : 'user', parts: [{ text: h.content }] }))
            .concat([{ role: 'user', parts: [{ text: opts.user }] }]),
          generationConfig: { temperature: temp, maxOutputTokens: maxTok }
        })
      });
      if (!r.ok) throw new Error('Gemini ' + r.status + ' — ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      const cand = (j.candidates || [])[0];
      const txt = cand && cand.content && (cand.content.parts || []).map(p => p.text || '').join('');
      return (txt || '').trim() || fb();
    }
  } catch (e) {
    console.warn('AI bridge failed:', e);
    toast(String(e.message || e).slice(0, 160) + ' — falling back to local simulation.', 'warn', 'AI BRIDGE');
    return fb();
  }
  return fb();
}

/* ----------------------------- context tools ---------------------------- */
function editorText(id) {
  const el = document.getElementById(id);

}
function lastWords(text, n) {
  const w = String(text || '').trim().split(/\s+/).filter(Boolean);
  return w.slice(Math.max(0, w.length - n)).join(' ');
}
function activeEditorId() {
  if (document.getElementById('chEd')) return 'chEd';
  if (document.getElementById('proEd')) return 'proEd';
  return null;
}
function castNames() {
  const b = currentBook(); if (!b) return [];
  return (b.characters || []).filter(c => c.name).sort((a, b2) => {
    const order = { lead: 0, co: 1, sup: 2, min: 3 };
    return (order[a.tier] || 9) - (order[b2.tier] || 9);
  }).map(c => c.name);
}

/* --------------------------- UNSTUCK ENGINE ----------------------------- */
const UNSTUCK_MODES = [
  { id: 'logical', label: 'The Logical Progression', tone: 'tone1', chip: 'cy', icon: 'arrow-right',
    brief: 'the most causally honest next step — what this scene has already promised' },
  { id: 'twist', label: 'The Dramatic Twist / Conflict Escalation', tone: 'tone2', chip: 'rd', icon: 'zap',
    brief: 'a reversal that reframes what came before and raises the cost' },
  { id: 'wildcard', label: 'The Wildcard / High Chaos Option', tone: 'tone3', chip: 'am', icon: 'flame',
    brief: 'the destabilising swing — genre-bending, structurally reckless, occasionally brilliant' }
];

function simulateUnstuck(mode, ctx, b) {
  const names = castNames();
  const lead = names[0] || 'she';
  const second = names[1] || 'the other one';
  const g = GENRES.find(x => x.id === b.genre);
  const sentences = (ctx.match(/[^.!?]+[.!?]+/g) || []).map(s => s.trim());
  const lastSentence = sentences.length ? sentences[sentences.length - 1] : '';
  const anchorNoun = (lastSentence.match(/\b([a-z]{5,})\b/gi) || ['the room']).slice(-1)[0];
  const img = pick(AI_IMAGES), stake = pick(AI_STAKES), verb = pick(AI_VERBS);

  if (mode === 'logical') {
    return [
      lead + ' does the obvious thing, because the obvious thing is still the hardest one available. ' +
      'The ' + anchorNoun + ' does not resolve; it simply hands over the next problem, which was waiting behind it the whole time.',
      'What follows is procedure — the ordinary, granular work of someone who has decided not to stop. ' +
      'Every step forward closes a door behind, and ' + lead + ' notices this and keeps going anyway.',
      'By the end of it ' + (names[1] ? second + ' knows too, and knowing changes what ' + second + ' is willing to do.' : 'there is a name attached to the thing, and names make it possible to hunt.')
    ].join('\n\n');
  }
  if (mode === 'twist') {
    return [
      'The assumption breaks. ' + (names[1] ? second + ' is not who ' + lead + ' has been treating them as' : 'The version of events everyone accepted') +
      ' — and the proof has been sitting inside the ' + anchorNoun + ' since the beginning.',
      'The reversal ' + verb + ' the previous chapter: every kindness reads as management, every coincidence reads as design. ' +
      lead + ' has to decide, in the space of one breath, whether to say it out loud.',
      'Whatever is chosen, it costs ' + stake + '. ' + img.charAt(0).toUpperCase() + img.slice(1) + ' — and that detail will matter twice more before the book ends.'
    ].join('\n\n');
  }
  return [
    'Something arrives that the scene did not order. ' + img.charAt(0).toUpperCase() + img.slice(1) + ', and no one in the room has an explanation that survives thirty seconds of scrutiny.',
    'The rules that governed the last hundred pages stop applying cleanly. ' + lead + ' abandons the plan entirely and does the thing that cannot be walked back — ' +
    (g ? 'the kind of move ' + g.name.toLowerCase() + ' readers will either forgive or never forget' : 'the kind of move that makes the rest of the book a different book') + '.',
    'The immediate consequence is ' + stake + '. The second consequence has not landed yet. That is the chapter break.'
  ].join('\n\n');
}

async function generateUnstuck(mode, ctx) {
  const b = currentBook() || {};
  const g = GENRES.find(x => x.id === b.genre);
  const modeInfo = UNSTUCK_MODES.find(m => m.id === mode);
  const prompt = (state.app.ai.templates.unstuck || '')
    .replace(/\{\{BOOK\}\}/g, b.title || 'the manuscript')
    .replace(/\{\{GENRE\}\}/g, g ? g.name : (b.genre || 'unspecified'))
    .replace(/\{\{CAST\}\}/g, castNames().slice(0, 8).join(', ') || 'unnamed cast')
    .replace(/\{\{CONTEXT\}\}/g, ctx || '(the page is blank — open the scene)')
    .replace(/\{\{MODE\}\}/g, modeInfo.label + ' — ' + modeInfo.brief);
  return aiComplete({
    system: 'You are a world-class novelist and story doctor. Return prose only. Never explain yourself.',
    user: prompt,
    maxTokens: 550,
    fallback: () => simulateUnstuck(mode, ctx, b)
  });
}

function simulateAtmosphere(text) {

      pick(SENSORY.body).replace(/^./, s => s.toUpperCase()) + '.'

  return { suggestions: lines, rewrite: rebuilt };
}

/* --------------------- CLICHÉ & REPETITION SCANNER ---------------------- */
const STOPWORDS = new Set(['the', 'and', 'that', 'have', 'for', 'not', 'with', 'you', 'this', 'but', 'his', 'her', 'they', 'she', 'him', 'from', 'their', 'what', 'been', 'were', 'was', 'are', 'had', 'has', 'would', 'could', 'should', 'there', 'them', 'then', 'than', 'when', 'which', 'into', 'about', 'like', 'said', 'says', 'just', 'over', 'back', 'down', 'still', 'even', 'only', 'some', 'other', 'more', 'very', 'much', 'will', 'can', 'did', 'does', 'her', 'its', 'our', 'out', 'off', 'why', 'how', 'who', 'all', 'one', 'two', 'now', 'him', 'his']);

function scanText(raw) {
  const text = String(raw || '');
  const lower = text.toLowerCase();
  const hits = [];
  CLICHES.forEach(c => {
    let i = 0, n = 0, spots = [];
    while ((i = lower.indexOf(c.p, i)) !== -1) { n++; spots.push(text.slice(Math.max(0, i - 40), i + c.p.length + 40)); i += c.p.length; if (n > 20) break; }
    if (n) hits.push({ phrase: c.p, count: n, alts: c.s, spots: spots.slice(0, 3) });
  });
  const words = (lower.match(/[a-z']{4,}/g) || []);
  const freq = {};
  words.forEach(w => { if (!STOPWORDS.has(w)) freq[w] = (freq[w] || 0) + 1; });
  const total = countWords(text) || 1;
  const repeats = Object.keys(freq).map(w => ({ w: w, n: freq[w], per1k: (freq[w] / total) * 1000 }))
    .filter(x => x.n >= 4).sort((a, b) => b.n - a.n).slice(0, 16);
  const adverbs = (lower.match(/\b\w+ly\b/g) || []);
  const advFreq = {};
  adverbs.forEach(a => { advFreq[a] = (advFreq[a] || 0) + 1; });
  const filters = FILTER_WORDS.map(f => {
    const re = new RegExp('\\b' + f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
    const m = lower.match(re);
    return { w: f, n: m ? m.length : 0 };
  }).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
  const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
  const starts = {};
  sentences.forEach(s => { const w = (s.trim().split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z']/g, ''); if (w) starts[w] = (starts[w] || 0) + 1; });
  const startRepeat = Object.keys(starts).map(w => ({ w: w, n: starts[w] })).filter(x => x.n >= 3).sort((a, b) => b.n - a.n).slice(0, 8);
  const avgSentence = sentences.length ? Math.round(total / sentences.length) : 0;
  return { hits: hits, repeats: repeats, filters: filters, startRepeat: startRepeat, adverbs: Object.keys(advFreq).map(a => ({ w: a, n: advFreq[a] })).sort((a, b) => b.n - a.n).slice(0, 10), total: total, sentences: sentences.length, avgSentence: avgSentence };
}

  const text = edId ? editorText(edId) : '';

            (r.startRepeat.length ? '<div class="flex gap4 wrap">' + r.startRepeat.map(x => '<span class="chip ' + (x.n > 5 ? 'rd' : '') + '">“' + esc(x.w) + '” ×' + x.n + '</span>').join('') + '</div>' +

};

function simulateBeats(b, tplKey) {
  const tpl = BEAT_TEMPLATES[tplKey] || BEAT_TEMPLATES.threeAct;
  const a = b.outline.answers || {};
  const names = castNames();
  const lead = names[0] || 'the protagonist';
  const anta = names[1] || 'the opposing force';
  const g = GENRES.find(x => x.id === b.genre);
  const frag = (s, n) => {
    const t = String(s || '').trim();
    if (!t) return '';
    const parts = t.split(/[.;\n]/).map(x => x.trim()).filter(Boolean);
    return parts[n % Math.max(1, parts.length)] || parts[0] || '';
  };
  const seeds = {
    about: frag(a.about, 0), plot: frag(a.plot, 0), plot2: frag(a.plot, 1),
    begin: frag(a.begin, 0), middle: frag(a.middle, 0), climax: frag(a.climax, 0), climax2: frag(a.climax, 1),
    theme: frag(a.theme, 0)
  };
  const out = [];
  tpl.acts.forEach((act) => {
    act.beats.forEach((beatTitle, bi) => {
      const total = tpl.acts.reduce((n, x) => n + x.beats.length, 0);
      const pos = out.length / Math.max(1, total - 1);
      let text;
      if (pos < 0.18) text = (seeds.begin || 'The ordinary world holds, with one detail out of place') + '. ' + lead + ' is introduced through what they are willing to tolerate.';
      else if (pos < 0.35) text = (seeds.plot || 'The external problem arrives') + '. ' + lead + ' refuses, then cannot.';
      else if (pos < 0.55) text = 'Pressure from ' + anta + '. ' + (seeds.plot2 || 'The plan works partially, and the partial success costs more than failure would have') + '.';
      else if (pos < 0.68) text = (seeds.middle || 'The midpoint reversal lands') + ' — ' + lead + ' stops reacting and starts choosing. ' + (seeds.about ? 'The story\'s argument (' + seeds.about.toLowerCase() + ') becomes visible here.' : '');
      else if (pos < 0.84) text = 'Everything narrows. ' + pick(AI_STAKES).replace(/^/, 'The cost lands on ') + '. ' + anta + ' is winning on the terms ' + lead + ' chose.';
      else text = (seeds.climax || 'The final confrontation') + '. ' + (seeds.climax2 || 'What remains afterwards is smaller and truer') + '.' + (seeds.theme ? ' Theme paid in full: ' + seeds.theme.toLowerCase() + '.' : '');
      out.push({ id: uid('bt'), act: act.n, title: beatTitle, text: text.replace(/\s+/g, ' ').trim() });
    });
  });
  if (g) out.push({ id: uid('bt'), act: 'GENRE CHECK', title: g.name + ' promise audit', text: 'Confirm the genre promise is delivered: ' + g.structure.slice(0, 3).join(' · ') + '. Avoid: ' + g.pitfalls[0] + '.' });
  return out;
}

ACTIONS.beatsBuild = async function () {
  const b = requireBook(); if (!b) return;
  const a = b.outline.answers || {};
  const answered = STORY_QS.filter(q => (a[q.k] || '').trim()).length;
  if (!answered) { toast('Answer at least one story question first.', 'warn'); return; }
  const tplKey = state.ui.beatTpl || 'threeAct';
  openModal({
    title: 'EXPANDING STORY ARCHITECTURE', icon: 'zap', size: 'narrow', closeOnScrim: false,
    body: '<div class="empty"><i data-lucide="brain"></i><h4>BUILDING BEAT SHEET</h4>' +
      '<div class="fs13">Template: <strong>' + esc(BEAT_TEMPLATES[tplKey].name) + '</strong><br>Engine: ' + esc(aiLabel()) + '</div>' +
      '<div class="mono fs11 t-am mt14">◌ SYNTHESISING…</div></div>',
    footer: null
  });
  const local = simulateBeats(b, tplKey);
  let beats = local;
  if (aiReady()) {
    const answersTxt = STORY_QS.map(q => q.q + '\n' + (a[q.k] || '(unanswered)')).join('\n\n');
    const g = GENRES.find(x => x.id === b.genre);
    const prompt = (state.app.ai.templates.beats || '')
      .replace(/\{\{BOOK\}\}/g, b.title || 'the manuscript')
      .replace(/\{\{GENRE\}\}/g, g ? g.name : (b.genre || 'unspecified'))
      .replace(/\{\{ANSWERS\}\}/g, answersTxt) +
      '\n\nUse the "' + BEAT_TEMPLATES[tplKey].name + '" structure. Format strictly as: ACT | BEAT TITLE | one-sentence description. One beat per line, no other text.';
    const raw = await aiComplete({ system: 'You are a story structure expert. Output only the requested lines.', user: prompt, maxTokens: 1400, fallback: () => '' });
    const parsed = String(raw).split('\n').map(l => l.trim()).filter(l => l && l.indexOf('|') !== -1).map(l => {
      const p = l.split('|').map(s => s.trim());
      return { id: uid('bt'), act: p[0].replace(/^[-*\d.\s]+/, ''), title: p[1] || 'Beat', text: p.slice(2).join(' — ') };
    });
    if (parsed.length >= 5) beats = parsed;
  }
  b.outline.beats = beats;
  b.outline.template = BEAT_TEMPLATES[tplKey].name;
  b.outline.generatedAt = nowISO();
  logActivity('outline', 'Generated a ' + beats.length + '-beat sheet (' + BEAT_TEMPLATES[tplKey].name + ')');
  markDirty();
  closeModal(); render();
  toast(beats.length + ' beats generated. Edit them freely — then build chapter stubs.', 'ok', 'ARCHITECTURE READY');
};

};
ACTIONS.kidLive = debounce(() => { renderRail(); icons(); }, 400);
ACTIONS.kidMark = function () {

  toast('“' + b.title + '” is now marked as a children’s book. It shows as one in All My Books.', 'ok');
};
ACTIONS.kidUnmark = function () {

ACTIONS.kidNewBook = async function () {
  const t = await promptDlg('NEW CHILDREN’S BOOK', 'Working title', '');
  if (t == null) return;
  const bk = newBook(t.trim() || 'New Picture Book');
  bk.format = 'childrens';
  bk.author = (currentBook() || {}).author || '';

  state.books.push(bk);
  setActiveBook(bk.id);

ACTIONS.kidTier = function (el) {
  const b = requireBook(); if (!b) return;
  b.kids.tier = el.getAttribute('data-k'); markDirty(); render();
};
ACTIONS.kidSpreadAdd = function () {
  const b = requireBook(); if (!b) return;
  b.kids.spreads = b.kids.spreads || [];
  b.kids.spreads.push(newSpread(b.kids.spreads.length + 1));
  markDirty(); render();
};
ACTIONS.kidSpreadDel = function (el) {
  const b = requireBook(); if (!b) return;
  b.kids.spreads = (b.kids.spreads || []).filter(s => s.id !== el.getAttribute('data-id'));
  markDirty(); render();
};
function kidMove(id, d) {
  const b = requireBook(); if (!b) return;
  const i = b.kids.spreads.findIndex(s => s.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= b.kids.spreads.length) return;
  const [m] = b.kids.spreads.splice(i, 1); b.kids.spreads.splice(j, 0, m);
  markDirty(); render();
}
ACTIONS.kidSpreadUp = function (el) { kidMove(el.getAttribute('data-id'), -1); };
ACTIONS.kidSpreadDown = function (el) { kidMove(el.getAttribute('data-id'), 1); };
ACTIONS.kidArt = async function (el) {
  const b = requireBook(); if (!b) return;
  const s = (b.kids.spreads || []).find(x => x.id === el.getAttribute('data-id')); if (!s) return;
  const f = await pickFile('image/*'); if (!f) return;
  s.art = f.data; markDirty(); render();
};
ACTIONS.kidAutoBuild = function () {
  const b = requireBook(); if (!b) return;
  const tier = b.kids.tier;
  const plan = tier === '0-3'
    ? [['Full Bleed', 'Title object introduced'], ['Full Bleed', 'The friend appears'], ['Full Bleed', 'A small problem'], ['Full Bleed', 'A bigger sound'], ['Full Bleed', 'The turn'], ['Full Bleed', 'Comfort'], ['Full Bleed', 'Sleep / resolution'], ['Full Bleed', 'Goodnight refrain']]
    : tier === '4-8'
      ? [['Full Bleed', 'Opening image — the ordinary world'], ['Spot Art', 'Character want established'], ['Full Bleed', 'The problem arrives'], ['Vignette', 'First attempt fails'], ['Spot Art', 'Second attempt fails — funnier'], ['Double-Page Spread', 'Lowest point'], ['Spot Art', 'The idea'], ['Full Bleed', 'Third attempt begins'], ['Double-Page Spread', 'The big moment — the wow spread'], ['Half-Page Top', 'Immediate consequence'], ['Spot Art', 'Reaction of the friends'], ['Full Bleed', 'Resolution'], ['Vignette', 'Emotional payoff'], ['Full Bleed', 'Final turn / last laugh']]
      : [['Spot Art', 'Ch 1 — the ordinary problem'], ['Text-Only Page', 'Ch 2 — the plan'], ['Half-Page Bottom', 'Ch 3 — first obstacle'], ['Spot Art', 'Ch 4 — an ally'], ['Text-Only Page', 'Ch 5 — betrayal or mistake'], ['Full Bleed', 'Ch 6 — the low point'], ['Spot Art', 'Ch 7 — the plan remade'], ['Full Bleed', 'Ch 8 — confrontation'], ['Spot Art', 'Ch 9 — putting it right'], ['Vignette', 'Ch 10 — the new normal']];
  b.kids.spreads = b.kids.spreads || [];
  plan.forEach((p, i) => {
    const s = newSpread(b.kids.spreads.length + 1);
    s.layout = p[0]; s.illo = p[1];
    b.kids.spreads.push(s);
  });
  logActivity('kids', 'Built a ' + plan.length + '-spread structure (' + tier + ')');
  markDirty(); render(); toast(plan.length + ' spreads planned.', 'ok');
};
function kidPromptFor(b, s, i) {
  const subject = b.kids.character || 'the main character';
  const scene = s.illo || s.text || 'the scene described on this spread';
  const layoutHint = s.layout === 'Double-Page Spread' ? 'wide panoramic composition suitable for a double-page spread with a safe gutter down the centre'
    : s.layout === 'Spot Art' ? 'isolated spot illustration on a clean background, no environment clutter'
    : s.layout === 'Vignette' ? 'soft-edged vignette fading into white space'
    : 'full-bleed illustration edge to edge with room for a short line of text';
  return "Children's book illustration, " + (b.kids.artStyle || 'watercolour storybook') + ', ' + (b.kids.palette || 'warm dusk') + ' palette. ' +
    'Subject: ' + subject + '. Scene: ' + scene + '. ' +
    'Composition: ' + layoutHint + '. ' +
    'Age group ' + b.kids.tier + '. Friendly, expressive, high readability, consistent character design, no text, no lettering, no watermark.';
}
ACTIONS.kidPrompt = function (el) {
  const b = requireBook(); if (!b) return;
  const s = (b.kids.spreads || []).find(x => x.id === el.getAttribute('data-id')); if (!s) return;
  s.prompt = kidPromptFor(b, s, b.kids.spreads.indexOf(s));
  markDirty(); render(); toast('Art prompt composed.', 'ok');
};
ACTIONS.kidPromptCopy = function (el) {
  const b = requireBook(); const s = (b.kids.spreads || []).find(x => x.id === el.getAttribute('data-id'));
  if (s) copyText(s.prompt || '');
};
ACTIONS.kidPromptsAll = function () {
  const b = requireBook(); if (!b) return;
  const spreads = b.kids.spreads || [];
  if (!spreads.length) { toast('Plan some spreads first.', 'warn'); return; }
  const base = spreads.map((s, i) => ({ i: i + 1, p: s.prompt || kidPromptFor(b, s, i) }));
  const mj = base.map(x => 'SPREAD ' + x.i + '\n/imagine prompt: ' + x.p + ' --ar 3:2 --style raw --v 6').join('\n\n');
  const gem = base.map(x => 'SPREAD ' + x.i + '\n' + x.p + ' Keep the character design identical to the previous images in this series.').join('\n\n');
  const sd = base.map(x => 'SPREAD ' + x.i + '\nPositive: ' + x.p + '\nNegative: text, watermark, signature, extra fingers, deformed hands, photorealistic, horror, adult themes').join('\n\n');
  window.__kidPrompts = { mj: mj, gem: gem, sd: sd, all: '=== MIDJOURNEY ===\n\n' + mj + '\n\n=== GEMINI / NANO BANANA ===\n\n' + gem + '\n\n=== STABLE DIFFUSION ===\n\n' + sd };
  openModal({
    title: 'AI ART PROMPTS — ' + spreads.length + ' SPREADS', icon: 'wand-2', size: 'wide',
    body: '<div class="tabs mb10">' +
        '<button class="tab on" data-act="kpTab" data-k="mj">MIDJOURNEY</button>' +

      '<div class="faint fs11 mt10">Character consistency tip: generate the main character alone first, then reference that image in every following prompt. Nano Banana and Gemini accept an uploaded reference image alongside the text.</div>',
    footer: '<button class="btn ghost" data-act="kpCopy">COPY CURRENT</button><button class="btn solid" data-act="kpDownload"><i data-lucide="download"></i>DOWNLOAD ALL</button>'
  });
};

      const id = node.getAttribute('data-pin');
      const p = (b.research.pins || []).find(x => x.id === id); if (!p) return;
      let drag = false, sx = 0, sy = 0, ox = 0, oy = 0;
      const start = (e) => {
        if (e.target.closest('.pin-x') || e.target.closest('textarea') || e.target.closest('input')) return;
        drag = true; node.classList.add('dragging');
        const pt = e.touches ? e.touches[0] : e;
        sx = pt.clientX; sy = pt.clientY; ox = p.x || 0; oy = p.y || 0;
        p.z = (state.ui.pinZ = (state.ui.pinZ || 10) + 1);

        p.x = clamp(ox + (pt.clientX - sx), 0, Math.max(0, r.width - 60));
        p.y = clamp(oy + (pt.clientY - sy), 0, Math.max(0, r.height - 40));
        node.style.left = p.x + 'px'; node.style.top = p.y + 'px';
      };
      const end = () => { if (!drag) return; drag = false; node.classList.remove('dragging'); markDirty(); };
      node.addEventListener('mousedown', start);
      node.addEventListener('touchstart', start, { passive: false });
      window.addEventListener('mousemove', move);
      window.addEventListener('touchmove', move, { passive: false });
      window.addEventListener('mouseup', end);
      window.addEventListener('touchend', end);

function manuscriptMarkdown(b) {
  const out = ['# ' + b.title, ''];
  if (b.subtitle) out.push('## ' + b.subtitle, '');
  if (b.author) out.push('_by ' + b.author + '_', '');
  if (b.logline) out.push('> ' + b.logline, '');
  out.push('---', '');
  if (b.dedication.text) out.push('### Dedication', '', b.dedication.text, '', '---', '');
  /* Pictures placed inside the prose become real Markdown images so nothing
     the writer put in the chapter is silently dropped on export. */
  const html2md = (html) => {
    const d = document.createElement('div'); d.innerHTML = String(html || '');
    const swap = (node, alt, src) => node.parentNode.replaceChild(
      document.createTextNode('\n\n![' + (alt || 'picture') + '](' + (src || '') + ')\n\n'), node);
    if (!picturesInPrint()) {
      d.querySelectorAll('figure, img').forEach(n => n.remove());
    } else {
      d.querySelectorAll('figure').forEach(f => {
        const im = f.querySelector('img'), cp = f.querySelector('figcaption');
        swap(f, cp ? cp.textContent : '', im ? im.getAttribute('src') : '');
      });
      d.querySelectorAll('img').forEach(im => swap(im, im.getAttribute('alt'), im.getAttribute('src')));
    }
    return stripHTML(d.innerHTML.replace(/<\/(p|div|h2|h3|blockquote|li)>/gi, '\n\n').replace(/<br\s*\/?>/gi, '\n').replace(/<li>/gi, '- ')).replace(/\n{3,}/g, '\n\n').trim();
  };
  if (b.prologue.html) out.push('## Prologue', '', html2md(b.prologue.html), '', '---', '');
  (b.chapters || []).forEach((c, i) => {
    out.push('## ' + (c.title || 'Chapter ' + (i + 1)), '');
    if (c.pov || c.setting) out.push('_' + [c.pov ? 'POV: ' + c.pov : '', c.setting ? 'Setting: ' + c.setting : ''].filter(Boolean).join(' · ') + '_', '');
    out.push(html2md(c.html) || '_(unwritten)_', '', '---', '');
  });
  if (b.dedication.ack) out.push('## Acknowledgements', '', b.dedication.ack, '');
  return out.join('\n');
}
function storyBibleMarkdown(b) {
  const a = b.outline.answers || {};

  const out = ['# ' + b.title + ' — Story Bible', '', '**Author:** ' + (b.author || '—') + '  ', '**Genre:** ' + (g ? g.name : (b.genre || '—')) + '  ',
    '**Status:** ' + b.status + '  ', '**Words:** ' + fmt(bookWords(b)) + ' / ' + fmt(b.goalWords) + '  ', '', b.logline ? '> ' + b.logline : '', '', '---', ''];

    ['Themes', A.themes], ['Tone', A.tone], ['Content warnings', A.warnings],
    ['Started', A.startDate], ['Target finish', A.deadline], ['Publication plan', A.pubPlan],
    ['Inspiration', A.inspiration], ['Playlist', A.playlist]
  ].filter(r => String(r[1] || '').trim() && String(r[1]).trim() !== '#');
  if (aboutRows.length) {
    out.push('## About This Book', '');
    aboutRows.forEach(r => out.push('- **' + r[0] + ':** ' + r[1]));
    out.push('');
  }
  if (String(A.pitch || '').trim()) out.push('### Elevator pitch', '', A.pitch, '');
  if (String(A.synopsisShort || '').trim()) out.push('### Short synopsis', '', A.synopsisShort, '');
  if (String(A.synopsisLong || '').trim()) out.push('### Full synopsis', '', A.synopsisLong, '');
  out.push('## Story Questions', '');
  STORY_QS.forEach(q => { if ((a[q.k] || '').trim()) out.push('### ' + q.q, '', a[q.k], ''); });
  if ((b.outline.beats || []).length) {
    out.push('## Beat Sheet — ' + (b.outline.template || ''), '');
    b.outline.beats.forEach((bt, i) => out.push('' + (i + 1) + '. **' + (bt.act ? bt.act + ' · ' : '') + bt.title + '** — ' + bt.text));

  }
  out.push('## Cast', '');
  TIERS.forEach(t => {
    const list = (b.characters || []).filter(c => c.tier === t.id);
    if (!list.length) return;
    out.push('### ' + t.label, '');
    list.forEach(c => {
      out.push('#### ' + (c.name || 'Unnamed') + (c.role ? ' — ' + c.role : ''));
      [['Aliases', c.aliases], ['Age', c.age], ['Pronouns', c.pronouns], ['Occupation', c.occupation], ['Alignment', c.alignment],
       ['Appearance', c.appearance], ['Wants', c.motivation], ['Needs', c.need], ['Flaws', c.flaws], ['Fears', c.fears],
       ['Secret', c.secret], ['Voice', c.voice], ['Mannerisms', c.mannerisms], ['Backstory', c.backstory], ['Arc', c.arc], ['Notes', c.notes]]
        .forEach(p => { if ((p[1] || '').trim()) out.push('- **' + p[0] + ':** ' + p[1]); });
      out.push('');
    });
  });
  if ((b.relationships || []).length) {
    out.push('## Relationship Map', '');
    b.relationships.forEach(r => {
      const A = (b.characters.find(c => c.id === r.a) || {}).name || '?';
      const B = (b.characters.find(c => c.id === r.b) || {}).name || '?';
      const t = (REL_TYPES.find(x => x.id === r.type) || {}).label || r.type;
      out.push('- **' + A + ' ↔ ' + B + '** — ' + t + (r.label ? ' (' + r.label + ')' : '') + (r.note ? ': ' + r.note : ''));
    });
    out.push('');
  }
  if ((b.chapters || []).length) {
    out.push('## Chapter Breakdown', '');
    b.chapters.forEach((c, i) => {
      out.push('### ' + (i + 1) + '. ' + (c.title || 'Untitled') + '  _(' + fmt(wordsOfHTML(c.html)) + ' words · tension ' + (c.tension || 5) + '/10 · ' + (c.status || 'draft') + ')_');
      [['POV', c.pov], ['Setting', c.setting], ['Goal', c.goal], ['Conflict', c.conflict], ['Outcome', c.outcome], ['Notes', c.notes]]
        .forEach(p => { if ((p[1] || '').trim()) out.push('- **' + p[0] + ':** ' + p[1]); });
      out.push('');
    });
  }
  if ((b.lore || []).length) {
    out.push('## World & Lore', '');
    const byType = {};
    b.lore.forEach(l => { (byType[l.type || 'Other'] = byType[l.type || 'Other'] || []).push(l); });
    Object.keys(byType).forEach(t => {
      out.push('### ' + t, '');
      byType[t].forEach(l => {
        out.push('#### ' + (l.name || 'Unnamed'));
        if (String(l.summary || '').trim()) out.push('_' + l.summary + '_', '');
        if (String(l.detail || '').trim()) out.push(l.detail, '');
        if (String(l.firstSeen || '').trim()) out.push('- First appears in: ' + l.firstSeen);
        if (String(l.tags || '').trim()) out.push('- Tags: ' + l.tags);
        out.push('');
      });
    });
  }
  if ((b.gallery || []).length) {
    out.push('## Picture Album', '');
    b.gallery.forEach((ph, i) => out.push('' + (i + 1) + '. **' + (ph.title || 'Untitled') + '**' + (ph.desc ? ' — ' + ph.desc : '') + (ph.tags ? '  _(' + ph.tags + ')_' : '')));
    out.push('');
  }
  if ((b.research.links || []).length) {
    out.push('## Research Vault', '');
    b.research.links.forEach(l => out.push('- [' + (l.title || l.url) + '](' + l.url + ') — _' + (l.cat || '') + '_' + (l.notes ? ': ' + l.notes : '')));
  }
  return out.filter(x => x !== undefined).join('\n');
}

/* Merge by identity, keeping whichever side was edited last. Books that only
   exist on one side always survive — this can never lose a project. */
ACTIONS.impSmart = async function () {
  const data = window.__import; if (!data) return;
  const incoming = ((data.state && data.state.books) || data.books || (Array.isArray(data) ? data : [])).map(bk => migrateBook(clone(bk)));
  if (!incoming.length) { toast('There are no books in that file.', 'warn'); return; }
  await snapshotTake('Before merging a backup', true);

  const tm = (b) => { const t = new Date(b.updated || b.created || 0).getTime(); return isNaN(t) ? 0 : t; };
  let added = 0, replaced = 0, kept = 0;
  incoming.forEach(inc => {
    const i = state.books.findIndex(b => b.id === inc.id ||
      (b.title && inc.title && b.title.trim().toLowerCase() === inc.title.trim().toLowerCase()));
    if (i < 0) { state.books.push(inc); added++; return; }
    if (tm(inc) > tm(state.books[i])) { inc.id = state.books[i].id; state.books[i] = inc; replaced++; }
    else kept++;
  });

  /* app-wide settings follow whichever payload is newer, so a machine that has
     been used more recently keeps its theme, menu layout and AI setup. */
  const incState = data.state || null;
  if (incState && payloadTime(data) > (state.__at ? new Date(state.__at).getTime() : 0)) {
    const merged = migrateState(Object.assign({}, incState, { books: [] }));
    merged.books = state.books;
    merged.ui = state.ui;
    merged.ui.bookId = state.ui.bookId;
    state = merged;
  }
  if (!state.books.length) seedStarterBook();
  if (!state.ui.bookId || !state.books.some(b => b.id === state.ui.bookId)) state.ui.bookId = state.books[0].id;
  normaliseNav();
  DIRTY = true; await saveNow(true);
  if (VAULT_HANDLE) vaultWriteNow('merged');
  if (FOLDER_HANDLE) folderWriteNow('merged', true);
  renderBrand(); closeAllModals(); render();
  toast(added + ' added · ' + replaced + ' updated to the newer copy · ' + kept + ' already newer here.', 'ok', 'MERGED');
};

/* ===========================================================================
   v8 · BRINGING A DOCUMENT IN, AND SENDING ONE OUT
   Open a manuscript you already wrote — Word (.docx), WordPad (.rtf), a web
   page, Markdown or plain text — and it arrives here already split into
   chapters, with its bold and italics intact. Send it back out again in
   whichever of those formats you want.
   ========================================================================= */

/* ---- .docx is a ZIP. Browsers can inflate, so no library is needed. ------ */
async function unzipEntry(buf, wanted) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  /* find the end-of-central-directory record, scanning back from the tail */
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('That file is not a readable .docx.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + cmtLen;
    if (name !== wanted) continue;
    /* jump to the local header to find where the data actually starts */
    const lnLen = dv.getUint16(localOff + 26, true);
    const leLen = dv.getUint16(localOff + 28, true);
    const start = localOff + 30 + lnLen + leLen;
    const raw = u8.subarray(start, start + compSize);
    if (method === 0) return new TextDecoder().decode(raw);
    if (method !== 8) throw new Error('This .docx uses a compression this browser cannot read.');
    if (typeof DecompressionStream !== 'function') throw new Error('This browser cannot unzip a .docx. Save it as .rtf or .txt and import that instead.');
    const ds = new DecompressionStream('deflate-raw');
    const blob = new Blob([raw]).stream().pipeThrough(ds);
    return new TextDecoder().decode(await new Response(blob).arrayBuffer());
  }
  throw new Error('That .docx has no document inside it.');
}
/** Word XML → the same simple HTML this app writes. */
function docxToHTML(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const paras = doc.getElementsByTagNameNS(NS, 'p');
  const out = [];
  for (let i = 0; i < paras.length; i++) {
    const p = paras[i];
    const styleEl = p.getElementsByTagNameNS(NS, 'pStyle')[0];
    const style = styleEl ? (styleEl.getAttribute('w:val') || styleEl.getAttributeNS(NS, 'val') || '') : '';
    const jcEl = p.getElementsByTagNameNS(NS, 'jc')[0];
    const jc = jcEl ? (jcEl.getAttribute('w:val') || jcEl.getAttributeNS(NS, 'val') || '') : '';
    const runs = p.getElementsByTagNameNS(NS, 'r');
    let html = '';
    for (let j = 0; j < runs.length; j++) {
      const r = runs[j];
      const ts = r.getElementsByTagNameNS(NS, 'rPr')[0];
      const bold = !!(ts && ts.getElementsByTagNameNS(NS, 'b')[0]);
      const ital = !!(ts && ts.getElementsByTagNameNS(NS, 'i')[0]);
      const und = !!(ts && ts.getElementsByTagNameNS(NS, 'u')[0]);
      let txt = '';
      const ts2 = r.getElementsByTagNameNS(NS, 't');
      for (let k = 0; k < ts2.length; k++) txt += ts2[k].textContent;
      if (r.getElementsByTagNameNS(NS, 'br').length) txt += ' ';
      if (!txt) continue;
      let piece = esc(txt);
      if (bold) piece = '<b>' + piece + '</b>';
      if (ital) piece = '<i>' + piece + '</i>';
      if (und) piece = '<u>' + piece + '</u>';
      html += piece;
    }
    const plain = html.replace(/<[^>]+>/g, '').trim();
    if (/^Heading1$/i.test(style) || /^Title$/i.test(style)) out.push('<h2>' + html + '</h2>');
    else if (/^Heading[2-6]$/i.test(style)) out.push('<h3>' + html + '</h3>');
    else if (!plain) out.push('<p><br></p>');
    else if (jc === 'center' && plain.length < 60) out.push('<h3>' + html + '</h3>');
    else out.push('<p>' + html + '</p>');
  }
  return out.join('\n');
}

/* ---- WordPad's own format ------------------------------------------------ */
function rtfToHTML(rtf) {
  let s = String(rtf || '');
  s = s.replace(/\{\\\*[^{}]*\}/g, '');                    /* drop \* groups   */
  s = s.replace(/\{\\(fonttbl|colortbl|stylesheet|info|generator)[^]*?\}\s*/g, '');
  const out = [];
  let cur = '', bold = false, ital = false, und = false;
  /* {\b bold text} — the brace closes the group AND the bold. Without a stack
     the bold ran on and swallowed the rest of the paragraph. */
  const stack = [];
  const flushRun = (t) => {
    if (!t) return;
    let piece = esc(t);
    if (bold) piece = '<b>' + piece + '</b>';
    if (ital) piece = '<i>' + piece + '</i>';
    if (und) piece = '<u>' + piece + '</u>';
    cur += piece;
  };
  const endPara = () => { out.push(cur.trim() ? '<p>' + cur + '</p>' : '<p><br></p>'); cur = ''; };
  let i = 0, buf = '';
  while (i < s.length) {
    const ch = s[i];
    if (ch === '\\') {
      const m = /^\\([a-zA-Z]+)(-?\d+)? ?/.exec(s.slice(i));
      if (m) {
        flushRun(buf); buf = '';
        const word = m[1], arg = m[2];
        if (word === 'par' || word === 'line') endPara();
        else if (word === 'b') bold = arg !== '0';
        else if (word === 'i') ital = arg !== '0';
        else if (word === 'ul' || word === 'ulw' || word === 'uld') und = true;
        else if (word === 'ulnone' || word === 'ul0') und = false;
        else if (word === 'pard' || word === 'plain') { bold = ital = und = false; }
        else if (word === 'tab') buf += '    ';
        else if (word === 'u' && arg) { buf += String.fromCharCode(Number(arg)); }
        i += m[0].length;
        continue;
      }
      const esc2 = /^\\([\\{}])/.exec(s.slice(i));
      if (esc2) { buf += esc2[1]; i += 2; continue; }
      const hex = /^\\'([0-9a-fA-F]{2})/.exec(s.slice(i));
      if (hex) { buf += String.fromCharCode(parseInt(hex[1], 16)); i += 4; continue; }
      i++; continue;
    }
    if (ch === '{') { flushRun(buf); buf = ''; stack.push([bold, ital, und]); i++; continue; }
    if (ch === '}') {
      flushRun(buf); buf = '';
      const prev = stack.pop();
      if (prev) { bold = prev[0]; ital = prev[1]; und = prev[2]; }
      i++; continue;
    }
    if (ch === '\n' || ch === '\r') { i++; continue; }
    buf += ch; i++;
  }
  flushRun(buf); endPara();
  return out.join('\n').replace(/(<p><br><\/p>\s*){3,}/g, '<p><br></p>');
}

/* ---- plain text and Markdown -------------------------------------------- */
function textToHTML(txt) {
  return String(txt || '').replace(/\r\n?/g, '\n').split(/\n{2,}/).map(block => {
    const t = block.trim();
    if (!t) return '';
    const h = /^(#{1,6})\s+(.*)$/.exec(t);
    if (h) { const lv = h[1].length === 1 ? 1 : h[1].length === 2 ? 2 : 3; return '<h' + lv + '>' + esc(h[2]) + '</h' + lv + '>'; }
    if (/^[-*]\s+/m.test(t) && t.split('\n').every(l => /^[-*]\s+/.test(l.trim())))
      return '<ul>' + t.split('\n').map(l => '<li>' + esc(l.replace(/^[-*]\s+/, '').trim()) + '</li>').join('') + '</ul>';
    if (/^(\*\s*){3,}$/.test(t) || /^-{3,}$/.test(t)) return '<hr>';
    return '<p>' + esc(t).replace(/\n/g, '<br>') + '</p>';
  }).filter(Boolean).join('\n');
}
/** Anything already HTML: keep only the tags this app understands. */
function tameHTML(html) {
  const d = document.createElement('div');
  d.innerHTML = String(html || '').replace(/<!--[^]*?-->/g, '');
  d.querySelectorAll('script,style,link,meta,head,noscript,iframe,object,embed').forEach(n => n.remove());
  const keep = { P: 1, BR: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1, H1: 1, H2: 1, H3: 1, H4: 1, H5: 1, H6: 1,
    BLOCKQUOTE: 1, UL: 1, OL: 1, LI: 1, HR: 1, FIGURE: 1, FIGCAPTION: 1, IMG: 1, DIV: 1, SPAN: 1 };
  const walk = (node) => {
    Array.from(node.children).forEach(c => {
      walk(c);
      if (!keep[c.tagName]) {
        while (c.firstChild) c.parentNode.insertBefore(c.firstChild, c);
        c.remove();
        return;
      }
      Array.from(c.attributes).forEach(a => {
        if (['src', 'alt', 'data-align', 'data-w'].indexOf(a.name) < 0) c.removeAttribute(a.name);
      });
      if (c.tagName === 'DIV') {
        const p = document.createElement('p');
        while (c.firstChild) p.appendChild(c.firstChild);
        c.replaceWith(p);
      }
    });
  };
  walk(d);
  return d.innerHTML;
}

/* ---- splitting one long document into chapters --------------------------- */
const CHAPTER_RX = /^(chapter|part|book|act|section|scene)\b[\s.:—-]*[0-9ivxlcdm]*\.?\s*(.*)$/i;
const FRONT_RX = /^(prologue|preface|foreword|introduction|epilogue|afterword|acknowledgements?|dedication|epigraph)\b/i;

/** Turns imported HTML into { title, chapters:[{title, html}] }. */
function splitIntoChapters(html) {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  const nodes = Array.from(d.childNodes).filter(n => n.nodeType === 1 || (n.nodeType === 3 && n.textContent.trim()));
  const chapters = [];
  let cur = null, docTitle = '';
  const textOf = (n) => (n.textContent || '').replace(/\s+/g, ' ').trim();
  const looksLikeHeading = (n) => {
    if (n.nodeType !== 1) return false;
    const t = textOf(n);
    if (!t || t.length > 90) return false;
    if (/^H[1-6]$/.test(n.tagName)) return true;
    /* a short standalone line that names a chapter counts even without a style */
    if (CHAPTER_RX.test(t) || FRONT_RX.test(t)) return true;
    /* an all-caps short line on its own is a heading in most manuscripts */
    if (t.length < 60 && t === t.toUpperCase() && /[A-Z]/.test(t) && !/[.!?]$/.test(t)) return true;
    return false;
  };
  const open = (title) => { cur = { title: title, parts: [] }; chapters.push(cur); };
  nodes.forEach((n, i) => {
    if (looksLikeHeading(n)) {
      const t = textOf(n);
      /* the very first heading, before any prose, is the book's own title */
      if (!chapters.length && !docTitle && !CHAPTER_RX.test(t) && !FRONT_RX.test(t) && n.tagName === 'H1') { docTitle = t; return; }
      open(t);
      return;
    }
    if (!cur) open('');
    cur.parts.push(n.nodeType === 1 ? n.outerHTML : '<p>' + esc(textOf(n)) + '</p>');
  });
  const outChapters = chapters
    .map(c => ({ title: c.title, html: c.parts.join('\n') }))
    .filter(c => stripHTML(c.html).trim() || c.title);
  return { title: docTitle, chapters: outChapters };
}

async function readDocumentFile(file) {
  const name = (file.name || '').toLowerCase();
  if (/\.docx$/.test(name)) {
    const buf = await file.arrayBuffer();
    return tameHTML(docxToHTML(await unzipEntry(buf, 'word/document.xml')));
  }
  if (/\.rtf$/.test(name)) return tameHTML(rtfToHTML(await file.text()));
  if (/\.(html?|htm)$/.test(name)) return tameHTML(await file.text());
  if (/\.(md|markdown)$/.test(name)) return textToHTML(await file.text());
  if (/\.doc$/.test(name)) {
    /* old binary .doc — but Word also writes HTML with a .doc extension */
    const txt = await file.text();
    if (/<html|<body|<w:WordDocument/i.test(txt)) return tameHTML(txt);
    throw new Error('An old binary .doc cannot be read here. Open it in Word or WordPad and save it as .docx or .rtf, then import that.');
  }
  return textToHTML(await file.text());
}

/* ---- sending a manuscript back out -------------------------------------- */
function bookBlocksHTML(b) {
  const out = [];
  const strip = (h) => picturesInPrint() ? h : String(h || '').replace(/<figure[^]*?<\/figure>/gi, '').replace(/<img[^>]*>/gi, '');
  out.push('<h1>' + esc(b.title || 'Untitled') + '</h1>');
  if (b.subtitle) out.push('<p class="sub"><i>' + esc(b.subtitle) + '</i></p>');
  if (b.author) out.push('<p class="sub">' + esc(b.author) + '</p>');
  if (b.dedication && b.dedication.text) out.push('<p class="ded"><i>' + esc(b.dedication.text) + '</i></p>');
  if (stripHTML(b.prologue.html || '').trim()) {
    out.push('<h2>' + esc(b.prologue.title || 'Prologue') + '</h2>');
    out.push(strip(b.prologue.html));
  }
  (b.chapters || []).forEach((c, i) => {
    out.push('<h2>' + esc(c.title || 'Chapter ' + (i + 1)) + '</h2>');
    out.push(strip(c.html) || '<p><i>(unwritten)</i></p>');
  });
  if (b.dedication && b.dedication.ack) { out.push('<h2>Acknowledgements</h2>'); out.push('<p>' + esc(b.dedication.ack) + '</p>'); }
  return out.join('\n');
}
/** A .doc that Word and WordPad both open, with real headings and page breaks. */
function bookAsWordHTML(b) {

  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" ' +

    '<style>' +
    '@page{ size:' + trimOf(d.trim)[2] + 'in ' + trimOf(d.trim)[3] + 'in; margin:' +
      d.mTop + 'in ' + d.mOuter + 'in ' + d.mBottom + 'in ' + d.mInner + 'in; }' +
    'body{ font-family:"' + gFontName(d.font) + '", Georgia, serif; font-size:' + d.size + 'pt; line-height:' + d.leading + '; }' +
    'h1{ font-size:' + Math.round(d.size * 2.4) + 'pt; text-align:center; margin:2in 0 .4in; page-break-after:always; }' +
    'h2{ font-size:' + Math.round(d.size * 1.6) + 'pt; text-align:center; margin:1in 0 .5in; page-break-before:always; }' +
    'p{ margin:0; text-indent:' + d.indent + 'em; text-align:' + (d.align === 'justify' ? 'justify' : 'left') + '; }' +
    'p.sub,p.ded{ text-align:center; text-indent:0; margin:.3em 0; }' +
    'h2 + p{ text-indent:0; }' +
    'img{ max-width:100%; }' +
    'figure{ margin:1em auto; text-align:center; } figcaption{ font-size:' + Math.round(d.size * .85) + 'pt; font-style:italic; }' +
    '</style></head><body>' + bookBlocksHTML(b) + '</body></html>';
}
/** WordPad's native format, written by hand - no library, no server. */
function bookAsRTF(b) {
  /* everything outside plain ASCII goes out as an RTF unicode escape */
  const esc2 = (t) => String(t || '')
    .replace(/\\/g, '\\\\').replace(/\{/g, '\\{').replace(/\}/g, '\\}')
    .replace(/[\u0080-\uFFFF]/g, (c) => '\\u' + c.charCodeAt(0) + '?');
  const d = document.createElement('div');
  d.innerHTML = bookBlocksHTML(b);
  const out = ['{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Georgia;}}\\fs24'];
  Array.from(d.children).forEach(n => {
    const tag = n.tagName.toLowerCase();
    const walk = (node) => {
      let s = '';
      Array.from(node.childNodes).forEach(c => {
        if (c.nodeType === 3) { s += esc2(c.textContent); return; }
        if (c.nodeType !== 1) return;
        const t = c.tagName.toLowerCase();
        if (t === 'br') { s += '\\line '; return; }
        if (t === 'img') { s += '[picture]'; return; }
        const inner = walk(c);
        if (t === 'b' || t === 'strong') s += '{\\b ' + inner + '}';
        else if (t === 'i' || t === 'em') s += '{\\i ' + inner + '}';
        else if (t === 'u') s += '{\\ul ' + inner + '}';
        else s += inner;
      });
      return s;
    };
    const body = walk(n);
    if (tag === 'h1') out.push('\\pard\\qc\\fs48\\b ' + body + '\\b0\\fs24\\par\\page ');
    else if (tag === 'h2') out.push('\\page\\pard\\qc\\fs36\\b ' + body + '\\b0\\fs24\\par ');
    else if (tag === 'h3') out.push('\\pard\\qc\\fs28\\b ' + body + '\\b0\\fs24\\par ');
    else if (tag === 'hr') out.push('\\pard\\qc * * *\\par ');
    else if (tag === 'blockquote') out.push('\\pard\\li720\\i ' + body + '\\i0\\par ');
    else if (tag === 'ul' || tag === 'ol') Array.from(n.children).forEach(li => out.push('\\pard\\li360 \\bullet\\tab ' + walk(li) + '\\par '));
    else out.push('\\pard\\fi360\\qj ' + body + '\\par ');
  });
  out.push('}');
  return out.join('\n');
}
function bookAsPlainText(b) {
  const d = document.createElement('div');
  d.innerHTML = bookBlocksHTML(b);
  const lines = [];
  Array.from(d.children).forEach(n => {
    const t = (n.textContent || '').replace(/\s+/g, ' ').trim();
    const tag = n.tagName.toLowerCase();
    if (tag === 'h1') { lines.push(t.toUpperCase(), '='.repeat(Math.min(60, t.length)), ''); }
    else if (tag === 'h2') { lines.push('', '', t.toUpperCase(), '-'.repeat(Math.min(60, t.length)), ''); }
    else if (tag === 'h3') { lines.push('', t, ''); }
    else if (tag === 'hr') lines.push('', '   * * *', '');
    else if (t) lines.push(t, '');
  });
  return lines.join('\r\n');
}

/* ============================ MIGRATION ================================== */
/* Books are rebuilt against the current template with deepDefaults, so a book
   saved by ANY build keeps every field it had — including ones this build has
   never heard of — while gaining anything new the template introduced. */
function migrateBook(bk) {
  const t = newBook(bk.title || 'Untitled Manuscript');
  const out = deepDefaults(bk, t);
  out.prologue.moodboard = out.prologue.moodboard || [];
  out.profile.cover = migrateBanner((bk.profile || {}).cover);
  if (!(bk.profile || {}).cover) out.profile.cover.h = 300;
  out.slideshow.slides = (out.slideshow.slides || []).filter(x => x && x.src);
  out.gallery = (bk.gallery || []).filter(x => x && x.src);
  out.design = bk.design ? deepDefaults(bk.design, newDesign()) : null;
  out.banners = {};
  Object.keys(bk.banners || {}).forEach(k => { out.banners[k] = migrateBanner(bk.banners[k]); });
  /* Banners used to cascade from one book-wide banner. Give every page its own
     copy of it once, so the picture the writer chose is still there but each
     page can now be changed on its own. */
  const seed = out.banners.__book;
  if (seed && seed.src) {
    Object.keys(NAV_ITEMS).forEach(v => { if (!out.banners[v]) out.banners[v] = migrateBanner(clone(seed)); });
  }
  delete out.banners.__book;
  if (!out.banners.profile) out.banners.profile = newBanner(0);
  out.chapters = (bk.chapters || []).map(c => deepDefaults(c, newChapter(1)));
  out.characters = (bk.characters || []).map(c => deepDefaults(c, newCharacter('sup')));
  if (!out.id) out.id = uid('bk');
  return out;
}
/* The whole saved project, rebuilt against this build's template. deepDefaults
   is what makes updating safe in both directions: a save from an older build
   picks up everything new, and a save from a NEWER build keeps every field it
   brought with it even though this build cannot yet display them. */
function migrateState(loaded) {
  const d = defaultState();
  const s = deepDefaults(loaded || {}, d);
  s.app.globalBanner = migrateBanner((loaded.app || {}).globalBanner);
  s.app.pageBanners = s.app.pageBanners || {};
  Object.keys(s.app.pageBanners).forEach(k => { s.app.pageBanners[k] = migrateBanner(s.app.pageBanners[k]); });
  /* same one-time seeding for the pages that belong to no book */
  if (s.app.globalBanner && s.app.globalBanner.src) {
    BOOKLESS_VIEWS.forEach(v => { if (!s.app.pageBanners[v]) s.app.pageBanners[v] = migrateBanner(clone(s.app.globalBanner)); });
  }
  s.app.showGuides = (loaded.app || {}).showGuides !== false;
  s.ui.lastEdited = s.ui.lastEdited || {};
  s.ui.helpClosed = s.ui.helpClosed || {};
  s.ui.shelf = Object.assign({ q: '', sort: 'updated', view: 'grid' }, s.ui.shelf || {});
  s.ui.shelf.q = '';
  s.books = (loaded.books || []).map(migrateBook);
  /* remember which build wrote this so the app can say so out loud */
  s.app.storage.savedByVersion = (loaded.__ver || (loaded.app && loaded.app.storage && loaded.app.storage.savedByVersion) || '');
  return s;
}

function applyTheme() {
  const el = document.getElementById('themeStyle');
  const bg = document.getElementById('pageBg');
  const { t: raw } = resolveTheme();
  const root = document.documentElement;
  const rs = root.style;
  const CLEAR = ['--brand-glow-a', '--brand-glow-b', '--accent', '--accent-2', '--bg-void', '--bg-deep', '--bg-panel', '--bg-panel-solid', '--surface-2',
    '--line', '--line-soft', '--line-hard', '--txt', '--txt-dim', '--txt-faint', '--radius', '--btn-radius',
    '--btn-caps', '--btn-track', '--btn-weight', '--pad', '--chrome', '--chrome-rail', '--field', '--field-focus',
    '--sunk', '--rte-bg', '--rte-fg', '--void', '--glow', '--on-accent', '--c-red', '--c-amber', '--c-lime',
    '--c-violet', '--c-red-t'];

  if (!raw) {
    el.textContent = '';
    bg.innerHTML = ''; bg.style.background = '';
    root.classList.remove('light-mode');
    CLEAR.forEach(k => rs.removeProperty(k));
    rs.setProperty('--accent', state.app.accent || '#23e0ff');
    rs.setProperty('--accent-2', state.app.accent2 || '#ff2b3d');
    document.body.classList.toggle('no-fx', !state.app.fx);
    return;
  }

  const th = newTheme(raw);
  const light = th.mode === 'light';
  const g = clamp(Number(th.glow) || 0, 0, 100) / 100;
  const pa = clamp(Number(th.panelAlpha) == null ? 100 : Number(th.panelAlpha), 15, 100) / 100;
  const radius = { sharp: '0px', clip: '2px', soft: '10px', round: '16px', pill: '22px' }[th.corner] || '2px';
  const btnRadius = { sharp: '0px', clip: '2px', soft: '8px', round: '10px', pill: '999px' }[th.corner] || '2px';
  const clip = th.corner === 'clip'
    ? 'polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))' : 'none';
  const pad = { cosy: '18px', normal: '14px', compact: '10px' }[th.density] || '14px';

  /* Derived palette ----------------------------------------------------- */
  const ink = th.ink || (light ? '#1c1e21' : '#cfe9f5');
  const lineBase = th.lineTint === 'accent' ? th.a : ink;
  const lineA = th.lineTint === 'accent' ? (.16 + g * .18) : (light ? .13 : .11);
  const chromeBg = light ? mixHex(th.panelBg, '#ffffff', .25) : mixHex(th.bg, '#000000', .25);
  const railBg = light ? mixHex(th.panelBg, '#ffffff', .1) : mixHex(th.bg, '#000000', .35);
  const surface2 = light ? mixHex(th.panelBg, '#ffffff', .4) : mixHex(th.panelBg, '#000000', .18);
  const field = light ? mixHex(th.panelBg, ink, .05) : mixHex(th.bg, '#000000', .3);
  const sunk = light ? rgba(ink, .04) : rgba('#000000', .3);
  const rteBg = light ? mixHex(th.panelBg, '#ffffff', .5) : mixHex(th.bg, '#000000', .2);
  const voidC = light ? mixHex(th.bg, ink, .1) : mixHex(th.bg, '#000000', .4);

  CLEAR.forEach(k => rs.removeProperty(k));
  const set = (k, v) => rs.setProperty(k, v);
  set('--accent', th.a); set('--accent-2', th.b);
  set('--bg-void', th.bg); set('--bg-deep', th.bg); set('--void', voidC);
  set('--bg-panel', rgba(th.panelBg, pa)); set('--bg-panel-solid', th.panelBg); set('--surface-2', surface2);
  set('--chrome', chromeBg); set('--chrome-rail', railBg);
  set('--field', field); set('--field-focus', light ? '#ffffff' : mixHex(th.bg, '#000000', .12));
  set('--sunk', sunk); set('--rte-bg', rteBg); set('--rte-fg', ink);
  set('--line', rgba(lineBase, lineA));
  set('--line-soft', rgba(lineBase, lineA * .5));
  set('--line-hard', rgba(lineBase, Math.min(.75, lineA * 2.2)));
  set('--txt', ink); set('--txt-dim', rgba(ink, .66)); set('--txt-faint', rgba(ink, .44));
  set('--radius', radius); set('--btn-radius', btnRadius); set('--pad', pad);
  set('--btn-caps', th.caps ? 'uppercase' : 'none');
  set('--btn-track', th.caps ? '1.1px' : '.2px');
  set('--btn-weight', th.caps ? '700' : '600');
  set('--glow', g > .05 ? '0 0 ' + (6 + g * 16) + 'px ' + rgba(th.a, .18 + g * .4) : '0 0 0 rgba(0,0,0,0)');
  set('--on-accent', readableOn(th.a));
  set('--brand-glow-a', g > .05 ? '0 0 10px ' + rgba(th.b, .5 + g * .4) + ',0 0 28px ' + rgba(th.b, g * .45) : 'none');
  set('--brand-glow-b', g > .05 ? '0 0 10px ' + rgba(th.a, .4 + g * .35) + ',0 0 26px ' + rgba(th.a, g * .35) : 'none');
  /* semantic colours need more punch on light backgrounds */
  set('--c-red', light ? '#c81e35' : '#ff2b3d');
  set('--c-red-t', light ? '#a81829' : '#ff8a95');
  set('--c-amber', light ? '#a86a10' : '#ffb43a');
  set('--c-lime', light ? '#2f7d32' : '#8dff4f');
  set('--c-violet', light ? '#6c3fc4' : '#c39bff');
  root.classList.toggle('light-mode', light);

  const shadowStrength = th.surface === 'raised' ? (light ? .16 : .55) : th.surface === 'outline' ? 0 : (light ? .08 : .42);
  el.textContent =
    'body{background:' + th.bg + ';}' +
    'body::before{' + bgLayerCSS(th) + '}' +

    '.panel.clip,.modal{clip-path:' + clip + ';}' +
    '.panel,.modal,.shelfcard,.post,.optcard,.lorecard,.shelfrow{border-radius:' + radius + ';}' +
    '.panel,.shelfcard,.post{box-shadow:0 10px 30px rgba(0,0,0,' + shadowStrength + ');}' +
    (th.surface === 'glass' ? '' : '.panel,.rail,.brandbar,.post,.shelfcard,.etoolbar,.prof-tabs{backdrop-filter:none;}') +
    (th.surface === 'outline' ? '.panel,.post,.shelfcard,.optcard{background:transparent;}' : '') +

    '.panel-hd h3,.brand-title,.banner-title,.prof-name,.stat .v,.modal-hd h3,.post-title,.shelf-id .nm,.prof-statbar .v,.shelf-stats b{font-family:' + headFontCSS(th.headFont) + ';}' +
    '.rte,.post-excerpt,.prose-c,.guide-bd,.helpbox{font-family:' + headFontCSS(th.bodyFont) + ';}' +
    'body,.btn,.navitem,.inp,.sel,.ta,.tab,.chip{font-family:' + headFontCSS(th.uiFont) + ';}' +
    (th.caps ? '' :
      '.panel-hd h3,.modal-hd h3{letter-spacing:.4px;text-transform:none;font-size:14px;}' +
      '.lb,.k,.stat .k,.prof-statbar .k,.shelf-stats span{text-transform:none;letter-spacing:.3px;font-size:11px;}' +
      '.chip{text-transform:none;letter-spacing:.2px;font-size:11px;}' +
      '.rail-label{text-transform:none;letter-spacing:.6px;font-size:11.5px;}' +
      '.tab{text-transform:none;letter-spacing:.2px;}' +
      '.banner-eyebrow{text-transform:none;letter-spacing:.6px;}') +
    (g < .06 ? '.btn:hover,.btn.solid{box-shadow:none;}.navitem.active{box-shadow:none;}' +
      '.corner-tl,.corner-br{display:none;}.prof-av{box-shadow:0 6px 18px rgba(0,0,0,.35);}' : '') +
    (light ? '.banner-fallback,.shelf-cover .banner-fallback{background:linear-gradient(135deg,' + rgba(th.a, .32) + ',' + rgba(th.b, .26) + ');}' +
      '.banner-scrim,.cvscrim{background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45));}' +

        $('#thBlV', r).textContent = d.bgBlur + 'px';
        previewTheme(d);
      };
      window.__themeSync = sync;
      ['thA', 'thB', 'thBg', 'thPanel', 'thInk', 'thMode', 'thPa', 'thGlow', 'thCorner', 'thSurface', 'thBgStyle',
        'thDensity', 'thLineTint', 'thCaps', 'thScan', 'thHead', 'thBody', 'thUi', 'thBgFit', 'thBgDim', 'thBgBlur']
        .forEach(id => { const e = $('#' + id, r); if (e) { e.addEventListener('input', sync); e.addEventListener('change', sync); } });
      $('#thBgUrl', r).addEventListener('input', debounce(() => { window.__themeDraft.bgImage = $('#thBgUrl', r).value.trim(); sync(); }, 400));
    },
    onClose: () => { applyTheme(); }
  });
}
/** Shows the draft immediately without committing it: the draft is promoted to
 *  the top of the cascade for one paint, then everything is put back. */
function previewTheme(d) {
  const b = currentBook();
  const saveApp = state.app.theme;
  const hadPage = !!(b && b.pageThemes && Object.prototype.hasOwnProperty.call(b.pageThemes, CURRENT_VIEW));
  const pageTheme = hadPage ? b.pageThemes[CURRENT_VIEW] : undefined;
  const bookTheme = b ? b.theme : null;
  if (b) { b.theme = null; if (b.pageThemes) delete b.pageThemes[CURRENT_VIEW]; }
  state.app.theme = d;
  applyTheme();
  state.app.theme = saveApp;
  if (b) { b.theme = bookTheme; if (hadPage) b.pageThemes[CURRENT_VIEW] = pageTheme; }
}
ACTIONS.themePreset = function (el) {
  const id = el.getAttribute('data-id');
  const d = themeById(id); if (!d) return;
  const prev = window.__themeDraft;
  d.bgImage = prev.bgImage; d.bgFit = prev.bgFit; d.bgDim = prev.bgDim; d.bgBlur = prev.bgBlur;
  window.__themeDraft = d;
  const r = el.closest('.modal');
  const set = (fid, val) => { const e = $('#' + fid, r); if (e) { if (e.type === 'checkbox') e.checked = !!val; else e.value = val; } };
  set('thA', d.a); set('thB', d.b); set('thBg', d.bg); set('thPanel', d.panelBg); set('thInk', d.ink);
  set('thMode', d.mode); set('thPa', d.panelAlpha); set('thGlow', d.glow); set('thCorner', d.corner);
  set('thSurface', d.surface); set('thBgStyle', d.bgStyle); set('thDensity', d.density); set('thLineTint', d.lineTint);
  set('thCaps', d.caps); set('thScan', d.scan); set('thHead', d.headFont); set('thBody', d.bodyFont); set('thUi', d.uiFont);
  $$('.themecard', r).forEach(c => c.classList.remove('sel')); el.classList.add('sel');
  if (window.__themeSync) window.__themeSync(); else previewTheme(d);
};
ACTIONS.thBgUpload = async function () {
  const f = await pickFile('image/*,image/gif'); if (!f) return;
  window.__themeDraft.bgImage = f.data;
  previewTheme(window.__themeDraft);
  toast('Background loaded' + (/gif/i.test(f.type) ? ' — your GIF will animate.' : '.'), 'ok');
};
ACTIONS.thBgClear = function () {
  window.__themeDraft.bgImage = '';
  const u = $('#thBgUrl'); if (u) u.value = '';
  previewTheme(window.__themeDraft);
};
ACTIONS.thScope = function (el) {
  const target = el.getAttribute('data-arg');
  const b = currentBook();
  const d = clone(window.__themeDraft);
  if (target === 'clear') {
    if (b) { b.theme = null; if (b.pageThemes) delete b.pageThemes[CURRENT_VIEW]; }
    state.app.theme = null;
    if (state.app.pageThemes) delete state.app.pageThemes[CURRENT_VIEW];
    toast('Look reset to the built-in TRON theme.', 'ok');
  } else if (target === 'app') {
    state.app.theme = d;
    if (b) { b.theme = null; if (b.pageThemes) delete b.pageThemes[CURRENT_VIEW]; }
    toast('Look applied everywhere.', 'ok');
  } else if (target === 'book' && b) {
    b.theme = d; if (b.pageThemes) delete b.pageThemes[CURRENT_VIEW]; toast('Look applied to this whole book.', 'ok');
  } else {
    if (b) { b.pageThemes = b.pageThemes || {}; b.pageThemes[CURRENT_VIEW] = d; }
    else { state.app.pageThemes = state.app.pageThemes || {}; state.app.pageThemes[CURRENT_VIEW] = d; }
    toast('Look applied to this page only.', 'ok');
  }
  markDirty(); closeModal(); applyTheme(); render();
};
