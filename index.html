}

/* -------------------------------- modals -------------------------------- */
const ModalStack = [];
function openModal(opts) {
  const o = Object.assign({ title: 'PANEL', body: '', footer: '', size: '', onMount: null, onClose: null, closeOnScrim: true }, opts || {});
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim';
  scrim.innerHTML =
    '<div class="modal ' + o.size + '" role="dialog" aria-modal="true">' +
      '<div class="modal-hd"><i data-lucide="' + attr(o.icon || 'square-pen') + '" style="width:16px;height:16px;color:var(--accent-2)"></i>' +
        '<h3>' + esc(o.title) + '</h3>' +
        '<button class="xclose" data-modal-close>✕</button></div>' +
      '<div class="modal-bd">' + o.body + '</div>' +
      (o.footer !== null ? '<div class="modal-ft">' + (o.footer || '<button class="btn ghost" data-modal-close>CLOSE</button>') + '</div>' : '') +
    '</div>';
  $('#modals').appendChild(scrim);
  ModalStack.push({ el: scrim, onClose: o.onClose });
  scrim.addEventListener('mousedown', (e) => { if (e.target === scrim && o.closeOnScrim) closeModal(); });
  scrim.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', () => closeModal()));
  icons();
  if (o.onMount) { try { o.onMount(scrim); } catch (e) { console.error(e); } }
  const f = scrim.querySelector('input,textarea,select'); if (f && !o.noFocus) setTimeout(() => f.focus(), 60);
  return scrim;
}
function closeModal() {
  const m = ModalStack.pop(); if (!m) return;
  if (m.onClose) { try { m.onClose(); } catch (e) { } }
  m.el.style.animation = 'fade .12s reverse';
  setTimeout(() => m.el.remove(), 110);
}
function closeAllModals() { while (ModalStack.length) closeModal(); }

function confirmDlg(title, msg, danger) {
  return new Promise((resolve) => {
    let done = false;
    openModal({
      title: title, size: 'narrow', icon: 'alert-triangle', closeOnScrim: false,
      body: '<div class="prose-c">' + msg + '</div>',
      footer: '<button class="btn ghost" data-cancel>CANCEL</button><button class="btn ' + (danger ? 'solid red' : 'solid') + '" data-ok>CONFIRM</button>',
      onMount: (r) => {
        r.querySelector('[data-ok]').addEventListener('click', () => { done = true; closeModal(); resolve(true); });
        r.querySelector('[data-cancel]').addEventListener('click', () => { closeModal(); });
      },
      onClose: () => { if (!done) resolve(false); }
    });
  });
}
function promptDlg(title, label, value, multiline) {
  return new Promise((resolve) => {
    let done = false;
    const field = multiline
      ? '<textarea class="ta" data-f rows="6">' + esc(value || '') + '</textarea>'
      : '<input class="inp" data-f value="' + attr(value || '') + '" />';
    openModal({
      title: title, size: 'narrow', icon: 'pencil-line', closeOnScrim: false,
      body: '<label class="fld"><span class="lb">' + esc(label) + '</span>' + field + '</label>',
      footer: '<button class="btn ghost" data-cancel>CANCEL</button><button class="btn solid" data-ok>APPLY</button>',
      onMount: (r) => {
        const f = r.querySelector('[data-f]');
        const ok = () => { done = true; const v = f.value; closeModal(); resolve(v); };
        r.querySelector('[data-ok]').addEventListener('click', ok);
        r.querySelector('[data-cancel]').addEventListener('click', () => closeModal());
        if (!multiline) f.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ok(); } });
      },
      onClose: () => { if (!done) resolve(null); }
    });
  });
}

/* ============================== PERSISTENCE ==============================
   Four layers, strongest first:
     1. VAULT FILE  — a real file on disk you choose once (File System Access
        API). Written automatically; survives clearing the browser, moving to
        a new machine, or reinstalling. This is the copy that matters.
     2. INDEXEDDB   — the working copy, written with a write-ahead record so a
        power cut mid-write can never leave a half-written state.
     3. SNAPSHOTS   — a rolling history inside IndexedDB you can roll back to.
     4. LOCALSTORAGE— a small last-resort mirror and the crash-flush target.
   ========================================================================= */
const DB_NAME = 'ravenbane-architect';
const DB_STORE = 'vault';
const DB_SNAPS = 'snapshots';
const DB_VER = 2;
const LS_KEY = 'ravenbane.architect.state.v1';
const LS_CRASH = 'ravenbane.architect.crashflush';
let _idb = null, ENGINE = 'localStorage';
let SAVE_SEQ = 0;

const HAS_FSA = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function';
let VAULT_HANDLE = null;         /* FileSystemFileHandle for the chosen file */
let VAULT_STATUS = 'none';       /* none | ready | needs-permission | error | unsupported */
let VAULT_LAST = null;
let VAULT_WRITING = false;

function idbOpen() {
  return new Promise((resolve) => {
    if (!('indexedDB' in window)) return resolve(null);
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return resolve(null); }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      if (!db.objectStoreNames.contains(DB_SNAPS)) db.createObjectStore(DB_SNAPS, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
    req.onblocked = () => resolve(null);
    setTimeout(() => resolve(req.result || null), 2500);
  });
}
function idbPut(key, val, store) {
  return new Promise((resolve, reject) => {
    if (!_idb) return reject(new Error('no idb'));
    const st = store || DB_STORE;
    const tx = _idb.transaction(st, 'readwrite');
    const os = tx.objectStore(st);
    if (os.keyPath) os.put(val); else os.put(val, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
}
function idbGet(key, store) {
  return new Promise((resolve, reject) => {
    if (!_idb) return reject(new Error('no idb'));
    const tx = _idb.transaction(store || DB_STORE, 'readonly');
    const rq = tx.objectStore(store || DB_STORE).get(key);
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}
function idbDel(key, store) {
  return new Promise((resolve) => {
    if (!_idb) return resolve(false);
    const tx = _idb.transaction(store || DB_STORE, 'readwrite');
    tx.objectStore(store || DB_STORE).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => resolve(false);
  });
}
function idbAll(store) {
  return new Promise((resolve) => {
    if (!_idb) return resolve([]);
    try {
      const tx = _idb.transaction(store, 'readonly');
      const rq = tx.objectStore(store).getAll();
      rq.onsuccess = () => resolve(rq.result || []);
      rq.onerror = () => resolve([]);
    } catch (e) { resolve([]); }
  });
}

/* ========================= VERSION / UPDATE PROOFING ======================
   Everything written to disk is stamped with the app version and the data
   format it was written by. On the way back in:
     · older data is filled out with whatever this build added, and nothing it
       already had is thrown away;
     · newer data is loaded as-is — unknown fields are carried through
       untouched, so opening a newer save in an older build cannot strip it;
     · when several copies exist, the newest one wins.
   That means updating the app is: download the new file, delete the old one,
   point it back at your vault file or storage folder. No export, no re-import.
   ========================================================================= */
const APP_VERSION = '7.1.0';
const APP_BUILD = '2026-08-18';
const DATA_FORMAT = 3;            /* shape of the saved state */

/** -1 / 0 / 1 — compares dotted version strings without semver library. */
function verCmp(a, b) {
  const pa = String(a || '0').split('.').map(n => parseInt(n, 10) || 0);
  const pb = String(b || '0').split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}
/** Every saved artefact gets the same identity stamp. */
function stampVersion(o) {
  o.appVersion = APP_VERSION;
  o.appBuild = APP_BUILD;
  o.dataFormat = DATA_FORMAT;
  o.savedAt = nowISO();
  return o;
}
/** The best "when was this written" we can read out of any saved artefact. */
function payloadTime(o) {
  if (!o || typeof o !== 'object') return 0;
  const t = o.savedAt || o.exported || o.__at || (o.state && o.state.__at) || '';
  const n = t ? new Date(t).getTime() : 0;
  return isNaN(n) ? 0 : n;
}
function payloadVersion(o) {
  if (!o || typeof o !== 'object') return '';
  return o.appVersion || (o.state && o.state.__ver) || o.__ver || '';
}
const isPlainObj = (o) => !!o && typeof o === 'object' && !Array.isArray(o);
/** Deep-fill missing keys from a template while keeping EVERY key the saved
    copy already has — including ones this build has never heard of. */
function deepDefaults(src, def) {
  if (!isPlainObj(def)) return src === undefined ? (def && typeof def === 'object' ? clone(def) : def) : src;
  const out = {};
  const keys = Object.keys(def);
  if (isPlainObj(src)) Object.keys(src).forEach(k => { if (keys.indexOf(k) < 0) keys.push(k); });
  keys.forEach(k => {
    const dv = def[k];
    const sv = isPlainObj(src) ? src[k] : undefined;
    if (sv === undefined) out[k] = (dv && typeof dv === 'object') ? clone(dv) : dv;
    else if (isPlainObj(dv) && isPlainObj(sv)) out[k] = deepDefaults(sv, dv);
    else out[k] = sv;
  });
  return out;
}

/* --------------------------- the backup payload -------------------------- */
const BACKUP_MAGIC = 'RAVENBANE-ARCHITECT-VAULT';
/** One object containing absolutely everything, with a checksum. */
function buildBackup(reason) {
  const payload = stampVersion({
    magic: BACKUP_MAGIC,
    format: DATA_FORMAT,
    app: 'RAVENBANE · ARCHITECT',
    exported: nowISO(),
    reason: reason || 'manual',
    seq: ++SAVE_SEQ,
    stats: {
      books: state.books.length,
      words: state.books.reduce((n, b) => n + bookWords(b), 0),
      chapters: state.books.reduce((n, b) => n + b.chapters.length, 0),
      characters: state.books.reduce((n, b) => n + b.characters.length, 0)
    },
    state: state
  });
  const body = JSON.stringify(payload);
  payload.checksum = hashString(body);
  return payload;
}
/** Small, fast, dependency-free checksum — enough to spot a truncated file. */
function hashString(str) {
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = (h1 ^ c) >>> 0; h1 = (h1 * 16777619) >>> 0;
    h2 = (h2 + c * (i % 97 + 1)) >>> 0;
  }
  return (h1.toString(16) + '-' + h2.toString(16) + '-' + str.length.toString(36));
}
function verifyBackup(obj) {
  if (!obj || typeof obj !== 'object') return { ok: false, why: 'Not a readable file.' };
  const hasState = obj.state && Array.isArray(obj.state.books);
  const hasBooks = Array.isArray(obj.books);
  const bare = Array.isArray(obj);
  if (!hasState && !hasBooks && !bare) return { ok: false, why: 'No RAVENBANE project data inside this file.' };
  let checksum = 'not checked';
  if (obj.checksum && obj.magic === BACKUP_MAGIC) {
    const copy = Object.assign({}, obj); delete copy.checksum;
    checksum = hashString(JSON.stringify(copy)) === obj.checksum ? 'verified' : 'MISMATCH';
  }
  return { ok: true, checksum: checksum, books: hasState ? obj.state.books.length : (hasBooks ? obj.books.length : obj.length) };
}

/* ------------------------------ vault file ------------------------------- */
async function handlePerm(h, request) {
  if (!h || !h.queryPermission) return true;
  const opts = { mode: 'readwrite' };
  try {
    if ((await h.queryPermission(opts)) === 'granted') return true;
    if (request && (await h.requestPermission(opts)) === 'granted') return true;
  } catch (e) { }
  return false;
}
async function vaultRestoreHandle() {
  if (!HAS_FSA) { VAULT_STATUS = 'unsupported'; return; }
  try {
    const rec = await idbGet('vaultHandle');
    if (!rec || !rec.handle) { VAULT_STATUS = 'none'; return; }
    VAULT_HANDLE = rec.handle;
    VAULT_LAST = rec.at || null;
    VAULT_STATUS = (await handlePerm(VAULT_HANDLE, false)) ? 'ready' : 'needs-permission';
  } catch (e) { VAULT_STATUS = 'none'; }
}
async function vaultWriteNow(reason) {
  if (!VAULT_HANDLE || VAULT_WRITING) return false;
  if (!(await handlePerm(VAULT_HANDLE, false))) { VAULT_STATUS = 'needs-permission'; paintVaultPill(); return false; }
  VAULT_WRITING = true;
  try {
    /* createWritable() writes to a swap file and only replaces the real one on
       close(), so an interrupted write leaves the previous file intact. */
    const w = await VAULT_HANDLE.createWritable();
    await w.write(JSON.stringify(buildBackup(reason || 'autosave'), null, 1));
    await w.close();
    VAULT_LAST = nowISO();
    VAULT_STATUS = 'ready';
    try { await idbPut('vaultHandle', { handle: VAULT_HANDLE, name: VAULT_HANDLE.name, at: VAULT_LAST }); } catch (e) { }
    paintVaultPill();
    return true;
  } catch (e) {
    console.warn('vault write failed', e);
    VAULT_STATUS = 'error';
    paintVaultPill();
    return false;
  } finally { VAULT_WRITING = false; }
}

/* ======================= PERSONAL STORAGE FOLDER =========================
   A whole folder of your own — Documents, Dropbox, OneDrive, a USB stick —
   that the app keeps up to date:

     <your folder>/ravenbane-vault.json          ← the live copy, always current
     <your folder>/backups/ravenbane-<stamp>.json ← a rolling set of dated copies

   This is the piece that makes updating painless. Download a newer build of
   the app, delete the old file, press "Reconnect my storage folder", and the
   app reads the newest thing in there and carries on. Nothing to export,
   nothing to re-import, nothing lost.
   ========================================================================= */
const HAS_FSD = typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';
const FOLDER_MAIN = 'ravenbane-vault.json';
const FOLDER_BAK = 'backups';
let FOLDER_HANDLE = null;
let FOLDER_STATUS = 'none';      /* none | ready | needs-permission | error | unsupported */
let FOLDER_LAST = null;
let FOLDER_WRITING = false;

async function folderRestoreHandle() {
  if (!HAS_FSD) { FOLDER_STATUS = 'unsupported'; return; }
  try {
    const rec = await idbGet('folderHandle');
    if (!rec || !rec.handle) { FOLDER_STATUS = 'none'; return; }
    FOLDER_HANDLE = rec.handle;
    FOLDER_LAST = rec.at || null;
    FOLDER_STATUS = (await handlePerm(FOLDER_HANDLE, false)) ? 'ready' : 'needs-permission';
  } catch (e) { FOLDER_STATUS = 'none'; }
}
async function folderWriteFile(dir, name, text) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();      /* swap-file write: atomic on close */
  await w.write(text);
  await w.close();
  return fh;
}
/** Write the live copy, and a dated copy into backups/ at most once a run-hour. */
async function folderWriteNow(reason, withBackup) {
  if (!FOLDER_HANDLE || FOLDER_WRITING) return false;
  if (!(await handlePerm(FOLDER_HANDLE, false))) { FOLDER_STATUS = 'needs-permission'; paintVaultPill(); return false; }
  FOLDER_WRITING = true;
  try {
    const text = JSON.stringify(buildBackup(reason || 'folder'), null, 1);
    await folderWriteFile(FOLDER_HANDLE, FOLDER_MAIN, text);
    if (withBackup) {
      const bak = await FOLDER_HANDLE.getDirectoryHandle(FOLDER_BAK, { create: true });
      await folderWriteFile(bak, 'ravenbane-' + dstamp() + '-' + String(Date.now()).slice(-6) + '.json', text);
      await folderTrim(bak);
    }
    FOLDER_LAST = nowISO();
    FOLDER_STATUS = 'ready';
    await idbPut('folderHandle', { handle: FOLDER_HANDLE, name: FOLDER_HANDLE.name, at: FOLDER_LAST });
    paintVaultPill();
    return true;
  } catch (e) {
    console.warn('folder write failed', e);
    FOLDER_STATUS = 'error'; paintVaultPill(); return false;
  } finally { FOLDER_WRITING = false; }
}
async function folderTrim(bak) {
  const keep = clamp(Number(state.app.storage.folderCopies) || 8, 2, 60);
  const names = [];
  try { for await (const [n, h] of bak.entries()) if (h.kind === 'file' && /^ravenbane-.*\.json$/.test(n)) names.push(n); }
  catch (e) { return; }
  names.sort();
  for (let i = 0; i < names.length - keep; i++) { try { await bak.removeEntry(names[i]); } catch (e) { } }
}
/** Read every RAVENBANE file in the folder and hand back the newest one. */
async function folderReadNewest(dir) {
  const found = [];
  const readOne = async (h, where) => {
    try {
      const txt = await (await h.getFile()).text();
      const obj = JSON.parse(txt);
      if (verifyBackup(obj).ok) found.push({ obj: obj, where: where, t: payloadTime(obj) });
    } catch (e) { }
  };
  try {
    for await (const [n, h] of dir.entries()) {
      if (h.kind === 'file' && /\.(json|rvbn)$/i.test(n)) await readOne(h, n);
      else if (h.kind === 'directory' && n === FOLDER_BAK) {
        for await (const [n2, h2] of h.entries()) if (h2.kind === 'file' && /\.json$/i.test(n2)) await readOne(h2, FOLDER_BAK + '/' + n2);
      }
    }
  } catch (e) { }
  found.sort((a, b) => b.t - a.t);
  return found;
}

/* ------------------------------ snapshots -------------------------------- */
async function snapshotTake(label, silent) {
  if (!_idb) return false;
  try {
    const payload = buildBackup('snapshot');
    const rec = {
      id: 'snap_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      at: nowISO(), label: label || 'Automatic', seq: payload.seq,
      bytes: JSON.stringify(payload).length,
      stats: payload.stats,
      data: payload
    };
    await idbPut(null, rec, DB_SNAPS);
    await snapshotTrim();
    if (!silent) toast('Snapshot saved.', 'ok');
    return true;
  } catch (e) { console.warn('snapshot failed', e); return false; }
}
async function snapshotTrim() {
  const keep = clamp(Number(state.app.storage.snapshotKeep) || 12, 3, 60);
  const all = (await idbAll(DB_SNAPS)).sort((a, b) => new Date(b.at) - new Date(a.at));
  /* always preserve anything the writer labelled by hand */
  const auto = all.filter(s => !s.pinned);
  for (let i = keep; i < auto.length; i++) await idbDel(auto[i].id, DB_SNAPS);
}
async function snapshotList() {
  return (await idbAll(DB_SNAPS)).sort((a, b) => new Date(b.at) - new Date(a.at));

/* -------------------------- core read / write ---------------------------- */
async function storageInit() {
  _idb = await idbOpen();
  ENGINE = _idb ? 'IndexedDB' : 'localStorage';
  const el = $('#railEngine'); if (el) el.textContent = _idb ? 'IDB' : 'LS';
  await vaultRestoreHandle();
  await folderRestoreHandle();
}
async function storageLoad() {
  /* write-ahead recovery: a `pending` newer than `state` means the last write
     was interrupted, so the pending copy is the freshest complete data. */
  let main = null, pending = null;
  try { if (_idb) main = await idbGet('state'); } catch (e) { console.warn('IDB read failed', e); }
  try { if (_idb) pending = await idbGet('pending'); } catch (e) { }
  if (typeof main === 'string') { try { main = JSON.parse(main); } catch (e) { main = null; } }
  if (typeof pending === 'string') { try { pending = JSON.parse(pending); } catch (e) { pending = null; } }

  let crash = null;
  try {
    const raw = localStorage.getItem(LS_CRASH);
    if (raw) crash = JSON.parse(raw);
  } catch (e) { }

  const cand = [];
  if (main) cand.push({ src: 'main', seq: main.__seq || 0, at: main.__at || '', data: main });
  if (pending) cand.push({ src: 'pending', seq: pending.__seq || 0, at: pending.__at || '', data: pending });
  if (crash) cand.push({ src: 'crash', seq: crash.__seq || 0, at: crash.__at || '', data: crash });
  if (!cand.length) {
    try { const s = localStorage.getItem(LS_KEY); if (s) return { data: JSON.parse(s), recovered: false }; } catch (e) { }
    return null;
  }
  /* newest wins — by clock first, because a sequence number only means
     anything within one install; a file carried in from another machine or a
     newer build of the app is compared on when it was actually written. */
  cand.forEach(c => { c.t = payloadTime(c.data); });
  cand.sort((a, b) => (b.t - a.t) || (b.seq - a.seq) || (String(b.at).localeCompare(String(a.at))));
  const win = cand[0];
  SAVE_SEQ = Math.max(SAVE_SEQ, win.seq || 0);
  return { data: win.data, recovered: win.src !== 'main', from: win.src, alternatives: cand.length,

}

<p>A prologue exists for exactly one reason: to create a <strong>question the reader must carry</strong> into chapter one. If it delivers history, geography, or a lecture, it is not a prologue — it is an appendix that wandered to the front.</p>
<h5>The four legitimate prologue types</h5>
<ul>
<li><strong>The Distant Detonation</strong> — an event years or centuries before the main story whose consequence is still travelling toward your protagonist. <em>Why it works:</em> the reader now reads chapter one looking for the impact crater.</li>
<li><strong>The Doomed Witness</strong> — a POV who will not survive, showing the threat in its full form so that chapter one's mundanity feels loaded. <em>Rule:</em> make the witness specific and likeable in under 800 words or the death is furniture.</li>

<p>A chapter break is the reader's natural exit. Your job is to make the exit inconvenient. That is not achieved by cutting mid-sentence — it is achieved by <strong>opening a loop one line before you close the chapter</strong>.</p>
<h5>Seven chapter-out patterns that work</h5>
<ul>

<p>Tension should not climb in a straight line — a monotone climb numbs. Design in a repeating 4-beat wave: <em>pressure → release → deeper pressure → smaller release</em>. Each release should be shorter than the last, so the reader's breathing room narrows as the book progresses.</p>

<p>A POV is not a camera position — it is a <strong>contract of consciousness</strong>. Each one must have its own want, its own information gap, and its own voice signature. If two POVs know the same things and want the same thing, delete one and give its scenes to the other.</p>
<h5>The four-question POV audit</h5>
<ol>
<li><strong>What does only this POV know?</strong> (If nothing — cut it.)</li>

<li><strong>Strict alternation (A/B/A/B)</strong> — best for two-hander romance and duel narratives. Predictable rhythm becomes a comfort; violate it once, late, for maximum effect.</li>

<p>On-the-nose dialogue is two characters exchanging accurate information. Real dialogue is two people <strong>negotiating</strong> while pretending to discuss something else. Write the argument they are actually having, then bury it under the argument they are willing to have.</p>
<h5>Tools</h5>
<ul>
<li><strong>Deflection</strong> — answer a different question than the one asked.</li>
<li><strong>Specificity as weapon</strong> — "You were at the Kessler place until four." Details prove surveillance, and surveillance is a threat.</li>
<li><strong>Interruption asymmetry</strong> — whoever interrupts holds power; flip it at the turn of the scene.</li>
<li><strong>Silence with business</strong> — let a character do something with their hands instead of replying.</li>
<li><strong>Repetition with a shift</strong> — the second time a phrase returns, it should mean something worse.</li>
</ul>
<h5>Mechanics</h5>
<ul>
<li>Use <code>said</code>. Exotic tags ("he opined") pull the reader out. Action beats replace adverbs.</li>

<p>Layered passes beat holistic tinkering. Each pass has one question and you ignore all other problems while making it.</p>

<li><strong>Causality pass</strong> — Replace every "and then" with "therefore" or "but". Coincidence audit: any event that solves a problem without a character choosing it is a debt.</li>
<li><strong>Character pass</strong> — one character at a time, front to back. Consistency of want, escalation of cost, voice drift.</li>
<li><strong>Tension pass</strong> — the heatmap. Flat runs get cut or escalated. Two consecutive quiet chapters become one.</li>
<li><strong>Line pass</strong> — filter words, repetitions, clichés, rhythm. This is where the Cliché &amp; Repetition Scanner earns its keep.</li>
<li><strong>Read-aloud pass</strong> — the only reliable detector of false dialogue and accidental comedy.</li>
<li><strong>Continuity pass</strong> — names, eye colour, day of the week, phases of the moon, who knows what and when.</li>

/** Repairs the saved sidebar layout: drops unknown ids, appends any page the
 *  user has never seen so new features can never become unreachable. */
function normaliseNav() {
  let nav = state.ui.nav;
  if (!Array.isArray(nav) || !nav.length) nav = defaultNav();
  const seen = {};
  nav = nav.filter(g => g && Array.isArray(g.items)).map(g => ({
    id: g.id || uid('g'), label: g.label || 'GROUP', tone: g.tone || '', open: g.open !== false,
    items: g.items.filter(v => NAV_ITEMS[v] && !seen[v] && (seen[v] = 1))
  }));
  const missing = Object.keys(NAV_ITEMS).filter(v => !seen[v]);
  if (missing.length) {
    missing.forEach(v => {
      const wanted = NAV_HOME[v] || 'g_profiles';
      const g = nav.find(x => x.id === wanted) || nav.find(x => x.id === 'g_profiles') || nav[0];
      if (g) g.items.push(v);
      else nav.push({ id: uid('g'), label: 'MORE', tone: '', open: true, items: [v] });
    });
  }
  /* One-time relocation: 'All My Books' used to live under COMMAND. Move it to
     the top of BOOK PROFILES once, leaving any other arrangement untouched. */
  if (state.ui.navV !== 2) {
    const prof = nav.find(g => g.id === 'g_profiles');
    if (prof) {
      nav.forEach(g => { if (g !== prof) g.items = g.items.filter(v => v !== 'library'); });
      prof.items = ['library'].concat(prof.items.filter(v => v !== 'library'));
    }
    state.ui.navV = 2;
  }
  state.ui.nav = nav;
  return nav;
}

/* -------------------------------- BANNER --------------------------------
   Cascade: this page's banner  →  this book's banner  →  the global banner.
   Heights are free-form pixels so any banner can be any size.            */
/* Pages that ARE a banner already — a profile cover, a character cover — never
   get a second strip on top of them. */
const HERO_VIEWS = ['profile', 'character'];
/* Pages that belong to no particular book, so their banner is kept app-wide. */
const BOOKLESS_VIEWS = ['library', 'settings', 'storage', 'exportv', 'gdoc', 'masterclass'];

function bannerStoreFor(view) {
  const b = currentBook();
  if (b && BOOKLESS_VIEWS.indexOf(view) < 0) { b.banners = b.banners || {}; return b.banners; }
  state.app.pageBanners = state.app.pageBanners || {};
  return state.app.pageBanners;
}
/* Every page owns its own banner. Nothing cascades and nothing follows you
   around — changing one page's banner changes exactly that page. */
function activeBanner(view) {
  view = view || CURRENT_VIEW;
  const store = bannerStoreFor(view);
  if (!store[view]) store[view] = newBanner(230);
  return { data: store[view], scope: 'page', view: view };
}

function bannerMediaHTML(bn) {
  const op = (bn.opacity == null ? 100 : bn.opacity) / 100;
  const blur = Number(bn.blur) || 0;
  const zoom = clamp(Number(bn.zoom == null ? 100 : bn.zoom), 100, 300) / 100;
  const scale = zoom * (blur ? 1 + blur / 40 : 1);
  const style = 'object-position:' + (bn.offsetX == null ? 50 : bn.offsetX) + '% ' + (bn.offset == null ? 50 : bn.offset) +
    '%;object-fit:' + (bn.fit || 'cover') + ';opacity:' + op +
    (blur ? ';filter:blur(' + blur + 'px)' : '') +
    (scale !== 1 ? ';transform:scale(' + scale.toFixed(3) + ')' : '');

    return '<video class="banner-media" src="' + attr(bn.src) + '" autoplay muted loop playsinline style="' + style + '"></video>';
  }
  if (bn.src) {
    /* Animated GIFs play automatically in an <img>, so GIF, APNG, WEBP and
       static images all share this one path. */
    return '<img class="banner-media" src="' + attr(bn.src) + '" alt="" style="' + style + '" onerror="this.style.display=\'none\'" />';

}

/* Drag the banner picture to reframe it — the same gesture as a cover. */
document.addEventListener('pointerdown', (e) => {
  const frame = e.target.closest && e.target.closest('.banner.draggable-banner');
  if (!frame) return;
  if (e.target.closest('button, a, input, select, textarea, .banner-tools')) return;
  const media = frame.querySelector('.banner-media');
  if (!media) return;
  const { data } = activeBanner();
  const box = frame.getBoundingClientRect();
  if (!box.width || !box.height) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY;
  const x0 = clamp(Number(data.offsetX == null ? 50 : data.offsetX), 0, 100);
  const y0 = clamp(Number(data.offset == null ? 50 : data.offset), 0, 100);
  frame.classList.add('dragging');
  const move = (ev) => {
    data.offsetX = clamp(Math.round(x0 - ((ev.clientX - sx) / box.width) * 100), 0, 100);
    data.offset = clamp(Math.round(y0 - ((ev.clientY - sy) / box.height) * 100), 0, 100);
    media.style.objectPosition = data.offsetX + '% ' + data.offset + '%';
    const a = document.getElementById('bnOffV'), c = document.getElementById('bnOffXV');
    if (a) a.textContent = data.offset + '%';
    if (c) c.textContent = data.offsetX + '%';
    const sa = document.getElementById('bnOffset'), sc = document.getElementById('bnOffsetX');
    if (sa) sa.value = data.offset;
    if (sc) sc.value = data.offsetX;
  };
  const up = () => {
    frame.classList.remove('dragging');
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    markDirty();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
});

/* ---- sidebar drag & drop: pages between groups, and groups themselves ---- */
function wireNavDrag() {
  const nav = $('#railNav'); if (!nav) return;
  let dragItem = null, dragGroup = null;

  nav.querySelectorAll('[data-navitem]').forEach(el => {
    el.addEventListener('dragstart', (e) => {
      e.stopPropagation();
      dragItem = el.getAttribute('data-navitem'); dragGroup = null;
      el.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', dragItem); } catch (_) { }
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); nav.querySelectorAll('.dragover').forEach(x => x.classList.remove('dragover')); });
    el.addEventListener('dragover', (e) => { if (!dragItem) return; e.preventDefault(); e.stopPropagation(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', () => el.classList.remove('dragover'));
    el.addEventListener('drop', (e) => {
      if (!dragItem) return;
      e.preventDefault(); e.stopPropagation(); el.classList.remove('dragover');
      moveNavItem(dragItem, el.getAttribute('data-ing'), el.getAttribute('data-navitem'));
    });
  });
  nav.querySelectorAll('[data-groupitems]').forEach(box => {
    box.addEventListener('dragover', (e) => { if (!dragItem) return; e.preventDefault(); box.classList.add('dragover'); });
    box.addEventListener('dragleave', () => box.classList.remove('dragover'));
    box.addEventListener('drop', (e) => {
      if (!dragItem) return;
      e.preventDefault(); box.classList.remove('dragover');
      moveNavItem(dragItem, box.getAttribute('data-groupitems'), null);
    });
  });
  nav.querySelectorAll('[data-group]').forEach(el => {
    el.addEventListener('dragstart', (e) => {
      if (dragItem) return;
      dragGroup = el.getAttribute('data-group');
      el.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', dragGroup); } catch (_) { }
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); dragGroup = null; });
    el.addEventListener('dragover', (e) => { if (!dragGroup) return; e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', () => el.classList.remove('dragover'));
    el.addEventListener('drop', (e) => {
      if (!dragGroup) return;
      e.preventDefault(); el.classList.remove('dragover');
      const nv = state.ui.nav;
      const from = nv.findIndex(g => g.id === dragGroup);
      const to = nv.findIndex(g => g.id === el.getAttribute('data-group'));
      if (from < 0 || to < 0 || from === to) return;
      const [m] = nv.splice(from, 1); nv.splice(to, 0, m);
      markDirty(); renderRail(); icons();
    });
  });
}
function moveNavItem(view, toGroupId, beforeView) {
  const nv = state.ui.nav;
  nv.forEach(g => { g.items = g.items.filter(v => v !== view); });
  const g = nv.find(x => x.id === toGroupId) || nv[0];
  if (!g) return;
  const at = beforeView ? g.items.indexOf(beforeView) : -1;
  if (at === -1) g.items.push(view); else g.items.splice(at, 0, view);
  markDirty(); renderRail(); icons();
}
/** Keyboard/touch equivalent of dragging a page — HTML5 drag does not work
 *  on phones or tablets, so every drag target also has buttons. */
ACTIONS.navMoveItem = function (el) {
  const v = el.getAttribute('data-v'), d = Number(el.getAttribute('data-d'));
  const nav = state.ui.nav;
  const gi = nav.findIndex(g => g.items.indexOf(v) !== -1);
  if (gi < 0) return;
  const g = nav[gi], i = g.items.indexOf(v), j = i + d;
  if (j >= 0 && j < g.items.length) {
    g.items.splice(i, 1); g.items.splice(j, 0, v);
  } else {
    /* past the end of a group — hop into the neighbouring one */
    const tgt = nav[gi + d];
    if (!tgt) return;
    g.items.splice(i, 1);
    if (d < 0) tgt.items.push(v); else tgt.items.unshift(v);
    tgt.open = true;
  }
  markDirty(); renderRail(); icons();
};
ACTIONS.navMoveGroup = function (el) {
  const nav = state.ui.nav;
  const i = nav.findIndex(g => g.id === el.getAttribute('data-g'));
  const j = i + Number(el.getAttribute('data-d'));
  if (i < 0 || j < 0 || j >= nav.length) return;
  const [m] = nav.splice(i, 1); nav.splice(j, 0, m);
  markDirty(); renderRail(); icons();
};
/* Send any page into any group, without needing to drag it — the reliable
   route on a touchscreen, and quicker than dragging on a long menu. */
ACTIONS.navSendTo = function (el) {
  const gid = el.value; if (!gid) return;
  const v = el.getAttribute('data-v');
  const nav = normaliseNav();
  nav.forEach(g => { g.items = g.items.filter(x => x !== v); });
  const target = nav.find(g => g.id === gid);
  if (target) target.items.push(v);
  state.ui.nav = nav;
  markDirty(); renderRail(); icons();
  toast('Moved to ' + (target ? target.label : 'the menu') + '.', 'ok');
};

/* ------------------------------ BOOK CRUD ------------------------------- */
function bookWords(b) {
  if (!b) return 0;
  let w = wordsOfHTML(b.prologue && b.prologue.html);
  (b.chapters || []).forEach(c => { w += wordsOfHTML(c.html); });
  return w;
}
function bookCompletion(b) {
  if (!b) return 0;
  const goal = Number(b.goalWords) || 80000;
  return clamp(Math.round((bookWords(b) / goal) * 100), 0, 100);
}

ACTIONS.globalSearch = function () {
  openModal({
    title: 'GRID SEARCH', icon: 'search', size: '',
    body: '<label class="fld"><span class="lb">Search chapters, characters, notes, outlines, links — across every project</span>' +
          '<input class="inp" id="gsQ" placeholder="Type at least 2 characters…"></label>' +
          '<div id="gsOut" class="mt10"></div>',
    footer: '<span class="faint fs11 mono" style="margin-right:auto">CTRL/⌘ + K</span><button class="btn ghost" data-modal-close>CLOSE</button>',
    onMount: (r) => {
      const q = $('#gsQ', r), out = $('#gsOut', r);
      const run = debounce(() => {
        const term = q.value.trim().toLowerCase();
        if (term.length < 2) { out.innerHTML = '<div class="empty"><i data-lucide="search"></i><h4>AWAITING QUERY</h4></div>'; icons(); return; }
        const hits = [];
        state.books.forEach(bk => {
          const add = (kind, label, text, view, id) => {
            const t = stripHTML(text || '');
            const i = t.toLowerCase().indexOf(term);
            if (i === -1) return;
            hits.push({ bk: bk, kind: kind, label: label, view: view, id: id, snip: t.slice(Math.max(0, i - 60), i + 110) });
          };
          if (bk.title.toLowerCase().includes(term)) hits.push({ bk: bk, kind: 'BOOK', label: bk.title, view: 'dashboard', snip: bk.logline || '' });
          add('LOGLINE', bk.title, bk.logline, 'dashboard');
          add('PROLOGUE', 'Prologue', bk.prologue.html, 'prologue');
          add('DEDICATION', 'Dedication', bk.dedication.text, 'title');
          (bk.chapters || []).forEach((c, i2) => { add('CHAPTER', 'Ch ' + (i2 + 1) + ': ' + c.title, c.html, 'chapters', c.id); add('SCENE NOTES', 'Ch ' + (i2 + 1) + ' notes', c.notes, 'chapters', c.id); });
          (bk.characters || []).forEach(c => { add('CHARACTER', c.name, [c.name, c.aliases, c.motivation, c.flaws, c.voice, c.backstory, c.notes].join(' \n '), 'characters', c.id); });
          (bk.outline.beats || []).forEach(bt => add('BEAT', bt.title || 'Beat', (bt.title || '') + ' ' + (bt.text || ''), 'outline'));
          (bk.lore || []).forEach(l => add('LORE', l.name || 'Lore entry', [l.name, l.type, l.summary, l.detail, l.tags].join(' \n '), 'profile'));
          (bk.gallery || []).forEach(ph => add('PHOTO', ph.title || 'Photo', [ph.title, ph.desc, ph.tags].join(' \n '), 'profile'));
          Object.keys(bk.about || {}).forEach(k => { if (String(bk.about[k] || '').trim()) add('ABOUT', k, bk.about[k], 'profile'); });
          Object.keys(bk.outline.answers || {}).forEach(k => add('STORY Q', k, bk.outline.answers[k], 'outline'));
          (bk.research.links || []).forEach(l => add('LINK', l.title || l.url, [l.title, l.url, l.notes, l.tags].join(' '), 'research'));
          (bk.research.pins || []).forEach(p => add('PIN', p.caption || 'Pin', [p.caption, p.text].join(' '), 'research'));
        });
        out.innerHTML = hits.length
          ? '<div class="mono fs11 faint mb6">' + hits.length + ' MATCHES</div>' + hits.slice(0, 60).map(h =>
              '<button class="optcard w100 mb6" style="text-align:left" data-act="gsGo" data-bid="' + h.bk.id + '" data-view="' + h.view + '" data-cid="' + (h.id || '') + '" data-kind="' + attr(h.kind) + '">' +
              '<div class="flex between center gap8"><span class="chip cy">' + esc(h.kind) + '</span><span class="mono fs10 faint">' + esc(h.bk.title) + '</span></div>' +
              '<div style="font-weight:700;color:var(--txt);margin:4px 0 2px">' + esc(h.label) + '</div>' +
              '<div class="fs12 muted">…' + esc(h.snip) + '…</div></button>').join('')
          : '<div class="empty"><i data-lucide="search"></i><h4>NO MATCHES</h4><div class="fs12">Nothing on the grid matches “' + esc(term) + '”.</div></div>';
        icons();
      }, 200);
      q.addEventListener('input', run);
      out.innerHTML = '<div class="empty"><i data-lucide="search"></i><h4>AWAITING QUERY</h4></div>'; icons();
    }
  });
};

function noBookPanel(msg) {
  return '<div class="panel clip"><div class="corner-tl"></div><div class="corner-br"></div><div class="panel-bd">' +
    '<div class="empty"><i data-lucide="book-marked"></i><h4>NO ACTIVE PROJECT</h4>' +
    '<div class="fs13 mb14">' + esc(msg || 'Initialise a book project to bring this module online.') + '</div>' +
    '<button class="btn solid" data-act="newBook"><i data-lucide="plus"></i>NEW BOOK PROJECT</button></div></div></div>';
}

function tensionColor(t) {
  const v = clamp(Number(t) || 0, 0, 10);
  if (v <= 2) return '#1f6f86';
  if (v <= 4) return '#23e0ff';
  if (v <= 6) return '#8dff4f';
  if (v <= 8) return '#ffb43a';
  return '#ff2b3d';
}

function heatmapHTML(b) {
  const units = [];
  if (b.prologue && wordsOfHTML(b.prologue.html) > 0) units.push({ label: 'PRO', w: wordsOfHTML(b.prologue.html), t: Number(b.prologue.tension || 5), id: '', view: 'prologue' });
  (b.chapters || []).forEach((c, i) => units.push({ label: String(i + 1), w: wordsOfHTML(c.html), t: Number(c.tension || 5), id: c.id, view: 'chapters' }));
  if (!units.length) return '<div class="empty" style="padding:24px"><i data-lucide="activity"></i><h4>NO NARRATIVE DATA</h4><div class="fs12">Add chapters to plot the pacing curve.</div></div>';
  const maxW = Math.max.apply(null, units.map(u => u.w).concat([1]));
  const pts = units.map((u, i) => {
    const x = units.length === 1 ? 50 : (i / (units.length - 1)) * 100;
    const y = 100 - (clamp(u.t, 0, 10) / 10) * 92 - 4;
    return x.toFixed(2) + ',' + y.toFixed(2);
  }).join(' ');
  return '' +
    '<div style="position:relative">' +
      '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:110px;pointer-events:none;z-index:3">' +
        '<polyline points="' + pts + '" fill="none" stroke="color-mix(in srgb, var(--accent-2) 85%, transparent)" stroke-width="1" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 5px color-mix(in srgb, var(--accent-2) 85%, transparent))"/>' +
      '</svg>' +
      '<div class="heat">' + units.map(u => {
        const hW = clamp((u.w / maxW) * 100, 4, 100);
        return '<div class="col" title="' + esc(u.label) + ' · ' + fmt(u.w) + ' words · tension ' + u.t + '/10" data-act="heatJump" data-view="' + u.view + '" data-id="' + u.id + '">' +
          '<div class="t" style="height:' + hW + '%;background:linear-gradient(180deg,' + tensionColor(u.t) + ',rgba(4,10,18,.15));box-shadow:0 0 12px ' + tensionColor(u.t) + '44"></div></div>';
      }).join('') + '</div>' +
    '</div>' +
    '<div class="flex" style="gap:3px;margin-top:2px">' + units.map(u => '<div class="lbl" style="flex:1 1 0;min-width:6px">' + esc(u.label) + '</div>').join('') + '</div>' +
    '<div class="flex between mt10 mono fs10 faint"><span>BAR HEIGHT = WORD COUNT</span><span class="t-rd">RED LINE = TENSION 0–10</span></div>';
}

const SHELF_SORTS = [

function shelfBooks() {
  const s = state.ui.shelf || (state.ui.shelf = { q: '', sort: 'updated', view: 'grid' });
  const q = (s.q || '').trim().toLowerCase();
  let list = state.books.slice();
  if (q) {
    list = list.filter(b => {
      const g = GENRES.find(x => x.id === b.genre);
      return [b.title, b.subtitle, b.author, b.logline, g ? g.name : '', (b.about || {}).series,
        (b.profile || {}).handle, (b.profile || {}).tagline, b.status].join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }
  const by = {
    updated: (a, b) => new Date(b.updated || 0) - new Date(a.updated || 0),
    created: (a, b) => new Date(b.created || 0) - new Date(a.created || 0),
    title: (a, b) => String(a.title || '').localeCompare(String(b.title || '')),
    words: (a, b) => bookWords(b) - bookWords(a),
    done: (a, b) => bookCompletion(b) - bookCompletion(a)
  };
  return list.sort(by[s.sort] || by.updated);
}

function wireEditor(id, setter, label) {
  const el = document.getElementById(id);
  if (!el) return;
  EDITORS[id] = { setter: setter, el: el, label: label || id };
  const stats = document.getElementById(id + '-stats');
  const update = () => {
    const txt = el.innerText || '';
    const w = countWords(txt);
    if (stats) stats.innerHTML = '<b>' + fmt(w) + '</b> words · <b>' + fmt(txt.length) + '</b> chars · <b>' + readTime(w) + '</b> read';
  };
  const commit = debounce(() => {
    setter(cleanEditorHTML(el.innerHTML));
    markDirty();
    const b = currentBook();
    if (b) {
      state.ui.lastEdited[b.id] = { view: CURRENT_VIEW, id: state.ui.chapterId || '', label: label, at: nowISO() };
      logActivity('write', 'Edited ' + label);
    }
  }, 700);
  el.addEventListener('input', () => {
    ensureFigGrips(el);
    update(); commit();
    if (state.ui.pageSim === id) pageSimSoon(cleanEditorHTML(el.innerHTML), label);
  });
  el.addEventListener('keyup', saveRange);
  el.addEventListener('mouseup', saveRange);
  el.addEventListener('blur', saveRange);
  el.addEventListener('paste', (e) => {
    // Paste as clean text so external HTML cannot poison the manuscript styling.
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
    document.execCommand('insertText', false, t);
  });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;'); }
  });
  ensureFigGrips(el);
  update();
  if (state.ui.pageSim === id) setTimeout(() => pageSimRepaint(cleanEditorHTML(el.innerHTML), label), 60);
}
/* The resize handle is a piece of editing furniture, not part of the writing:
   it is put on every picture when an editor opens and taken back off before
   anything is saved, exported or typeset. */
function ensureFigGrips(el) {
  if (!el) return;
  el.querySelectorAll('figure.ed-fig').forEach(f => {
    if (!f.querySelector('.fig-grip')) {
      const g = document.createElement('span');
      g.className = 'fig-grip';
      g.setAttribute('contenteditable', 'false');
      f.appendChild(g);
    }
  });
}
function cleanEditorHTML(html) {
  const d = document.createElement('div');
  d.innerHTML = String(html || '');
  d.querySelectorAll('.fig-grip, .fig-readout').forEach(n => n.remove());
  d.querySelectorAll('figure.ed-fig.selected').forEach(n => n.classList.remove('selected'));
  return d.innerHTML;
}
function saveRange() {
  const s = window.getSelection();
  if (!s || !s.rangeCount || !s.anchorNode) return;
  const n = s.anchorNode;
  const el = n.nodeType === 1 ? n : n.parentElement;
  if (el && el.closest && el.closest('.rte')) SAVED_RANGE = s.getRangeAt(0).cloneRange();
}
function focusEditor(id) {
  const el = document.getElementById(id); if (!el) return null;
  el.focus();
  const sel = window.getSelection();
  if (SAVED_RANGE && el.contains(SAVED_RANGE.commonAncestorContainer)) {
    sel.removeAllRanges(); sel.addRange(SAVED_RANGE);
  } else {
    const r = document.createRange();
    r.selectNodeContents(el); r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
  }
  return el;
}

/* ===========================================================================
   v8 · WORDPAD-STYLE WRITING
   A writing surface that behaves the way people expect a word processor to:
   a toolbar top and bottom, one that can follow you down a long chapter,
   a real full-screen mode, pictures you drag to resize with the text flowing
   under them, and a little bar that appears when you highlight something.
   ========================================================================= */

const RTE_FONTS = [
  ['', 'Same as the page'],
  ['Georgia, serif', 'Georgia'],
  ['"Playfair Display", Georgia, serif', 'Playfair Display'],
  ['"Times New Roman", Times, serif', 'Times New Roman'],
  ['Inter, system-ui, sans-serif', 'Inter'],
  ['Arial, Helvetica, sans-serif', 'Arial'],
  ['"Courier New", Courier, monospace', 'Courier New'],
  ['"Special Elite", Courier, monospace', 'Typewriter'],
  ['"Dancing Script", cursive', 'Handwritten'],
  ['Cinzel, Georgia, serif', 'Cinzel']
];
const RTE_SIZES = [['', 'Normal'], ['0.8em', 'Small'], ['0.9em', 'Slightly small'],
  ['1.15em', 'Slightly large'], ['1.35em', 'Large'], ['1.6em', 'Very large'], ['2em', 'Huge']];
const RTE_COLOURS = ['#e9f6ff', '#ffffff', '#ff2b3d', '#ff8e3c', '#ffd23f', '#7ee787', '#23e0ff', '#8b7bff', '#ff7ac6', '#9aa7b4', '#111418'];

/* ------------------------ the selection bubble ---------------------------- */
let RTE_BUBBLE = null;
function rteBubble() {
  if (RTE_BUBBLE && document.body.contains(RTE_BUBBLE)) return RTE_BUBBLE;
  const el = document.createElement('div');
  el.className = 'rte-bubble hidden';
  el.innerHTML =
    '<button class="etool" data-act="selCmd" data-cmd="bold" title="Bold"><b>B</b></button>' +
    '<button class="etool" data-act="selCmd" data-cmd="italic" title="Italic"><i>I</i></button>' +
    '<button class="etool" data-act="selCmd" data-cmd="underline" title="Underline"><u>U</u></button>' +
    '<button class="etool" data-act="selCmd" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>' +
    '<span class="esep"></span>' +
    '<button class="etool" data-act="selSize" data-d="up" title="Bigger">A<span style="font-size:8px">▴</span></button>' +
    '<button class="etool" data-act="selSize" data-d="down" title="Smaller">a<span style="font-size:8px">▾</span></button>' +
    '<select class="selfont" data-change="selFont" title="Font for the highlighted words">' +
      RTE_FONTS.map(f => '<option value="' + attr(f[0]) + '">' + esc(f[1]) + '</option>').join('') + '</select>' +
    '<select class="selfont" data-change="selSizePick" title="Size for the highlighted words">' +
      RTE_SIZES.map(f => '<option value="' + attr(f[0]) + '">' + esc(f[1]) + '</option>').join('') + '</select>' +
    '<span class="esep"></span>' +
    '<span class="swatches">' + RTE_COLOURS.map(c =>
      '<button class="sw" data-act="selColour" data-c="' + attr(c) + '" style="background:' + attr(c) + '" title="Text colour ' + attr(c) + '"></button>').join('') + '</span>' +
    '<button class="etool" data-act="selHighlight" title="Highlight behind the words"><i data-lucide="highlighter"></i></button>' +
    '<span class="esep"></span>' +
    '<button class="etool" data-act="selCmd" data-cmd="removeFormat" title="Clear formatting"><i data-lucide="eraser"></i></button>';
  document.body.appendChild(el);
  RTE_BUBBLE = el;
  icons();
  return el;
}
function hideBubble() { if (RTE_BUBBLE) RTE_BUBBLE.classList.add('hidden'); }
function showBubbleForSelection() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { hideBubble(); return; }
  const node = sel.anchorNode;
  const host = node && (node.nodeType === 1 ? node : node.parentElement);
  const rte = host && host.closest && host.closest('.rte');
  if (!rte) { hideBubble(); return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  if (!rect || (!rect.width && !rect.height)) { hideBubble(); return; }
  const el = rteBubble();
  el.setAttribute('data-ed', rte.id || '');
  el.classList.remove('hidden');
  const w = el.offsetWidth || 460, h = el.offsetHeight || 40;
  let left = rect.left + rect.width / 2 - w / 2;
  left = clamp(left, 8, Math.max(8, window.innerWidth - w - 8));
  let top = rect.top - h - 10;
  if (top < 8) top = rect.bottom + 10;
  el.style.left = Math.round(left) + 'px';
  el.style.top = Math.round(top) + 'px';
}
document.addEventListener('selectionchange', debounce(() => {
  try { showBubbleForSelection(); } catch (e) { }
}, 90));
document.addEventListener('mousedown', (e) => {
  if (RTE_BUBBLE && !RTE_BUBBLE.contains(e.target) && !(e.target.closest && e.target.closest('.rte'))) hideBubble();
});
window.addEventListener('scroll', () => hideBubble(), true);

/* Applying a style to a selection: keep the selection alive across the click. */
function withSelection(fn) {
  const ed = RTE_BUBBLE && document.getElementById(RTE_BUBBLE.getAttribute('data-ed') || '');
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0).cloneRange();
  if (ed) ed.focus({ preventScroll: true });
  sel.removeAllRanges(); sel.addRange(range);
  fn(range, ed);
  if (ed) ed.dispatchEvent(new Event('input'));
  setTimeout(showBubbleForSelection, 0);
}
/** Wraps whatever is highlighted in a span carrying the given inline styles. */
function styleSelection(styles) {
  withSelection((range) => {
    const span = document.createElement('span');
    Object.keys(styles).forEach(k => { span.style[k] = styles[k]; });
    try {
      span.appendChild(range.extractContents());
      range.insertNode(span);
      const sel = window.getSelection();
      const r = document.createRange();
      r.selectNodeContents(span);
      sel.removeAllRanges(); sel.addRange(r);
    } catch (e) { console.warn(e); }
  });
}
ACTIONS.selCmd = function (el) {
  const cmd = el.getAttribute('data-cmd');

};
ACTIONS.selColour = function (el) { styleSelection({ color: el.getAttribute('data-c') }); };

ACTIONS.selSize = function (el) {
  const up = el.getAttribute('data-d') === 'up';
  /* step through the same ladder the dropdown offers, from wherever we are */
  const sel = window.getSelection();
  let cur = 1;
  if (sel && sel.anchorNode) {
    const host = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    const fs = host && host.closest('span[style*="font-size"]');
    if (fs) cur = parseFloat(fs.style.fontSize) || 1;
  }
  const next = clamp(Math.round((cur + (up ? 0.15 : -0.15)) * 100) / 100, 0.6, 3);
  styleSelection({ fontSize: next + 'em' });
};

/* -------------------- pictures: drag the corner to resize ----------------- */
/* Clicking a picture selects it and shows a handle; dragging the handle
   resizes it live, exactly like dragging a picture in a word processor. */
document.addEventListener('click', (e) => {
  const img = e.target.closest && e.target.closest('.rte img');
  document.querySelectorAll('.rte figure.ed-fig.selected').forEach(f => { if (!img || f !== img.closest('figure')) f.classList.remove('selected'); });
  if (!img) return;
  const fig = img.closest('figure.ed-fig');
  if (fig) fig.classList.add('selected');
});
document.addEventListener('pointerdown', (e) => {
  const grip = e.target.closest && e.target.closest('.fig-grip');
  if (!grip) return;
  const fig = grip.closest('figure.ed-fig'); if (!fig) return;
  const rte = fig.closest('.rte'); if (!rte) return;
  e.preventDefault(); e.stopPropagation();
  const colW = rte.clientWidth || 600;
  const startW = fig.getBoundingClientRect().width;
  const sx = e.clientX;
  const readout = document.createElement('span');
  readout.className = 'fig-readout';
  fig.appendChild(readout);
  const move = (ev) => {
    const w = clamp(Math.round(((startW + (ev.clientX - sx)) / colW) * 100), 10, 100);
    const step = Math.round(w / 5) * 5;      /* the CSS ladder runs in fives */
    fig.setAttribute('data-w', String(clamp(step, 15, 100)));
    fig.style.width = w + '%';
    readout.textContent = w + '%';
  };
  const up = () => {
    readout.remove();
    fig.style.width = '';
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    rte.dispatchEvent(new Event('input'));
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
});

/* --------------------- AI insertion with diff highlight ------------------ */
let AI_INSERT_SEQ = 0;
function insertAIText(editorId, text) {
  const ed = focusEditor(editorId);
  if (!ed) { toast('Open a chapter or the prologue first.', 'warn'); return false; }
  const mark = 'aiIns' + (++AI_INSERT_SEQ);
  const paras = String(text).split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
  const inner = paras.map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
  const html = '<span class="ai-ins" data-ai="' + mark + '">' + (inner || '<p>' + esc(text) + '</p>') + '</span>';
  document.execCommand('insertHTML', false, html);
  ed.dispatchEvent(new Event('input'));
  const bar = document.getElementById(editorId + '-diff');
  if (bar) { bar.classList.remove('hidden'); bar.dataset.mark = mark; }
  const node = ed.querySelector('[data-ai="' + mark + '"]');
  if (node && node.scrollIntoView) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
  logActivity('ai', 'Inserted an AI passage into ' + (EDITORS[editorId] ? EDITORS[editorId].label : 'the manuscript'));
  return true;
}
ACTIONS.aiKeep = function (el) {
  const id = el.getAttribute('data-ed');
  const ed = document.getElementById(id), bar = document.getElementById(id + '-diff');
  if (!ed) return;
  ed.querySelectorAll('.ai-ins').forEach(sp => {
    const frag = document.createDocumentFragment();
    while (sp.firstChild) frag.appendChild(sp.firstChild);
    sp.parentNode.replaceChild(frag, sp);
  });
  if (bar) bar.classList.add('hidden');
  ed.dispatchEvent(new Event('input'));
  toast('Passage merged into the manuscript.', 'ok', 'KEPT');
};
ACTIONS.aiUndo = function (el) {
  const id = el.getAttribute('data-ed');
  const ed = document.getElementById(id), bar = document.getElementById(id + '-diff');
  if (!ed) return;
  const mark = bar ? bar.dataset.mark : null;
  const targets = mark ? ed.querySelectorAll('[data-ai="' + mark + '"]') : ed.querySelectorAll('.ai-ins');
  targets.forEach(n => n.remove());
  if (bar) bar.classList.add('hidden');
  ed.dispatchEvent(new Event('input'));
  toast('AI passage rolled back.', 'warn', 'UNDONE');
};

/* Drag the artwork inside its frame. Works with a mouse, a finger or a pen. */
document.addEventListener('pointerdown', (e) => {
  /* the scrim and the title block sit over the picture, so the drag has to be
     picked up from the frame rather than from the <img> itself */
  const frame = e.target.closest && e.target.closest('.cover-preview.draggable-art');
  if (!frame) return;
  if (e.target.closest('button, a, input, select, textarea')) return;
  const img = frame.querySelector('img[data-artdrag]');
  if (!img) return;
  const b = currentBook(); if (!b) return;
  const side = img.getAttribute('data-artdrag');
  const a = b.cover[side]; if (!a) return;
  const box = frame.getBoundingClientRect();
  if (!box.width || !box.height) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY;
  const x0 = clamp(Number(a.artX == null ? 50 : a.artX), 0, 100);
  const y0 = clamp(Number(a.artY == null ? 50 : a.artY), 0, 100);
  frame.classList.add('dragging');
  const move = (ev) => {
    /* moving the picture left means showing more of its right side, hence the
       inverted sign — it should feel like sliding the photo under the frame */
    a.artX = clamp(Math.round(x0 - ((ev.clientX - sx) / box.width) * 100), 0, 100);
    a.artY = clamp(Math.round(y0 - ((ev.clientY - sy) / box.height) * 100), 0, 100);
    img.style.objectPosition = a.artX + '% ' + a.artY + '%';
    img.style.transformOrigin = a.artX + '% ' + a.artY + '%';
    const px = document.getElementById('cvX' + side), py = document.getElementById('cvY' + side);
    if (px) px.textContent = a.artX;
    if (py) py.textContent = a.artY;
    const sx2 = document.querySelector('[data-sub="cover.' + side + '"] [data-model="artX"]');
    const sy2 = document.querySelector('[data-sub="cover.' + side + '"] [data-model="artY"]');
    if (sx2) sx2.value = a.artX;
    if (sy2) sy2.value = a.artY;
  };
  const up = () => {
    frame.classList.remove('dragging');
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    markDirty();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
});

                  '<button class="btn xs ghost" style="flex:1;border:0" data-act="chImgInsert" data-id="' + im.id + '" title="Insert into chapter text"><i data-lucide="corner-down-left"></i></button>' +
                  '<button class="btn xs ghost red" style="border:0" data-act="chImgDel" data-id="' + im.id + '"><i data-lucide="x"></i></button>' +
                '</div></div>').join('') + '</div>'
              : '<div class="dropzone" data-act="chImgAdd"><i data-lucide="image-plus"></i><div class="fs12">Attach scene art, references, storyboards</div></div>') +
          '</div></div>' +
      '</div></div>' +
    '</div>';

  mount() {
    const b = currentBook(); if (!b) return;
    const ch = activeChapter(b); if (!ch) return;
    wireEditor('chEd', (html) => { ch.html = html; }, ch.title || 'Chapter');
    // drag-reorder
    const list = $('#chList'); if (!list) return;
    let dragId = null;
    list.querySelectorAll('[data-chrow]').forEach(row => {
      row.addEventListener('dragstart', (e) => { dragId = row.getAttribute('data-chrow'); row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) { } });
      row.addEventListener('dragend', () => { row.classList.remove('dragging'); list.querySelectorAll('.dragover').forEach(x => x.classList.remove('dragover')); });
      row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', () => row.classList.remove('dragover'));
      row.addEventListener('drop', (e) => {
        e.preventDefault(); row.classList.remove('dragover');
        const targetId = row.getAttribute('data-chrow');
        if (!dragId || dragId === targetId) return;
        const from = b.chapters.findIndex(c => c.id === dragId);
        const to = b.chapters.findIndex(c => c.id === targetId);
        if (from < 0 || to < 0) return;
        const [m] = b.chapters.splice(from, 1);
        b.chapters.splice(to, 0, m);
        markDirty(); render(); toast('Chapter order updated.', 'ok');
      });
    });
  }
};
ACTIONS.chAdd = function () {
  const b = requireBook(); if (!b) return;
  const c = newChapter(b.chapters.length + 1);
  b.chapters.push(c); state.ui.chapterId = c.id;
  logActivity('chapter', 'Created ' + c.title);
  markDirty(); render();
};
ACTIONS.chPick = function (el) { state.ui.chapterId = el.getAttribute('data-id'); markDirty(true); render(); };
ACTIONS.chTitleLive = debounce(() => { render(); }, 600);
ACTIONS.chMove = function (el) {
  const b = requireBook(); if (!b) return;
  const dir = Number(el.getAttribute('data-dir'));
  const i = b.chapters.findIndex(c => c.id === state.ui.chapterId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= b.chapters.length) return;
  const [m] = b.chapters.splice(i, 1); b.chapters.splice(j, 0, m);
  markDirty(); render();
};
ACTIONS.chDuplicate = function () {
  const b = requireBook(); if (!b) return;
  const ch = activeChapter(b); if (!ch) return;
  const c = clone(ch); c.id = uid('ch'); c.title = ch.title + ' (copy)';
  b.chapters.splice(b.chapters.indexOf(ch) + 1, 0, c);
  state.ui.chapterId = c.id; markDirty(); render();
};
ACTIONS.chDelete = async function () {
  const b = requireBook(); if (!b) return;
  const ch = activeChapter(b); if (!ch) return;
  const ok = await confirmDlg('DELETE CHAPTER', '<p>Delete <strong>' + esc(ch.title) + '</strong> (' + fmt(wordsOfHTML(ch.html)) + ' words) permanently?</p>', true);
  if (!ok) return;
  b.chapters = b.chapters.filter(c => c.id !== ch.id);
  state.ui.chapterId = (b.chapters[0] || {}).id || '';
  markDirty(); render(); toast('Chapter deleted.', 'warn');
};
ACTIONS.chImgAdd = async function () {
  const b = requireBook(); if (!b) return;
  const ch = activeChapter(b); if (!ch) return;
  const f = await pickFile('image/*'); if (!f) return;
  ch.images = ch.images || [];
  ch.images.push({ id: uid('im'), src: f.data, caption: f.name });
  markDirty(); render(); toast('Scene image attached.', 'ok');
};
ACTIONS.chImgDel = function (el) {
  const b = requireBook(); const ch = activeChapter(b); if (!ch) return;
  ch.images = (ch.images || []).filter(i => i.id !== el.getAttribute('data-id'));
  markDirty(); render();
};
ACTIONS.chImgInsert = function (el) {
  const b = requireBook(); const ch = activeChapter(b); if (!ch) return;
  const im = (ch.images || []).find(i => i.id === el.getAttribute('data-id')); if (!im) return;
  const ed = focusEditor('chEd'); if (!ed) return;
  document.execCommand('insertHTML', false, '<img src="' + attr(im.src) + '" alt="' + attr(im.caption || 'scene') + '" />');
  ed.dispatchEvent(new Event('input'));
};
ACTIONS.chFromBeats = async function () {
  const b = requireBook(); if (!b) return;
  const beats = b.outline.beats || [];
  if (!beats.length) { toast('No beat sheet yet — run the Story Breakdown Hub first.', 'warn'); go('outline'); return; }
  const ok = await confirmDlg('BUILD CHAPTERS FROM BEATS', '<p>Create <strong>' + beats.length + '</strong> chapter stubs from your beat sheet? Existing chapters are kept; new stubs are appended.</p>');
  if (!ok) return;
  beats.forEach((bt, i) => {
    const c = newChapter(b.chapters.length + 1);
    c.title = bt.title || ('Beat ' + (i + 1));
    c.goal = bt.text || '';
    c.status = 'outline';
    c.tension = clamp(3 + Math.round((i / Math.max(1, beats.length - 1)) * 6), 0, 10);
    c.html = '<p><em>' + esc(bt.text || '') + '</em></p>';
    b.chapters.push(c);
  });
  logActivity('chapter', 'Generated ' + beats.length + ' chapter stubs from the beat sheet');
  markDirty(); render(); toast(beats.length + ' chapter stubs created.', 'ok');
};

/* ===========================================================================
   v7 · CHARACTER PROFILE PAGES
   Every character gets a real page of their own — a cover picture, a portrait,
   their whole dossier laid out in tabs, their ties, their gallery, every
   chapter they appear in, and their own conversation history. The sidebar
   grows a CHARACTERS group listing all of them so they are always one click
   away, exactly like the book switcher.
   ========================================================================= */

const CHAR_TABS = [
  ['dossier', 'Dossier', 'user'],
  ['inner', 'Inner Life', 'heart'],
  ['voice', 'Voice & Dialogue', 'message-square'],
  ['ties', 'Relationships', 'network'],
  ['appear', 'Appearances', 'files'],
  ['gallery', 'Gallery', 'image'],
  ['notes', 'Notes', 'sticky-note']
];

function charById(id) {
  for (const b of state.books) {
    const c = (b.characters || []).find(x => x.id === id);
    if (c) return { c: c, b: b };
  }
  return null;
}
/** Every chapter (and the prologue) whose text names this character. */
function charAppearances(b, c) {
  const names = [c.name].concat(String(c.aliases || '').split(/[,;/]/))
    .map(n => String(n || '').trim()).filter(n => n.length > 2);
  if (!names.length) return [];
  const rx = new RegExp('\\b(' + names.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\\b', 'gi');
  const out = [];
  const scan = (label, html, goTo, arg) => {
    const txt = stripHTML(html || '');
    const hits = txt.match(rx);
    if (!hits || !hits.length) return;
    const i = txt.search(rx);
    const from = Math.max(0, i - 90);
    out.push({
      label: label, count: hits.length, go: goTo, arg: arg,
      snippet: (from ? '…' : '') + txt.slice(from, i + 170).replace(/\s+/g, ' ').trim() + '…'
    });
  };
  scan('Prologue', b.prologue.html, 'prologue', '');
  (b.chapters || []).forEach((ch, i) => scan(ch.title || 'Chapter ' + (i + 1), ch.html, 'profile', ch.id));
  return out;
}
function charTierMeta(c) { return TIERS.find(t => t.id === c.tier) || TIERS[2]; }
function charPortrait(c, size) {
  return c.photo
    ? '<img src="' + attr(c.photo) + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block">'
    : '<span style="font-family:var(--font-display);font-size:' + (size || 52) + 'px;color:color-mix(in srgb, var(--accent) 26%, transparent)">' +
      esc((c.name || '?').charAt(0).toUpperCase()) + '</span>';
}
/** A one-line completeness read on a dossier — what is still missing. */
function charDepth(c) {
  const want = [
    ['name', 'a name'], ['role', 'a story role'], ['motivation', 'what they want'],
    ['need', 'what they need'], ['flaws', 'a flaw'], ['fears', 'a fear'],
    ['voice', 'a voice'], ['secret', 'a secret'], ['backstory', 'a backstory'], ['arc', 'an arc']
  ];
  const missing = want.filter(w => !String(c[w[0]] || '').trim()).map(w => w[1]);
  return { pct: Math.round(((want.length - missing.length) / want.length) * 100), missing: missing };
}

VIEWS.character = {
  render() {
    const id = state.ui.viewArg || state.ui.charId || '';
    const hit = charById(id);
    if (!hit) {
      return '<div class="panel clip"><div class="panel-bd"><div class="empty"><i data-lucide="user"></i>' +
        '<h4>NO CHARACTER CHOSEN</h4><div class="fs13 mb14">Pick someone from the CHARACTERS list in the menu, or open the matrix to make a new one.</div>' +
        '<button class="btn solid" data-go="characters"><i data-lucide="users"></i>OPEN THE CHARACTER MATRIX</button></div></div></div>';
    }
    const c = hit.c, b = hit.b;
    if (b.id !== state.ui.bookId) state.ui.bookId = b.id;

    const depth = charDepth(c);
    const coverH = clamp(Number(c.coverH) || 220, 90, 620);
    const av = clamp(Number(c.avatarSize) || 150, 70, 300);
    const pos = c.avatarPos || 'left';
    const shape = { circle: '50%', round: '18px', square: '0', hex: '0' }[c.avatarShape || 'round'] || '18px';

    const head = '' +
      '<div class="panel clip mb14" style="overflow:hidden;padding:0">' +
        '<div class="charcover" style="height:' + coverH + 'px;' +
          (c.cover ? 'background-image:url(' + JSON.stringify(c.cover).replace(/"/g, '&quot;') + ');background-size:cover;background-position:center ' + (Number(c.coverY) || 50) + '%' : '') + '">' +
          (!c.cover ? '<div class="charcover-empty"><i data-lucide="image"></i><span>No cover picture yet</span></div>' : '') +

    const tabs = '<div class="tabs mb14">' + CHAR_TABS.map(t =>

      '</div></div>';
  },

  dossier(c) {

ACTIONS.charAI = async function (el) {

  const c = h.c, b = h.b, kind = el.getAttribute('data-kind');
  const ask = {
    flesh: 'Suggest concrete, specific detail this character is missing — appearance, habits, one telling possession, and one contradiction. Six short bullet points.',
    voice: 'Describe exactly how this character speaks: diction, sentence length, rhythm, what they avoid saying, and two example lines of their dialogue.',
    secret: 'Give this character three possible secrets, each one that would complicate the plot if it came out. One line each, plus who it would hurt.',
    arc: 'Propose a character arc: where they begin, the lie they believe, the moment it breaks, and where they end. Four short paragraphs.'
  }[kind] || 'Suggest how to develop this character.';
  const profile = ['Name: ' + (c.name || 'unnamed'), 'Role: ' + (c.role || '—'), 'Tier: ' + charTierMeta(c).label,
    'Wants: ' + (c.motivation || '—'), 'Needs: ' + (c.need || '—'), 'Flaws: ' + (c.flaws || '—'),
    'Fears: ' + (c.fears || '—'), 'Secret: ' + (c.secret || '—'), 'Voice: ' + (c.voice || '—'),
    'Backstory: ' + (c.backstory || '—'), 'Arc: ' + (c.arc || '—')].join('\n');
  openModal({
    title: 'THINKING ABOUT ' + ((c.name || 'THEM').toUpperCase()), icon: 'wand-2', size: '',
    body: '<div id="charAIOut" class="prose-c"><div class="mono fs11 faint">working…</div></div>',
    footer: '<button class="btn ghost" data-act="charAICopy">COPY</button><button class="btn solid" data-modal-close>CLOSE</button>'
  });
  const out = await aiComplete({
    system: 'You are a novelist and character coach. Be concrete and specific. Never pad, never explain yourself.',
    user: 'Here is the book:\n' + bookBrief(b) + '\n\nHere is the character:\n' + profile + '\n\n' + ask,
    maxTokens: 700,

  });
  window.__charAI = out;
  const host = $('#charAIOut');
  if (host) host.innerHTML = String(out || 'Nothing came back.').split(/\n{2,}/).map(p =>
    '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
  icons();
};

/* Offline stand-in so every AI button on this page does something useful with
   no API key at all — built from what the writer has already written down. */
function localCharIdeas(kind, c, b) {
  const nm = c.name || 'They';
  const want = c.motivation || 'something they will not name out loud';
  const flaw = c.flaws || 'a habit of solving the wrong problem first';
  const fear = c.fears || 'being seen clearly';
  const g = (GENRES.find(x => x.id === b.genre) || {}).name || 'this story';
  if (kind === 'voice') {
    return 'A voice is three decisions, not a description.\n\n' +
      '1 · LENGTH. Does ' + nm + ' answer in one clause or three? People who are frightened get shorter. People who are hiding something get longer.\n\n' +
      '2 · WHAT THEY REFUSE TO SAY. ' + nm + ' fears ' + fear + ' — so name the two words they will talk around all book. That absence IS the voice.\n\n' +
      '3 · ONE TIC, USED SPARINGLY. A repeated construction ("The thing is —"), an odd formality, a profession bleeding into their metaphors.\n\n' +
      'Try writing the same line three ways: as they would say it to a stranger, to the person they love, and to themselves. The one that surprises you is the real voice.';
  }
  if (kind === 'secret') {
    return 'Three secrets that would cost ' + nm + ' something if they came out:\n\n' +
      '· A secret about the past — ' + nm + ' was present when something went wrong and did nothing. Costs them the trust of whoever they most want to keep.\n\n' +
      '· A secret about the present — ' + nm + ' is already doing the thing they publicly condemn, because it is the only route to ' + want + '. Costs them their own story about themselves.\n\n' +
      '· A secret about someone else — ' + nm + ' knows a truth that would free one character and destroy another, and has chosen silence. Costs them the moral high ground the moment it surfaces.\n\n' +
      'Pick the one you least want to write. That is usually the one the book needs.';
  }
  if (kind === 'arc') {
    return 'BEGINS · ' + nm + ' believes that getting ' + want + ' will settle everything, and organises their whole life around it. The reader should like them and see the crack.\n\n' +
      'THE LIE · Underneath: ' + (c.lie || 'that they are only worth what they can provide') + '. It was true once. It is not true now.\n\n' +
      'BREAKS · The midpoint takes ' + want + ' away, or gives it to them in a form that is worthless. ' + flaw + ' is what makes that happen — not bad luck.\n\n' +
      'ENDS · ' + nm + ' chooses the thing they actually needed over the thing they wanted, and pays a real price for it. If the price is not real, the arc is decoration.';
  }
  return 'Concrete detail that would make ' + nm + ' real on the page in ' + g + ':\n\n' +
    '· ONE OBJECT with no practical use that they will not travel without. Say why in half a line, never in full.\n' +
    '· A PHYSICAL DEFAULT — what their hands do when they are waiting. Reuse it exactly three times in the book.\n' +
    '· A CONTRADICTION. They are careful about ' + (c.occupation || 'their work') + ' and reckless about ' + (c.origin ? 'home' : 'their own body') + '. Characters are believable in the gap between two settings.\n' +
    '· AN OPINION nobody asked for, that they will state in full at a bad moment.\n' +
    '· HOW THEY EAT. It is the fastest way to show class, upbringing and self-control without saying any of those words.\n' +
    '· WHAT THEY ARE WRONG ABOUT, and who has already told them so. Given ' + flaw + ', they did not listen.';
}
