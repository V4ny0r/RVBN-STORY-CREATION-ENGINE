      '<div><h6>Good to know</h6><ul>' + h.tips.map(s => '<li>' + s + '</li>').join('') + '</ul>' +
        '<div class="flex gap6 wrap mt10">' +
          '<button class="btn xs ghost" data-act="themeEdit"><i data-lucide="palette"></i>CUSTOMISE LOOK</button>' +
          '<button class="btn xs ghost" data-act="bannerEdit"><i data-lucide="image"></i>CHANGE BANNER</button>' +
          '<button class="btn xs ghost" data-act="guideOffAll">HIDE ALL GUIDES</button>' +
        '</div>' +
      '</div>' +
    '</div></div>' : '') +
  '</div>';
}
ACTIONS.guideToggle = function (el) {
  const v = el.getAttribute('data-v');
  state.ui.helpClosed[v] = !state.ui.helpClosed[v];
  markDirty(true); render();
};
ACTIONS.guideOffAll = function () {
  state.app.showGuides = false; markDirty(); render();
  toast('Guides hidden. Turn them back on with the ? button in the top bar.', 'ok');
};
ACTIONS.guideOnAll = function () {
  state.app.showGuides = !state.app.showGuides;
  if (state.app.showGuides) state.ui.helpClosed = {};
  markDirty(); render();
  toast(state.app.showGuides ? 'Page guides are on.' : 'Page guides hidden.', 'ok');
};

/* ===========================================================================
   v2 · THE SOCIAL BOOK PROFILE
   The home of the book: cover, avatar, stats, and every chapter as a
   scrollable, editable feed — plus About / Cast / World / Gallery / Notes.
   ========================================================================= */

const PROF_TABS = [
  ['timeline', 'Chapters', 'files'],
  ['about', 'About This Book', 'info'],
  ['cast', 'Cast', 'users'],
  ['world', 'World & Lore', 'globe'],
  ['gallery', 'Gallery', 'image'],
  ['notes', 'Notes', 'sticky-note']
];

function excerptOf(html, n) {
  const t = stripHTML(html || '').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t;
}
function chapterPart(ch) { return partOf(ch.part); }

VIEWS.profile = {
  render() {
    const b = requireBook();
    if (!b) return noBookPanel('Create a book and it gets its own profile page — cover picture, chapters, cast, the lot.');
    const p = b.profile;
    const tab = p.tab || 'timeline';
    const words = bookWords(b);
    const cover = p.cover;
    const av = clamp(Number(p.avatarSize) || 128, 56, 260);

    return '' +
    /* ---------- cover ---------- */
    '<div class="prof-cover" style="height:' + clamp(Number(cover.h) || 300, 60, 700) + 'px">' +
      bannerMediaHTML(cover) +
      '<div class="cvscrim" style="opacity:' + ((cover.tint == null ? 55 : cover.tint) / 100) + '"></div>' +
      '<div class="cvtools">' +
        '<button class="btn ghost xs" data-act="profCoverNudge" data-d="-40" title="Shorter cover">–</button>' +
        '<span class="chip mono" style="background:var(--sunk)">' + (cover.h || 300) + 'px</span>' +
        '<button class="btn ghost xs" data-act="profCoverNudge" data-d="40" title="Taller cover">+</button>' +
        '<button class="btn xs" data-act="profCoverEdit"><i data-lucide="image"></i>COVER PICTURE / GIF</button>' +
      '</div>' +
    '</div>' +

    /* ---------- identity ---------- */
    '<div class="prof-head pos-' + (p.avatarPos || 'left') + '">' +
      '<div class="prof-av ' + (p.avatarShape || 'circle') + '" style="width:' + av + 'px;height:' + av + 'px" data-act="profAvatarMenu" title="Click to change the profile picture">' +
        (p.avatar ? '<img src="' + attr(p.avatar) + '" alt="">' : '<span class="ph" style="font-size:' + Math.round(av / 2.6) + 'px">' + esc((b.title || '?').charAt(0).toUpperCase()) + '</span>') +
        '<span class="avedit">✎</span>' +
      '</div>' +
      '<div class="prof-id">' +
        '<h1 class="prof-name">' + esc(p.displayName || b.title) + '</h1>' +
        '<div class="prof-handle">@' + esc(p.handle || slug(b.title)) + (b.author ? ' · by ' + esc(b.author) : '') + '</div>' +
        (p.tagline || b.logline ? '<div class="prof-tagline">' + esc(p.tagline || b.logline) + '</div>' : '') +
        '<div class="prof-chips">' +
          '<span class="chip rd">' + esc((b.status || 'drafting').toUpperCase()) + '</span>' +
          (b.genre ? '<span class="chip cy">' + esc(((GENRES.find(g => g.id === b.genre) || {}).name) || b.genre) + '</span>' : '') +
          (b.about && b.about.series ? '<span class="chip am">' + esc(b.about.series) + (b.about.seriesNo ? ' #' + esc(b.about.seriesNo) : '') + '</span>' : '') +
          '<span class="chip">' + fmt(b.chapters.length) + ' CHAPTERS</span>' +
          '<span class="chip">' + fmt(words) + ' WORDS</span>' +
          '<span class="chip lm">' + bookCompletion(b) + '% DONE</span>' +
        '</div>' +
      '</div>' +
      '<div class="prof-actions">' +
        '<button class="btn solid" data-act="feedAdd"><i data-lucide="plus"></i>WRITE A NEW CHAPTER</button>' +
        '<button class="btn ghost" data-act="profEdit"><i data-lucide="pencil"></i>EDIT PROFILE</button>' +
        '<button class="btn ghost" data-act="themeEdit"><i data-lucide="palette"></i>CUSTOMISE LOOK</button>' +
        '<button class="btn ghost" data-go="library"><i data-lucide="library"></i>ALL MY BOOKS' +
          (state.books.length > 1 ? ' <span class="badge">' + state.books.length + '</span>' : '') + '</button>' +
      '</div>' +
    '</div>' +

    (p.showStats === false ? '' :
    '<div class="prof-statbar">' +
      profStat(fmt(words), 'WORDS') + profStat(readTime(words), 'READING TIME') +
      profStat(fmt(b.chapters.length), 'CHAPTERS') + profStat(fmt(b.characters.length), 'CAST') +
      profStat(fmt((b.lore || []).length), 'LORE ENTRIES') + profStat(bookCompletion(b) + '%', 'OF GOAL') +
    '</div>') +

    /* ---------- tabs ---------- */
    '<div class="prof-tabs">' + profileTabs(b).map(t =>
      '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" draggable="true" data-act="profTab" data-k="' + t[0] + '" title="Drag to move this tab">' +
      '<span class="tabgrip">⠿</span>' +
      '<i data-lucide="' + t[2] + '"></i>' + esc(t[1]) +
      (t[0] === 'timeline' ? ' <span class="mono fs10">' + b.chapters.length + '</span>' : '') +
      (t[0] === 'cast' ? ' <span class="mono fs10">' + b.characters.length + '</span>' : '') +
      (t[0] === 'world' ? ' <span class="mono fs10">' + (b.lore || []).length + '</span>' : '') +
      (t[0] === 'gallery' ? ' <span class="mono fs10">' + ((b.gallery || []).length) + '</span>' : '') + '</button>').join('') +
      '<span style="flex:1"></span>' +
      '<span class="tabmove">' +
        '<span class="mono fs10 faint">MOVE “' + esc((PROF_TABS.find(x => x[0] === tab) || ['', 'tab'])[1]) + '”</span>' +
        '<button class="btn xs ghost" data-act="profTabMove" data-k="' + tab + '" data-d="-1" title="Move this tab left">◂</button>' +
        '<button class="btn xs ghost" data-act="profTabMove" data-k="' + tab + '" data-d="1" title="Move this tab right">▸</button>' +
      '</span>' +
    '</div>' +

    (tab === 'timeline' ? this.timeline(b)
      : tab === 'about' ? this.about(b)
      : tab === 'cast' ? this.cast(b)
      : tab === 'world' ? this.world(b)
      : tab === 'gallery' ? VIEWS.profile.gallery(b)
      : this.notes(b));
  },

  /* ------------------------------ TIMELINE ------------------------------ */
  timeline(b) {
    const p = b.profile;
    const chs = b.chapters || [];
    const openId = state.ui.feedOpen;
    const markers = bookMarkers(b);

    const postFor = (ch, i) => {
      const pt = chapterPart(ch);
      const pc = pt ? pt.color : 'color-mix(in srgb, var(--accent) 35%, transparent)';
      const w = wordsOfHTML(ch.html);
      const isOpen = openId === ch.id;
      return '<article class="post' + (isOpen ? ' open' : '') + '" id="post-' + ch.id + '" data-post="' + ch.id + '" style="--pc:' + pc + '">' +
        '<div class="post-hd">' +
          '<span class="post-num">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<div class="post-meta">' +
            '<input class="post-title" data-act="feedTitle" data-id="' + ch.id + '" value="' + attr(ch.title || '') + '" placeholder="Untitled chapter — click to name it">' +
            '<div class="post-sub">' + fmt(w) + ' WORDS · ' + esc((ch.status || 'draft').toUpperCase()) + ' · TENSION ' + (ch.tension || 5) + '/10' + (ch.pov ? ' · POV ' + esc(ch.pov.toUpperCase()) : '') + '</div>' +
          '</div>' +
          '<div class="post-tools">' +
            '<select class="sel" style="width:172px;font-size:12px;padding:5px 9px" data-act="feedPart" data-id="' + ch.id + '" title="What part of the story is this?">' +
              '<option value="">— no story part —</option>' +
              STORY_PARTS.map(s => '<option value="' + s.id + '"' + (ch.part === s.id ? ' selected' : '') + '>' + esc(s.label) + '</option>').join('') +
            '</select>' +
          '</div>' +
        '</div>' +

        '<div class="post-body">' +
          (isOpen
            ? editorHTML('feedEd', ch.html, 'Write this chapter. It saves as you type.', { allowImage: true, minHeight: 380 })
            : (w
              ? '<div class="post-excerpt' + (p.expandAll ? '' : ' fade') + '">' + (p.expandAll ? (ch.html || '') : '<p>' + esc(excerptOf(ch.html, 420)) + '</p>') + '</div>'
              : '<div class="post-empty">Nothing written yet. Press <strong>Open &amp; write</strong> to start this chapter.</div>')) +
        '</div>' +

        ((ch.images || []).length ? '<div class="post-imgs">' + ch.images.slice(0, 8).map(im => '<img src="' + attr(im.src) + '" alt="">').join('') + '</div>' : '') +

        '<div class="post-foot">' +
          '<button class="btn sm ' + (isOpen ? 'lime' : 'solid') + '" data-act="feedOpen" data-id="' + ch.id + '">' +
            '<i data-lucide="' + (isOpen ? 'check' : 'pencil-line') + '"></i>' + (isOpen ? 'DONE WRITING' : 'OPEN & WRITE') + '</button>' +
          (isOpen ? '<button class="btn sm amber" data-act="unstuckFor" data-ed="feedEd"><i data-lucide="brain"></i>UNSTUCK ME</button>' +
                    '<button class="btn sm violet" data-act="edMark" data-ed="feedEd"><i data-lucide="bookmark"></i>TAG PARAGRAPH</button>' : '') +
          '<button class="btn sm ghost" data-act="feedDetails" data-id="' + ch.id + '"><i data-lucide="notebook-pen"></i>SCENE NOTES</button>' +
          '<span style="flex:1"></span>' +
          (pt ? '<span class="partbadge" style="--pc:' + pt.color + '">' + esc(pt.label) + '</span>' : '') +
          '<button class="btn sm ghost" data-act="feedMove" data-id="' + ch.id + '" data-d="-1" title="Move up"><i data-lucide="arrow-up"></i></button>' +
          '<button class="btn sm ghost" data-act="feedMove" data-id="' + ch.id + '" data-d="1" title="Move down"><i data-lucide="arrow-down"></i></button>' +
          '<button class="btn sm ghost" data-act="feedDup" data-id="' + ch.id + '" title="Duplicate"><i data-lucide="copy"></i></button>' +
          '<button class="btn sm ghost red" data-act="feedDel" data-id="' + ch.id + '" title="Delete chapter"><i data-lucide="trash-2"></i></button>' +
        '</div>' +
      '</article>';
    };

    let feed = '';
    if (!chs.length) {
      feed = '<div class="panel clip"><div class="panel-bd"><div class="empty">' +
        '<i data-lucide="files"></i><h4>NO CHAPTERS YET</h4>' +
        '<div class="fs13 mb14">This is where your whole book will live — one chapter after another, top to bottom. Add the first one and start writing.</div>' +
        '<div class="flex gap6" style="justify-content:center;flex-wrap:wrap">' +
        '<button class="btn solid" data-act="feedAdd"><i data-lucide="plus"></i>WRITE CHAPTER ONE</button>' +
        '<button class="btn ghost" data-act="chFromBeats"><i data-lucide="git-branch"></i>BUILD FROM MY BEAT SHEET</button>' +
        '</div></div></div></div>';
    } else if (p.group) {
      /* grouped by story part, in the order the parts are defined */
      const used = [];
      STORY_PARTS.forEach(sp => { if (chs.some(c => c.part === sp.id)) used.push(sp); });
      const untagged = chs.filter(c => !partOf(c.part));
      feed = used.map(sp =>
        '<div class="partsection" style="--pc:' + sp.color + '">' + esc(sp.label) + '</div>' +
        chs.filter(c => c.part === sp.id).map(c => postFor(c, chs.indexOf(c))).join('<div style="height:12px"></div>')
      ).join('') +
      (untagged.length ? '<div class="partsection">UNTAGGED</div>' + untagged.map(c => postFor(c, chs.indexOf(c))).join('<div style="height:12px"></div>') : '');
    } else {
      feed = chs.map((c, i) =>
        postFor(c, i) +
        '<div class="addhere"><button class="btn xs ghost" data-act="feedAddAt" data-i="' + (i + 1) + '"><i data-lucide="plus"></i>ADD A CHAPTER HERE</button></div>'
      ).join('');
    }

    return '<div class="grid-auto" style="grid-template-columns:minmax(200px,240px) minmax(0,1fr) minmax(240px,300px)">' +

      /* left: jump list */
      '<div><div style="position:sticky;top:56px">' +
        '<div class="panel clip mb10"><div class="panel-hd"><i data-lucide="list"></i><h3>JUMP TO</h3></div>' +
          '<div class="panel-bd storyrail" style="padding:7px">' +
            (chs.length ? chs.map((c, i) => {
              const pt = chapterPart(c);
              return '<button class="srow" data-act="feedJump" data-id="' + c.id + '" style="--pc:' + (pt ? pt.color : 'color-mix(in srgb, var(--accent) 35%, transparent)') + '">' +
                '<span class="dot"></span><span class="mono fs10 faint">' + String(i + 1).padStart(2, '0') + '</span>' +
                '<span class="nm">' + esc(c.title || 'Untitled') + '</span>' +
                '<span class="wc">' + fmt(wordsOfHTML(c.html)) + '</span></button>';
            }).join('') : '<div class="faint fs12" style="padding:8px">No chapters yet.</div>') +
          '</div></div>' +
        '<div class="panel clip"><div class="panel-hd"><i data-lucide="eye"></i><h3>FEED OPTIONS</h3></div>' +
          '<div class="panel-bd" data-root="book" data-sub="profile">' +
            '<label class="flex center gap8 fs13 mb10"><input type="checkbox" data-model="group" data-rerender' + (p.group ? ' checked' : '') + '> Group by story part</label>' +
            '<label class="flex center gap8 fs13 mb10"><input type="checkbox" data-model="expandAll" data-rerender' + (p.expandAll ? ' checked' : '') + '> Show full chapter text</label>' +
            '<label class="flex center gap8 fs13"><input type="checkbox" data-model="showStats" data-rerender' + (p.showStats !== false ? ' checked' : '') + '> Show the stats bar</label>' +
            '<div class="hint mt6">Grouping stacks your chapters under headings like <em>Setup</em> and <em>The Climax</em> so you can see the shape of the book.</div>' +
          '</div></div>' +
      '</div></div>' +

      /* centre: feed */
      '<div>' +
        '<div class="panel clip mb14"><div class="panel-bd" style="padding:12px">' +
          '<div class="flex gap8 center wrap">' +
            '<div class="prof-av circle" style="width:38px;height:38px;border-width:2px;cursor:default">' +
              (p.avatar ? '<img src="' + attr(p.avatar) + '">' : '<span class="ph" style="font-size:15px">' + esc((b.title || '?').charAt(0).toUpperCase()) + '</span>') + '</div>' +
            '<input class="inp" id="quickTitle" style="flex:1;min-width:170px" placeholder="Name a new chapter and press Add…">' +
            '<select class="sel" id="quickPart" style="width:180px"><option value="">— story part —</option>' +
              STORY_PARTS.map(s => '<option value="' + s.id + '">' + esc(s.label) + '</option>').join('') + '</select>' +
            '<button class="btn solid" data-act="feedQuickAdd"><i data-lucide="plus"></i>ADD</button>' +
          '</div>' +
        '</div></div>' +
        (chs.length ? '<div class="addhere"><button class="btn xs ghost" data-act="feedAddAt" data-i="0"><i data-lucide="plus"></i>ADD A CHAPTER AT THE TOP</button></div>' : '') +
        '<div class="feed">' + feed + '</div>' +
      '</div>' +

      /* right: story map + summary */
      '<div><div style="position:sticky;top:56px">' +
        '<div class="panel clip mb10 tone-red"><div class="panel-hd"><i data-lucide="target"></i><h3>STORY MAP</h3>' +
          '<span style="flex:1"></span><span class="sub">' + markers.length + ' MARKS</span></div>' +
          '<div class="panel-bd" style="max-height:280px;overflow:auto">' +
            '<div class="hint mb10">Marks you placed on individual paragraphs. Open a chapter, put the cursor in a paragraph and press <strong>Tag paragraph</strong>.</div>' +
            (markers.length ? '<div class="marker-list">' + markers.map(m =>
              '<div class="mrow" style="--pc:' + m.color + '" data-act="feedJump" data-id="' + m.chId + '">' +
                '<span class="mono fs10" style="color:' + m.color + '">' + esc(m.label) + '</span>' +
                '<span class="fs11 muted" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.chTitle) + '</span></div>').join('') + '</div>'
              : '<div class="faint fs12">No paragraph marks yet.</div>') +
          '</div></div>' +
        '<div class="panel clip mb10"><div class="panel-hd"><i data-lucide="pin"></i><h3>PINNED NOTE</h3></div>' +
          '<div class="panel-bd" data-root="book" data-sub="profile">' +
            '<textarea class="ta" rows="4" data-model="pinned" placeholder="Something to keep in front of you while you write…">' + esc(p.pinned) + '</textarea>' +
          '</div></div>' +
        '<div class="panel clip"><div class="panel-hd"><i data-lucide="gauge"></i><h3>PROGRESS</h3></div>' +
          '<div class="panel-bd">' +
            '<div class="flex between mono fs10 faint mb6"><span>' + fmt(bookWords(b)) + ' / ' + fmt(b.goalWords) + '</span><span>' + bookCompletion(b) + '%</span></div>' +
            '<div class="bar mb10"><i style="width:' + bookCompletion(b) + '%"></i></div>' +
            '<div class="flex gap4 wrap">' +
              '<button class="btn xs ghost" data-go="outline"><i data-lucide="git-branch"></i>PLAN</button>' +
              '<button class="btn xs ghost" data-go="characters"><i data-lucide="users"></i>CAST</button>' +
              '<button class="btn xs ghost" data-go="cover"><i data-lucide="image"></i>COVER</button>' +
              '<button class="btn xs ghost" data-go="exportv"><i data-lucide="download"></i>EXPORT</button>' +
            '</div>' +
          '</div></div>' +
      '</div></div>' +
    '</div>';
  },

  /* -------------------------------- ABOUT ------------------------------- */
  about(b) {
    const a = b.about;
    const fld = (k, label, hint, rows) => rows
      ? '<label class="fld"><span class="lb">' + esc(label) + '</span><textarea class="ta" rows="' + rows + '" data-model="' + k + '">' + esc(a[k] || '') + '</textarea>' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>'
      : '<label class="fld"><span class="lb">' + esc(label) + '</span><input class="inp" data-model="' + k + '" value="' + attr(a[k] || '') + '">' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>';
    return '<div class="grid-auto" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">' +
      '<div>' +
        '<div class="panel clip mb14" data-root="book"><div class="panel-hd"><i data-lucide="book"></i><h3>THE BASICS</h3></div><div class="panel-bd">' +
          '<div class="helpbox mb14"><b>WHAT THIS TAB IS FOR</b>Everything a reader, an agent or future-you would need to know about this book in one place. Fill in what you know; leave the rest blank and come back.</div>' +
          '<div class="grid-auto g2">' +
            '<label class="fld"><span class="lb">Title</span><input class="inp" data-model="title" data-rerender value="' + attr(b.title) + '"></label>' +

            '<label class="fld"><span class="lb">Genre</span><select class="sel" data-model="genre" data-rerender><option value="">— unset —</option>' +

            '<label class="fld"><span class="lb">Status</span><select class="sel" data-model="status" data-rerender>' +
              ['ideation', 'outlining', 'drafting', 'revising', 'polished', 'shipped'].map(s => '<option value="' + s + '"' + (b.status === s ? ' selected' : '') + '>' + s.toUpperCase() + '</option>').join('') + '</select></label>' +

          '<label class="fld"><span class="lb">Logline — the whole book in one sentence</span><textarea class="ta" rows="2" data-model="logline" placeholder="When ___ happens, ___ must ___ or else ___.">' + esc(b.logline) + '</textarea>' +

        '<div class="panel clip mb14" data-root="book" data-sub="about"><div class="panel-hd"><i data-lucide="layers"></i><h3>SERIES &amp; POSITIONING</h3></div><div class="panel-bd">' +
          '<div class="grid-auto g2">' +
            fld('series', 'Series name', 'Leave blank for a standalone.') +
            fld('seriesNo', 'Book number in the series') +
            fld('penName', 'Pen name', 'If it differs from your real name.') +
            fld('audience', 'Audience', 'Children / Middle Grade / YA / Adult.') +
            fld('subgenre', 'Sub-genre', 'e.g. cosy mystery, hopepunk, grimdark.') +
            fld('rating', 'Content rating', 'e.g. PG-13, adult, all ages.') +
          '</div>' +
          fld('comps', 'Comparison titles ("for fans of…")', 'Two or three books or shows a reader could be told this is like.', 2) +
        '</div></div>' +

        '<div class="panel clip" data-root="book" data-sub="about"><div class="panel-hd"><i data-lucide="quote"></i><h3>PITCH &amp; SYNOPSIS</h3></div><div class="panel-bd">' +
          fld('pitch', 'Elevator pitch (30 seconds)', 'What you would say out loud if someone asked what it is about.', 3) +
          fld('synopsisShort', 'Short synopsis (1 paragraph)', '', 4) +
          fld('synopsisLong', 'Full synopsis (with the ending)', 'Agents ask for this. It must include how it ends.', 9) +
        '</div></div>' +
      '</div>' +

      '<div data-root="book" data-sub="about">' +

function profStat(v, k) { return '<div><div class="v">' + v + '</div><div class="k">' + esc(k) + '</div></div>'; }
function aboutChecklist(b) {
  const a = b.about;
  const rows = [
    ['Title', !!b.title], ['Author name', !!b.author], ['Genre chosen', !!b.genre],
    ['Logline written', !!(b.logline || '').trim()], ['Elevator pitch', !!(a.pitch || '').trim()],
    ['Short synopsis', !!(a.synopsisShort || '').trim()], ['Full synopsis', !!(a.synopsisLong || '').trim()],
    ['POV & tense decided', !!(a.pov && a.tense)], ['Setting described', !!(a.setting || '').trim()],
    ['Themes named', !!(a.themes || '').trim()], ['Comp titles', !!(a.comps || '').trim()],
    ['Cover art', !!b.cover.front.art], ['At least one chapter', !!b.chapters.length],
    ['At least one lead character', (b.characters || []).some(c => c.tier === 'lead')],
    ['Beat sheet built', !!(b.outline.beats || []).length]
  ];
  const done = rows.filter(r => r[1]).length;
  return '<div class="flex between mono fs10 faint mb6"><span>' + done + ' OF ' + rows.length + ' COMPLETE</span><span>' + Math.round((done / rows.length) * 100) + '%</span></div>' +
    '<div class="bar mb10"><i style="width:' + Math.round((done / rows.length) * 100) + '%"></i></div>' +
    rows.map(r => '<div class="flex center gap8 fs13 mb6" style="color:' + (r[1] ? '#8dff4f' : 'var(--txt-faint)') + '">' +
      '<span style="width:14px">' + (r[1] ? '✓' : '○') + '</span>' + esc(r[0]) + '</div>').join('');
}

/* ------------------------------ feed actions ----------------------------- */
function feedNewChapter(b, at, title, part) {
  const c = newChapter(b.chapters.length + 1);
  if (title) c.title = title;
  if (part) c.part = part;
  if (at == null || at < 0 || at > b.chapters.length) b.chapters.push(c);
  else b.chapters.splice(at, 0, c);
  state.ui.chapterId = c.id;
  state.ui.feedOpen = c.id;
  logActivity('chapter', 'Added ' + (c.title || 'a chapter'));
  markDirty();
  return c;
}
ACTIONS.feedAdd = function () {
  const b = requireBook(); if (!b) return;
  if (b.profile) b.profile.tab = 'timeline';
  const c = feedNewChapter(b, null);
  render();
  setTimeout(() => { const n = document.getElementById('post-' + c.id); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 90);
};
ACTIONS.feedAddAt = function (el) {
  const b = requireBook(); if (!b) return;
  const c = feedNewChapter(b, Number(el.getAttribute('data-i')));
  render();
  setTimeout(() => { const n = document.getElementById('post-' + c.id); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 90);
};
ACTIONS.feedQuickAdd = function () {
  const b = requireBook(); if (!b) return;
  const t = ($('#quickTitle') || {}).value || '';
  const pt = ($('#quickPart') || {}).value || '';
  const c = feedNewChapter(b, null, t.trim(), pt);
  render();
  setTimeout(() => { const n = document.getElementById('post-' + c.id); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 90);
};

  }, 60);

ACTIONS.feedMove = function (el) {
  const b = requireBook(); if (!b) return;
  const id = el.getAttribute('data-id'), d = Number(el.getAttribute('data-d'));
  const i = b.chapters.findIndex(c => c.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= b.chapters.length) return;
  const [m] = b.chapters.splice(i, 1); b.chapters.splice(j, 0, m);
  markDirty(); render();
  setTimeout(() => { const n = document.getElementById('post-' + id); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 80);

  const c = clone(ch); c.id = uid('ch'); c.title = (ch.title || 'Chapter') + ' (copy)';
  b.chapters.splice(b.chapters.indexOf(ch) + 1, 0, c);

/* ------------------------- paragraph story markers ----------------------- */
ACTIONS.edMark = function (el) {
  const edId = el.getAttribute('data-ed') || activeEditorId() || 'feedEd';
  const ed = document.getElementById(edId);
  if (!ed) { toast('Open a chapter first.', 'warn'); return; }
  const sel = window.getSelection();
  let node = sel && sel.anchorNode ? (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement) : null;
  if (SAVED_RANGE && (!node || !ed.contains(node))) {
    const n2 = SAVED_RANGE.commonAncestorContainer;
    node = n2.nodeType === 1 ? n2 : n2.parentElement;
  }
  let block = null;
  while (node && node !== ed) {
    if (/^(P|DIV|H1|H2|H3|H4|BLOCKQUOTE|LI|PRE)$/.test(node.tagName)) { block = node; break; }
    node = node.parentElement;
  }
  if (!block) { toast('Click inside the paragraph you want to tag first.', 'warn', 'NO PARAGRAPH SELECTED'); return; }
  window.__markBlock = block; window.__markEd = edId;
  openModal({
    title: 'TAG THIS PARAGRAPH', icon: 'bookmark', size: '',
    body: '<div class="helpbox mb14"><b>WHAT THIS DOES</b>' +
      'Puts a little coloured label on this exact paragraph so you can find it instantly later. Use it to mark the moment the story turns — the inciting incident, the midpoint, the climax, a reveal. ' +
      'All your marks are listed in the <strong>Story Map</strong> beside the feed.</div>' +
      '<div class="fs12 muted mb10">Paragraph: “' + esc(excerptOf(block.innerHTML, 130) || '(empty)') + '”</div>' +
      '<div class="grid-auto" style="grid-template-columns:repeat(auto-fill,minmax(168px,1fr))">' +
        STORY_PARTS.map(s => '<button class="optcard" data-act="edMarkSet" data-id="' + s.id + '" style="border-left:3px solid ' + s.color + '">' +
          '<strong class="fs13" style="color:' + s.color + '">' + esc(s.label) + '</strong></button>').join('') +
      '</div>',
    footer: '<button class="btn ghost red" data-act="edMarkClear" style="margin-right:auto"><i data-lucide="x"></i>REMOVE MARK</button>' +
            '<button class="btn ghost" data-modal-close>CANCEL</button>'
  });
};
ACTIONS.edMarkSet = function (el) {
  const sp = partOf(el.getAttribute('data-id')); if (!sp) return;
  const block = window.__markBlock; if (!block) return;
  block.setAttribute('data-marker', sp.label);
  block.style.setProperty('--mk', sp.color);
  const ed = document.getElementById(window.__markEd);
  if (ed) ed.dispatchEvent(new Event('input'));
  closeModal(); markDirty();
  toast('Paragraph tagged as “' + sp.label + '”.', 'ok');
  setTimeout(() => render(), 400);
};
ACTIONS.edMarkClear = function () {
  const block = window.__markBlock; if (!block) return;
  block.removeAttribute('data-marker'); block.style.removeProperty('--mk');
  const ed = document.getElementById(window.__markEd);
  if (ed) ed.dispatchEvent(new Event('input'));
  closeModal(); markDirty(); setTimeout(() => render(), 400);
};
/** Every paragraph mark in the book, in reading order. */
function bookMarkers(b) {
  const out = [];
  const scan = (html, chId, chTitle) => {
    if (!html || html.indexOf('data-marker') === -1) return;
    const d = document.createElement('div');
    d.innerHTML = html;
    d.querySelectorAll('[data-marker]').forEach(n => {
      const label = n.getAttribute('data-marker');
      const sp = STORY_PARTS.find(s => s.label === label);
      out.push({ label: label, color: sp ? sp.color : '#23e0ff', chId: chId, chTitle: chTitle, text: excerptOf(n.innerHTML, 90) });
    });
  };
  scan(b.prologue && b.prologue.html, '', 'Prologue');
  (b.chapters || []).forEach((c, i) => scan(c.html, c.id, 'Ch ' + (i + 1) + ' — ' + (c.title || 'Untitled')));
  return out;
}

const SLIDE_TRANSITIONS = [
  ['fade', 'Fade — soft cross-dissolve'],
  ['slide', 'Slide — glides in from the right'],
  ['zoom', 'Zoom — eases in from close'],
  ['flip', 'Flip — swings in like a page'],
  ['blur', 'Blur — resolves into focus'],
  ['kenburns', 'Ken Burns — slow drift on a still image']
];
let SLIDE_TIMER = null;

function slideshowHTML(b) {
  const s = b.slideshow || (b.slideshow = { slides: [], interval: 5, transition: 'fade', h: 320, autoplay: true, showCaptions: true });
  const n = s.slides.length;
  if (!n) {
    return '<div class="panel clip mb14"><div class="panel-hd"><i data-lucide="film"></i><h3>SLIDESHOW</h3></div>' +
      '<div class="panel-bd"><div class="empty" style="padding:30px">' +

        '<button class="btn solid" data-act="slideEdit"><i data-lucide="plus"></i>BUILD A SLIDESHOW</button>' +
      '</div></div></div>';
  }
  const i = clamp(Number(state.ui.slide) || 0, 0, n - 1);
  state.ui.slide = i;
  return '<div class="panel clip mb14" style="padding:0;overflow:hidden">' +
    '<div class="slideshow" id="slideshow" data-tr="' + esc(s.transition || 'fade') + '" style="height:' + clamp(Number(s.h) || 320, 120, 700) + 'px">' +
      s.slides.map((sl, k) => '<div class="slide' + (k === i ? ' active' : '') + '" data-slide="' + k + '">' +
        (/^data:video|\.(mp4|webm|ogg)(\?|$)/i.test(sl.src)
          ? '<video src="' + attr(sl.src) + '" autoplay muted loop playsinline></video>'
          : '<img src="' + attr(sl.src) + '" alt="" loading="lazy">') +
        (s.showCaptions !== false && (sl.title || sl.caption)
          ? '<div class="scap">' + (sl.title ? '<h4>' + esc(sl.title) + '</h4>' : '') + (sl.caption ? '<p>' + esc(sl.caption) + '</p>' : '') + '</div>' : '') +
      '</div>').join('') +
      (n > 1 ? '<button class="snav prev" data-act="slideGo" data-d="-1">‹</button><button class="snav next" data-act="slideGo" data-d="1">›</button>' +
        '<div class="sdots">' + s.slides.map((_, k) => '<i class="' + (k === i ? 'on' : '') + '" data-act="slideTo" data-i="' + k + '"></i>').join('') + '</div>' : '') +
      '<div class="stools">' +
        '<button class="btn ghost xs" data-act="slidePlay" title="Play / pause">' + (s.autoplay ? '❚❚' : '▶') + '</button>' +
        '<button class="btn xs" data-act="slideEdit"><i data-lucide="sliders-horizontal"></i>EDIT SLIDESHOW</button>' +
      '</div>' +
    '</div></div>';
}
function wireSlideshow() {
  if (SLIDE_TIMER) { clearInterval(SLIDE_TIMER); SLIDE_TIMER = null; }
  const b = currentBook(); if (!b || !b.slideshow) return;
  const host = document.getElementById('slideshow'); if (!host) return;
  const s = b.slideshow;
  if (!s.autoplay || s.slides.length < 2) return;
  SLIDE_TIMER = setInterval(() => {
    const h = document.getElementById('slideshow');
    if (!h) { clearInterval(SLIDE_TIMER); SLIDE_TIMER = null; return; }
    slideShow((Number(state.ui.slide) || 0) + 1);
  }, clamp(Number(s.interval) || 5, 2, 60) * 1000);
}
function slideShow(idx) {
  const b = currentBook(); if (!b) return;
  const n = (b.slideshow.slides || []).length; if (!n) return;
  const i = ((idx % n) + n) % n;
  state.ui.slide = i;
  const host = document.getElementById('slideshow'); if (!host) return;
  host.querySelectorAll('.slide').forEach((el, k) => el.classList.toggle('active', k === i));
  host.querySelectorAll('.sdots i').forEach((el, k) => el.classList.toggle('on', k === i));
}
ACTIONS.slideGo = function (el) { slideShow((Number(state.ui.slide) || 0) + Number(el.getAttribute('data-d'))); wireSlideshow(); };

          '<label class="flex center gap8 fs13 mt6"><input type="checkbox" data-model="showCaptions" data-live="slideRepaint"' + (s.showCaptions !== false ? ' checked' : '') + '> Show captions</label></div>' +

/** Pictures living elsewhere in the project, gathered for the "from this book" strip. */
function collectBookImages(b) {
  const out = [];

  add(b.cover.front.art, 'Front cover', 'Cover Studio');

  add(b.profile.avatar, 'Profile picture', 'Book Profile');

  (b.prologue.moodboard || []).forEach((m, i) => add(m.src, m.note || 'Prologue moodboard ' + (i + 1), 'Prologue'));
  (b.chapters || []).forEach((c, i) => (c.images || []).forEach(im => add(im.src, (c.title || 'Chapter ' + (i + 1)), 'Chapter ' + (i + 1))));
  (b.characters || []).forEach(c => add(c.photo, c.name || 'Character', 'Cast'));
  (b.research.pins || []).forEach(pn => add(pn.src, pn.caption || 'Research pin', 'Research'));

/* --------------------- draggable profile tab strip ----------------------- */
function profileTabs(b) {
  const p = b.profile;
  const known = PROF_TABS.map(t => t[0]);
  let order = (p.tabOrder || []).filter(t => known.indexOf(t) !== -1);
  known.forEach(t => { if (order.indexOf(t) === -1) order.push(t); });
  p.tabOrder = order;
  return order.map(id => PROF_TABS.find(t => t[0] === id));
}
ACTIONS.profTabMove = function (el) {
  const b = requireBook(); if (!b) return;
  const order = profileTabs(b).map(t => t[0]);
  const id = el.getAttribute('data-k');
  const d = Number(el.getAttribute('data-d'));
  const i = order.indexOf(id), j = i + d;
  if (i < 0 || j < 0 || j >= order.length) return;
  const [m] = order.splice(i, 1); order.splice(j, 0, m);
  b.profile.tabOrder = order; markDirty(); render();
};
function wireTabDrag() {
  const strip = document.querySelector('.prof-tabs'); if (!strip) return;
  const b = currentBook(); if (!b) return;
  let dragId = null;
  strip.querySelectorAll('[data-k]').forEach(el => {
    el.addEventListener('dragstart', (e) => {
      dragId = el.getAttribute('data-k'); el.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', dragId); } catch (_) { }
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); strip.querySelectorAll('.dragover').forEach(x => x.classList.remove('dragover')); });
    el.addEventListener('dragover', (e) => { if (!dragId) return; e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', () => el.classList.remove('dragover'));
    el.addEventListener('drop', (e) => {
      if (!dragId) return;
      e.preventDefault(); el.classList.remove('dragover');
      const target = el.getAttribute('data-k');
      if (target === dragId) return;
      const order = profileTabs(b).map(t => t[0]);
      const from = order.indexOf(dragId), to = order.indexOf(target);
      if (from < 0 || to < 0) return;
      const [m] = order.splice(from, 1); order.splice(to, 0, m);
      b.profile.tabOrder = order; markDirty(); render();
      toast('Tab order saved.', 'ok');
    });
  });
}

  b.research.pins = [
    { id: uid('pin'), type: 'quote', x: 40, y: 40, z: 11, text: 'Every record can be rewritten.\nEvery city remembers anyway.', caption: 'working epigraph' },
    { id: uid('pin'), type: 'swatch', x: 300, y: 60, z: 12, color: '#1d5a6b', caption: 'flood water' },
    { id: uid('pin'), type: 'swatch', x: 300, y: 200, z: 13, color: '#c9a227', caption: 'archive lamp' },
    { id: uid('pin'), type: 'note', x: 520, y: 60, z: 14, text: 'RESEARCH: how paper records were physically stored in flood-prone municipal archives. Cabinet height above datum. What survives immersion.' }
  ];
  b.kids.tier = '4-8';
  b.comic.pages = [newComicPage('four')];
  b.comic.pages[0].title = 'The Test Siren';
  b.comic.pages[0].panels[0].desc = 'Wide. The terraced city at 3am, every window dark. One lit square: the archive.';
  b.comic.pages[0].panels[0].camera = 'Establishing wide';
  b.comic.pages[0].panels[0].lines = [{ type: 'caption', who: '', text: 'The siren tested three months early.' }];
  b.comic.pages[0].panels[1].desc = 'Interior. VERA at the window, cup in hand, listening.';
  b.comic.pages[0].panels[1].camera = 'Medium';
  b.comic.pages[0].panels[1].lines = [{ type: 'thought', who: 'VERA', text: 'Nobody is waking up.' }];
  b.comic.pages[0].panels[2].desc = 'Close on the dark windows across the terrace. Not one light.';
  b.comic.pages[0].panels[2].camera = 'Close-up';
  b.comic.pages[0].panels[3].desc = 'The siren dies. Silence with a shape to it.';
  b.comic.pages[0].panels[3].camera = 'Extreme close-up';
  b.comic.pages[0].panels[3].lines = [{ type: 'sfx', who: '', text: '— khhhh —' }];
  /* --- social profile --- */
  b.profile.displayName = 'The Ashfall Protocol';
  b.profile.handle = 'ashfall';
  b.profile.tagline = 'Nine days until the tide gates cycle. One forged record. One witness who is eight years old.';

  b.profile.avatarSize = 132; b.profile.avatarPos = 'left'; b.profile.avatarShape = 'circle';
  b.profile.cover.h = 320;
  /* --- about --- */
  Object.assign(b.about, {
    series: 'The Cinder Accords', seriesNo: '1', audience: 'Adult', subgenre: 'near-future political thriller',
    comps: 'For readers of THE CITY & THE CITY and STATION ELEVEN.',
    pov: 'Third limited', tense: 'Past',
    setting: 'Kessler Terraces — a stepped coastal city built above its own drowned quarter',
    period: 'Roughly forty years from now, after the third surge',
    themes: 'Complicity. What a record is worth once nobody trusts it. Who gets believed.',
    tone: 'Cold, procedural, quietly furious, ultimately hopeful',
    warnings: 'Drowning, institutional abuse, on-page grief',
    pitch: 'An archivist finds her own signature on a flood report for a flood that never happened, and has nine days to prove it before the evidence is destroyed by the next one.',
    synopsisShort: 'Vera Solane has filed the drowned history of Kessler Terraces for eleven years. A routine re-index turns up a forged report in her own hand. Her former partner countersigned it. The tide gates cycle in nine days, and when they do the paper record goes with them.',
    inspiration: 'A photograph of a flooded municipal archive, index cards floating like lily pads.',
    startDate: '', deadline: '', pubPlan: 'Query agents once the second draft is clean.',
    notes: 'Open question: does Idris know Vera cannot remember the year? Decide before act three.'

  /* --- story parts on the demo chapters --- */
  const demoParts = ['hook', 'inciting', 'rising', 'plot1'];

  b.chapters[0].html = '<p data-marker="The Hook" style="--mk:#7ff3ff">The flood siren tested at three in the morning, three months out of schedule, and no one in the Lower Registry woke up.</p>' +
    '<p>Vera counted eleven thousand dark windows and not one light among them. She wrote the time on the back of her hand because the log would not take an entry that early.</p>' +

async function boot() {
  await storageInit();
  const loaded = await storageLoad();
  let first = false;
  if (loaded) {
    try { state = migrateState(loaded); }
    catch (e) { console.error('Migration failed, starting clean.', e); state = defaultState(); first = true; }
  } else { first = true; }

  if (!state.books.length) seedStarterBook();
  if (!state.ui.bookId || !state.books.some(b => b.id === state.ui.bookId)) state.ui.bookId = state.books[0].id;
  normaliseNav();

  // route from the URL hash when present, otherwise from saved UI state
  const hash = (location.hash || '').replace(/^#/, '');
  const hv = hash.split('/')[0];
  CURRENT_VIEW = VIEWS[hv] ? hv : (VIEWS[state.ui.view] ? state.ui.view : 'profile');
  state.ui.view = CURRENT_VIEW;

  renderBrand();
  render();
  startAutosave();
  refreshStorageMeter();
  paintSavePill('idle');

  /* --- brandbar wiring --- */
  $('#brandTitle').addEventListener('click', () => ACTIONS.brandRename());
  $('#brandLogo').addEventListener('click', () => ACTIONS.logoMenu());
  $('#bookSwitchBtn').addEventListener('click', () => ACTIONS.toggleBookMenu());
  $('#btnSearch').addEventListener('click', () => ACTIONS.globalSearch());
  $('#btnSaveNow').addEventListener('click', () => ACTIONS.saveForce());
  $('#btnFx').addEventListener('click', () => { state.app.fx = !state.app.fx; markDirty(); renderBrand(); toast('Grid FX ' + (state.app.fx ? 'enabled' : 'disabled') + '.', 'ok'); });
  $('#btnRail').addEventListener('click', () => {
    const rail = $('#rail');
    rail.classList.toggle('open');
    if (rail.classList.contains('open')) {
      const bd = document.createElement('div');
      bd.className = 'rail-backdrop';
      bd.addEventListener('click', () => { rail.classList.remove('open'); bd.remove(); });
      document.body.appendChild(bd);
    } else { const bd = $('.rail-backdrop'); if (bd) bd.remove(); }
  });

  /* --- global drag & drop of images onto dropzones --- */
  document.addEventListener('dragover', (e) => {
    const z = e.target.closest('.dropzone'); if (!z) return;
    e.preventDefault(); z.classList.add('over');
  });
  document.addEventListener('dragleave', (e) => {
    const z = e.target.closest('.dropzone'); if (z) z.classList.remove('over');
  });
  document.addEventListener('drop', async (e) => {
    const z = e.target.closest('.dropzone'); if (!z) return;
    e.preventDefault(); z.classList.remove('over');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f || !/^image\//.test(f.type)) return;
    const data = await readFileAsDataURL(f);
    const act = z.getAttribute('data-act');
    const arg = z.getAttribute('data-arg');
    const b = currentBook();
    if (act === 'coverArt' && b) { b.cover[arg].art = data; markDirty(); render(); toast('Cover art dropped in.', 'ok'); }
    else if (act === 'moodAdd' && b) { b.prologue.moodboard.unshift({ id: uid('mp'), src: data, note: '' }); markDirty(); render(); }
    else if (act === 'chImgAdd' && b) { const ch = activeChapter(b); if (ch) { ch.images = ch.images || []; ch.images.push({ id: uid('im'), src: data, caption: f.name }); markDirty(); render(); } }
    else toast('Drop target does not accept images here — use the button instead.', 'warn');
  });

  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').replace(/^#/, '').split('/')[0];
    if (h && VIEWS[h] && h !== CURRENT_VIEW) go(h);
  });

  if (first) setTimeout(welcomeModal, 400);
  console.log('%cRAVENBANE · ARCHITECT online — engine: ' + ENGINE, 'color:#23e0ff;font-family:monospace');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
