<style>
/* ============================================================================
   RAVENBANE :: ARCHITECT  —  TRON LEGACY / ARES GRID THEME
   All core layout lives in hand-written CSS so the shell survives a CDN outage.
   ========================================================================== */

:root{
  --bg-void:#03050a;
  --bg-deep:#05080f;
  --bg-panel:rgba(9,16,26,.78);
  --bg-panel-solid:#080e18;
  --bg-raise:rgba(18,32,48,.55);
  --line:rgba(35,224,255,.16);
  --line-soft:rgba(35,224,255,.08);
  --line-hard:rgba(35,224,255,.42);
  --txt:#cfe9f5;
  --txt-dim:#7e9bad;
  --txt-faint:#4d6b7d;
  --accent:#23e0ff;
  --accent-2:#ff2b3d;
  --accent-3:#ffb43a;
  --glow:0 0 12px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 32px color-mix(in srgb, var(--accent) 14%, transparent);
  --chrome:linear-gradient(180deg,rgba(6,12,20,.97),rgba(4,8,14,.92));
  --chrome-rail:linear-gradient(180deg,rgba(6,11,19,.96),rgba(4,7,13,.98));
  --surface-2:#080e18;
  --field:rgba(3,8,14,.85);
  --field-focus:rgba(6,14,24,.95);
  --sunk:rgba(3,7,13,.45);
  --rte-bg:rgba(3,7,13,.62);
  --rte-fg:#dcecf5;
  --void:#04070c;
  --btn-radius:2px;
  --btn-caps:uppercase;
  --btn-track:1.1px;
  --btn-weight:700;
  --pad:14px;
  --c-red:#ff2b3d; --c-amber:#ffb43a; --c-lime:#8dff4f; --c-violet:#a56bff; --c-red-t:#ff8a95;
  --glow-red:0 0 12px color-mix(in srgb, var(--accent-2) 50%, transparent), 0 0 34px color-mix(in srgb, var(--accent-2) 18%, transparent);
  --rail-w:268px;
  --brand-h:56px;
  --radius:2px;
  --font-ui:'Rajdhani','Inter',system-ui,sans-serif;
  --font-display:'Orbitron','Rajdhani',sans-serif;
  --font-mono:'Share Tech Mono','IBM Plex Mono',ui-monospace,monospace;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg-void); color:var(--txt);
  font-family:var(--font-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  letter-spacing:.2px;
}
/* --- Ambient TRON grid + vignette + scanlines --- */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(color-mix(in srgb, var(--accent) 5.5%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--accent) 5.5%, transparent) 1px, transparent 1px),
    radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
    radial-gradient(ellipse at 100% 110%, color-mix(in srgb, var(--accent-2) 9%, transparent), transparent 55%);
  background-size:52px 52px, 52px 52px, 100% 100%, 100% 100%;
}
body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9998;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 3px, rgba(0,0,0,.16) 3px 4px);
  mix-blend-mode:multiply; opacity:.5;
}
body.no-fx::before,body.no-fx::after{ display:none; }

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:rgba(3,5,10,.6); }
::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,color-mix(in srgb, var(--accent) 35%, transparent),color-mix(in srgb, var(--accent) 12%, transparent)); border:1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
::-webkit-scrollbar-thumb:hover{ background:color-mix(in srgb, var(--accent) 50%, transparent); }
* { scrollbar-color: color-mix(in srgb, var(--accent) 35%, transparent) rgba(3,5,10,.6); scrollbar-width: thin; }

::selection{ background:color-mix(in srgb, var(--accent) 30%, transparent); color:#fff; }

/* ============================ APP SHELL ================================== */
#app{ position:relative; z-index:1; height:100vh; display:flex; flex-direction:column; }

.brandbar{
  height:var(--brand-h); flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:0 14px; background:var(--chrome);
  border-bottom:1px solid var(--line); backdrop-filter:blur(14px);
  box-shadow:0 1px 0 color-mix(in srgb, var(--accent) 10%, transparent), 0 8px 30px rgba(0,0,0,.7); position:relative;
}
.brandbar::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-2) 12%,var(--accent) 55%,transparent);
  opacity:.75;
}
.brand-logo{
  width:38px; height:38px; flex:0 0 auto; display:grid; place-items:center; overflow:hidden;
  border:1px solid var(--line-hard); background:color-mix(in srgb, var(--accent) 6%, transparent);
  clip-path:polygon(22% 0,100% 0,100% 78%,78% 100%,0 100%,0 22%);
  box-shadow:var(--glow); cursor:pointer; transition:.2s;
}
.brand-logo:hover{ box-shadow:var(--glow-red); border-color:color-mix(in srgb, var(--accent-2) 60%, transparent); }
.brand-logo img{ width:100%; height:100%; object-fit:cover; }
.brand-title{
  font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:3.5px;
  cursor:pointer; white-space:nowrap; user-select:none; line-height:1;
}
.brand-title .a{ color:var(--accent-2); text-shadow:var(--brand-glow-a,0 0 10px color-mix(in srgb, var(--accent-2) 85%, transparent)); }
.brand-title .b{ color:var(--txt); text-shadow:var(--brand-glow-b,0 0 10px color-mix(in srgb, var(--accent) 70%, transparent)); }
.brand-title .sep{ color:var(--txt-faint); margin:0 6px; font-weight:400; }
.brand-sub{ font-family:var(--font-mono); font-size:10px; color:var(--txt-faint); letter-spacing:2.4px; margin-top:2px; }

.shell{ flex:1 1 auto; display:flex; min-height:0; }

/* ------------------------------- RAIL ----------------------------------- */
.rail{
  width:var(--rail-w); flex:0 0 var(--rail-w); display:flex; flex-direction:column; min-height:0;
  background:var(--chrome-rail);
  border-right:1px solid var(--line); backdrop-filter:blur(10px); position:relative; z-index:40;
}
.rail::after{ content:''; position:absolute; top:0; bottom:0; right:-1px; width:1px;
  background:linear-gradient(180deg,var(--accent-2),var(--accent) 40%,transparent); opacity:.5; }
.rail-scroll{ overflow-y:auto; overflow-x:hidden; flex:1 1 auto; padding:8px 8px 24px; }
.rail-group{ margin-bottom:12px; }
.rail-label{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:2.6px; color:var(--txt-faint);
  padding:8px 10px 5px; display:flex; align-items:center; gap:7px; text-transform:uppercase;
}
.rail-label::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }
.navitem{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 10px; margin:1px 0; border:1px solid transparent; background:transparent;
  color:var(--txt-dim); font-family:var(--font-ui); font-size:14px; font-weight:600; letter-spacing:.6px;
  cursor:pointer; position:relative; transition:.14s ease; border-radius:var(--radius);
}
.navitem i,.navitem svg{ width:16px; height:16px; flex:0 0 16px; opacity:.85; }
.navitem:hover{ color:var(--txt); background:color-mix(in srgb, var(--accent) 7%, transparent); border-color:color-mix(in srgb, var(--accent) 18%, transparent); }
.navitem.active{
  color:var(--txt); background:linear-gradient(90deg,color-mix(in srgb, var(--accent) 20%, transparent),color-mix(in srgb, var(--accent) 3%, transparent));
  border-color:color-mix(in srgb, var(--accent) 45%, transparent); box-shadow:inset 0 0 18px color-mix(in srgb, var(--accent) 10%, transparent);
}
.navitem.active::before{
  content:''; position:absolute; left:-8px; top:2px; bottom:2px; width:3px;
  background:var(--accent); box-shadow:0 0 10px var(--accent); }
.navitem.tone-red.active{ background:linear-gradient(90deg,color-mix(in srgb, var(--accent-2) 20%, transparent),color-mix(in srgb, var(--accent-2) 2%, transparent)); border-color:color-mix(in srgb, var(--accent-2) 45%, transparent); }
.navitem.tone-red.active::before{ background:var(--accent-2); box-shadow:0 0 10px var(--accent-2); }
.navitem .badge{
  margin-left:auto; font-family:var(--font-mono); font-size:9.5px; padding:1px 6px;
  border:1px solid var(--line); color:var(--accent); background:color-mix(in srgb, var(--accent) 7%, transparent);
}

.bookswitch{ padding:10px; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--accent) 4%, transparent); }
.bookswitch-btn{
  width:100%; display:flex; align-items:center; gap:9px; padding:8px 10px; cursor:pointer;
  background:var(--field); border:1px solid var(--line-hard); color:var(--txt);
  font-family:var(--font-ui); font-weight:600; font-size:14px; text-align:left;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  transition:.15s;
}
.bookswitch-btn:hover{ border-color:var(--accent); box-shadow:inset 0 0 20px color-mix(in srgb, var(--accent) 12%, transparent); }
.bookswitch-btn .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bookmenu{
  position:absolute; left:10px; right:10px; top:100%; margin-top:4px; z-index:120; max-height:340px; overflow:auto;
  background:var(--bg-panel-solid); border:1px solid var(--line-hard); box-shadow:0 20px 50px rgba(0,0,0,.8),var(--glow);
}
.bookmenu button{
  display:flex; width:100%; gap:8px; align-items:center; padding:9px 11px; background:transparent; border:0;
  border-bottom:1px solid var(--line-soft); color:var(--txt-dim); font-family:var(--font-ui); font-size:14px;
  cursor:pointer; text-align:left;
}
.bookmenu button:hover{ background:color-mix(in srgb, var(--accent) 10%, transparent); color:var(--txt); }
.bookmenu button.sel{ color:var(--accent); }

/* ------------------------------ MAIN ------------------------------------ */
.main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.main-scroll{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; scroll-behavior:smooth; }
.view-pad{ padding:20px 24px 90px; max-width:1680px; margin:0 auto; }

/* ------------------------------ BANNER ---------------------------------- */
.banner{ position:relative; width:100%; overflow:hidden; border-bottom:1px solid var(--line); background:var(--void); flex:0 0 auto; }
.banner-media{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.banner-fallback{
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 20% 120%, color-mix(in srgb, var(--accent-2) 30%, transparent), transparent 55%),
    radial-gradient(ellipse at 80% -20%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 55%),
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, transparent) 0 1px, transparent 1px 60px),
    repeating-linear-gradient(0deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 1px, transparent 1px 60px),
    linear-gradient(180deg, var(--surface-2), var(--void));
}
.banner-scrim{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(3,5,10,.30) 0%,rgba(3,5,10,.15) 40%,rgba(3,5,10,.92) 100%); }
.banner-inner{ position:relative; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:16px 24px; }
.banner-eyebrow{ font-family:var(--font-mono); font-size:10px; letter-spacing:3.4px; color:var(--accent); text-shadow:0 0 12px color-mix(in srgb, var(--accent) 70%, transparent); }
.banner-title{ font-family:var(--font-display); font-weight:800; letter-spacing:2.4px; color:#fff; text-shadow:0 0 18px rgba(0,0,0,.9),0 0 34px color-mix(in srgb, var(--accent) 35%, transparent); margin:2px 0 0; }
.banner-desc{ color:var(--txt-dim); font-size:13.5px; max-width:760px; }
.banner-tools{ position:absolute; top:10px; right:12px; display:flex; gap:6px; z-index:5; }
.banner-h-compact{ height:132px; } .banner-h-compact .banner-title{ font-size:20px; }
.banner-h-medium{ height:230px; } .banner-h-medium .banner-title{ font-size:27px; }
.banner-h-hero{ height:420px; } .banner-h-hero .banner-title{ font-size:38px; }
.banner-h-off{ height:0; border:0; }
@media(max-width:820px){ .banner-h-hero{ height:260px; } .banner-h-hero .banner-title{ font-size:26px; } }

/* ------------------------- PRIMITIVE COMPONENTS -------------------------- */
.panel{
  background:var(--bg-panel); border:1px solid var(--line); backdrop-filter:blur(10px);
  position:relative; border-radius:var(--radius);
  box-shadow:0 10px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03);
}
.panel.clip{ clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px)); }
.panel:hover{ border-color:color-mix(in srgb, var(--accent) 30%, transparent); }
.panel-hd{
  display:flex; align-items:center; gap:9px; padding:10px 14px; border-bottom:1px solid var(--line-soft);
  background:linear-gradient(90deg,color-mix(in srgb, var(--accent) 9%, transparent),transparent 70%);
}
.panel-hd h3{
  margin:0; font-family:var(--font-display); font-size:12.5px; font-weight:700; letter-spacing:2.2px;
  color:var(--txt); text-transform:uppercase;
}
.panel-hd .sub{ font-family:var(--font-mono); font-size:10px; color:var(--txt-faint); letter-spacing:1.6px; }
.panel-bd{ padding:var(--pad); }
.panel.tone-red .panel-hd{ background:linear-gradient(90deg,color-mix(in srgb, var(--accent-2) 12%, transparent),transparent 70%); }
.panel.tone-red{ border-color:color-mix(in srgb, var(--accent-2) 24%, transparent); }

.corner-tl,.corner-br{ position:absolute; width:10px; height:10px; pointer-events:none; }
.corner-tl{ top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
.corner-br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--accent-2); border-right:2px solid var(--accent-2); }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:7px 13px; cursor:pointer;
  font-family:var(--font-ui); font-weight:var(--btn-weight); font-size:13px; letter-spacing:var(--btn-track); text-transform:var(--btn-caps);
  color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent); border:1px solid color-mix(in srgb, var(--accent) 42%, transparent);
  transition:.15s; border-radius:var(--btn-radius); white-space:nowrap; user-select:none;
}
.btn:hover{ background:color-mix(in srgb, var(--accent) 18%, transparent); box-shadow:0 0 16px color-mix(in srgb, var(--accent) 30%, transparent); color:var(--txt); }
.btn:active{ transform:translateY(1px); }
.btn i,.btn svg{ width:15px; height:15px; }
.btn.sm{ padding:4px 9px; font-size:11.5px; letter-spacing:.9px; }
.btn.sm i,.btn.sm svg{ width:13px; height:13px; }
.btn.xs{ padding:2px 7px; font-size:10.5px; }
.btn.xs i,.btn.xs svg{ width:11px; height:11px; }
.btn.lg{ padding:11px 20px; font-size:14.5px; }
.btn.red{ color:var(--c-red-t); border-color:color-mix(in srgb, var(--c-red) 45%, transparent); background:color-mix(in srgb, var(--c-red) 10%, transparent); }
.btn.red:hover{ background:color-mix(in srgb, var(--c-red) 22%, transparent); color:var(--c-red); }
.btn.amber{ color:var(--c-amber); border-color:color-mix(in srgb, var(--c-amber) 45%, transparent); background:color-mix(in srgb, var(--c-amber) 10%, transparent); }
.btn.amber:hover{ background:color-mix(in srgb, var(--c-amber) 22%, transparent); }
.btn.lime{ color:var(--c-lime); border-color:color-mix(in srgb, var(--c-lime) 45%, transparent); background:color-mix(in srgb, var(--c-lime) 10%, transparent); }
.btn.lime:hover{ background:color-mix(in srgb, var(--c-lime) 22%, transparent); }
.btn.violet{ color:var(--c-violet); border-color:color-mix(in srgb, var(--c-violet) 45%, transparent); background:color-mix(in srgb, var(--c-violet) 10%, transparent); }
.btn.violet:hover{ background:color-mix(in srgb, var(--c-violet) 22%, transparent); }
.btn.ghost{ color:var(--txt-dim); border-color:var(--line); background:transparent; }
.btn.ghost:hover{ color:var(--txt); border-color:color-mix(in srgb, var(--accent) 40%, transparent); background:color-mix(in srgb, var(--accent) 7%, transparent); box-shadow:none; }
.btn.solid{ color:var(--on-accent,#04121a); background:var(--accent); border-color:var(--accent); text-shadow:none; box-shadow:0 0 18px color-mix(in srgb, var(--accent) 40%, transparent); }
.btn.solid:hover{ filter:brightness(1.12); }
.btn.solid.red{ color:#fff; background:var(--c-red); border-color:var(--c-red); box-shadow:0 0 18px color-mix(in srgb, var(--c-red) 45%, transparent); }
.btn[disabled]{ opacity:.4; pointer-events:none; }

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; font-family:var(--font-mono); font-size:10px;
  letter-spacing:1.3px; text-transform:uppercase; border:1px solid var(--line); color:var(--txt-dim);
  background:color-mix(in srgb, var(--accent) 5%, transparent); border-radius:999px; white-space:nowrap;
}
.chip.cy{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, transparent); }
.chip.rd{ color:var(--c-red-t); border-color:color-mix(in srgb, var(--c-red) 40%, transparent); background:color-mix(in srgb, var(--c-red) 8%, transparent); }
.chip.am{ color:var(--c-amber); border-color:color-mix(in srgb, var(--c-amber) 40%, transparent); background:color-mix(in srgb, var(--c-amber) 8%, transparent); }
.chip.lm{ color:var(--c-lime); border-color:color-mix(in srgb, var(--c-lime) 40%, transparent); background:color-mix(in srgb, var(--c-lime) 8%, transparent); }
.chip.vi{ color:var(--c-violet); border-color:color-mix(in srgb, var(--c-violet) 40%, transparent); background:color-mix(in srgb, var(--c-violet) 8%, transparent); }

label.fld{ display:block; margin-bottom:11px; }
label.fld > span.lb, .lb{
  display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:2px; text-transform:uppercase;
  color:var(--txt-faint); margin-bottom:4px;
}
.inp,.sel,.ta{
  width:100%; padding:8px 11px; background:var(--field); border:1px solid var(--line);
  color:var(--txt); font-family:var(--font-ui); font-size:14.5px; outline:none; transition:.15s;
  border-radius:var(--radius);
}
.ta{ resize:vertical; min-height:80px; line-height:1.62; }
.inp:focus,.sel:focus,.ta:focus{ border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); background:var(--field-focus); }
.inp::placeholder,.ta::placeholder{ color:var(--txt-faint); }
.sel{ appearance:none; cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 10px) calc(50% + 1px);
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px; }
.sel option{ background:var(--surface-2); color:var(--txt); }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:3px; background:color-mix(in srgb, var(--accent) 20%, transparent); outline:none; cursor:pointer; }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; background:var(--accent); border:2px solid #041018; box-shadow:0 0 12px var(--accent); cursor:pointer; border-radius:50%; }
input[type=range]::-moz-range-thumb{ width:13px; height:13px; background:var(--accent); border:2px solid #041018; box-shadow:0 0 12px var(--accent); cursor:pointer; border-radius:50%; }
input[type=color]{ width:100%; height:34px; background:transparent; border:1px solid var(--line); cursor:pointer; padding:2px; }
input[type=checkbox]{ accent-color:#23e0ff; width:15px; height:15px; cursor:pointer; }

.grid-auto{ display:grid; gap:14px; }
.g2{ grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
.g3{ grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); }
.g4{ grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }

.stat{ padding:13px 15px; position:relative; overflow:hidden; }
.stat .v{ font-family:var(--font-display); font-size:28px; font-weight:800; color:var(--txt); line-height:1.05; text-shadow:0 0 20px color-mix(in srgb, var(--accent) 40%, transparent); }
.stat .k{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:2.2px; color:var(--txt-faint); text-transform:uppercase; margin-top:5px; }
.stat .ic{ position:absolute; right:10px; top:10px; opacity:.16; }
.stat .ic i,.stat .ic svg{ width:40px; height:40px; }
.stat.red .v{ color:#ffd7db; text-shadow:0 0 20px color-mix(in srgb, var(--accent-2) 50%, transparent); }
.stat.amber .v{ color:#ffe7bd; text-shadow:0 0 20px rgba(255,180,58,.45); }
.stat.lime .v{ color:#ddffc9; text-shadow:0 0 20px rgba(141,255,79,.4); }

.bar{ height:6px; background:color-mix(in srgb, var(--accent) 10%, transparent); border:1px solid var(--line-soft); overflow:hidden; }
.bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent-3) 45%,var(--accent)); box-shadow:0 0 12px color-mix(in srgb, var(--accent) 50%, transparent); transition:width .5s ease; }

.empty{ text-align:center; padding:46px 20px; color:var(--txt-faint); }
.empty i,.empty svg{ width:40px; height:40px; opacity:.35; margin-bottom:10px; }
.empty h4{ font-family:var(--font-display); letter-spacing:2px; font-size:14px; color:var(--txt-dim); margin:0 0 6px; }

.dropzone{
  border:1px dashed color-mix(in srgb, var(--accent) 35%, transparent); background:color-mix(in srgb, var(--accent) 4%, transparent); display:grid; place-items:center;
  text-align:center; padding:20px; cursor:pointer; transition:.15s; color:var(--txt-faint); position:relative;
}
.dropzone:hover,.dropzone.over{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 11%, transparent); color:var(--accent); box-shadow:inset 0 0 30px color-mix(in srgb, var(--accent) 10%, transparent); }
.dropzone i,.dropzone svg{ width:26px; height:26px; margin-bottom:6px; }

/* ------------------------------- MODALS --------------------------------- */
.modal-scrim{
  position:fixed; inset:0; z-index:9000; background:rgba(2,4,8,.82); backdrop-filter:blur(7px);
  display:flex; align-items:flex-start; justify-content:center; padding:36px 16px; overflow-y:auto;
  animation:fade .16s ease;
}
@keyframes fade{ from{opacity:0} to{opacity:1} }
@keyframes riseIn{ from{opacity:0;transform:translateY(14px) scale(.985)} to{opacity:1;transform:none} }
.modal{
  width:100%; max-width:760px; background:var(--surface-2);
  border:1px solid color-mix(in srgb, var(--accent) 42%, transparent); box-shadow:0 40px 100px rgba(0,0,0,.9),0 0 60px color-mix(in srgb, var(--accent) 13%, transparent);
  animation:riseIn .2s cubic-bezier(.2,.9,.3,1); position:relative; margin:auto 0;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
}
.modal.wide{ max-width:1180px; } .modal.narrow{ max-width:480px; }
.modal-hd{ display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,color-mix(in srgb, var(--accent-2) 10%, transparent),color-mix(in srgb, var(--accent) 7%, transparent) 45%,transparent); }
.modal-hd h3{ margin:0; font-family:var(--font-display); font-size:14px; letter-spacing:2.4px; color:var(--txt); text-transform:uppercase; flex:1; }
.modal-bd{ padding:18px; max-height:min(70vh,760px); overflow-y:auto; }
.modal-ft{ padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; background:var(--sunk); }
.xclose{ background:transparent; border:1px solid var(--line); color:var(--txt-dim); width:28px; height:28px; display:grid; place-items:center; cursor:pointer; }
.xclose:hover{ color:#fff; border-color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 15%, transparent); }

/* -------------------------------- TOASTS -------------------------------- */
#toasts{ position:fixed; right:16px; bottom:16px; z-index:9500; display:flex; flex-direction:column; gap:8px; max-width:380px; }
.toast{
  display:flex; gap:10px; align-items:flex-start; padding:10px 13px; background:var(--surface-2);
  border:1px solid var(--line-hard); border-left:3px solid var(--accent); box-shadow:0 14px 36px rgba(0,0,0,.7),var(--glow);
  font-size:13.5px; animation:slideIn .22s cubic-bezier(.2,.9,.3,1); color:var(--txt);
}
@keyframes slideIn{ from{opacity:0;transform:translateX(26px)} to{opacity:1;transform:none} }
.toast.err{ border-left-color:var(--accent-2); box-shadow:0 14px 36px rgba(0,0,0,.7),var(--glow-red); }
.toast.warn{ border-left-color:var(--accent-3); }
.toast.ok{ border-left-color:var(--c-lime); }
.toast b{ display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:2px; color:var(--accent); text-transform:uppercase; }
.toast.err b{ color:var(--c-red-t); } .toast.warn b{ color:var(--accent-3); } .toast.ok b{ color:var(--c-lime); }

/* ------------------------------- EDITOR --------------------------------- */
.editor-wrap{ display:flex; flex-direction:column; min-height:0; }
.etoolbar{
  display:flex; flex-wrap:wrap; gap:4px; padding:7px 9px; border-bottom:1px solid var(--line-soft);
  background:var(--sunk); align-items:center; position:sticky; top:0; z-index:20; backdrop-filter:blur(8px);
}
.etool{
  width:29px; height:27px; display:grid; place-items:center; background:transparent; border:1px solid transparent;
  color:var(--txt-dim); cursor:pointer; transition:.12s; border-radius:var(--radius);
}
.etool:hover{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 35%, transparent); background:color-mix(in srgb, var(--accent) 9%, transparent); }
.etool.on{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 50%, transparent); background:color-mix(in srgb, var(--accent) 15%, transparent); }
.etool i,.etool svg{ width:14px; height:14px; }
.esep{ width:1px; height:18px; background:var(--line); margin:0 3px; }
.rte{
  min-height:420px; padding:26px 30px; outline:none; color:var(--rte-fg); font-size:16.5px; line-height:1.85;
  background:var(--rte-bg); overflow-y:auto; font-family:'Inter',var(--font-ui);
}
.rte:focus{ background:var(--rte-bg); }
.rte p{ margin:0 0 1.05em; } .rte h2{ font-family:var(--font-display); font-size:22px; color:var(--txt); letter-spacing:1.6px; margin:1.5em 0 .6em; }
.rte h3{ font-family:var(--font-display); font-size:17px; color:var(--accent); letter-spacing:1.2px; margin:1.3em 0 .5em; }
.rte blockquote{ border-left:3px solid var(--accent); margin:1.2em 0; padding:.3em 0 .3em 1.1em; color:var(--txt-dim); font-style:italic; background:color-mix(in srgb, var(--accent) 5%, transparent); }
.rte hr{ border:0; border-top:1px solid var(--line); margin:2em 0; }
.rte ul,.rte ol{ padding-left:1.6em; margin:0 0 1em; }
.rte ul{ list-style:disc; } .rte ol{ list-style:decimal; } .rte li{ margin-bottom:.3em; }
.rte img{ max-width:100%; border:1px solid var(--line); margin:.8em 0; display:block; }
.rte:empty::before{ content:attr(data-ph); color:var(--txt-faint); font-style:italic; }
.rte.wide-measure{ max-width:none; }
.rte.paper{ background:#f4f1e8; color:#20242b; font-family:'Playfair Display',Georgia,serif; }
.rte.paper blockquote{ color:#4a5058; background:rgba(0,0,0,.04); border-left-color:#8a7f6a; }
.rte.focus-mode{ font-size:19px; line-height:2; padding:40px 8%; }

/* AI inserted text highlight */
.ai-ins{
  display:block; background:linear-gradient(90deg,rgba(255,180,58,.22),rgba(141,255,79,.13));
  border-left:3px solid rgba(255,180,58,.8); box-shadow:0 0 24px rgba(255,180,58,.20) inset;
  color:var(--txt); padding:8px 12px; margin:.7em 0; animation:aiPulse 1.9s ease-in-out infinite; border-radius:2px;
}
.ai-ins p:last-child{ margin-bottom:0; }
@keyframes aiPulse{ 0%,100%{ box-shadow:0 0 14px rgba(255,180,58,.20) inset; } 50%{ box-shadow:0 0 30px rgba(141,255,79,.34) inset; } }
.ai-ins.kept{ animation:none; background:transparent; border-bottom:0; box-shadow:none; color:inherit; }
.diffbar{
  position:sticky; bottom:0; z-index:30; display:flex; align-items:center; gap:9px; padding:9px 13px;
  background:linear-gradient(90deg,rgba(255,180,58,.14),rgba(6,12,20,.97));
  border-top:1px solid rgba(255,180,58,.5); box-shadow:0 -10px 30px rgba(0,0,0,.6); flex-wrap:wrap;
}

/* --------------------------- CHARACTER CARDS ---------------------------- */
.cast-card{
  position:relative; overflow:hidden; cursor:pointer; transition:.18s;
  background:linear-gradient(160deg,rgba(12,22,34,.9),rgba(5,10,17,.94)); border:1px solid var(--line);
}
.cast-card:hover{ transform:translateY(-3px); border-color:var(--accent); box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 26px color-mix(in srgb, var(--accent) 18%, transparent); }
.cast-photo{ height:172px; background:var(--void); position:relative; overflow:hidden; display:grid; place-items:center; }
.cast-photo img{ width:100%; height:100%; object-fit:cover; filter:contrast(1.06) saturate(1.05); }
.cast-photo .ph{ font-family:var(--font-display); font-size:40px; color:color-mix(in srgb, var(--accent) 22%, transparent); }
.cast-photo::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,rgba(4,8,14,.95)); }
.cast-tier{ position:absolute; top:8px; left:8px; z-index:3; }
.cast-body{ padding:11px 13px; }
.cast-name{ font-family:var(--font-display); font-size:14.5px; letter-spacing:1.4px; color:var(--txt); margin:0; }
.cast-role{ font-family:var(--font-mono); font-size:10px; color:var(--accent); letter-spacing:1.6px; }
.tier-lead{ border-color:color-mix(in srgb, var(--accent-2) 50%, transparent) !important; }
.tier-lead .cast-photo::before{ content:''; position:absolute; inset:0; z-index:2; box-shadow:inset 0 0 60px color-mix(in srgb, var(--accent-2) 28%, transparent); }
.tier-co{ border-color:rgba(255,180,58,.42) !important; }
.tier-sup{ border-color:color-mix(in srgb, var(--accent) 34%, transparent) !important; }
.tier-min{ border-color:rgba(120,150,170,.28) !important; }

/* --------------------------- RELATIONSHIP MAP --------------------------- */
#relCanvas{ width:100%; height:560px; background:
  radial-gradient(ellipse at 50% 50%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%),
  repeating-linear-gradient(0deg,color-mix(in srgb, var(--accent) 5%, transparent) 0 1px,transparent 1px 40px),
  repeating-linear-gradient(90deg,color-mix(in srgb, var(--accent) 5%, transparent) 0 1px,transparent 1px 40px), #04070d;
  border:1px solid var(--line); cursor:grab; user-select:none; }
.rel-node{ cursor:grab; }
.rel-node:active{ cursor:grabbing; }

/* ------------------------------- CHAT ----------------------------------- */
.chatlog{ height:440px; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:11px; background:var(--rte-bg); }
.msg{ max-width:78%; padding:9px 13px; font-size:14.5px; line-height:1.6; position:relative; }
.msg.me{ align-self:flex-end; background:color-mix(in srgb, var(--accent) 13%, transparent); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent); color:var(--txt);
  clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px)); }
.msg.them{ align-self:flex-start; background:color-mix(in srgb, var(--accent-2) 10%, transparent); border:1px solid color-mix(in srgb, var(--accent-2) 30%, transparent); color:var(--txt);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%); }
.msg .who{ font-family:var(--font-mono); font-size:9px; letter-spacing:2px; opacity:.7; display:block; margin-bottom:3px; text-transform:uppercase; }
.typing span{ display:inline-block; width:6px; height:6px; background:var(--accent-2); border-radius:50%; margin:0 2px; animation:blip 1.1s infinite; }
.typing span:nth-child(2){ animation-delay:.16s } .typing span:nth-child(3){ animation-delay:.32s }
@keyframes blip{ 0%,60%,100%{ opacity:.25; transform:translateY(0) } 30%{ opacity:1; transform:translateY(-4px) } }

/* ------------------------------- COMICS --------------------------------- */
.comic-page{ background:var(--surface-2); border:1px solid var(--line); padding:10px; display:grid; gap:8px; aspect-ratio:2/3; }
.comic-panel{
  position:relative; background:linear-gradient(140deg,#0d1826,#070d16); border:2px solid color-mix(in srgb, var(--accent) 35%, transparent);
  overflow:hidden; cursor:grab; display:flex; flex-direction:column; min-height:60px;
}
.comic-panel.dragging{ opacity:.35; }
.comic-panel.dragover{ border-color:var(--accent-3); box-shadow:inset 0 0 26px rgba(255,180,58,.28); }
.comic-panel img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.92; }
.comic-panel .pn{ position:absolute; top:3px; left:5px; font-family:var(--font-mono); font-size:10px; color:var(--accent); z-index:3; text-shadow:0 0 6px #000; }
.comic-panel .pv{ position:relative; z-index:2; padding:16px 8px 8px; font-size:11px; color:var(--txt-dim); overflow:hidden; }
.comic-panel .bub{ background:#e9f4fa; color:#101820; border-radius:9px; padding:3px 7px; font-size:10.5px; margin:3px 0; display:inline-block; max-width:100%; font-family:'Inter',sans-serif; }
.comic-panel .sfx{ font-family:var(--font-display); color:var(--accent-3); font-size:14px; text-shadow:0 0 10px rgba(255,180,58,.7); }

/* --------------------------- MOODBOARD CANVAS --------------------------- */
#moodCanvas{ position:relative; height:640px; overflow:hidden; border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb, var(--accent) 6%, transparent),transparent 60%),
  repeating-linear-gradient(0deg,color-mix(in srgb, var(--accent) 4%, transparent) 0 1px,transparent 1px 30px),
  repeating-linear-gradient(90deg,color-mix(in srgb, var(--accent) 4%, transparent) 0 1px,transparent 1px 30px),#04070d; }
.pin{ position:absolute; min-width:110px; max-width:300px; background:var(--surface-2); border:1px solid var(--line-hard);
  box-shadow:0 12px 30px rgba(0,0,0,.7); cursor:grab; user-select:none; }
.pin.dragging{ cursor:grabbing; z-index:999 !important; box-shadow:0 20px 50px rgba(0,0,0,.85),var(--glow); }
.pin img{ width:100%; display:block; }
.pin .pin-x{ position:absolute; top:-9px; right:-9px; width:20px; height:20px; background:#12202e; border:1px solid var(--accent-2);
  color:var(--c-red-t); display:none; place-items:center; font-size:12px; cursor:pointer; z-index:5; }
.pin:hover .pin-x{ display:grid; }
.pin .cap{ padding:6px 8px; font-size:12px; color:var(--txt-dim); }

/* ---------------------------- HEATMAP / GRAPH --------------------------- */
.heat{ display:flex; gap:3px; align-items:stretch; height:110px; }
.heat .col{ flex:1 1 0; min-width:6px; height:100%; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; cursor:pointer; position:relative; }
.heat .col .t{ width:100%; transition:.3s; }
.heat .col:hover .t{ filter:brightness(1.5); }
.heat .lbl{ font-family:var(--font-mono); font-size:8px; color:var(--txt-faint); text-align:center; margin-top:3px; }

/* ------------------------------- MISC ----------------------------------- */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.tab{ padding:7px 15px; background:transparent; border:1px solid transparent; border-bottom:0; color:var(--txt-dim);
  font-family:var(--font-ui); font-weight:700; font-size:13px; letter-spacing:1.1px; cursor:pointer; text-transform:uppercase; }
.tab:hover{ color:var(--txt); background:color-mix(in srgb, var(--accent) 6%, transparent); }
.tab.on{ color:var(--accent); border-color:var(--line-hard); background:color-mix(in srgb, var(--accent) 11%, transparent); box-shadow:inset 0 2px 0 var(--accent); }

.accordion .acc-hd{ display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; cursor:pointer;
  background:color-mix(in srgb, var(--accent) 5%, transparent); border:1px solid var(--line); color:var(--txt); text-align:left; font-family:var(--font-ui);
  font-weight:700; font-size:15px; letter-spacing:.7px; transition:.15s; }
.accordion .acc-hd:hover{ background:color-mix(in srgb, var(--accent) 10%, transparent); border-color:color-mix(in srgb, var(--accent) 35%, transparent); }
.accordion .acc-bd{ display:none; padding:16px 18px; border:1px solid var(--line); border-top:0; background:var(--sunk); }
.accordion .acc-item.open .acc-bd{ display:block; animation:fade .2s; }
.accordion .acc-item.open .acc-hd{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, transparent); }
.prose-c{ color:var(--txt-dim); font-size:14.5px; line-height:1.75; }
.prose-c h5{ font-family:var(--font-display); font-size:12.5px; letter-spacing:1.8px; color:var(--accent); margin:1.2em 0 .45em; text-transform:uppercase; }
.prose-c p{ margin:0 0 .85em; }
.prose-c ul{ margin:0 0 .9em; padding-left:1.3em; list-style:disc; }
.prose-c ol{ margin:0 0 .9em; padding-left:1.45em; list-style:decimal; }
.prose-c li{ margin-bottom:.35em; }
.prose-c a{ color:var(--accent); text-decoration:underline; }
.prose-c strong{ color:var(--txt); } .prose-c em{ color:var(--accent-3); font-style:normal; }
.prose-c code{ font-family:var(--font-mono); background:color-mix(in srgb, var(--accent) 10%, transparent); padding:1px 5px; color:var(--accent); font-size:.9em; }

.savepill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; letter-spacing:1.6px;
  color:var(--txt-faint); text-transform:uppercase; }
.savepill .dot{ width:7px; height:7px; border-radius:50%; background:#8dff4f; box-shadow:0 0 9px #8dff4f; }
.savepill.saving .dot{ background:var(--accent-3); box-shadow:0 0 9px var(--accent-3); animation:blink .7s infinite; }
.savepill.dirty .dot{ background:var(--accent-2); box-shadow:0 0 9px var(--accent-2); }
@keyframes blink{ 50%{ opacity:.25 } }

.wcount{ font-family:var(--font-mono); font-size:10.5px; color:var(--txt-faint); letter-spacing:1.4px; }
.wcount b{ color:var(--accent); font-weight:400; }

.sortrow{ transition:.14s; }
.sortrow.dragging{ opacity:.35; }
.sortrow.dragover{ box-shadow:inset 0 3px 0 var(--accent-3); }

.cover-preview{ aspect-ratio:2/3; background:var(--surface-2); border:1px solid var(--line); position:relative; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,.7); }
.cover-preview img.art{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cover-preview .cvr-scrim{ position:absolute; inset:0; }
.cover-preview .cvr-txt{ position:relative; z-index:3; padding:22px; height:100%; display:flex; flex-direction:column; }
.trimguide{ position:absolute; inset:14px; border:1px dashed color-mix(in srgb, var(--accent-2) 55%, transparent); z-index:6; pointer-events:none; }
.trimguide::after{ content:'TRIM / SAFE ZONE'; position:absolute; top:-16px; left:0; font-family:var(--font-mono); font-size:8px; color:color-mix(in srgb, var(--accent-2) 85%, transparent); letter-spacing:1.5px; }
.barcode{ background:#fff; padding:5px 7px 3px; display:inline-block; }
.barcode .bars{ height:32px; width:104px; background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 3px,#000 3px 4px,#fff 4px 7px,#000 7px 9px,#fff 9px 11px); }
.barcode .num{ font-family:var(--font-mono); font-size:7px; color:#000; text-align:center; letter-spacing:1px; }

.wizard-step{ display:none; } .wizard-step.on{ display:block; animation:fade .22s; }
.step-dots{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.step-dot{ width:26px; height:26px; display:grid; place-items:center; border:1px solid var(--line); color:var(--txt-faint);
  font-family:var(--font-mono); font-size:11px; cursor:pointer; transition:.15s; }
.step-dot.on{ border-color:var(--accent); color:var(--accent); background:color-mix(in srgb, var(--accent) 15%, transparent); box-shadow:0 0 14px color-mix(in srgb, var(--accent) 30%, transparent); }
.step-dot.done{ border-color:rgba(141,255,79,.5); color:var(--c-lime); }

.optcard{ cursor:pointer; transition:.16s; border:1px solid var(--line); background:var(--bg-panel); padding:13px; }
.optcard:hover{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent); transform:translateY(-2px); }
.optcard.sel{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 13%, transparent); box-shadow:0 0 22px color-mix(in srgb, var(--accent) 20%, transparent); }
.optcard.tone1{ border-left:3px solid var(--accent); }
.optcard.tone2{ border-left:3px solid var(--accent-2); }
.optcard.tone3{ border-left:3px solid var(--accent-3); }

.kbd{ font-family:var(--font-mono); font-size:10px; padding:1px 5px; border:1px solid var(--line); color:var(--txt-dim); background:color-mix(in srgb, var(--accent) 6%, transparent); }

.mobile-only{ display:none; }
@media(max-width:1024px){
  :root{ --rail-w:250px; }
  .rail{ position:fixed; top:var(--brand-h); bottom:0; left:0; transform:translateX(-102%); transition:transform .22s ease; z-index:500; }

  .mobile-only{ display:inline-flex; }
  .view-pad{ padding:14px 13px 80px; }

}

}

@media print{

  .rail,.brandbar,.banner,.no-print{ display:none !important; }

  .main-scroll{ overflow:visible; }
}

/* =========================================================================
   v2 — PAGE THEMES · HELP · SOCIAL BOOK PROFILES · FEED · SLIDESHOW · NAV DND
   ========================================================================= */

/* --- page background layer (image / GIF behind everything) --- */
#pageBg{ position:fixed; inset:0; z-index:0; pointer-events:none; background-repeat:no-repeat; }
#pageBg .pbimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#pageBg .pbdim{ position:absolute; inset:0; background:var(--bg-void); }

/* --- plain-English help panels --- */
.helpbox{
  border:1px solid color-mix(in srgb, var(--accent) 28%, transparent); border-left:3px solid var(--accent);
  background:linear-gradient(90deg,color-mix(in srgb, var(--accent) 9%, transparent),rgba(6,12,20,.55));
  padding:11px 14px; font-size:13.5px; line-height:1.62; color:var(--txt-dim); border-radius:var(--radius);
}
.helpbox b{ display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:2.2px; color:var(--accent); margin-bottom:4px; }
.helpbox strong{ color:var(--txt); } .helpbox em{ color:var(--accent-3); font-style:normal; }
.guide{ margin-bottom:14px; }
.guide-hd{
  display:flex; align-items:center; gap:9px; width:100%; padding:10px 14px; cursor:pointer; text-align:left;
  background:linear-gradient(90deg,color-mix(in srgb, var(--accent-2) 12%, transparent),color-mix(in srgb, var(--accent) 6%, transparent) 55%,transparent);
  border:1px solid color-mix(in srgb, var(--accent) 26%, transparent); color:var(--txt); font-family:var(--font-ui); font-weight:700;
  font-size:13.5px; letter-spacing:.6px; border-radius:var(--radius);
}
.guide-hd:hover{ border-color:var(--accent); background:linear-gradient(90deg,color-mix(in srgb, var(--accent-2) 18%, transparent),color-mix(in srgb, var(--accent) 11%, transparent) 55%,transparent); }
.guide-hd .q{ width:19px; height:19px; flex:0 0 19px; display:grid; place-items:center; border-radius:50%;
  background:var(--accent); color:#04121a; font-weight:900; font-size:12px; font-family:var(--font-display); }
.guide-bd{ border:1px solid var(--line); border-top:0; background:var(--sunk); padding:14px 16px; animation:fade .18s; }
.guide-bd .cols{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
.guide-bd h6{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:2.2px; color:var(--accent-3); margin:0 0 6px; text-transform:uppercase; }
.guide-bd ol,.guide-bd ul{ margin:0; padding-left:1.25em; font-size:13.5px; line-height:1.66; color:var(--txt-dim); }
.guide-bd ol{ list-style:decimal; } .guide-bd ul{ list-style:disc; }
.guide-bd li{ margin-bottom:5px; } .guide-bd li strong{ color:var(--txt); }
.hint{ display:block; font-size:11.5px; color:var(--txt-faint); line-height:1.5; margin-top:4px; }
label.fld > .hint{ margin-top:3px; }

/* --- sidebar arrange mode --- */
.rail-editbar{ display:flex; gap:5px; padding:7px 6px 4px; flex-wrap:wrap; }
.rail-tip{ font-size:11px; color:var(--txt-faint); padding:0 8px 8px; line-height:1.5; }
.rail-tip b{ color:var(--accent); }
.rail-label{ cursor:pointer; user-select:none; border-bottom:1px solid var(--line-soft); }
.rail-label::after{ content:none !important; }
.rail-label .gname{ flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rail-label .gcaret{ color:var(--accent); font-size:9px; }
.rail-label:hover{ color:var(--accent); }
.rail-group.editing{ border:1px dashed color-mix(in srgb, var(--accent) 22%, transparent); border-radius:var(--radius); margin-bottom:8px; }
.rail-group.dragover{ border-color:var(--accent-3); box-shadow:inset 0 0 22px rgba(255,180,58,.16); }
.rail-group.dragging{ opacity:.4; }
.navwrap{ display:flex; align-items:center; gap:2px; }
.navwrap .navitem{ flex:1 1 auto; min-width:0; }
.navwrap.dragging{ opacity:.35; }
.navwrap.dragover{ box-shadow:inset 0 2px 0 var(--accent-3); }
.draghandle{ color:var(--txt-faint); cursor:grab; padding:0 3px; font-size:13px; line-height:1; letter-spacing:-1px; }
.draghandle:active{ cursor:grabbing; }
.draghandle.sm{ font-size:11px; }
.rail-items.dragover{ background:rgba(255,180,58,.07); }
.dropslot{ border:1px dashed color-mix(in srgb, var(--accent) 30%, transparent); color:var(--txt-faint); font-size:11px; text-align:center; padding:9px; margin:3px 0; }
.railav{ width:18px; height:18px; flex:0 0 18px; border-radius:50%; overflow:hidden; border:1px solid var(--line-hard); }
.railav img{ width:100%; height:100%; object-fit:cover; }

/* ======================= SOCIAL BOOK PROFILE ============================= */
.prof-cover{ position:relative; width:100%; overflow:hidden; border:1px solid var(--line); background:var(--void); }
.prof-cover .banner-media{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.prof-cover .cvtools{ position:absolute; top:9px; right:10px; display:flex; gap:5px; z-index:6; }
.prof-cover .cvscrim{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(3,5,10,.15),rgba(3,5,10,.9)); }

.prof-head{
  display:flex; align-items:flex-end; gap:18px; padding:0 20px 16px; margin-top:-44px; position:relative; z-index:5;
  flex-wrap:wrap;
}
.prof-head.pos-center{ flex-direction:column; align-items:center; text-align:center; }
.prof-head.pos-right{ flex-direction:row-reverse; text-align:right; }
.prof-head.pos-right .prof-actions{ margin-right:auto; margin-left:0; }
.prof-av{
  flex:0 0 auto; overflow:hidden; background:var(--void); border:3px solid var(--accent);
  box-shadow:0 0 26px color-mix(in srgb, var(--accent) 40%, transparent),0 14px 40px rgba(0,0,0,.75); display:grid; place-items:center; cursor:pointer;
  position:relative; transition:.18s;
}
.prof-av:hover{ border-color:var(--accent-2); box-shadow:0 0 30px color-mix(in srgb, var(--accent-2) 50%, transparent),0 14px 40px rgba(0,0,0,.8); }
.prof-av img{ width:100%; height:100%; object-fit:cover; display:block; }
.prof-av .ph{ font-family:var(--font-display); color:color-mix(in srgb, var(--accent) 40%, transparent); font-weight:900; }
.prof-av.circle{ border-radius:50%; }
.prof-av.rounded{ border-radius:14px; }
.prof-av.square{ border-radius:2px; }
.prof-av.hex{ clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%); border-radius:0; }
.prof-av .avedit{
  position:absolute; right:4px; bottom:4px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center;
  background:rgba(4,10,18,.92); border:1px solid var(--accent); color:var(--accent); font-size:11px;
}
.prof-id{ flex:1 1 260px; min-width:0; padding-bottom:4px; }
.prof-name{
  font-family:var(--font-display); font-size:27px; font-weight:800; letter-spacing:1.6px; color:var(--txt); margin:0;
  text-shadow:0 0 22px color-mix(in srgb, var(--accent) 35%, transparent),0 2px 12px #000; word-break:break-word; line-height:1.12;
}
.prof-handle{ font-family:var(--font-mono); font-size:11px; letter-spacing:1.8px; color:var(--accent); margin-top:3px; }
.prof-tagline{ font-size:14px; color:var(--txt-dim); margin-top:6px; max-width:70ch; }
.prof-chips{ display:flex; gap:5px; flex-wrap:wrap; margin-top:9px; }
.prof-actions{ display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; padding-bottom:4px; }
.prof-head.pos-center .prof-actions{ margin:10px auto 0; justify-content:center; }

.prof-statbar{ display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:1px; background:var(--line);
  border:1px solid var(--line); margin-bottom:14px; }
.prof-statbar > div{ background:var(--bg-panel); padding:10px 12px; text-align:center; }
.prof-statbar .v{ font-family:var(--font-display); font-size:19px; color:var(--txt); }
.prof-statbar .k{ font-family:var(--font-mono); font-size:9px; letter-spacing:1.8px; color:var(--txt-faint); margin-top:3px; }

.prof-tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); flex-wrap:wrap; margin-bottom:14px;
  position:sticky; top:0; z-index:30; background:var(--chrome); backdrop-filter:blur(9px); }
.prof-tabs .tab{ display:flex; align-items:center; gap:6px; }
.prof-tabs .tab i,.prof-tabs .tab svg{ width:14px; height:14px; }

/* --- chapter feed --- */
.feed{ display:flex; flex-direction:column; gap:0; }
.post{
  background:var(--bg-panel); border:1px solid var(--line); backdrop-filter:blur(9px); position:relative;
  border-radius:var(--radius); box-shadow:0 10px 30px rgba(0,0,0,.45); scroll-margin-top:80px; transition:border-color .16s;
}
.post:hover{ border-color:color-mix(in srgb, var(--accent) 30%, transparent); }
.post.open{ border-color:color-mix(in srgb, var(--accent) 50%, transparent); box-shadow:0 14px 44px rgba(0,0,0,.6),0 0 26px color-mix(in srgb, var(--accent) 10%, transparent); }
.post::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--pc,var(--line-hard)); box-shadow:0 0 12px var(--pc,transparent); }
.post-hd{ display:flex; align-items:center; gap:10px; padding:11px 14px 11px 17px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap; }
.post-num{
  width:38px; height:38px; flex:0 0 38px; display:grid; place-items:center; border:1px solid var(--pc,var(--line-hard));
  background:color-mix(in srgb, var(--accent) 7%, transparent); font-family:var(--font-display); font-weight:800; font-size:14px; color:var(--pc,var(--accent));
  border-radius:50%; text-shadow:0 0 10px currentColor;
}
.post-meta{ flex:1 1 200px; min-width:0; }
.post-title{
  width:100%; background:transparent; border:1px solid transparent; color:var(--txt); font-family:var(--font-display);
  font-size:15px; letter-spacing:1.1px; padding:3px 6px; border-radius:2px;
}
.post-title:hover{ border-color:var(--line); } .post-title:focus{ border-color:var(--accent); background:rgba(3,8,14,.8); outline:none; }
.post-sub{ font-family:var(--font-mono); font-size:10px; color:var(--txt-faint); letter-spacing:1.4px; padding-left:7px; }
.post-tools{ display:flex; gap:4px; flex-wrap:wrap; }
.post-body{ padding:14px 18px 14px 17px; }
.post-excerpt{ font-family:'Inter',var(--font-ui); font-size:14.5px; line-height:1.8; color:var(--txt-dim); }
.post-excerpt p{ margin:0 0 .85em; }
.post-excerpt .fade{ -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent); mask-image:linear-gradient(180deg,#000 55%,transparent); max-height:190px; overflow:hidden; }
.post-empty{ color:var(--txt-faint); font-style:italic; font-size:13.5px; }
.post-imgs{ display:flex; gap:6px; flex-wrap:wrap; padding:0 18px 12px 17px; }
.post-imgs img{ width:78px; height:60px; object-fit:cover; border:1px solid var(--line); }
.post-foot{ display:flex; gap:5px; flex-wrap:wrap; padding:9px 14px 11px 17px; border-top:1px solid var(--line-soft); background:var(--sunk); }
.partbadge{ display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-family:var(--font-mono);
  font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase; border:1px solid var(--pc); color:var(--pc); background:rgba(0,0,0,.35); white-space:nowrap; }
.addhere{ display:flex; align-items:center; gap:10px; padding:9px 0; }
.addhere::before,.addhere::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); }
.addhere button{ opacity:.45; transition:.15s; }
.addhere:hover button{ opacity:1; }
.partsection{
  display:flex; align-items:center; gap:9px; margin:16px 0 8px; font-family:var(--font-mono); font-size:10px;
  letter-spacing:2.4px; text-transform:uppercase; color:var(--pc,var(--accent));
}
.partsection::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--pc,var(--line)),transparent); opacity:.6; }

.storyrail{ max-height:calc(100vh - 190px); overflow:auto; }
.storyrail .srow{
  display:flex; align-items:center; gap:8px; width:100%; padding:6px 9px; background:transparent; border:1px solid transparent;
  color:var(--txt-dim); font-size:13px; cursor:pointer; text-align:left; border-radius:2px;
}
.storyrail .srow:hover{ background:color-mix(in srgb, var(--accent) 8%, transparent); border-color:color-mix(in srgb, var(--accent) 20%, transparent); color:var(--txt); }
.storyrail .dot{ width:8px; height:8px; flex:0 0 8px; border-radius:50%; background:var(--pc,var(--line-hard)); box-shadow:0 0 8px var(--pc,transparent); }
.storyrail .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.storyrail .wc{ font-family:var(--font-mono); font-size:9.5px; color:var(--txt-faint); }

/* --- paragraph story markers inside the editors --- */
.rte [data-marker]{
  position:relative; display:block; border-left:3px solid var(--mk,#23e0ff); padding:4px 0 4px 14px; margin-left:-17px;
  background:linear-gradient(90deg,color-mix(in srgb, var(--accent) 7%, transparent),transparent 60%);
}
.rte [data-marker]::before{
  content:attr(data-marker); position:absolute; left:-2px; top:-9px; font-family:var(--font-mono); font-size:8.5px;
  letter-spacing:1.6px; text-transform:uppercase; color:var(--mk,#23e0ff); background:var(--bg-panel-solid);
  padding:1px 6px; border:1px solid var(--mk,#23e0ff); border-radius:999px; pointer-events:none; white-space:nowrap;
}
.marker-list .mrow{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-left:3px solid var(--pc); cursor:pointer;
  background:color-mix(in srgb, var(--accent) 4%, transparent); margin-bottom:4px; }
.marker-list .mrow:hover{ background:color-mix(in srgb, var(--accent) 11%, transparent); }

/* --- dashboard slideshow --- */
.slideshow{ position:relative; width:100%; overflow:hidden; background:var(--void); border:1px solid var(--line); }
.slideshow .slide{
  position:absolute; inset:0; opacity:0; transition:opacity .85s cubic-bezier(.4,0,.2,1), transform .85s cubic-bezier(.4,0,.2,1);
  pointer-events:none; will-change:opacity,transform;
}
.slideshow .slide img,.slideshow .slide video{ width:100%; height:100%; object-fit:cover; display:block; }
.slideshow .slide.active{ opacity:1; pointer-events:auto; z-index:2; }
.slideshow[data-tr="slide"] .slide{ transform:translateX(28%); }
.slideshow[data-tr="slide"] .slide.active{ transform:none; }
.slideshow[data-tr="zoom"] .slide{ transform:scale(1.14); }
.slideshow[data-tr="zoom"] .slide.active{ transform:scale(1); }
.slideshow[data-tr="flip"] .slide{ transform:rotateY(52deg); transform-origin:left center; }
.slideshow[data-tr="flip"] .slide.active{ transform:none; }
.slideshow[data-tr="blur"] .slide{ filter:blur(16px); }
.slideshow[data-tr="blur"] .slide.active{ filter:none; }
.slideshow[data-tr="kenburns"] .slide.active img{ animation:kenb 9s ease-out forwards; }
@keyframes kenb{ from{ transform:scale(1.02) translate(0,0) } to{ transform:scale(1.16) translate(-1.5%,-1.5%) } }
.slideshow .scap{
  position:absolute; left:0; right:0; bottom:0; z-index:5; padding:34px 20px 16px;
  background:linear-gradient(180deg,transparent,rgba(3,6,12,.94)); pointer-events:none;
}
.slideshow .scap h4{ margin:0; font-family:var(--font-display); font-size:17px; letter-spacing:1.6px; color:var(--txt); text-shadow:0 2px 14px #000; }
.slideshow .scap p{ margin:4px 0 0; font-size:13px; color:var(--txt-dim); }
.slideshow .snav{ position:absolute; top:50%; transform:translateY(-50%); z-index:7; width:34px; height:44px;
  display:grid; place-items:center; background:rgba(3,8,14,.7); border:1px solid var(--line-hard); color:var(--accent); cursor:pointer; }
.slideshow .snav:hover{ background:color-mix(in srgb, var(--accent) 20%, transparent); }
.slideshow .snav.prev{ left:8px; } .slideshow .snav.next{ right:8px; }
.slideshow .sdots{ position:absolute; bottom:9px; left:0; right:0; z-index:8; display:flex; gap:6px; justify-content:center; }
.slideshow .sdots i{ width:8px; height:8px; border-radius:50%; background:color-mix(in srgb, var(--accent) 30%, transparent); border:1px solid color-mix(in srgb, var(--accent) 60%, transparent); cursor:pointer; display:block; }
.slideshow .sdots i.on{ background:var(--accent); box-shadow:0 0 10px var(--accent); width:20px; border-radius:4px; }
.slideshow .stools{ position:absolute; top:9px; right:9px; z-index:8; display:flex; gap:5px; }

/* --- theme picker swatches --- */
.themecard{ cursor:pointer; border:1px solid var(--line); padding:0; overflow:hidden; background:var(--void); transition:.16s; }
.themecard:hover{ border-color:var(--accent); transform:translateY(-2px); }
.themecard.sel{ border-color:var(--accent); box-shadow:0 0 20px color-mix(in srgb, var(--accent) 28%, transparent); }
.themecard .sw{ height:46px; display:flex; }
.themecard .sw i{ flex:1; display:block; }
.themecard .nm{ padding:7px 9px; font-family:var(--font-display); font-size:11px; letter-spacing:1.3px; color:var(--txt); }

/* --- lore cards --- */
.lorecard{ display:flex; gap:10px; padding:10px; border:1px solid var(--line); background:rgba(8,15,25,.7); cursor:pointer; transition:.15s; }
.lorecard:hover{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 7%, transparent); }
.lorecard img{ width:62px; height:62px; object-fit:cover; border:1px solid var(--line); flex:0 0 62px; }
.lorecard .lph{ width:62px; height:62px; flex:0 0 62px; display:grid; place-items:center; border:1px solid var(--line);
  background:color-mix(in srgb, var(--accent) 6%, transparent); color:color-mix(in srgb, var(--accent) 40%, transparent); font-family:var(--font-display); font-size:20px; }

/* --- gallery --- */
.gal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.gal figure{ margin:0; position:relative; border:1px solid var(--line); overflow:hidden; background:var(--void); }
.gal img{ width:100%; height:135px; object-fit:cover; display:block; transition:.25s; }
.gal figure:hover img{ transform:scale(1.06); }
.gal figcaption{ position:absolute; left:0; right:0; bottom:0; padding:14px 7px 5px; font-family:var(--font-mono); font-size:9px;

/* ============================== PERSISTENCE ============================== */
const DB_NAME = 'ravenbane-architect';
const DB_STORE = 'vault';
const LS_KEY = 'ravenbane.architect.state.v1';
let _idb = null, ENGINE = 'localStorage';

function idbOpen() {
  return new Promise((resolve) => {
    if (!('indexedDB' in window)) return resolve(null);
    let req;
    try { req = indexedDB.open(DB_NAME, 1); } catch (e) { return resolve(null); }
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
    req.onblocked = () => resolve(null);
    setTimeout(() => resolve(req.result || null), 2500);
  });
}
function idbPut(key, val) {
  return new Promise((resolve, reject) => {
    if (!_idb) return reject(new Error('no idb'));
    const tx = _idb.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
}
function idbGet(key) {
  return new Promise((resolve, reject) => {
    if (!_idb) return reject(new Error('no idb'));
    const tx = _idb.transaction(DB_STORE, 'readonly');
    const rq = tx.objectStore(DB_STORE).get(key);
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}

async function storageInit() {
  _idb = await idbOpen();
  ENGINE = _idb ? 'IndexedDB' : 'localStorage';
  const el = $('#railEngine'); if (el) el.textContent = _idb ? 'IDB' : 'LS';
}
async function storageLoad() {
  try {
    if (_idb) { const v = await idbGet('state'); if (v) return typeof v === 'string' ? JSON.parse(v) : v; }
  } catch (e) { console.warn('IDB read failed', e); }
  try { const s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch (e) { console.warn('LS read failed', e); }
  return null;
}
async function storageSave(obj) {
  let ok = false;
  try { if (_idb) { await idbPut('state', obj); ok = true; } } catch (e) { console.warn('IDB write failed', e); }
  try {
    const s = JSON.stringify(obj);
    if (s.length < 4.4 * 1024 * 1024) { localStorage.setItem(LS_KEY, s); ok = true; }
    else if (!ok) throw new Error('payload too large for localStorage');
    else localStorage.setItem(LS_KEY + '.meta', JSON.stringify({ note: 'payload stored in IndexedDB', at: nowISO(), bytes: s.length }));
  } catch (e) {
    if (!ok) { console.error(e); throw e; }
  }
  return ok;
}
async function storageUsage() {
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      return { used: e.usage || 0, quota: e.quota || 0 };
    }
  } catch (e) { }
  try { const s = localStorage.getItem(LS_KEY) || ''; return { used: s.length, quota: 5 * 1024 * 1024 }; } catch (e) { }
  return { used: 0, quota: 0 };
}

function resolveRoot(el) {
  const host = el.closest('[data-root]');
  if (!host) return state;
  const spec = host.getAttribute('data-root');
  const ix = spec.indexOf(':');
  const key = ix === -1 ? spec : spec.slice(0, ix);
  const arg = ix === -1 ? undefined : spec.slice(ix + 1);
  const f = ROOTS[key];
  let obj = f ? f(arg) : state;
  const sub = host.getAttribute('data-sub');
  if (sub && obj) obj = getPath(obj, sub);
  return obj || {};
}
/* Returns undefined when a numeric field is mid-edit (empty), so a cleared
   "word goal" box never lands in the data as 0. */
function fieldValue(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'number' || el.type === 'range') {
    if (el.type === 'number' && String(el.value).trim() === '') return undefined;
    let n = Number(el.value);
    if (isNaN(n)) return undefined;
    const mn = el.getAttribute('min'), mx = el.getAttribute('max');
    if (mn !== null && n < Number(mn)) n = Number(mn);
    if (mx !== null && n > Number(mx)) n = Number(mx);
    return n;
  }
  return el.value;
}

    const fv = fieldValue(el);
    if (fv === undefined) return;
    setPath(root, el.getAttribute('data-model'), fv);
    markDirty();
    const live = el.getAttribute('data-live');
    if (live && ACTIONS[live]) { try { ACTIONS[live](el, e); } catch (err) { console.error(err); } }
    if (el.hasAttribute('data-rerender')) rerenderSoon();
  }
});
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-go]');
  if (nav) { e.preventDefault(); go(nav.getAttribute('data-go'), nav.getAttribute('data-arg') || ''); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.getAttribute('data-act')];
  if (!fn) { console.warn('No action:', el.getAttribute('data-act')); return; }
  e.preventDefault();
  try { fn(el, e); } catch (err) { console.error(err); toast(String(err && err.message || err), 'err', 'ACTION FAULT'); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ModalStack.length) { e.preventDefault(); closeModal(); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(true).then(ok => { if (ok) toast('Project written to ' + ENGINE + '.', 'ok', 'SAVED'); }); }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); ACTIONS.globalSearch && ACTIONS.globalSearch(); }
});
window.addEventListener('beforeunload', (e) => {
  if (DIRTY) { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (_) { } }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && DIRTY) saveNow(); });

/* ================================ ROUTER ================================= */
const VIEWS = Object.create(null);   // populated by the feature modules
let CURRENT_VIEW = 'dashboard';

function go(view, arg) {
  if (!VIEWS[view]) { toast('Unknown module: ' + view, 'warn'); return; }
  CURRENT_VIEW = view;
  state.ui.view = view;
  if (arg) state.ui.viewArg = arg; else state.ui.viewArg = '';
  markDirty(true);
  $('#rail') && $('#rail').classList.remove('open');
  $('.rail-backdrop') && $('.rail-backdrop').remove();
  render();
  const ms = $('#mainScroll'); if (ms) ms.scrollTop = 0;
  try { history.replaceState(null, '', '#' + view + (arg ? '/' + arg : '')); } catch (_) { }
}

function render() {
  const v = VIEWS[CURRENT_VIEW] || VIEWS.dashboard;
  const host = $('#view');
  applyTheme();
  renderBanner();
  try {
    host.innerHTML = guidePanel(CURRENT_VIEW) + (v.render ? v.render() : '');
  } catch (err) {
    console.error(err);
    host.innerHTML = '<div class="panel clip"><div class="panel-bd"><h3 class="t-rd">MODULE FAULT</h3><pre class="mono fs12" style="white-space:pre-wrap;color:var(--c-red-t)">' + esc(String(err && err.stack || err)) + '</pre></div></div>';
  }
  renderRail();
  icons();
  if (v.mount) { try { v.mount(); } catch (err) { console.error(err); } }
}

    body: `<h5>The only job of a prologue</h5>
<p>A prologue exists for exactly one reason: to create a <strong>question the reader must carry</strong> into chapter one. If it delivers history, geography, or a lecture, it is not a prologue — it is an appendix that wandered to the front.</p>
<h5>The four legitimate prologue types</h5>
<ul>
<li><strong>The Distant Detonation</strong> — an event years or centuries before the main story whose consequence is still travelling toward your protagonist. <em>Why it works:</em> the reader now reads chapter one looking for the impact crater.</li>
<li><strong>The Doomed Witness</strong> — a POV who will not survive, showing the threat in its full form so that chapter one's mundanity feels loaded. <em>Rule:</em> make the witness specific and likeable in under 800 words or the death is furniture.</li>
<li><strong>The Frame Voice</strong> — a narrator from outside the timeline (archivist, older self, court record) who tells you the ending is already fixed. <em>Rule:</em> the frame must return at the end, or cut it.</li>
<li><strong>The Rule Statement</strong> — the world declares its one non-negotiable law, dramatised as a scene. Never as exposition.</li>
</ul>
<h5>Mechanics that earn page two</h5>
<ul>
<li><strong>Open in motion, close on a question.</strong> First sentence: a body in space doing something. Last sentence: a hole the reader needs filled.</li>

<li><strong>One concrete strangeness per paragraph.</strong> Not three. Readers can hold one anomaly at a time and will trust you to explain later.</li>
<li><strong>Withhold the proper noun.</strong> "The thing in the reservoir" beats "the Vashaal Devourer" every single time on page one.</li>

<p>Delete the prologue. Read chapter one cold. If nothing is lost — <em>nothing at all</em> — the prologue was scaffolding. If chapter one now feels flat, safe, or unmotivated, the prologue was doing structural work. Keep it.</p>

<h5>Seven chapter-out patterns that work</h5>
<ul>
<li><strong>The Decision Made</strong> — the character commits to something costly. We close before we see the cost. ("So I said yes.")</li>
<li><strong>The Arrival</strong> — someone enters who should not be able to.</li>

<li><strong>The Reframe</strong> — a line of dialogue that makes the last ten pages mean something else.</li>
<li><strong>The Countdown Tick</strong> — time visibly contracts: "Nine hours."</li>
<li><strong>The Withheld Reaction</strong> — a devastating line lands; we cut before the response.</li>
<li><strong>The Quiet Dread</strong> — an ordinary detail rendered wrong. Use sparingly; it is the strongest and the easiest to overuse.</li>

<h5>Pacing as a waveform</h5>
<p>Tension should not climb in a straight line — a monotone climb numbs. Design in a repeating 4-beat wave: <em>pressure → release → deeper pressure → smaller release</em>. Each release should be shorter than the last, so the reader's breathing room narrows as the book progresses.</p>
<ul>
<li><strong>Scene length is a pacing tool.</strong> Action chapters: 1,200–2,000 words. Revelation chapters: 800–1,400. Aftermath/interiority: never two in a row.</li>

<p>A POV is not a camera position — it is a <strong>contract of consciousness</strong>. Each one must have its own want, its own information gap, and its own voice signature. If two POVs know the same things and want the same thing, delete one and give its scenes to the other.</p>
<h5>The four-question POV audit</h5>
<ol>
<li><strong>What does only this POV know?</strong> (If nothing — cut it.)</li>

<li><strong>How does their narration sound different?</strong> Diction, sentence length, what they notice first on entering a room.</li>

<h5>Rotation architectures</h5>
<ul>
<li><strong>Strict alternation (A/B/A/B)</strong> — best for two-hander romance and duel narratives. Predictable rhythm becomes a comfort; violate it once, late, for maximum effect.</li>

<li><strong>Tension pass</strong> — the heatmap. Flat runs get cut or escalated. Two consecutive quiet chapters become one.</li>
<li><strong>Line pass</strong> — filter words, repetitions, clichés, rhythm. This is where the Cliché &amp; Repetition Scanner earns its keep.</li>
<li><strong>Read-aloud pass</strong> — the only reliable detector of false dialogue and accidental comedy.</li>
<li><strong>Continuity pass</strong> — names, eye colour, day of the week, phases of the moon, who knows what and when.</li>
</ol>
<h5>The 10% cut</h5>
<p>Whatever your draft length, cut 10% without removing scenes. It is almost always achievable in filter words, redundant beats, and dialogue runway — and it almost always improves pace.</p>`
  }
];

/** Repairs the saved sidebar layout: drops unknown ids, appends any page the
 *  user has never seen so new features can never become unreachable. */
function normaliseNav() {
  let nav = state.ui.nav;
  if (!Array.isArray(nav) || !nav.length) nav = defaultNav();
  const seen = {};
  nav = nav.filter(g => g && Array.isArray(g.items)).map(g => ({
    id: g.id || uid('g'), label: g.label || 'GROUP', tone: g.tone || '', open: g.open !== false,
    items: g.items.filter(v => NAV_ITEMS[v] && !seen[v] && (seen[v] = 1))
  }));
  const missing = Object.keys(NAV_ITEMS).filter(v => !seen[v]);
  if (missing.length) {
    const home = nav.find(g => g.id === 'g_profiles') || nav[0];
    if (home) home.items = home.items.concat(missing);
    else nav.push({ id: uid('g'), label: 'MORE', tone: '', open: true, items: missing });
  }
  /* One-time relocation: 'All My Books' used to live under COMMAND. Move it to
     the top of BOOK PROFILES once, leaving any other arrangement untouched. */
  if (state.ui.navV !== 2) {
    const prof = nav.find(g => g.id === 'g_profiles');
    if (prof) {
      nav.forEach(g => { if (g !== prof) g.items = g.items.filter(v => v !== 'library'); });
      prof.items = ['library'].concat(prof.items.filter(v => v !== 'library'));
    }
    state.ui.navV = 2;
  }
  state.ui.nav = nav;
  return nav;
}

  if (state.app.perViewBanners && b && b.banners && b.banners[CURRENT_VIEW]) return { data: b.banners[CURRENT_VIEW], scope: 'view' };
  if (b && b.banners && b.banners.__book) return { data: b.banners.__book, scope: 'book' };
  return { data: state.app.globalBanner, scope: 'global' };
}
/** Shared markup for any banner anywhere (page banners and profile covers). */
function bannerMediaHTML(bn) {
  const op = (bn.opacity == null ? 100 : bn.opacity) / 100;
  const blur = Number(bn.blur) || 0;
  const style = 'object-position:50% ' + (bn.offset == null ? 50 : bn.offset) + '%;object-fit:' + (bn.fit || 'cover') +
    ';opacity:' + op + (blur ? ';filter:blur(' + blur + 'px);transform:scale(' + (1 + blur / 40) + ')' : '');
  if (bn.src && bn.type === 'video') {
    return '<video class="banner-media" src="' + attr(bn.src) + '" autoplay muted loop playsinline style="' + style + '"></video>';
  }
  if (bn.src) {
    /* Animated GIFs play automatically in an <img>, so GIF, APNG, WEBP and
       static images all share this one path. */
    return '<img class="banner-media" src="' + attr(bn.src) + '" alt="" style="' + style + '" onerror="this.style.display=\'none\'" />';
  }
  return '<div class="banner-fallback"></div>';
}
function renderBanner() {
  const host = $('#bannerHost');
  const { data: bn, scope } = activeBanner();
  const meta = VIEW_META[CURRENT_VIEW] || { t: 'ARCHITECT', e: '', d: '' };
  const book = currentBook();
  const h = clamp(Number(bn.h == null ? 230 : bn.h), 0, 700);
  if (h < 40) {
    host.innerHTML = '<div class="banner" style="height:34px;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;gap:6px">' +
      '<span class="mono fs10 faint">BANNER HIDDEN</span>' +
      '<button class="btn ghost xs" data-act="bannerEdit"><i data-lucide="image"></i>BANNER</button></div>';
    icons(); return;
  }
  const titleSize = clamp(Math.round(h / 12), 17, 40);
  const title = bn.title || (book && ['library', 'settings', 'exportv', 'masterclass'].indexOf(CURRENT_VIEW) === -1 ? book.title + ' — ' + meta.t : meta.t);
  const desc = bn.desc || meta.d;
  host.innerHTML =
    '<div class="banner" style="height:' + h + 'px">' + bannerMediaHTML(bn) +
      '<div class="banner-scrim" style="opacity:' + ((bn.tint == null ? 60 : bn.tint) / 100) + '"></div>' +
      '<div class="banner-tools">' +
        '<button class="btn ghost xs" data-act="bannerNudge" data-d="-40" title="Make this banner shorter">–</button>' +
        '<span class="chip mono" style="background:var(--sunk)">' + h + 'px</span>' +
        '<button class="btn ghost xs" data-act="bannerNudge" data-d="40" title="Make this banner taller">+</button>' +
        '<button class="btn ghost xs" data-act="bannerEdit" title="Change the picture, GIF, video, size and position"><i data-lucide="sliders-horizontal"></i>EDIT BANNER</button>' +
      '</div>' +
      '<div class="banner-inner">' +
        '<div class="banner-eyebrow">' + esc(meta.e) + (scope !== 'global' ? ' · ' + scope.toUpperCase() + ' BANNER' : '') + '</div>' +
        '<h1 class="banner-title" style="font-size:' + titleSize + 'px">' + esc(title) + '</h1>' +
        (desc && h > 150 ? '<div class="banner-desc">' + esc(desc) + '</div>' : '') +
      '</div>' +
    '</div>';
  icons();
}
ACTIONS.bannerNudge = function (el) {
  const { data } = activeBanner();
  data.h = clamp((Number(data.h) || 230) + Number(el.getAttribute('data-d')), 0, 700);
  markDirty(); renderBanner();
};

ACTIONS.bannerEdit = function () { openBannerEditor(activeBanner().data, {}); };
ACTIONS.bnPreset = function (el) {
  const h = Number(el.getAttribute('data-h'));
  const slider = $('#bnH'); if (slider) { slider.value = h; }
  window.__bannerDraft.h = h;
  if (window.__bannerSync) window.__bannerSync(); else { markDirty(); window.__bannerRepaint(); }
};
ACTIONS.bnUpload = async function (el) {
  const kind = el.getAttribute('data-arg');
  const f = await pickFile(kind === 'video' ? 'video/*' : 'image/*,image/gif');
  if (!f) return;
  const d = window.__bannerDraft;
  d.src = f.data; d.type = kind;
  markDirty(); window.__bannerRepaint();
  const sel = $('#bnType'); if (sel) sel.value = kind;
  toast(kind === 'video' ? 'Video loaded.' : 'Picture loaded' + (/gif/i.test(f.type) ? ' — your GIF will animate.' : '.'), 'ok');
};
ACTIONS.bnClear = function () { const d = window.__bannerDraft; d.src = ''; d.type = 'none'; markDirty(); window.__bannerRepaint(); const u = $('#bnUrl'); if (u) u.value = ''; };
ACTIONS.bnScope = function (el) {
  const target = el.getAttribute('data-arg');
  const src = clone(window.__bannerDraft);
  const b = currentBook();
  if (target === 'global') state.app.globalBanner = src;
  else if (target === 'book' && b) { b.banners = b.banners || {}; b.banners.__book = src; }
  else if (b) { b.banners = b.banners || {}; b.banners[CURRENT_VIEW] = src; }
  else state.app.globalBanner = src;
  markDirty(); renderBanner();
  toast('Banner applied to ' + (target === 'view' ? 'this page' : target === 'book' ? 'the whole book' : 'every page') + '.', 'ok');
  window.__bannerDraft = activeBanner().data;
};
ACTIONS.bnDropOverride = function () {
  const b = currentBook(); if (!b || !b.banners) return;
  delete b.banners[CURRENT_VIEW];
  markDirty(); renderBanner(); closeModal(); toast('Override cleared — this page now inherits its banner.', 'ok');
};
